<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 884" width="1066" height="884" role="img" aria-label="Simulator quality evaluation: a fidelity ladder" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, &#x27;Noto Sans&#x27;, sans-serif">
<title>Simulator quality evaluation: a fidelity ladder</title>
<defs>
<marker id="arrow-0" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#184F95"/></marker>
<marker id="arrow-1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#256ABF"/></marker>
<marker id="arrow-2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#3987E5"/></marker>
<marker id="arrow-3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#6DA7EC"/></marker>
<marker id="arrow-4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#9EC5F4"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1065" height="883" rx="10" fill="#0D1117" stroke="#3D444D"/>
<rect x="24" y="24" width="1018" height="60" rx="6" fill="#161B22"/>
<text x="36" y="49" font-size="14" fill="#E6EDF3">Example: an agent builds a kitchen simulation in which a robot practises “open the cabinet and put the cup inside”. Every level below</text>
<text x="36" y="69" font-size="14" fill="#E6EDF3">asks its question of this kitchen.</text>
<text x="24" y="116" font-size="12.5" font-weight="600" fill="#9198A1">Stage</text>
<text x="150" y="116" font-size="12.5" font-weight="600" fill="#9198A1">Level</text>
<text x="334" y="116" font-size="12.5" font-weight="600" fill="#9198A1">Asked of the kitchen</text>
<text x="678" y="116" font-size="12.5" font-weight="600" fill="#9198A1">What it cannot catch</text>
<text x="932" y="116" font-size="12.5" font-weight="600" fill="#9198A1">Works</text>
<line x1="24" y1="126" x2="1042" y2="126" stroke="#3D444D"/>
<line x1="31" y1="163" x2="31" y2="314" stroke="#184F95" stroke-width="2" marker-end="url(#arrow-0)"/>
<line x1="31" y1="339" x2="31" y2="406" stroke="#256ABF" stroke-width="2" marker-end="url(#arrow-1)"/>
<line x1="31" y1="431" x2="31" y2="498" stroke="#3987E5" stroke-width="2" marker-end="url(#arrow-2)"/>
<line x1="31" y1="523" x2="31" y2="738" stroke="#6DA7EC" stroke-width="2" marker-end="url(#arrow-3)"/>
<circle cx="31" cy="152" r="7" fill="#184F95"/>
<text x="46" y="157" font-size="14" font-weight="700" fill="#E6EDF3">Look only</text>
<circle cx="31" cy="328" r="7" fill="#256ABF"/>
<text x="46" y="333" font-size="14" font-weight="700" fill="#E6EDF3">Left at rest</text>
<circle cx="31" cy="420" r="7" fill="#3987E5"/>
<text x="46" y="425" font-size="14" font-weight="700" fill="#E6EDF3">Poke it</text>
<circle cx="31" cy="512" r="7" fill="#6DA7EC"/>
<text x="46" y="517" font-size="14" font-weight="700" fill="#E6EDF3">Let it run</text>
<circle cx="31" cy="752" r="7" fill="#9EC5F4"/>
<text x="46" y="757" font-size="14" font-weight="700" fill="#E6EDF3">Put it to</text>
<text x="46" y="777" font-size="14" font-weight="700" fill="#E6EDF3">use</text>
<rect x="150.75" y="142.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#184F95" stroke-width="1.5"/>
<text x="157.75" y="157" font-size="12.5" font-weight="700" fill="#E6EDF3">L0a</text>
<text x="150" y="177" font-size="14" font-weight="600" fill="#E6EDF3">Semantic fidelity</text>
<text x="334" y="157" font-size="14" fill="#E6EDF3">Are the table, cabinet and cup that were</text>
<text x="334" y="177" font-size="14" fill="#E6EDF3">asked for all there? Is the cup on the table?</text>
<text x="678" y="157" font-size="14" fill="#9198A1">Any physical error, since no</text>
<text x="678" y="177" font-size="14" fill="#9198A1">physics is run</text>
<circle cx="936.5" cy="152" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="948.5" cy="152" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="960.5" cy="152" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="972.5" cy="152" r="4.5" fill="#9198A1"/>
<text x="984" y="157" font-size="12.5" fill="#9198A1">4</text>
<line x1="150" y1="194" x2="1042" y2="194" stroke="#3D444D" stroke-dasharray="3 3"/>
<rect x="150.75" y="206.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#184F95" stroke-width="1.5"/>
<text x="157.75" y="221" font-size="12.5" font-weight="700" fill="#E6EDF3">L0b</text>
<text x="150" y="241" font-size="14" font-weight="600" fill="#E6EDF3">Visual /</text>
<text x="150" y="261" font-size="14" font-weight="600" fill="#E6EDF3">reconstruction</text>
<text x="150" y="281" font-size="14" font-weight="600" fill="#E6EDF3">fidelity</text>
<text x="334" y="221" font-size="14" fill="#E6EDF3">Does it look like the kitchen in the photo?</text>
<text x="678" y="221" font-size="14" fill="#9198A1">Collision shapes, masses and</text>
<text x="678" y="241" font-size="14" fill="#9198A1">joints can still be wrong</text>
<circle cx="936.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="984.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="996.5" cy="216" r="4.5" fill="#9198A1"/>
<text x="1008" y="221" font-size="12.5" fill="#9198A1">6</text>
<line x1="24" y1="302" x2="1042" y2="302" stroke="#3D444D"/>
<rect x="150.75" y="318.75" width="30" height="19.5" rx="4" fill="#0D1117" stroke="#256ABF" stroke-width="1.5"/>
<text x="157.75" y="333" font-size="12.5" font-weight="700" fill="#E6EDF3">L1</text>
<text x="150" y="353" font-size="14" font-weight="600" fill="#E6EDF3">Static physical</text>
<text x="150" y="373" font-size="14" font-weight="600" fill="#E6EDF3">plausibility</text>
<text x="334" y="333" font-size="14" fill="#E6EDF3">Is the cup floating or sunk into the table?</text>
<text x="334" y="353" font-size="14" fill="#E6EDF3">Can the robot get through?</text>
<text x="678" y="333" font-size="14" fill="#9198A1">What happens once something is</text>
<text x="678" y="353" font-size="14" fill="#9198A1">touched or moves</text>
<circle cx="936.5" cy="328" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="948.5" cy="328" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="960" y="333" font-size="12.5" fill="#9198A1">2</text>
<line x1="24" y1="394" x2="1042" y2="394" stroke="#3D444D"/>
<rect x="150.75" y="410.75" width="30" height="19.5" rx="4" fill="#0D1117" stroke="#3987E5" stroke-width="1.5"/>
<text x="157.75" y="425" font-size="12.5" font-weight="700" fill="#E6EDF3">L2</text>
<text x="150" y="445" font-size="14" font-weight="600" fill="#E6EDF3">Interaction</text>
<text x="150" y="465" font-size="14" font-weight="600" fill="#E6EDF3">plausibility</text>
<text x="334" y="425" font-size="14" fill="#E6EDF3">Pull the cabinet door: does it swing open on</text>
<text x="334" y="445" font-size="14" fill="#E6EDF3">its hinge?</text>
<text x="678" y="425" font-size="14" fill="#9198A1">The door opens, but its mass and</text>
<text x="678" y="445" font-size="14" fill="#9198A1">damping may be wrong</text>
<circle cx="936.5" cy="420" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="420" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="420" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="420" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="984" y="425" font-size="12.5" fill="#9198A1">4</text>
<line x1="24" y1="486" x2="1042" y2="486" stroke="#3D444D"/>
<rect x="150.75" y="502.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#6DA7EC" stroke-width="1.5"/>
<text x="157.75" y="517" font-size="12.5" font-weight="700" fill="#E6EDF3">L3a</text>
<text x="150" y="537" font-size="14" font-weight="600" fill="#E6EDF3">Looks right</text>
<text x="334" y="517" font-size="14" fill="#E6EDF3">When the cup is knocked over and rolls off the</text>
<text x="334" y="537" font-size="14" fill="#E6EDF3">table, does it match real footage?</text>
<text x="678" y="517" font-size="14" fill="#9198A1">It may be hand-written animation</text>
<text x="678" y="537" font-size="14" fill="#9198A1">rather than simulation</text>
<circle cx="936.5" cy="512" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="512" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="512" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="512" r="4.5" fill="#9198A1"/>
<circle cx="984.5" cy="512" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="996.5" cy="512" r="4.5" fill="#9198A1"/>
<circle cx="1008.5" cy="512" r="4.5" fill="#9198A1"/>
<circle cx="1020.5" cy="512" r="4.5" fill="#9198A1"/>
<text x="1032" y="517" font-size="12.5" fill="#9198A1">8</text>
<line x1="150" y1="554" x2="1042" y2="554" stroke="#3D444D" stroke-dasharray="3 3"/>
<rect x="150.75" y="566.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#6DA7EC" stroke-width="1.5"/>
<text x="157.75" y="581" font-size="12.5" font-weight="700" fill="#E6EDF3">L3b</text>
<text x="150" y="601" font-size="14" font-weight="600" fill="#E6EDF3">Truly simulated</text>
<text x="334" y="581" font-size="14" fill="#E6EDF3">Tilt the table or make the cup heavier, then</text>
<text x="334" y="601" font-size="14" fill="#E6EDF3">rerun: does the outcome change correctly?</text>
<text x="678" y="581" font-size="14" fill="#9198A1">The laws are right, but values</text>
<text x="678" y="601" font-size="14" fill="#9198A1">such as mass and friction may be</text>
<text x="678" y="621" font-size="14" fill="#9198A1">off</text>
<circle cx="936.5" cy="576" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="576" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="576" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="576" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="984" y="581" font-size="12.5" fill="#9198A1">4</text>
<line x1="150" y1="638" x2="1042" y2="638" stroke="#3D444D" stroke-dasharray="3 3"/>
<rect x="150.75" y="650.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#6DA7EC" stroke-width="1.5"/>
<text x="157.75" y="665" font-size="12.5" font-weight="700" fill="#E6EDF3">L3c</text>
<text x="150" y="685" font-size="14" font-weight="600" fill="#E6EDF3">Numerically accurate</text>
<text x="334" y="665" font-size="14" fill="#E6EDF3">Do the cup&#x27;s mass and the table&#x27;s friction</text>
<text x="334" y="685" font-size="14" fill="#E6EDF3">match measurements? From the first seconds,</text>
<text x="334" y="705" font-size="14" fill="#E6EDF3">can it predict the rest?</text>
<text x="678" y="665" font-size="14" fill="#9198A1">Whether conclusions hold once it</text>
<text x="678" y="685" font-size="14" fill="#9198A1">is used for evaluation or</text>
<text x="678" y="705" font-size="14" fill="#9198A1">training</text>
<circle cx="936.5" cy="660" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="660" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="660" r="4.5" fill="#9198A1"/>
<text x="972" y="665" font-size="12.5" fill="#9198A1">3</text>
<line x1="24" y1="726" x2="1042" y2="726" stroke="#3D444D"/>
<rect x="150.75" y="742.75" width="30" height="19.5" rx="4" fill="#0D1117" stroke="#9EC5F4" stroke-width="1.5"/>
<text x="157.75" y="757" font-size="12.5" font-weight="700" fill="#E6EDF3">L4</text>
<text x="150" y="777" font-size="14" font-weight="600" fill="#E6EDF3">Sim-to-real</text>
<text x="150" y="797" font-size="14" font-weight="600" fill="#E6EDF3">predictivity</text>
<text x="334" y="757" font-size="14" fill="#E6EDF3">Does the policy that ranks first here also</text>
<text x="334" y="777" font-size="14" fill="#E6EDF3">rank first in a real kitchen?</text>
<text x="678" y="757" font-size="14" fill="#9198A1">Accurate rankings do not make it</text>
<text x="678" y="777" font-size="14" fill="#9198A1">safe for training: policies</text>
<text x="678" y="797" font-size="14" fill="#9198A1">exploit simulator errors</text>
<circle cx="936.5" cy="752" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="752" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="752" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="752" r="4.5" fill="#9198A1"/>
<circle cx="984.5" cy="752" r="4.5" fill="#9198A1"/>
<text x="996" y="757" font-size="12.5" fill="#9198A1">5</text>
<text x="24" y="840" font-size="12.5" fill="#9198A1">Top to bottom, the simulator is used more and more like the real thing. Each level catches different errors; it is not a</text>
<text x="24" y="860" font-size="12.5" fill="#9198A1">cumulative score. L0a and L0b are parallel starting points.</text>
<circle cx="852.25" cy="835.5" r="4.5" fill="#9198A1"/>
<text x="863.75" y="840" font-size="12.5" fill="#9198A1">a work</text>
<circle cx="923" cy="835.5" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="934.5" y="840" font-size="12.5" fill="#9198A1">an evaluator †</text>
</svg>
