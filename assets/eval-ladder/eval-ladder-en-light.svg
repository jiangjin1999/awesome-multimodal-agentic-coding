<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 884" width="1066" height="884" role="img" aria-label="Simulator quality evaluation: a fidelity ladder" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, &#x27;Noto Sans&#x27;, sans-serif">
<title>Simulator quality evaluation: a fidelity ladder</title>
<defs>
<marker id="arrow-0" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#86B6EF"/></marker>
<marker id="arrow-1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5598E7"/></marker>
<marker id="arrow-2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#2A78D6"/></marker>
<marker id="arrow-3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#1C5CAB"/></marker>
<marker id="arrow-4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#104281"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1065" height="883" rx="10" fill="#FFFFFF" stroke="#D1D9E0"/>
<rect x="24" y="24" width="1018" height="60" rx="6" fill="#F0F3F6"/>
<text x="36" y="49" font-size="14" fill="#1F2328">Example: an agent builds a kitchen simulation in which a robot practises “open the cabinet and put the cup inside”. Every level below</text>
<text x="36" y="69" font-size="14" fill="#1F2328">asks its question of this kitchen.</text>
<text x="24" y="116" font-size="12.5" font-weight="600" fill="#59636E">Stage</text>
<text x="150" y="116" font-size="12.5" font-weight="600" fill="#59636E">Level</text>
<text x="334" y="116" font-size="12.5" font-weight="600" fill="#59636E">Asked of the kitchen</text>
<text x="678" y="116" font-size="12.5" font-weight="600" fill="#59636E">What it cannot catch</text>
<text x="932" y="116" font-size="12.5" font-weight="600" fill="#59636E">Works</text>
<line x1="24" y1="126" x2="1042" y2="126" stroke="#D1D9E0"/>
<line x1="31" y1="163" x2="31" y2="314" stroke="#86B6EF" stroke-width="2" marker-end="url(#arrow-0)"/>
<line x1="31" y1="339" x2="31" y2="406" stroke="#5598E7" stroke-width="2" marker-end="url(#arrow-1)"/>
<line x1="31" y1="431" x2="31" y2="498" stroke="#2A78D6" stroke-width="2" marker-end="url(#arrow-2)"/>
<line x1="31" y1="523" x2="31" y2="738" stroke="#1C5CAB" stroke-width="2" marker-end="url(#arrow-3)"/>
<circle cx="31" cy="152" r="7" fill="#86B6EF"/>
<text x="46" y="157" font-size="14" font-weight="700" fill="#1F2328">Look only</text>
<circle cx="31" cy="328" r="7" fill="#5598E7"/>
<text x="46" y="333" font-size="14" font-weight="700" fill="#1F2328">Left at rest</text>
<circle cx="31" cy="420" r="7" fill="#2A78D6"/>
<text x="46" y="425" font-size="14" font-weight="700" fill="#1F2328">Poke it</text>
<circle cx="31" cy="512" r="7" fill="#1C5CAB"/>
<text x="46" y="517" font-size="14" font-weight="700" fill="#1F2328">Let it run</text>
<circle cx="31" cy="752" r="7" fill="#104281"/>
<text x="46" y="757" font-size="14" font-weight="700" fill="#1F2328">Put it to</text>
<text x="46" y="777" font-size="14" font-weight="700" fill="#1F2328">use</text>
<rect x="150.75" y="142.75" width="37" height="19.5" rx="4" fill="#FFFFFF" stroke="#86B6EF" stroke-width="1.5"/>
<text x="157.75" y="157" font-size="12.5" font-weight="700" fill="#1F2328">L0a</text>
<text x="150" y="177" font-size="14" font-weight="600" fill="#1F2328">Semantic fidelity</text>
<text x="334" y="157" font-size="14" fill="#1F2328">Are the table, cabinet and cup that were</text>
<text x="334" y="177" font-size="14" fill="#1F2328">asked for all there? Is the cup on the table?</text>
<text x="678" y="157" font-size="14" fill="#59636E">Any physical error, since no</text>
<text x="678" y="177" font-size="14" fill="#59636E">physics is run</text>
<circle cx="936.5" cy="152" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<circle cx="948.5" cy="152" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<circle cx="960.5" cy="152" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<circle cx="972.5" cy="152" r="4.5" fill="#59636E"/>
<text x="984" y="157" font-size="12.5" fill="#59636E">4</text>
<line x1="150" y1="194" x2="1042" y2="194" stroke="#D1D9E0" stroke-dasharray="3 3"/>
<rect x="150.75" y="206.75" width="37" height="19.5" rx="4" fill="#FFFFFF" stroke="#86B6EF" stroke-width="1.5"/>
<text x="157.75" y="221" font-size="12.5" font-weight="700" fill="#1F2328">L0b</text>
<text x="150" y="241" font-size="14" font-weight="600" fill="#1F2328">Visual /</text>
<text x="150" y="261" font-size="14" font-weight="600" fill="#1F2328">reconstruction</text>
<text x="150" y="281" font-size="14" font-weight="600" fill="#1F2328">fidelity</text>
<text x="334" y="221" font-size="14" fill="#1F2328">Does it look like the kitchen in the photo?</text>
<text x="678" y="221" font-size="14" fill="#59636E">Collision shapes, masses and</text>
<text x="678" y="241" font-size="14" fill="#59636E">joints can still be wrong</text>
<circle cx="936.5" cy="216" r="4.5" fill="#59636E"/>
<circle cx="948.5" cy="216" r="4.5" fill="#59636E"/>
<circle cx="960.5" cy="216" r="4.5" fill="#59636E"/>
<circle cx="972.5" cy="216" r="4.5" fill="#59636E"/>
<circle cx="984.5" cy="216" r="4.5" fill="#59636E"/>
<circle cx="996.5" cy="216" r="4.5" fill="#59636E"/>
<text x="1008" y="221" font-size="12.5" fill="#59636E">6</text>
<line x1="24" y1="302" x2="1042" y2="302" stroke="#D1D9E0"/>
<rect x="150.75" y="318.75" width="30" height="19.5" rx="4" fill="#FFFFFF" stroke="#5598E7" stroke-width="1.5"/>
<text x="157.75" y="333" font-size="12.5" font-weight="700" fill="#1F2328">L1</text>
<text x="150" y="353" font-size="14" font-weight="600" fill="#1F2328">Static physical</text>
<text x="150" y="373" font-size="14" font-weight="600" fill="#1F2328">plausibility</text>
<text x="334" y="333" font-size="14" fill="#1F2328">Is the cup floating or sunk into the table?</text>
<text x="334" y="353" font-size="14" fill="#1F2328">Can the robot get through?</text>
<text x="678" y="333" font-size="14" fill="#59636E">What happens once something is</text>
<text x="678" y="353" font-size="14" fill="#59636E">touched or moves</text>
<circle cx="936.5" cy="328" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<circle cx="948.5" cy="328" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<text x="960" y="333" font-size="12.5" fill="#59636E">2</text>
<line x1="24" y1="394" x2="1042" y2="394" stroke="#D1D9E0"/>
<rect x="150.75" y="410.75" width="30" height="19.5" rx="4" fill="#FFFFFF" stroke="#2A78D6" stroke-width="1.5"/>
<text x="157.75" y="425" font-size="12.5" font-weight="700" fill="#1F2328">L2</text>
<text x="150" y="445" font-size="14" font-weight="600" fill="#1F2328">Interaction</text>
<text x="150" y="465" font-size="14" font-weight="600" fill="#1F2328">plausibility</text>
<text x="334" y="425" font-size="14" fill="#1F2328">Pull the cabinet door: does it swing open on</text>
<text x="334" y="445" font-size="14" fill="#1F2328">its hinge?</text>
<text x="678" y="425" font-size="14" fill="#59636E">The door opens, but its mass and</text>
<text x="678" y="445" font-size="14" fill="#59636E">damping may be wrong</text>
<circle cx="936.5" cy="420" r="4.5" fill="#59636E"/>
<circle cx="948.5" cy="420" r="4.5" fill="#59636E"/>
<circle cx="960.5" cy="420" r="4.5" fill="#59636E"/>
<circle cx="972.5" cy="420" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<text x="984" y="425" font-size="12.5" fill="#59636E">4</text>
<line x1="24" y1="486" x2="1042" y2="486" stroke="#D1D9E0"/>
<rect x="150.75" y="502.75" width="37" height="19.5" rx="4" fill="#FFFFFF" stroke="#1C5CAB" stroke-width="1.5"/>
<text x="157.75" y="517" font-size="12.5" font-weight="700" fill="#1F2328">L3a</text>
<text x="150" y="537" font-size="14" font-weight="600" fill="#1F2328">Looks right</text>
<text x="334" y="517" font-size="14" fill="#1F2328">When the cup is knocked over and rolls off the</text>
<text x="334" y="537" font-size="14" fill="#1F2328">table, does it match real footage?</text>
<text x="678" y="517" font-size="14" fill="#59636E">It may be hand-written animation</text>
<text x="678" y="537" font-size="14" fill="#59636E">rather than simulation</text>
<circle cx="936.5" cy="512" r="4.5" fill="#59636E"/>
<circle cx="948.5" cy="512" r="4.5" fill="#59636E"/>
<circle cx="960.5" cy="512" r="4.5" fill="#59636E"/>
<circle cx="972.5" cy="512" r="4.5" fill="#59636E"/>
<circle cx="984.5" cy="512" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<circle cx="996.5" cy="512" r="4.5" fill="#59636E"/>
<circle cx="1008.5" cy="512" r="4.5" fill="#59636E"/>
<circle cx="1020.5" cy="512" r="4.5" fill="#59636E"/>
<text x="1032" y="517" font-size="12.5" fill="#59636E">8</text>
<line x1="150" y1="554" x2="1042" y2="554" stroke="#D1D9E0" stroke-dasharray="3 3"/>
<rect x="150.75" y="566.75" width="37" height="19.5" rx="4" fill="#FFFFFF" stroke="#1C5CAB" stroke-width="1.5"/>
<text x="157.75" y="581" font-size="12.5" font-weight="700" fill="#1F2328">L3b</text>
<text x="150" y="601" font-size="14" font-weight="600" fill="#1F2328">Truly simulated</text>
<text x="334" y="581" font-size="14" fill="#1F2328">Tilt the table or make the cup heavier, then</text>
<text x="334" y="601" font-size="14" fill="#1F2328">rerun: does the outcome change correctly?</text>
<text x="678" y="581" font-size="14" fill="#59636E">The laws are right, but values</text>
<text x="678" y="601" font-size="14" fill="#59636E">such as mass and friction may be</text>
<text x="678" y="621" font-size="14" fill="#59636E">off</text>
<circle cx="936.5" cy="576" r="4.5" fill="#59636E"/>
<circle cx="948.5" cy="576" r="4.5" fill="#59636E"/>
<circle cx="960.5" cy="576" r="4.5" fill="#59636E"/>
<circle cx="972.5" cy="576" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<text x="984" y="581" font-size="12.5" fill="#59636E">4</text>
<line x1="150" y1="638" x2="1042" y2="638" stroke="#D1D9E0" stroke-dasharray="3 3"/>
<rect x="150.75" y="650.75" width="37" height="19.5" rx="4" fill="#FFFFFF" stroke="#1C5CAB" stroke-width="1.5"/>
<text x="157.75" y="665" font-size="12.5" font-weight="700" fill="#1F2328">L3c</text>
<text x="150" y="685" font-size="14" font-weight="600" fill="#1F2328">Numerically accurate</text>
<text x="334" y="665" font-size="14" fill="#1F2328">Do the cup&#x27;s mass and the table&#x27;s friction</text>
<text x="334" y="685" font-size="14" fill="#1F2328">match measurements? From the first seconds,</text>
<text x="334" y="705" font-size="14" fill="#1F2328">can it predict the rest?</text>
<text x="678" y="665" font-size="14" fill="#59636E">Whether conclusions hold once it</text>
<text x="678" y="685" font-size="14" fill="#59636E">is used for evaluation or</text>
<text x="678" y="705" font-size="14" fill="#59636E">training</text>
<circle cx="936.5" cy="660" r="4.5" fill="#59636E"/>
<circle cx="948.5" cy="660" r="4.5" fill="#59636E"/>
<circle cx="960.5" cy="660" r="4.5" fill="#59636E"/>
<text x="972" y="665" font-size="12.5" fill="#59636E">3</text>
<line x1="24" y1="726" x2="1042" y2="726" stroke="#D1D9E0"/>
<rect x="150.75" y="742.75" width="30" height="19.5" rx="4" fill="#FFFFFF" stroke="#104281" stroke-width="1.5"/>
<text x="157.75" y="757" font-size="12.5" font-weight="700" fill="#1F2328">L4</text>
<text x="150" y="777" font-size="14" font-weight="600" fill="#1F2328">Sim-to-real</text>
<text x="150" y="797" font-size="14" font-weight="600" fill="#1F2328">predictivity</text>
<text x="334" y="757" font-size="14" fill="#1F2328">Does the policy that ranks first here also</text>
<text x="334" y="777" font-size="14" fill="#1F2328">rank first in a real kitchen?</text>
<text x="678" y="757" font-size="14" fill="#59636E">Accurate rankings do not make it</text>
<text x="678" y="777" font-size="14" fill="#59636E">safe for training: policies</text>
<text x="678" y="797" font-size="14" fill="#59636E">exploit simulator errors</text>
<circle cx="936.5" cy="752" r="4.5" fill="#59636E"/>
<circle cx="948.5" cy="752" r="4.5" fill="#59636E"/>
<circle cx="960.5" cy="752" r="4.5" fill="#59636E"/>
<circle cx="972.5" cy="752" r="4.5" fill="#59636E"/>
<circle cx="984.5" cy="752" r="4.5" fill="#59636E"/>
<text x="996" y="757" font-size="12.5" fill="#59636E">5</text>
<text x="24" y="840" font-size="12.5" fill="#59636E">Top to bottom, the simulator is used more and more like the real thing. Each level catches different errors; it is not a</text>
<text x="24" y="860" font-size="12.5" fill="#59636E">cumulative score. L0a and L0b are parallel starting points.</text>
<circle cx="852.25" cy="835.5" r="4.5" fill="#59636E"/>
<text x="863.75" y="840" font-size="12.5" fill="#59636E">a work</text>
<circle cx="923" cy="835.5" r="3.75" fill="none" stroke="#59636E" stroke-width="1.5"/>
<text x="934.5" y="840" font-size="12.5" fill="#59636E">an evaluator †</text>
</svg>
