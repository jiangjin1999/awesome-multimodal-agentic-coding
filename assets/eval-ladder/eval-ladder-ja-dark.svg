<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 724" width="1066" height="724" role="img" aria-label="シミュレータ品質評価：検証レベル" font-family="&#x27;Hiragino Sans&#x27;, &#x27;Hiragino Kaku Gothic ProN&#x27;, &#x27;Yu Gothic&#x27;, Meiryo, &#x27;Noto Sans CJK JP&#x27;, &#x27;Noto Sans JP&#x27;, sans-serif">
<title>シミュレータ品質評価：検証レベル</title>
<defs>
<marker id="arrow-0" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#184F95"/></marker>
<marker id="arrow-1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#256ABF"/></marker>
<marker id="arrow-2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#3987E5"/></marker>
<marker id="arrow-3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#6DA7EC"/></marker>
<marker id="arrow-4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#9EC5F4"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1065" height="723" rx="10" fill="#0D1117" stroke="#3D444D"/>
<rect x="24" y="24" width="1018" height="60" rx="6" fill="#161B22"/>
<text x="36" y="49" font-size="14" fill="#E6EDF3">例：エージェントがキッチンのシミュレーションを作り、ロボットが「棚の扉を開けてコップを入れる」練習をする。以下の各レベルは、このキッチンについ</text>
<text x="36" y="69" font-size="14" fill="#E6EDF3">て問う。</text>
<text x="24" y="116" font-size="12.5" font-weight="600" fill="#9198A1">段階</text>
<text x="150" y="116" font-size="12.5" font-weight="600" fill="#9198A1">レベル</text>
<text x="334" y="116" font-size="12.5" font-weight="600" fill="#9198A1">このキッチンで問うこと</text>
<text x="678" y="116" font-size="12.5" font-weight="600" fill="#9198A1">このレベルでは見抜けない</text>
<text x="932" y="116" font-size="12.5" font-weight="600" fill="#9198A1">作品</text>
<line x1="24" y1="126" x2="1042" y2="126" stroke="#3D444D"/>
<line x1="31" y1="163" x2="31" y2="274" stroke="#184F95" stroke-width="2" marker-end="url(#arrow-0)"/>
<line x1="31" y1="299" x2="31" y2="346" stroke="#256ABF" stroke-width="2" marker-end="url(#arrow-1)"/>
<line x1="31" y1="371" x2="31" y2="418" stroke="#3987E5" stroke-width="2" marker-end="url(#arrow-2)"/>
<line x1="31" y1="443" x2="31" y2="618" stroke="#6DA7EC" stroke-width="2" marker-end="url(#arrow-3)"/>
<circle cx="31" cy="152" r="7" fill="#184F95"/>
<text x="46" y="157" font-size="14" font-weight="700" fill="#E6EDF3">見るだけ</text>
<circle cx="31" cy="288" r="7" fill="#256ABF"/>
<text x="46" y="293" font-size="14" font-weight="700" fill="#E6EDF3">置いたまま</text>
<circle cx="31" cy="360" r="7" fill="#3987E5"/>
<text x="46" y="365" font-size="14" font-weight="700" fill="#E6EDF3">触れてみる</text>
<circle cx="31" cy="432" r="7" fill="#6DA7EC"/>
<text x="46" y="437" font-size="14" font-weight="700" fill="#E6EDF3">動かしてみる</text>
<circle cx="31" cy="632" r="7" fill="#9EC5F4"/>
<text x="46" y="637" font-size="14" font-weight="700" fill="#E6EDF3">実際に使う</text>
<rect x="150.75" y="142.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#184F95" stroke-width="1.5"/>
<text x="157.75" y="157" font-size="12.5" font-weight="700" fill="#E6EDF3">L0a</text>
<text x="150" y="177" font-size="14" font-weight="600" fill="#E6EDF3">意味的忠実度</text>
<text x="334" y="157" font-size="14" fill="#E6EDF3">要求されたテーブル、棚、コップはそろっているか？</text>
<text x="334" y="177" font-size="14" fill="#E6EDF3">コップはテーブルの上か？</text>
<text x="678" y="157" font-size="14" fill="#9198A1">物理的な誤り全般（物理は動かさない）</text>
<circle cx="936.5" cy="152" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="948.5" cy="152" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="960.5" cy="152" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="972.5" cy="152" r="4.5" fill="#9198A1"/>
<text x="984" y="157" font-size="12.5" fill="#9198A1">4</text>
<line x1="150" y1="194" x2="1042" y2="194" stroke="#3D444D" stroke-dasharray="3 3"/>
<rect x="150.75" y="206.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#184F95" stroke-width="1.5"/>
<text x="157.75" y="221" font-size="12.5" font-weight="700" fill="#E6EDF3">L0b</text>
<text x="150" y="241" font-size="14" font-weight="600" fill="#E6EDF3">視覚・再構成の忠実度</text>
<text x="334" y="221" font-size="14" fill="#E6EDF3">写真のキッチンと同じに見えるか？</text>
<text x="678" y="221" font-size="14" fill="#9198A1">見た目が同じでも、衝突形状・質量・</text>
<text x="678" y="241" font-size="14" fill="#9198A1">関節は正しいとは限らない</text>
<circle cx="936.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="984.5" cy="216" r="4.5" fill="#9198A1"/>
<circle cx="996.5" cy="216" r="4.5" fill="#9198A1"/>
<text x="1008" y="221" font-size="12.5" fill="#9198A1">6</text>
<line x1="24" y1="262" x2="1042" y2="262" stroke="#3D444D"/>
<rect x="150.75" y="278.75" width="30" height="19.5" rx="4" fill="#0D1117" stroke="#256ABF" stroke-width="1.5"/>
<text x="157.75" y="293" font-size="12.5" font-weight="700" fill="#E6EDF3">L1</text>
<text x="150" y="313" font-size="14" font-weight="600" fill="#E6EDF3">静的な物理的妥当性</text>
<text x="334" y="293" font-size="14" fill="#E6EDF3">コップが浮いたり天板にめり込んだりしていないか？</text>
<text x="334" y="313" font-size="14" fill="#E6EDF3">ロボットは通れるか？</text>
<text x="678" y="293" font-size="14" fill="#9198A1">触れたり動いたりした後にどうなるか</text>
<circle cx="936.5" cy="288" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="948.5" cy="288" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="960" y="293" font-size="12.5" fill="#9198A1">2</text>
<line x1="24" y1="334" x2="1042" y2="334" stroke="#3D444D"/>
<rect x="150.75" y="350.75" width="30" height="19.5" rx="4" fill="#0D1117" stroke="#3987E5" stroke-width="1.5"/>
<text x="157.75" y="365" font-size="12.5" font-weight="700" fill="#E6EDF3">L2</text>
<text x="150" y="385" font-size="14" font-weight="600" fill="#E6EDF3">インタラクションの妥当性</text>
<text x="334" y="365" font-size="14" fill="#E6EDF3">棚の扉を引くと、蝶番を軸に開くか？</text>
<text x="678" y="365" font-size="14" fill="#9198A1">扉は開いても、質量や減衰は正しいと</text>
<text x="678" y="385" font-size="14" fill="#9198A1">は限らない</text>
<circle cx="936.5" cy="360" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="360" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="360" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="360" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="984" y="365" font-size="12.5" fill="#9198A1">4</text>
<line x1="24" y1="406" x2="1042" y2="406" stroke="#3D444D"/>
<rect x="150.75" y="422.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#6DA7EC" stroke-width="1.5"/>
<text x="157.75" y="437" font-size="12.5" font-weight="700" fill="#E6EDF3">L3a</text>
<text x="150" y="457" font-size="14" font-weight="600" fill="#E6EDF3">見た目が正しい</text>
<text x="334" y="437" font-size="14" fill="#E6EDF3">コップが倒れてテーブルから転がり落ちる様子は、</text>
<text x="334" y="457" font-size="14" fill="#E6EDF3">実際の映像と同じか？</text>
<text x="678" y="437" font-size="14" fill="#9198A1">手書きのアニメーションかもしれず、</text>
<text x="678" y="457" font-size="14" fill="#9198A1">計算した結果とは限らない</text>
<circle cx="936.5" cy="432" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="432" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="432" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="432" r="4.5" fill="#9198A1"/>
<circle cx="984.5" cy="432" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<circle cx="996.5" cy="432" r="4.5" fill="#9198A1"/>
<circle cx="1008.5" cy="432" r="4.5" fill="#9198A1"/>
<circle cx="1020.5" cy="432" r="4.5" fill="#9198A1"/>
<text x="1032" y="437" font-size="12.5" fill="#9198A1">8</text>
<line x1="150" y1="474" x2="1042" y2="474" stroke="#3D444D" stroke-dasharray="3 3"/>
<rect x="150.75" y="486.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#6DA7EC" stroke-width="1.5"/>
<text x="157.75" y="501" font-size="12.5" font-weight="700" fill="#E6EDF3">L3b</text>
<text x="150" y="521" font-size="14" font-weight="600" fill="#E6EDF3">本当にシミュレーション</text>
<text x="334" y="501" font-size="14" fill="#E6EDF3">天板を傾ける、コップを重くするなどして</text>
<text x="334" y="521" font-size="14" fill="#E6EDF3">再実行すると、結果は正しく変わるか？</text>
<text x="678" y="501" font-size="14" fill="#9198A1">法則は正しくても、質量や摩擦などの</text>
<text x="678" y="521" font-size="14" fill="#9198A1">値が正確とは限らない</text>
<circle cx="936.5" cy="496" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="496" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="496" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="496" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="984" y="501" font-size="12.5" fill="#9198A1">4</text>
<line x1="150" y1="538" x2="1042" y2="538" stroke="#3D444D" stroke-dasharray="3 3"/>
<rect x="150.75" y="550.75" width="37" height="19.5" rx="4" fill="#0D1117" stroke="#6DA7EC" stroke-width="1.5"/>
<text x="157.75" y="565" font-size="12.5" font-weight="700" fill="#E6EDF3">L3c</text>
<text x="150" y="585" font-size="14" font-weight="600" fill="#E6EDF3">数値が正確</text>
<text x="334" y="565" font-size="14" fill="#E6EDF3">コップの質量や天板の摩擦は実測と一致するか？</text>
<text x="334" y="585" font-size="14" fill="#E6EDF3">最初の数秒から、その後を予測できるか？</text>
<text x="678" y="565" font-size="14" fill="#9198A1">評価や学習に使ったとき、結論が成り</text>
<text x="678" y="585" font-size="14" fill="#9198A1">立つか</text>
<circle cx="936.5" cy="560" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="560" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="560" r="4.5" fill="#9198A1"/>
<text x="972" y="565" font-size="12.5" fill="#9198A1">3</text>
<line x1="24" y1="606" x2="1042" y2="606" stroke="#3D444D"/>
<rect x="150.75" y="622.75" width="30" height="19.5" rx="4" fill="#0D1117" stroke="#9EC5F4" stroke-width="1.5"/>
<text x="157.75" y="637" font-size="12.5" font-weight="700" fill="#E6EDF3">L4</text>
<text x="150" y="657" font-size="14" font-weight="600" fill="#E6EDF3">Sim-to-Real 予測性</text>
<text x="334" y="637" font-size="14" fill="#E6EDF3">ここで1位の方策は、本物のキッチンでも1位か？</text>
<text x="678" y="637" font-size="14" fill="#9198A1">評価の順位が正確でも、学習では方策</text>
<text x="678" y="657" font-size="14" fill="#9198A1">がシミュレータの誤差を突きうる</text>
<circle cx="936.5" cy="632" r="4.5" fill="#9198A1"/>
<circle cx="948.5" cy="632" r="4.5" fill="#9198A1"/>
<circle cx="960.5" cy="632" r="4.5" fill="#9198A1"/>
<circle cx="972.5" cy="632" r="4.5" fill="#9198A1"/>
<circle cx="984.5" cy="632" r="4.5" fill="#9198A1"/>
<text x="996" y="637" font-size="12.5" fill="#9198A1">5</text>
<text x="24" y="700" font-size="12.5" fill="#9198A1">上から下へ、シミュレータの使い方が実際の利用に近づく。各レベルは異なる誤りを捉えるもので、累積スコアではない。L0a と L0b は並列の起点。</text>
<circle cx="888.75" cy="695.5" r="4.5" fill="#9198A1"/>
<text x="900.25" y="700" font-size="12.5" fill="#9198A1">作品1件</text>
<circle cx="966.25" cy="695.5" r="3.75" fill="none" stroke="#9198A1" stroke-width="1.5"/>
<text x="977.75" y="700" font-size="12.5" fill="#9198A1">評価器 †</text>
</svg>
