<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 446" width="1280" height="446" role="img" aria-label="The robotics branch as one Real2Sim2Real loop. Multimodal coding agent: writes code → runs it on a robot or in a simulator → looks at the result → revises. 1 Act (Real world): 3.1 Embodied harnesses, 2.6 Action models × robot manipulation. 2 Build (Simulation): 3.2 Simulator construction, 3.3 Simulator quality evaluation. 3 Learn (Simulation): 3.4 Data, 3.5 Training and capability improvement. 4 Apply (Real world): 3.6 Physical applications and experiments." font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, &#x27;Noto Sans&#x27;, sans-serif">
