      tags: [bench]
      cells:
      - - g
        - {en: Human, zh: 人工, ja: 人手}
        - {en: Designs the tasks, zh: 设计任务, ja: タスクを設計}
      - n
      - - t
        - {en: Meshy · asset library, zh: Meshy · 资产库, ja: Meshy · アセットライブラリ}
        - {en: 'Rebuilds or collects objects, checked by hand', zh: 重建或收集物体，人工检查, ja: 物体を再構築・収集し、人手で確認}
      - - g
        - {en: Existing assets, zh: 现成资产, ja: 既存アセット}
        - {en: 'Open-source libraries, 3D scans, ClothesNet', zh: 开源库、3D 扫描、ClothesNet, ja: オープンソースライブラリ、3D スキャン、ClothesNet}
      - - g
        - {en: Hand-written YAML, zh: 人工 YAML, ja: 手書き YAML}
        - {en: Layout and initial distribution, zh: 布局与初始分布, ja: 配置と初期分布}
      - - g
        - {en: Human, zh: 人工, ja: 人手}
        - {en: Physical properties come with the assets, zh: 资产库带物理属性, ja: アセットに物理属性が付属}
      - - t
        - Isaac Sim · Isaac Lab
        - {en: Parallel evaluation, zh: 并行评测, ja: 並列評価}
      - - g
        - {en: Policy under test, zh: 被测策略, ja: 評価対象の方策}
        - {en: Outputs the actions, zh: 输出动作, ja: 行動を出力}
      - - g
        - {en: Hand-written YAML, zh: 人工 YAML, ja: 手書き YAML}
        - {en: Success conditions, zh: 成功条件, ja: 成功条件}
    - name: Video2World
