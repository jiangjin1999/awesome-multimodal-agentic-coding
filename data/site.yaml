hero:
  light: assets/hero/hero-light.png
  dark: assets/hero/hero-dark.png
  alt: 'Awesome Multimodal Agentic Coding — three cumulative stages. 01 Visual as Feedback: an agent writes code, builds an
    artifact, and observes it. 02 Orchestrating Models as Tools: the same loop calls image, video and world models. 03 Bridging
    Digital & Physical Worlds: the agent acts and observes in simulation and reality, with simulation built from the real
    world and practice in simulation strengthening the agent.'
text:
  tagline:
    en: A research map of multimodal agents that write code, observe what it does, and improve — from the digital world to
      the physical world.
    zh: 一份多模态智能体编程的研究地图：Agent 编写代码，观察代码运行的结果，并据此不断改进——从数字世界延伸到物理世界。
    ja: マルチモーダルエージェントがコードを書き、その結果を観察し、改善していく研究のマップ——デジタル世界から物理世界まで。
  vision_title:
    en: Our Vision
    zh: 我们的愿景
    ja: ビジョン
  vision:
    en: |-
      From a coding perspective, we see three stages in multimodal agents' evolution from the digital world to the physical world:

      1. **Visual feedback:** Build digital artifacts with code and refine them through visual feedback.
      2. **Models as tools:** Orchestrate models through code to combine perception, generation, and action.
      3. **Bridging digital and physical worlds:** Build simulations and drive actions with code, learning and improving in simulation and reality.
    zh: |-
      我们从 coding 的视角，将多模态 Agent 从数字世界走向物理世界的演进分为三个阶段：

      1. **视觉反馈**：用代码构建数字产物，并通过视觉反馈改进。
      2. **模型作为工具**：用代码编排不同模型，组合感知、生成与行动能力。
      3. **连接数字与物理世界**：用代码构建仿真、驱动行动，在仿真与现实中学习和改进。
    ja: |-
      私たちはコーディングの視点から、マルチモーダルエージェントがデジタル世界から物理世界へ進む過程を三段階で捉えます。

      1. **視覚フィードバック**：コードでデジタル成果物を構築し、視覚フィードバックで改善する。
      2. **ツールとしてのモデル**：コードで異なるモデルを組み合わせ、知覚・生成・行動の能力を統合する。
      3. **デジタル世界と物理世界の接続**：コードでシミュレーションを構築して行動を制御し、シミュレーションと現実で学習・改善する。
  machine_note:
    ja: この日本語版は機械支援翻訳です。論文タイトルは原文のままです。誤りを見つけた場合は Issue でお知らせください。
