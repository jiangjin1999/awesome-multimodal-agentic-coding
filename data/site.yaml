stage_chart:
  text:
    title: {en: Who does each step of building a simulator, zh: 仿真器构建：每一步由谁来做, ja: シミュレータ構築：各ステップを誰が担うか}
    alt: {en: 'Chart of who does each of the nine steps of building a simulator in fifteen representative works and two benchmarks. Columns are grouped as A Perception & Planning (task planning, perception & measurement), B Scene Construction (object assets, articulation, layout & alignment), C Physics Modeling (physical parameters, physics engine) and D Task & Control (robot control, task definition). Rows are grouped by organization: Agentic End-to-End (Plumb, CUE, Real2Gym, DyCraft), Closed-loop Workflow (Agentic Real2Sim, WorldMirror, Text2Sim, SceneSmith, Articulate-Anything, Gym-Anything), Open-loop Workflow (GenSim, Holodeck, SimFoundry) and Model-based (PhysX-Omni, Real2Code). Agents mostly plan, lay out and write control and tasks; perception goes to specialised models; every physics engine is an existing one. DyCraft has no physics engine and only builds a scene; PhysX-Omni stops at sim-ready assets.', zh: 仿真器构建九步分别由谁来做，列出 15 项代表工作和两个基准。列分四组：A 输入理解（任务规划、感知测量）、B 场景构建（物体资产、关节结构、布局对齐）、C
        物理建模（物理参数、物理引擎）、D 任务与控制（机器人控制、任务定义）。行按组织方式分组：Agentic End-to-End（Plumb、CUE、Real2Gym、DyCraft）、Closed-loop Workflow（Agentic Real2Sim、WorldMirror、Text2Sim、SceneSmith、Articulate-Anything、Gym-Anything）、Open-loop Workflow（GenSim、Holodeck、SimFoundry）、Model-based（PhysX-Omni、Real2Code）。Agent 主要负责规划、布局、控制与任务；感知交给专用模型；物理引擎都用现成的。DyCraft 没有物理引擎，只建了场景；PhysX-Omni 只到仿真就绪。, ja: シミュレータ構築の 9 ステップを誰が担うかを、代表的な 15 件とベンチマーク 2 件で示した図。列は A 入力理解（タスク計画、知覚・計測）、B シーン構築（物体アセット、関節構造、配置・位置合わせ）、C 物理モデリング（物理パラメータ、物理エンジン）、D タスクと制御（ロボット制御、タスク定義）の 4 グループ。行は構成方式で分かれる：Agentic End-to-End（Plumb、CUE、Real2Gym、DyCraft）、Closed-loop Workflow（Agentic Real2Sim、WorldMirror、Text2Sim、SceneSmith、Articulate-Anything、Gym-Anything）、Open-loop Workflow（GenSim、Holodeck、SimFoundry）、Model-based（PhysX-Omni、Real2Code）。Agent は主に計画、配置、制御とタスクを担い、知覚は専用モデルに任され、物理エンジンはすべて既存のもの。DyCraft は物理エンジンを持たずシーンのみ、PhysX-Omni はシム対応のアセットまで。}
    legend:
      a: {en: Agent or VLM does it itself, zh: Agent 或 VLM 自己做, ja: Agent・VLM 自身が行う}
      t: {en: 'Specialised tool, model or engine', zh: 交给专用工具、模型或引擎, ja: 専用ツール・モデル・エンジン}
      g: {en: Given in advance or by hand, zh: 事先给定或人工, ja: 事前に所与、または人手}
      n: {en: Not involved or not stated, zh: 不涉及或没写明, ja: 関与しない・記載なし}
      x: {en: 'No physics engine: scene only', zh: 没有物理引擎：只建了场景, ja: 物理エンジンなし：シーンのみ}
      r: {en: 'Sim-ready: loadable, not run', zh: 仿真就绪：可导入，方法里没运行, ja: シム対応：読み込めるが未実行}
    tags:
      bench: {en: Bench, zh: Bench, ja: Bench}
      S: {en: Scene only, zh: 只建场景, ja: シーンのみ}
      R: {en: Sim-ready, zh: 仿真就绪, ja: シム対応}
  groups:
  - {block: a, span: 2, en: A Perception & Planning, zh: A 输入理解, ja: A 入力理解}
  - {block: b, span: 3, en: B Scene Construction, zh: B 场景构建, ja: B シーン構築}
  - {block: c, span: 2, en: C Physics Modeling, zh: C 物理建模, ja: C 物理モデリング}
  - {block: d, span: 2, en: D Task & Control, zh: D 任务与控制, ja: D タスクと制御}
  columns:
  - {en: Task planning, zh: 任务规划, ja: タスク計画}
  - {en: Perception & measurement, zh: 感知测量, ja: 知覚・計測}
  - {en: Object assets, zh: 物体资产, ja: 物体アセット}
  - {en: Articulation, zh: 关节结构, ja: 関節構造}
  - {en: Layout & alignment, zh: 布局对齐, ja: "配置・\n位置合わせ"}
  - {en: Physical parameters, zh: 物理参数, ja: 物理パラメータ}
  - {en: Physics engine, zh: 物理引擎, ja: 物理エンジン}
  - {en: Robot control, zh: 机器人控制, ja: ロボット制御}
  - {en: Task definition, zh: 任务定义, ja: タスク定義}
  sections:
  - title: {en: Bench · reference only, zh: Bench · 基准，只作参照, ja: Bench · 参照用}
    rows:
    - name: RoboDojo
