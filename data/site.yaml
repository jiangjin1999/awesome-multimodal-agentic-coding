stages:
- id: 1
  name:
    en: Visual as Feedback
    zh: 视觉作为反馈
    ja: フィードバックとしての視覚
  intro:
    en: The agent writes code, renders or runs what it built, **looks at the result**, and uses what it sees to choose the
      next edit. Vision is feedback, not only input. Works are organized by what is built.
    zh: Agent 编写代码，渲染或运行构建出的产物，**观察结果**，再根据看到的内容决定下一步修改。视觉是反馈，而不只是输入。本阶段按构建的对象（任务）组织。
    ja: エージェントはコードを書き、作ったものをレンダリングまたは実行し、**結果を見て**、見たものから次の修正を決めます。視覚は入力であるだけでなくフィードバックです。本段階は構築する対象（タスク）ごとに整理しています。
  start_with:
  - '2502.18525'
  - '2412.13810'
  - '2608.26238'
  - '2605.28258'
  - '2605.07807'
  sections:
  - '1.1'
  - '1.2'
  - '1.3'
  - '1.4'
  - '1.5'
  - '1.6'
  - '1.7'
- id: 2
  name:
    en: Orchestrating Models as Tools
    zh: 把模型当作工具来编排
    ja: モデルをツールとして編成する
  intro:
    en: The agent **calls other models through code** — image, video and world generators, perception and action models —
      composes them into workflows, and revises those workflows from feedback. A work is placed here when its main contribution
      is how models are chosen and combined. Works are organized by model type × task.
    zh: Agent **通过代码调用其他模型**——图像、视频和世界生成模型，以及感知和动作模型——把它们组合成工作流，并根据反馈修改工作流。主要贡献在于「怎样选择和组合模型」的工作放在这里。本阶段按「模型类型 × 任务」组织。
    ja: エージェントは**コードを通じて他のモデルを呼び出し**（画像・動画・世界の生成モデル、知覚モデル、行動モデル）、それらをワークフローに組み合わせ、フィードバックに基づいてワークフローを修正します。主な貢献が「モデルの選び方と組み合わせ方」にある研究をここに置きます。本段階は「モデルの種類
      × タスク」で整理しています。
  start_with:
  - '2609.24997'
  - '2610.20571'
  - '2610.26811'
  - '2611.05275'
  sections:
  - '2.1'
  - '2.2'
  - '2.3'
  - '2.4'
  - '2.5'
  - '2.6'
- id: 3
  name:
    en: Bridging Digital & Physical Worlds
    zh: 打通数字世界与物理世界
    ja: デジタルと物理世界の架け橋
  intro:
    en: 'The loop reaches simulation and reality: the agent **acts and observes in the real world**, builds simulators from
      real observations, and practises in simulation to become stronger — Real2Sim2Real. Works are organized by research question:
      build verifiable environments → collect interaction experience → improve the agent.'
    zh: 闭环延伸到仿真与现实：Agent **在真实世界中行动和观察**，依据真实观测构建仿真器，并在仿真中练习来增强自身——即 Real2Sim2Real。本阶段按研究问题组织，主线是：构建可验证的环境 → 收集交互经验 → 提升 Agent。
    ja: ループはシミュレーションと現実へ広がります。エージェントは**現実世界で行動し観察し**、実観測からシミュレータを構築し、シミュレーションで練習して強くなります——Real2Sim2Real です。本段階は研究課題ごとに整理しており、検証可能な環境を構築
      → インタラクション経験を収集 → エージェントを改善、という流れです。
  start_with:
  - '2209.07753'
  - '2611.01560'
  - '2609.37089'
  - '2610.10479'
  - '2310.12931'
  sections:
