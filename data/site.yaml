stage_chart_full:
  text:
    title: {en: 'Every Section 3.2 work, step by step', zh: 3.2 全部工作逐步对照}
    alt: {en: 'Chart of all 68 works in Section 3.2 and two reference benchmarks: for each of the nine build steps, plus verification & revision and variant expansion, whether the Agent or VLM does it, a specialised tool does it, it is given, or it is not involved. Agents take most of task planning (55 works), layout (43) and verification & revision (49), while perception goes to specialised models (32). 46 works run a physics engine, 10 only build a scene, 9 stop at sim-ready and 3 do not name one.', zh: 3.2 全部 68 项和两个参照基准的逐步对照：九个构建步骤加上检查与修订、变体扩增，每一步是 Agent 或 VLM 自己做、交给专用工具、事先给定，还是不涉及。任务规划（55 项）、布局对齐（43 项）和检查与修订（49 项）大多由 Agent 做，感知测量多交给专用模型（32 项）。46 项运行了物理引擎，10 项只建场景，9 项只到仿真就绪，3 项没写明引擎。}
