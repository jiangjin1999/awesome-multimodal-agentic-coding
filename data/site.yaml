  extras:
  - anchor: s3-engines
    title:
      en: Simulation engines at a glance
      zh: 仿真引擎一览
      ja: シミュレーションエンジン一覧
    body:
      en: |-
        Physics simulation engines commonly used in Stage 3. Representative works are chosen from those that use the engine as their main platform, ranked by citations and GitHub stars.

        **Choosing for robot-arm manipulation:** state inputs such as joint angles and object poses, with accurate contact → MuJoCo; camera-image inputs or large-scale synthetic data → Isaac Sim / Isaac Lab or ManiSkill; articulated objects such as drawers and cabinet doors → SAPIEN / ManiSkill; cloth, cables or soft bodies → Genesis or Newton.

        | Category | Engine | In one sentence | For robot-arm manipulation | Representative works |
        |---|---|---|---|---|
        | Physics engines (physics only, simple graphics) | [MuJoCo](https://mujoco.readthedocs.io/en/stable/overview.html) | An open-source physics engine maintained by Google DeepMind. Describe the robot and objects in one XML file, and it computes contacts and joint motion quickly and accurately | **First choice.** Accurate contact; suits state-based policies, reinforcement learning and calibrating parameters against real data. Graphics are simple, so it does not suit vision-based policies | [Real2Code](#paper-2406-08474) · [Articulate-Anything](#paper-2410-13882) · [LiteReality-Agent](#paper-2610-01863) |
        | | [PyBullet](https://pybullet.org/) | A long-standing, lightweight physics engine that works right after `pip install` | Usable. Good for quick prototypes; accuracy and graphics are moderate | [GenSim](#paper-2310-01361) · [Instruct2Act](#paper-2305-11176) · [OMNI-EPIC](#paper-2405-15568) |
        | | [Drake](https://drake.mit.edu/) | A robotics toolbox developed mainly by Toyota Research Institute, emphasizing rigorous models and mathematical optimization | Usable. Good for motion planning and for checking whether a placement is stable or interpenetrating; not suited to large-scale training | [SceneSmith](#paper-2602-09153) · [GIF](#paper-2609-05927) |
        | | [Genesis](https://genesis-world.readthedocs.io/en/latest/) | A newer Python-native physics platform with one interface for rigid bodies, cloth, fluids and soft bodies | Usable. Better suited to manipulation involving cloth or soft bodies; the ecosystem is still young | [RoboGen](#paper-2311-01455) · [GS-Agent](#paper-2607-21522) |
        | | [Newton](https://newton-physics.github.io/newton/) / [Warp](https://nvidia.github.io/warp/) | Warp is NVIDIA's framework for writing GPU simulation code in Python; Newton is an open-source physics engine built on Warp by NVIDIA, Google DeepMind and Disney Research | Usable. GPU-accelerated and differentiable; suits cloth, cables and soft bodies; still evolving quickly | [RoboSimStudio](#paper-2610-18835) · [Gym-Anything](#paper-2610-40565) · [DeformMaster](#paper-2605-09586) |
        | Simulation platforms (physics + realistic rendering + sensors) | [Isaac Sim](https://docs.isaacsim.omniverse.nvidia.com/latest/index.html) / [Isaac Lab](https://isaac-sim.github.io/IsaacLab/) | NVIDIA's robot simulation platform: PhysX for physics, ray tracing for rendering, plus simulated cameras and LiDAR. Isaac Lab is the parallel-training framework built on it, succeeding Isaac Gym | **First choice.** Suits vision-based policies, large-scale synthetic data and digital twins; needs an NVIDIA GPU and a heavy installation | [SAGE](#paper-2602-10116) · [Gen2Sim](#paper-2310-18308) |
        | | [SAPIEN](https://github.com/haosulab/SAPIEN) / [ManiSkill](https://maniskill.readthedocs.io/en/latest/) | A simulation platform designed for manipulation, with many articulated object models such as drawers and cabinet doors. ManiSkill is the GPU-parallel task suite built on it | **First choice.** Suits articulated-object manipulation and GPU-parallel data collection | [Articulate-Anything](#paper-2410-13882) · [EmbodiedGen V2](#paper-2607-07459) |
        | ROS-ecosystem simulators | [Gazebo](https://gazebosim.org/docs/latest/getstarted/) / [Webots](https://cyberbotics.com/) | Built for whole-system testing: the real robot's ROS code can run directly in simulation | Usable. Good for whole-system integration; grasp contact is weaker, so it does not suit large-scale data collection | [Adaptive Code Generation](#paper-2610-09588) · [Webots MCP](#paper-res-webots-mcp) |
      zh: |-
        Stage 3 工作中常用的物理仿真引擎。代表工作从以该引擎为主平台的工作中选取，按引用数和 GitHub star 排序。

        **做机械臂操作时怎么选：** 策略输入关节角、物体位姿等状态，且要求接触准 → MuJoCo；策略输入相机图像，或需要大规模合成数据 → Isaac Sim / Isaac Lab 或 ManiSkill；主要操作抽屉、柜门等关节物体 → SAPIEN / ManiSkill；涉及布料、绳子、软体 → Genesis 或 Newton。

        | 类别 | 引擎 | 一句话理解 | 用于机械臂操作 | 代表工作 |
        |---|---|---|---|---|
        | 物理引擎（只算物理，画面简单） | [MuJoCo](https://mujoco.readthedocs.io/en/stable/overview.html) | Google DeepMind 维护的开源物理引擎。一个 XML 文件写清机器人和物体，就能又快又准地算出碰撞和关节运动 | **首选**。接触准，适合输入状态的策略、强化学习、按真实数据校准参数；画面简单，不适合视觉策略 | [Real2Code](#paper-2406-08474) · [Articulate-Anything](#paper-2410-13882) · [LiteReality-Agent](#paper-2610-01863) |
        | | [PyBullet](https://pybullet.org/) | 老牌轻量物理引擎，pip 装上就能用 | 可用。适合快速做原型；精度和画面一般 | [GenSim](#paper-2310-01361) · [Instruct2Act](#paper-2305-11176) · [OMNI-EPIC](#paper-2405-15568) |
        | | [Drake](https://drake.mit.edu/) | 丰田研究院（TRI）主导开发的机器人工具箱，强调模型严谨和数学优化 | 可用。适合运动规划，以及检查放置稳不稳、有没有穿模；不适合大规模训练 | [SceneSmith](#paper-2602-09153) · [GIF](#paper-2609-05927) |
        | | [Genesis](https://genesis-world.readthedocs.io/en/latest/) | 新一代 Python 物理平台，刚体、布料、流体、软体用同一套接口 | 可用。涉及布料、软体的操作更合适；生态还比较新 | [RoboGen](#paper-2311-01455) · [GS-Agent](#paper-2607-21522) |
        | | [Newton](https://newton-physics.github.io/newton/) / [Warp](https://nvidia.github.io/warp/) | Warp 是 NVIDIA 用 Python 写 GPU 仿真代码的工具；Newton 是 NVIDIA、Google DeepMind、Disney Research 基于 Warp 联合开源的物理引擎 | 可用。GPU 加速、可微，适合布料、绳子、软体；还在快速迭代 | [RoboSimStudio](#paper-2610-18835) · [Gym-Anything](#paper-2610-40565) · [DeformMaster](#paper-2605-09586) |
        | 仿真平台（物理 + 逼真渲染 + 传感器） | [Isaac Sim](https://docs.isaacsim.omniverse.nvidia.com/latest/index.html) / [Isaac Lab](https://isaac-sim.github.io/IsaacLab/) | NVIDIA 的机器人仿真平台：物理用 PhysX，画面用光线追踪，还能模拟相机和激光雷达。Isaac Lab 是在它上面做并行训练的框架，前身是 Isaac Gym | **首选**。适合视觉策略、大规模合成数据、数字孪生；需要 NVIDIA 显卡，安装较重 | [SAGE](#paper-2602-10116) · [Gen2Sim](#paper-2310-18308) |
        | | [SAPIEN](https://github.com/haosulab/SAPIEN) / [ManiSkill](https://maniskill.readthedocs.io/en/latest/) | 专为操作任务设计的仿真平台，配套大量抽屉、柜门等关节物体模型。ManiSkill 是在它上面做的 GPU 并行任务集 | **首选**。适合关节物体操作、GPU 并行采数据 | [Articulate-Anything](#paper-2410-13882) · [EmbodiedGen V2](#paper-2607-07459) |
        | ROS 生态仿真器 | [Gazebo](https://gazebosim.org/docs/latest/getstarted/) / [Webots](https://cyberbotics.com/) | 面向整机系统测试：真机的 ROS 代码可以直接放进仿真里跑 | 可用。适合整套系统联调；抓取接触较弱，不适合大规模采数据 | [Adaptive Code Generation](#paper-2610-09588) · [Webots MCP](#paper-res-webots-mcp) |
      ja: |-
        Stage 3 の作品でよく使われる物理シミュレーションエンジンです。代表作は、そのエンジンを主なプラットフォームとして使う作品から、被引用数と GitHub スター数の順に選んでいます。

        **ロボットアームによる操作で選ぶなら：** 関節角や物体姿勢などの状態を入力とし、正確な接触が必要 → MuJoCo；カメラ画像を入力とする、または大規模な合成データが必要 → Isaac Sim / Isaac Lab または ManiSkill；引き出しや扉などの関節物体を主に操作する → SAPIEN / ManiSkill；布、ケーブル、柔軟物を扱う → Genesis または Newton。

        | 分類 | エンジン | ひとことで | ロボットアーム操作での使い方 | 代表作 |
        |---|---|---|---|---|
        | 物理エンジン（物理計算のみ、描画は簡素） | [MuJoCo](https://mujoco.readthedocs.io/en/stable/overview.html) | Google DeepMind が保守するオープンソース物理エンジン。ロボットと物体を 1 つの XML ファイルに書けば、接触と関節の運動を高速かつ正確に計算する | **第一候補**。接触が正確で、状態入力の方策、強化学習、実データに基づくパラメータ較正に向く。描画は簡素で、視覚方策には向かない | [Real2Code](#paper-2406-08474) · [Articulate-Anything](#paper-2410-13882) · [LiteReality-Agent](#paper-2610-01863) |
        | | [PyBullet](https://pybullet.org/) | 定番の軽量物理エンジン。pip でインストールすればすぐ使える | 利用可。素早い試作に向く。精度と描画はそこそこ | [GenSim](#paper-2310-01361) · [Instruct2Act](#paper-2305-11176) · [OMNI-EPIC](#paper-2405-15568) |
        | | [Drake](https://drake.mit.edu/) | Toyota Research Institute（TRI）が中心となって開発するロボティクスツールボックス。厳密なモデルと数理最適化を重視する | 利用可。動作計画や、配置が安定しているか・めり込みがないかの検査に向く。大規模な学習には向かない | [SceneSmith](#paper-2602-09153) · [GIF](#paper-2609-05927) |
        | | [Genesis](https://genesis-world.readthedocs.io/en/latest/) | 新世代の Python ネイティブ物理プラットフォーム。剛体、布、流体、柔軟物を同じインターフェースで扱う | 利用可。布や柔軟物を含む操作に特に向く。エコシステムはまだ新しい | [RoboGen](#paper-2311-01455) · [GS-Agent](#paper-2607-21522) |
        | | [Newton](https://newton-physics.github.io/newton/) / [Warp](https://nvidia.github.io/warp/) | Warp は Python で GPU シミュレーションのコードを書くための NVIDIA のフレームワーク。Newton は NVIDIA、Google DeepMind、Disney Research が Warp 上で共同開発したオープンソース物理エンジン | 利用可。GPU で高速化でき微分可能で、布、ケーブル、柔軟物に向く。開発は今も急速に進んでいる | [RoboSimStudio](#paper-2610-18835) · [Gym-Anything](#paper-2610-40565) · [DeformMaster](#paper-2605-09586) |
        | シミュレーションプラットフォーム（物理＋リアルな描画＋センサー） | [Isaac Sim](https://docs.isaacsim.omniverse.nvidia.com/latest/index.html) / [Isaac Lab](https://isaac-sim.github.io/IsaacLab/) | NVIDIA のロボットシミュレーションプラットフォーム。物理は PhysX、描画はレイトレーシングで、カメラや LiDAR も模擬できる。Isaac Lab はその上の並列学習フレームワークで、Isaac Gym の後継 | **第一候補**。視覚方策、大規模な合成データ、デジタルツインに向く。NVIDIA GPU が必要で、導入は重い | [SAGE](#paper-2602-10116) · [Gen2Sim](#paper-2310-18308) |
        | | [SAPIEN](https://github.com/haosulab/SAPIEN) / [ManiSkill](https://maniskill.readthedocs.io/en/latest/) | 操作タスク向けに設計されたシミュレーションプラットフォームで、引き出しや扉などの関節物体モデルを多数備える。ManiSkill はその上に作られた GPU 並列のタスク集 | **第一候補**。関節物体の操作や GPU 並列のデータ収集に向く | [Articulate-Anything](#paper-2410-13882) · [EmbodiedGen V2](#paper-2607-07459) |
        | ROS 系シミュレータ | [Gazebo](https://gazebosim.org/docs/latest/getstarted/) / [Webots](https://cyberbotics.com/) | システム全体のテスト向け。実機の ROS コードをそのままシミュレーションで動かせる | 利用可。システム全体の統合試験に向く。把持の接触は弱く、大規模なデータ収集には向かない | [Adaptive Code Generation](#paper-2610-09588) · [Webots MCP](#paper-res-webots-mcp) |
