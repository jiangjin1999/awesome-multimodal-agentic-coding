engine_strengths:
  text:
    title:
      en: Simulation tool strengths
      zh: 仿真工具强项对比
      ja: シミュレーションツールの強み
    alt:
      en: 'Heatmap of simulation tool strengths: eight tools rated from 1 to 3 on eight dimensions, grouped like the coverage
        map. Top picks: building the world, SAPIEN/ManiSkill for articulated objects and MuJoCo for friendliness to coding agents
        (PyBullet is also strong); physics, Drake for contact accuracy (MuJoCo and Newton are also strong) and Genesis for deformables
        (Newton is also strong); observation, Isaac Sim/Lab for visual realism; training and deployment, Isaac Sim/Lab for GPU scale (SAPIEN/ManiSkill,
        Genesis and Newton are also strong), Drake for planning and optimization, and Gazebo/Webots for ROS and real robots.'
      zh: 仿真工具强项对比热力表：8 个工具在 8 个维度上各评 1 到 3 档，维度按覆盖图的四块分组。各维度首推：A 造世界——关节物体 SAPIEN/ManiSkill，Agent 友好 MuJoCo（PyBullet
        也强）；B 算物理——接触精度 Drake（MuJoCo、Newton 也强），软体布料 Genesis（Newton 也强）；C 给观察——画面逼真 Isaac Sim/Lab；D 训练与部署——GPU 并行 Isaac
        Sim/Lab（SAPIEN/ManiSkill、Genesis、Newton 也强），规划优化 Drake，ROS 与真机 Gazebo/Webots。
      ja: シミュレーションツールの強みのヒートマップ。8 つのツールを 8 つの観点で 1〜3 段階に評価し、観点は対応範囲の図と同じ四つに分けている。各観点の第一候補：A 世界をつくる——関節物体は SAPIEN/ManiSkill、エージェント向きは
        MuJoCo（PyBullet も強い）。B 物理計算——接触精度は Drake（MuJoCo と Newton も強い）、柔軟物は Genesis（Newton も強い）。C 観測——写実的な描画は Isaac Sim/Lab。D
        学習と実機展開——GPU 並列は Isaac Sim/Lab（SAPIEN/ManiSkill、Genesis、Newton も強い）、計画・最適化は Drake、ROS・実機は Gazebo/Webots。
    legend:
      '3':
        en: Strong
        zh: 强
        ja: 強い
      '2':
        en: Usable
        zh: 可用
        ja: 使える
      '1':
        en: Weak or needs other tools
        zh: 弱或要靠外部工具
        ja: 弱い・外部ツールが必要
      star:
        en: Top pick for this column
        zh: 这一项的首推
        ja: この項目の第一候補
  groups:
  - block: a
    span: 2
    en: A Build the world
    zh: A 造世界
    ja: A 世界をつくる
  - block: b
    span: 2
    en: B Physics
    zh: B 算物理
    ja: B 物理計算
  - block: c
    span: 1
    en: C Observation
    zh: C 给观察
    ja: C 観測
  - block: d
    span: 3
    en: D Training & deployment
    zh: D 训练与部署
    ja: D 学習と実機展開
  columns:
  - name: {en: Articulated, zh: 关节物体, ja: 関節物体}
    hint: {en: 'drawers, doors', zh: 抽屉、柜门, ja: 引き出し・扉}
  - name: {en: For agents, zh: Agent 友好, ja: Agent 向き}
    hint: {en: easy to edit, zh: 场景好写好改, ja: 書きやすさ}
  - name: {en: Contact, zh: 接触精度, ja: 接触精度}
    hint: {en: 'grasp, insert', zh: 抓取、插孔, ja: 把持・挿入}
  - name: {en: Deformables, zh: 软体布料, ja: 柔軟物}
    hint: {en: 'cloth, fluid', zh: 布、绳、流体, ja: 布・紐・流体}
