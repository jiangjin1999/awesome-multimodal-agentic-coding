    - name: Usage-Driven Code Scenes
      id: '2608.18840'
      tier: F
      steps: anaatntnaan
      how: {en: 'ArtiCraft writes movable assets; interaction rules, geometric solving and a Critic', zh: ArtiCraft 写可动资产，交互规则，几何求解与 Critic}
    - name: LiteReality-Agent
      id: '2610.01863'
      tier: R
      steps: gtttaarnnan
      how: {en: Fixed front-end pipeline; a Coding Agent edits Room.py and exports MuJoCo, zh: 前段固定流水线，Coding Agent 改 Room.py，导出 MuJoCo}
    - name: SimFoundry
      id: '2606.28276'
      tier: F
      steps: attatatnana
      how: {en: 'Perception, generation, articulation and pose modules in order; a VLM sets physics', zh: 感知、生成、关节、位姿模块按序，VLM 定物理参数}
    - name: SceneCode
      id: '2605.19587'
      tier: R
      steps: anaaatrnnan
      how: {en: 'Room Agent lays out, per-part Blender Python, physics compiled in', zh: 房间 Agent 布局，逐部件 Blender Python，编译物理属性}
    - name: Vid2Sid
      id: '2602.19359'
      tier: F
      steps: ntgnnatgnan
      how: {en: Fixed perception; a VLM tunes parameters by comparing sim and real video, zh: 感知固定，VLM 对比仿真与真实视频调参数}
  - title: {en: Model-based (without Agent) · models or optimization produce the result, zh: Model-based (without Agent) · 没有 Agent，模型或优化直接产出}
    rows:
    - name: UniPhysGen
      id: '2607.13586'
      tier: R
      steps: ntgtntrnntn
      how: {en: 'Existing assets, perceptual grouping and property estimation, a learned model', zh: 已有资产，感知分组与属性估计，学习模型}
    - name: Video2Sim2Real
      id: '2606.08828'
      tier: F
      steps: nttntnttgnn
      how: {en: 'Foundation models rebuild the twin; optimisation, imitation and RL', zh: 基础模型重建孪生，优化、模仿学习和强化学习}
    - name: PhysX-Omni
      id: '2605.21572'
      tier: R
      steps: tnttntrnnnn
      how: {en: Fine-tuned VLM generates assets with joints and physical properties, zh: 微调的 VLM 直接生成带关节和物理属性的资产}
    - name: DeformMaster
      id: '2605.09586'
      tier: F
      steps: nttnntttnnn
      how: {en: 'MPM plus a neural residual, optimised from interaction video', zh: MPM + 神经残差，从交互视频优化}
    - name: Real2Code
      id: '2406.08474'
      tier: F
      steps: nttttntnnnn
      how: {en: 'Segmentation and completion, then fine-tuned CodeLlama writes joint code', zh: 分割、补全后，微调 CodeLlama 写关节代码}
