  - '3.5'
  - '3.6'
  extras:
  - anchor: s3-engines
    title:
      en: Simulation engines at a glance
      zh: 仿真引擎一览
      ja: シミュレーションエンジン一覧
    body:
      en: |-
        Read across a row to see which steps of a simulator each tool handles. Coverage is a broad judgment that shows the division of labour, not a precise score.

        {engine_map}

        <details>
        <summary>Tool documentation and examples</summary>

        [MuJoCo](https://mujoco.readthedocs.io/en/stable/overview.html) · [PyBullet](https://pybullet.org/) · [Bullet](https://github.com/bulletphysics/bullet3) · [Drake](https://drake.mit.edu/) · [Genesis](https://genesis-world.readthedocs.io/en/latest/) · [Newton](https://newton-physics.github.io/newton/) · [Warp](https://nvidia.github.io/warp/) · [Isaac Sim](https://docs.isaacsim.omniverse.nvidia.com/latest/index.html) · [Isaac Lab](https://isaac-sim.github.io/IsaacLab/) · [Isaac Gym](https://github.com/isaac-sim/IsaacGymEnvs) · [SAPIEN](https://github.com/haosulab/SAPIEN) · [ManiSkill](https://maniskill.readthedocs.io/en/latest/) · [Gazebo](https://gazebosim.org/docs/latest/getstarted/) · [Webots](https://cyberbotics.com/) · [GS-Agent example scripts](https://github.com/UMass-Embodied-AGI/gs-agent/tree/gh-pages/static/code)

        </details>
      zh: |-
        横着看一行，就是这个工具负责仿真器的哪些环节。覆盖程度是概括性判断，用来看清分工，不是精确评分。

        {engine_map}

        <details>
        <summary>工具文档与示例</summary>

        [MuJoCo](https://mujoco.readthedocs.io/en/stable/overview.html) · [PyBullet](https://pybullet.org/) · [Bullet](https://github.com/bulletphysics/bullet3) · [Drake](https://drake.mit.edu/) · [Genesis](https://genesis-world.readthedocs.io/en/latest/) · [Newton](https://newton-physics.github.io/newton/) · [Warp](https://nvidia.github.io/warp/) · [Isaac Sim](https://docs.isaacsim.omniverse.nvidia.com/latest/index.html) · [Isaac Lab](https://isaac-sim.github.io/IsaacLab/) · [Isaac Gym](https://github.com/isaac-sim/IsaacGymEnvs) · [SAPIEN](https://github.com/haosulab/SAPIEN) · [ManiSkill](https://maniskill.readthedocs.io/en/latest/) · [Gazebo](https://gazebosim.org/docs/latest/getstarted/) · [Webots](https://cyberbotics.com/) · [GS-Agent 脚本示例](https://github.com/UMass-Embodied-AGI/gs-agent/tree/gh-pages/static/code)

        </details>
      ja: |-
        行を横に見ると、そのツールがシミュレータのどの工程を担うかがわかります。対応範囲はおおまかな判断で、役割分担を示すためのものです。厳密な評価ではありません。

        {engine_map}

        <details>
        <summary>ツールのドキュメントとサンプル</summary>

        [MuJoCo](https://mujoco.readthedocs.io/en/stable/overview.html) · [PyBullet](https://pybullet.org/) · [Bullet](https://github.com/bulletphysics/bullet3) · [Drake](https://drake.mit.edu/) · [Genesis](https://genesis-world.readthedocs.io/en/latest/) · [Newton](https://newton-physics.github.io/newton/) · [Warp](https://nvidia.github.io/warp/) · [Isaac Sim](https://docs.isaacsim.omniverse.nvidia.com/latest/index.html) · [Isaac Lab](https://isaac-sim.github.io/IsaacLab/) · [Isaac Gym](https://github.com/isaac-sim/IsaacGymEnvs) · [SAPIEN](https://github.com/haosulab/SAPIEN) · [ManiSkill](https://maniskill.readthedocs.io/en/latest/) · [Gazebo](https://gazebosim.org/docs/latest/getstarted/) · [Webots](https://cyberbotics.com/) · [GS-Agent のサンプルスクリプト](https://github.com/UMass-Embodied-AGI/gs-agent/tree/gh-pages/static/code)

        </details>
engine_map:
  text:
    title:
      en: Simulation tool coverage map
      zh: 仿真工具覆盖图
      ja: シミュレーションツールの対応範囲
    alt:
      en: 'Coverage map of simulation tools across eight steps: assets, scene file, physical parameters, physics solver,
        rendering, sensors, control, and tasks and training. MuJoCo centres on physics solving; robosuite and RoboCasa are
        built on it and add control, tasks and training. Isaac Sim covers assets through control and uses PhysX for physics;
        Isaac Lab is built on it and adds parallel training. SAPIEN/ManiSkill covers the whole manipulation pipeline. Genesis
        adds sensors, inverse kinematics and motion planning to its physics. Newton/Warp, Drake and PyBullet centre on physics
        solving, and Drake is also strong in planning and optimization. Gazebo/Webots are strong in sensors and ROS. Blender
        is shown for contrast: it models and renders well, but its physics only aims to look right.'
      zh: 仿真工具覆盖图，横轴是八个环节：素材、场景文件、物理参数、物理求解、渲染、传感器、控制接口、任务与训练。MuJoCo 以物理求解为核心，robosuite 和 RoboCasa
        建在它之上，补上控制、任务与训练。Isaac Sim 覆盖从素材到控制接口，物理用 PhysX；Isaac Lab 建在它之上，负责并行训练。SAPIEN/ManiSkill 覆盖操作任务的全流程。Genesis
        在物理求解之外还提供传感器、逆运动学和运动规划。Newton/Warp、Drake 和 PyBullet 以物理求解为核心，Drake 还擅长规划与优化。Gazebo/Webots 强在传感器和 ROS。Blender
        作为对照：建模和渲染强，但物理只求看起来对。
      ja: シミュレーションツールの対応範囲。横軸は素材、シーン記述、物理パラメータ、物理ソルバ、レンダリング、センサー、ロボット制御、タスクと学習の八工程。MuJoCo は物理計算が中心で、robosuite
        と RoboCasa がその上に制御、タスク、学習を加える。Isaac Sim は素材から制御までを担い、物理には PhysX を使う。Isaac Lab はその上で並列学習を担う。SAPIEN/ManiSkill
        は操作タスクの全工程を扱う。Genesis は物理計算に加えてセンサー、逆運動学、動作計画を備える。Newton/Warp、Drake、PyBullet は物理計算が中心で、Drake は計画と最適化にも強い。Gazebo/Webots
        はセンサーと ROS に強い。Blender は比較用で、モデリングと描画に強いが、物理は見た目重視にとどまる。
    legend:
      core:
        en: Core function
        zh: 核心功能
        ja: 中核機能
      basic:
        en: Basic support
        zh: 基础可用
        ja: 基本機能
      none:
        en: Not included; needs another project
        zh: 没有，要靠别的项目
        ja: なし（別のプロジェクトで補う）
      inherit:
        en: Uses the tool it is built on
        zh: 直接用底下那个工具的
        ja: 土台のツールをそのまま使う
