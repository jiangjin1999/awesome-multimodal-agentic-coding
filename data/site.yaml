hero:
  light: assets/hero/hero-light.png
  dark: assets/hero/hero-dark.png
  alt: >-
    Awesome Multimodal Agentic Coding — three cumulative stages. 01 Visual as Feedback: an agent writes code,
    builds an artifact, and observes it. 02 Orchestrating Models as Tools: the same loop calls image, video and
    world models. 03 Bridging Digital & Physical Worlds: the agent acts and observes in simulation and reality,
    with simulation built from the real world and practice in simulation strengthening the agent.

text:
  tagline:
    en: A research map of multimodal agents that write code, observe what it does, and improve — from screens to the physical world.
    zh: 一份多模态智能体编程的研究地图：Agent 编写代码，观察代码运行的结果，并据此不断改进——从屏幕延伸到物理世界。
    ja: マルチモーダルエージェントがコードを書き、その結果を観察し、改善していく研究のマップ——画面の中から物理世界まで。
  vision_title:
    en: Our Vision
    zh: 我们的愿景
    ja: ビジョン
  vision:
    en: >-
      We read multimodal agentic coding as **one loop that keeps expanding**: an agent writes code, builds something,
      observes the result, and revises. Each stage keeps that loop and adds one thing — **01** the agent *sees* what it
      builds; **02** it *calls other models as tools*; **03** it *acts* in simulation and the real world.
    zh: >-
      我们把多模态智能体编程理解为**一个不断扩展的闭环**：Agent 编写代码、构建产物、观察结果，再据此修改。每个阶段都保留这个闭环，并在其上增加一样东西——**01** Agent *看见*自己构建的东西；**02** Agent *把其他模型当作工具来调用*；**03** Agent 在仿真与真实世界中*行动*。
    ja: >-
      私たちはマルチモーダル・エージェンティック・コーディングを**拡張し続ける一つのループ**として捉えます。エージェントはコードを書き、成果物を構築し、結果を観察して修正します。各段階はこのループを保ったまま一つの要素を加えます——**01** 自分が作ったものを*見る*、**02** 他のモデルを*ツールとして呼び出す*、**03** シミュレーションと現実世界で*行動する*。
  machine_note:
    ja: この日本語版は機械支援翻訳です。論文タイトルは原文のままです。誤りを見つけた場合は Issue でお知らせください。
  contents:
    en: Contents
    zh: 目录
    ja: 目次
  scope_title:
    en: What is included
    zh: 收录标准
    ja: 収録基準
  scope:
    en: >-
      A work is included when, within one agent trajectory, **code builds or changes an artifact or world state, the
      agent obtains post-execution evidence (visual, temporal, spatial, interactive or embodied), and that evidence changes
      later code or tool actions.** Tools, callable models and demos are listed when they support such a loop.
      Each work appears once; related placements are linked with *See also*.
    zh: >-
      收录标准是：在同一条 Agent 轨迹中，**代码构建或改变了产物或世界状态，Agent 获得了执行后的证据（视觉、时间、空间、交互或具身），并且这些证据改变了后续的代码或工具动作。** 工具、可调用模型和 Demo 在能够支撑这一闭环时收录。每项工作只出现一次，相关位置用「另见」链接。
    ja: >-
      収録の基準は、一つのエージェント軌跡の中で、**コードが成果物や世界の状態を構築・変更し、エージェントが実行後の証拠（視覚・時間・空間・インタラクション・身体性）を得て、その証拠が後のコードやツール操作を変えること**です。ツール、呼び出し可能なモデル、デモは、このループを支える場合に掲載します。各研究は一度だけ掲載し、関連する箇所は「関連」で示します。
  start_with:
    en: Start with
    zh: 入门必读
    ja: まず読む
