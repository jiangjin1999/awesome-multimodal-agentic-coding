      - - a
        - Agent
        - {en: Sets up contacts, zh: 设置接触, ja: 接触を設定}
      - - t
        - Isaac Sim
        - {en: Platform runs the replay, zh: 平台执行回放, ja: プラットフォームが再生を実行}
      - - a
        - Agent
        - {en: Writes actions.npy, zh: 写 actions.npy, ja: actions.npy を書く}
      - - g
        - {en: Given by the task, zh: 题目给定, ja: 課題で指定}
        - {en: Success conditions, zh: 成功条件, ja: 成功条件}
  - title: {en: Agentic End-to-End · one Agent does it all, zh: Agentic End-to-End · 一个 Agent 端到端, ja: Agentic End-to-End · 1 つの Agent が通しで担う}
    rows:
    - name: Plumb
