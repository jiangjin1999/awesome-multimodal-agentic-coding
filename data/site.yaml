related_lists:
- name: Awesome Multimodal LLM for Code
  url: https://github.com/xjywhu/Awesome-Multimodal-LLM-for-Code
  en: The closest broad collection, covering both one-shot and agentic multimodal code generation.
  zh: 最接近的宽口径合集，同时覆盖一次性与 Agentic 多模态代码生成。
  ja: 最も近い幅広いコレクションで、一回生成型とエージェント型の両方のマルチモーダルコード生成を扱います。
- name: Awesome Agentic Artifact Creation
  url: https://github.com/GeminiLight/awesome-agentic-artifact-creation
  en: A broader artifact-centric list spanning code, visual media, audio, video and 3D.
  zh: 更广的产物中心合集，覆盖代码、视觉媒体、音频、视频和 3D。
  ja: コード、視覚メディア、音声、動画、3D にわたる、成果物中心のより広いリストです。
- name: Awesome Agentic Coding Papers
  url: https://github.com/archersama/awesome-agentic-coding-papers
  en: Coding-agent research with less emphasis on multimodal execution feedback.
  zh: Coding Agent 研究合集，对多模态执行反馈的强调较少。
  ja: コーディングエージェント研究のリストで、マルチモーダルな実行フィードバックへの比重は小さめです。
- name: Awesome Code Agents
  url: https://github.com/EuniAI/awesome-code-agents
  en: Coding agents organized by the artifacts and environments they build, including web, CAD, 3D, graphics and games.
  zh: 按产物和环境组织 Coding Agent，包括 Web、CAD、3D、图形和游戏。
  ja: Web、CAD、3D、グラフィックス、ゲームなど、構築する成果物と環境ごとにコーディングエージェントを整理しています。
- name: Awesome Agentic MLLMs
  url: https://github.com/HJYao00/Awesome-Agentic-MLLMs
  en: General multimodal-agent methods, benchmarks and datasets.
  zh: 通用多模态 Agent 方法、Benchmark 与数据集。
  ja: 汎用マルチモーダルエージェントの手法、ベンチマーク、データセットです。
- name: Awesome Multimodal Agent
  url: https://github.com/OpenEnvision/Awesome-Multimodal-Agent
  en: A broad collection spanning visual agents, agentic AIGC, CAD and 3D.
  zh: 覆盖视觉 Agent、Agentic AIGC、CAD 与 3D 的宽口径合集。
  ja: 視覚エージェント、エージェント型 AIGC、CAD、3D にわたる幅広いコレクションです。
- name: Awesome Multimodal Agent Benchmarks
  url: https://github.com/PhiloLabs/awesome-multimodal-agent-benchmarks
  en: Benchmark-focused multimodal-agent resources.
  zh: 以多模态 Agent Benchmark 为核心的资源。
  ja: ベンチマークを中心としたマルチモーダルエージェントのリソースです。
- name: Awesome LLM SWE-bench
  url: https://github.com/wasiahmad/Awesome-LLM-SWE-Bench
  en: Repository-level software-engineering agents and the SWE-bench ecosystem.
  zh: 仓库级软件工程 Agent 与 SWE-bench 生态。
  ja: リポジトリ単位のソフトウェア工学エージェントと SWE-bench エコシステムです。
- name: Awesome Issue Solving
  url: https://github.com/ZhonghaoJiang/Awesome-Issue-Solving
  en: Issue understanding, localization, patching and evaluation resources.
  zh: Issue 理解、定位、补丁与评测资源。
  ja: Issue の理解、特定、パッチ作成、評価に関するリソースです。
