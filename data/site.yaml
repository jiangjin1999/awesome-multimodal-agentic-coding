      - n
  - title: {en: 'Closed-loop Workflow · roles fixed in advance, problems go back to the responsible step', zh: Closed-loop Workflow · 分工事先定好，出错回到对应步骤, ja: Closed-loop Workflow · 分担は事前に決まり、問題は担当ステップへ戻す}
    rows:
