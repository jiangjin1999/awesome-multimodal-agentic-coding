hero:
  light: assets/hero/hero-light.png
  dark: assets/hero/hero-dark.png
  alt: 'Awesome Multimodal Agentic Coding — three cumulative stages. 01 Visual as Feedback: an agent writes code, builds an
    artifact, and observes it. 02 Orchestrating Models as Tools: the same loop calls image, video and world models. 03 Bridging
    Digital & Physical Worlds: the agent acts and observes in simulation and reality, with simulation built from the real
    world and practice in simulation strengthening the agent.'
text:
  tagline:
    en: A research map of multimodal agents that write code, observe what it does, and improve — from screens to the physical
      world.
    zh: 一份多模态智能体编程的研究地图：Agent 编写代码，观察代码运行的结果，并据此不断改进——从屏幕延伸到物理世界。
    ja: マルチモーダルエージェントがコードを書き、その結果を観察し、改善していく研究のマップ——画面の中から物理世界まで。
  vision_title:
    en: Our Vision
    zh: 我们的愿景
    ja: ビジョン
  vision:
    en: 'We read multimodal agentic coding as **one loop that keeps expanding**: an agent writes code, builds something, observes
      the result, and revises. Each stage keeps that loop and adds one thing — **01** the agent *sees* what it builds; **02**
      it *calls other models as tools*; **03** it *acts* in simulation and the real world.'
    zh: 我们把多模态智能体编程理解为**一个不断扩展的闭环**：Agent 编写代码、构建产物、观察结果，再据此修改。每个阶段都保留这个闭环，并在其上增加一样东西——**01** Agent *看见*自己构建的东西；**02** Agent
      *把其他模型当作工具来调用*；**03** Agent 在仿真与真实世界中*行动*。
    ja: 私たちはマルチモーダル・エージェンティック・コーディングを**拡張し続ける一つのループ**として捉えます。エージェントはコードを書き、成果物を構築し、結果を観察して修正します。各段階はこのループを保ったまま一つの要素を加えます——**01**
      自分が作ったものを*見る*、**02** 他のモデルを*ツールとして呼び出す*、**03** シミュレーションと現実世界で*行動する*。
  machine_note:
    ja: この日本語版は機械支援翻訳です。論文タイトルは原文のままです。誤りを見つけた場合は Issue でお知らせください。
  contents:
    en: Contents
    zh: 目录
    ja: 目次
  scope_title:
    en: What is included
    zh: 收录标准
    ja: 収録基準
  scope:
    en: Core works document code or a programmatic representation, execution, post-execution multimodal observation, and a
      subsequent code or tool action driven by that observation in one trajectory or named evaluation configuration. Adjacent
      works provide directly related methods, evaluation, data or foundations. Resources provide reusable capabilities and
      tools; demos and reading materials retain their own roles. Stages describe research perspectives, not scope or quality.
      Each work has one primary entry; other contributions use See also links.
    zh: Core 工作在同一轨迹或明确评测配置中展示代码或程序化表示、执行、执行后的多模态观测，以及观测驱动的后续代码或工具动作。Adjacent 收录直接相关的方法、评测、数据与基础。Resource 提供可复用能力或工具；Demo
      与阅读资料保留各自角色。三个阶段表示研究视角，不决定范围身份或质量。每项工作只有一个主入口，其他贡献通过「另见」连接。
    ja: Core は、同一の軌跡または明示された評価設定で、コードやプログラム表現、実行、実行後のマルチモーダルな観測、その観測に基づく次のコード修正またはツール操作を示す研究です。Adjacent は直接関連する手法・評価・データ・基盤を扱います。Resource
      は再利用可能な能力やツールを提供し、デモと読み物はそれぞれの役割を維持します。三段階は研究の視点であり、範囲や品質の等級ではありません。各項目には一つの主掲載先を設け、他の貢献は「関連」で結びます。
