# Decision log for update runs. Rules: docs/AUTO_UPDATE.md (§7). Checked by scripts/build_readme.py --check.
# This file is not rendered. It answers "why is this work (not) in the collection?" and holds the queue of
# candidates still to be read.
#
# runs:        one row per run: date, trigger (sweep | report | citations | issue), covered, optional note.
# candidates:  one row per work:
#   id         arXiv ID without version, or a stable slug such as web:<name>
#   title, url official title and primary link
#   found      date the candidate was found; via: where it came from
#   decision   pending | added | updated | excluded | deferred
#   decided    date of the decision (absent while pending)
#   entry      catalog ID, when it differs from id
#   precedent  catalog IDs whose placement and scope were followed
#   reason     required for excluded and deferred
#   note       optional hint, such as the likely section or nearest catalog entries
runs:
- date: '2026-11-15'
  trigger: report
  covered: The maintainer reported 2610.35817 as missing. Every reference of 2610.35817 with an arXiv ID or URL was checked
    against the catalog. Missing works that may fit a scope identity were queued. Cited VLA models, VLA evaluations and
    LLM reinforcement-learning methods were not queued (no agent, code or tool use). Reference [14] has no URL and was
    not queued.
- date: '2026-11-16'
  trigger: sweep
  covered: Manual continuation of the 2026-11-16 Monday arXiv last-updated scan, 2026-10-17 through 2026-11-16 UTC. Recovered
    all pages for cs.GR, cs.HC, cs.RO, cs.CV and cs.AI; reused the completed cs.SE pages. Inventoried 1,633 cs.RO titles
    and screened titles and abstracts for code/render/screenshot feedback, visual artifact construction, agentic robot
    harnesses, real-to-sim and model orchestration. Reviewed selected matches, the first queued work and its references.
    Remaining full-text reviews and exhaustive manual title review are pending.
  note: Twenty selected arXiv leads and three citation leads were queued for full-text review. The acknowledgments spelling
    was corrected across the three READMEs.
- date: '2026-11-17'
  trigger: sweep
  covered: Daily review for 2026-11-03 to 2026-11-17. Reviewed the oldest queued candidate (VIA v2) and its references.
    Read the 61 titles in the November 16 cs.RO new/cross-listed/replacement batch. Inventoried recent/new pages for cs.RO,
    cs.CV, cs.GR, cs.AI, cs.LG, cs.CL, cs.SE, cs.HC and cs.MM and screened titles and abstracts for visual feedback, model/tool
    orchestration, asset creation, robot harnesses, physical reasoning and sim-to-real. Checked HF Daily Papers, related
    awesome lists, official project and benchmark sources, and open suggestions.
  note: Partial coverage. The November 17 arXiv batch was not available at recheck. The 14-day last-updated API completed
    cs.GR; other categories stopped at an error or an unfinished page. The 438-title cs.RO recent inventory and recovered
    weekly pages have outstanding title/full-text review. Queued four robotics titles and one VIA citation.
- date: '2026-11-17'
  trigger: report
  covered: Maintainer-prioritized review of PEAR (2611.18562), previously pending. Read v1 and checked the official project,
    code and model weights. Cross-checked work identities and reviewed recent references against the catalog and queue.
  note: Added PEAR under 3.5 post-training and queued four citation leads. This review supplements the same-day sweep.
- date: '2026-11-17'
  trigger: report
  covered: Maintainer-requested publication of the existing interactive DROID walkthrough. Reconciled the page and
    generated navigation from claude/brave-lovelace-51e46e with the latest main. No research discovery or candidate review.
  note: Section 3.4 and the contents link to the GitHub Pages walkthrough in all three READMEs. The HTML, episode data
    and camera frames are stored under stage3/droid-data/. Catalog entries and candidate decisions are unchanged.
- date: '2026-11-17'
  trigger: report
  covered: Maintainer-requested English and Japanese translations of the interactive DROID walkthrough, including static
    explanations, dynamic labels, case annotations, language navigation and localized README destinations. No research review.
  note: The three pages share the same episode data, camera images, styles and interaction code. Existing catalog entries
    and candidate decisions are unchanged.
- date: '2026-11-18'
  trigger: sweep
  covered: 'November 4–18, 2026: screened nine arXiv categories and read all 217 titles in the November 17 cs.RO listing,
    including cross-lists and replacements. Queried visual code feedback, model orchestration, assets, robot policies,
    and games and interactive worlds. Checked HF Daily Papers, GitHub lists and suggestions, official projects, enabled
    benchmark sources and selected author sources. Reviewed the oldest queued item, GPT-Policy v1, and its references.'
  note: Partial coverage. November 18 arXiv listings were still absent at recheck and HF showed the same papers as November
    17. Last-updated paging completed cs.LG, cs.CL, cs.SE, cs.HC and cs.MM; cs.RO, cs.CV, cs.GR and cs.AI have incomplete
    current-window coverage. Added GPT-Policy and queued 11 leads.
