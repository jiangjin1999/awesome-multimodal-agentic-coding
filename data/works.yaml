  date: "2026.05"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Couples a game-coding agent with a GUI-playing agent whose experience reports drive continued code changes.
    zh: 将游戏 Coding Agent 与 GUI 游玩 Agent 配对，以后者的体验报告驱动持续代码修改。
    ja: ''
- id: "2604.18394"
  title: "OpenGame: Open Agentic Coding for Games"
  url: "https://arxiv.org/abs/2604.18394"
  date: "2026.04"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Provides an open agentic workflow and evaluation setting for creating, running, and iteratively improving games.
    zh: 提供开放的 Agentic 游戏创建、运行与迭代改进工作流及评测环境。
    ja: ''
- id: "system:vibegame"
