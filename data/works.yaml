  - https://continual-game-generation.vercel.app/
  verification:
    en: Gameplay-rubric pass fraction · GUI–human agreement · cross-generation improvement.
    zh: 玩法 Rubric 通过比例 · GUI 与人工一致性 · 跨代改进。
  tags:
  - Method
  - Benchmark
  - Inference
  - Environment
  - Verification
- id: '2604.18394'
  title: 'OpenGame: Open Agentic Coding for Games'
  url: https://arxiv.org/abs/2604.18394
  date: '2026.04'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Provides an open agentic workflow and evaluation setting for creating, running, and iteratively improving games.
    zh: 提供开放的 Agentic 游戏创建、运行与迭代改进工作流及评测环境。
    ja: ゲームの作成、実行、反復改善を行う公開エージェントワークフローと評価環境を提供する。
  sources:
  - https://arxiv.org/abs/2604.18394
  - https://github.com/leigest519/OpenGame
  verification:
    en: Build correctness · visual quality · intent satisfaction.
    zh: 构建正确性 · 视觉质量 · 意图满足度。
