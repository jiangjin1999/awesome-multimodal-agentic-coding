    zh: 摄像机／镜头一致性 · 空间与外观保真度 · 动作时序／接触关系 · 人类与判定器一致性 · 迭代修订消融。
  tags:
  - Benchmark
  - Dataset
  - Data Curation
  - Environment
  - Verification
- id: '2610.04292'
  title: 'LMBuild: Evaluating LLM Agents for Generating Buildable and Functional Structures'
  url: https://arxiv.org/abs/2610.04292
  date: '2026.10'
  section: '1.5'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Builds part-based structures with executable CSG and assembly operations, feeding rendered views and diagnostics into
      later review rounds while evaluating soundness, affordance, design, and physical realization.
    zh: 通过可执行 CSG 和装配操作构建部件化结构，将渲染视图与诊断返回后续复核轮次，并评测结构健全、功能可供性、设计及物理实现。
