- id: '2610.09127'
  title: 'CADFather: Autonomous CAD Reconstruction through Coordinated Tool Use'
  url: https://arxiv.org/abs/2610.09127
  date: '2026.10'
  section: '1.5'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs meshes as CadQuery-based programs by inspecting target and candidate renders, coordinating learned proposals,
      geometric construction, and parameter optimization across a persistent candidate pool.
    zh: 观察目标与候选的渲染，将网格重建为 CadQuery 风格程序，并在持久候选池中协调学习式提案、几何构造与参数优化。
    ja: 目標と候補の描画を観察してメッシュを CadQuery 形式のプログラムへ再構築し、持続的な候補群の中で学習された提案、幾何構築、パラメータ最適化を連携させる。
  sources:
  - https://arxiv.org/abs/2610.09127
  - https://github.com/kulibinai/CADFather
  verification:
    en: Execution and watertight validity · volumetric overlap · surface/normal agreement · geometric distance · search cost.
    zh: 执行与闭合有效性 · 体积重叠 · 表面／法线一致性 · 几何距离 · 搜索成本。
  tags:
  - Method
  - System
  - Inference
  - Environment
  - Verification
- id: '2610.04262'
  title: 'CADForge: Agentic Single-View CAD Reconstruction with Explicit Geometry Reasoning'
  url: https://arxiv.org/abs/2610.04262
  date: '2026.10'
  section: '1.5'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs single-view objects as component-wise CadQuery programs, using explicit geometry calculations and highlighted
      multi-view reviews to route corrections back to parameter reasoning or code synthesis.
    zh: 通过显式几何计算逐部件重建单视图物体的 CadQuery 程序，再以高亮多视图审查把修正路由回参数推理或代码合成。
    ja: 明示的な幾何計算で単眼画像の物体を部品ごとに CadQuery へ再構築し、強調表示した多視点レビューで修正をパラメータ推論またはコード合成へ振り分ける。
  sources:
  - https://arxiv.org/abs/2610.04262
  verification:
    en: CAD validity · geometric distance/F-score · silhouette alignment · perceptual review · repair efficiency.
    zh: CAD 有效性 · 几何距离/F-score · 轮廓对齐 · 感知审查 · 修复效率。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: '2610.11215'
  title: 'GATOR: Generative and Agentic 3D Object Reconstruction From Casual Images'
  url: https://arxiv.org/abs/2610.11215
  date: '2026.10'
  section: '1.5'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Initializes a Blender edit–render–review loop with a pose-aware generative reconstruction, using input images and
      matched candidate renders to retain or revert local geometry and appearance repairs.
    zh: 以带场景位姿的生成式重建初始化 Blender 编辑—渲染—审查闭环，根据输入图像及匹配的候选渲染，保留或回退局部几何与外观修复。
    ja: 姿勢付きの生成的再構築で Blender の編集・描画・レビューを初期化し、入力画像と対応する候補描画を基に、局所的な形状・外観修正を採用または取り消す。
  sources:
  - https://arxiv.org/abs/2610.11215
  - https://research.nvidia.com/labs/lpr/gator/
  verification:
    en: Posed geometry and surface accuracy · rendered appearance · refinement/time-budget ablations · asset validity.
    zh: 带位姿几何与表面精度 · 渲染外观 · 修订／时间预算消融 · 资产有效性。
