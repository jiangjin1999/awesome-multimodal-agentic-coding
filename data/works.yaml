  verification:
    en: Dual VQA semantic retention · V-JEPA latent similarity · balanced overall score · per-scene cost. Use the option-aware
      Dual VQA evaluator and refreshed source-answer cache (2026-10-19).
    zh: Dual VQA 语义保留 · V-JEPA 潜空间相似度 · 均衡综合评分 · 单场景成本。 使用含选择题选项的 Dual VQA 评估器及更新后的源视频答案缓存（2026-10-19）。
  tags:
