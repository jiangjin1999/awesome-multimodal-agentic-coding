  url: "https://arxiv.org/abs/2608.14490"
  demo: "https://arc-agi-3-twin.vercel.app/"
  date: "2026.08"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Learns an executable digital twin from interaction counterexamples, validates past transitions, and plans inside the repaired model.
    zh: 从交互反例中学习可执行数字孪生，验证历史状态转移，并在修复后的模型中规划。
    ja: ''
- id: "2607.28287"
