- id: res:godot-agent-loop
  title: Godot Agent Loop
  url: https://github.com/beremaran/godot-agent-loop
  date: null
  section: '1.6'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Returns runtime PNGs as MCP image content, with bounded input scenarios, tests, and independent verification; its
      skills distinguish saved project edits from ephemeral playtest state. Screenshots require a headed Godot 4.7+ runtime.
    zh: 以 MCP 图像内容返回运行时 PNG，提供有界输入场景、测试及独立验证；Skills 区分保存的项目修改与临时试玩状态。截图需要带显示上下文的 Godot 4.7+ 运行环境。
    ja: 実行時 PNG を MCP の画像として返し、範囲を限定した入力場面、テスト、独立検証を提供する。保存した編集と一時的な試遊状態を区別し、撮影には表示コンテキストのある Godot 4.7 以降が必要となる。
  sources:
