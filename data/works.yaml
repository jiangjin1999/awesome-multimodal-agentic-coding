    en: Generates HTML-rendered posters with specialized checker modules for iterative refinement and releases P2PInstruct and P2PEval.
    zh: 使用专门的 Checker 模块迭代细化 HTML 渲染海报，并发布 P2PInstruct 和 P2PEval。
    ja: ''
- id: "2505.21497"
  title: "Paper2Poster: Towards Multimodal Poster Automation from Scientific Papers"
  url: "https://arxiv.org/abs/2505.21497"
  date: "2025.05"
  section: "1.4"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Uses cooperating agents for scientific content selection, layout construction, rendering, and visual poster refinement.
    zh: 使用协作 Agent 完成科学内容选择、布局构建、渲染和视觉海报细化。
    ja: ''
- id: "2505.21660"
  title: "PreGenie: An Agentic Framework for High-quality Visual Presentation Generation"
  url: "https://arxiv.org/abs/2505.21660"
  date: "2025.05"
  section: "1.4"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Organizes presentation planning, executable slide construction, rendering, and multimodal quality refinement as an agent workflow.
    zh: 将 Presentation 规划、可执行 Slide 构建、渲染和多模态质量改进组织成 Agent 工作流。
    ja: ''
- id: "2502.15412"
  title: Textual-to-Visual Iterative Self-Verification for Slide Generation
  url: "https://arxiv.org/abs/2502.15412"
  date: "2025.02"
  section: "1.4"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Alternates textual planning with rendered-slide verification and revision to improve visual presentation quality.
    zh: 在文本规划与渲染 Slide 验证、修改之间交替，提高视觉 Presentation 质量。
    ja: ''
- id: "res:diffusion-studio"
  title: Diffusion Studio
  url: "https://github.com/diffusionstudio/editor"
  date: null
  section: "1.4"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Keeps editable SolidJS/TSX compositions synchronized with the canvas and timeline, connecting footage analysis, media generation, source edits, and rendering; agent workflows require the desktop app, and model-backed actions may use paid credits.
    zh: 将可编辑 SolidJS/TSX 合成与画布、时间线同步，连接素材分析、媒体生成、源码修改和渲染；Agent 工作流需要桌面应用，模型调用可能消耗付费额度。
    ja: ''
- id: "res:manim-mcp"
  title: Manim MCP
  url: "https://github.com/paulnegz/manim-mcp"
  date: null
  section: "1.4"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Connects text, generated Manim code, rendered video, and subsequent correction in one workflow.
    zh: 把文本、生成的 Manim 代码、渲染视频与后续修正连接成一条工作流。
    ja: ''
- id: "res:manim-video-lab"
  title: Manim Video Lab
  url: "https://github.com/ApliroAI/manim-video-lab"
  date: null
  section: "1.4"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Uses a Docker-backed Manim/FFmpeg pipeline with explicit storyboard contracts, video or sampled-frame review, timestamped code fixes, and bounded rerender-and-review passes.
    zh: 引导 Manim 场景生成，先检查 SVG 资产网格与中间帧，再在有限重试内修复源码、重新渲染，最后组装视频。
    ja: ''
- id: "res:remotion"
  title: Remotion
  url: "https://github.com/remotion-dev/remotion"
  date: null
  section: "1.4"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Turns React code into inspectable frames and videos, enabling frame-level rendering and iterative correction.
    zh: 将 React 代码转化为可检查的视频帧和视频，从而支持逐帧渲染与迭代纠错。
    ja: ''
- id: "2611.09017"
  title: "Frontier3DBench: Benchmarking Coding Agents for 3D Creation across Objects, Scenes, and Interactive Open Worlds"
  url: "https://arxiv.org/abs/2611.09017"
  date: "2026.11"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - "3.3"
  tldr:
    en: Evaluates code-authored objects, scenes and interactive worlds across Blender and Unreal Engine.
    zh: 跨 Blender 与 Unreal Engine 评测代码生成的物体、场景和交互世界，连接可视化产物与可执行任务要求。
    ja: ''
- id: "2610.38231"
  title: "3DCodeEdit: Benchmarking Instruction-Guided 3D Program Editing"
  url: "https://arxiv.org/abs/2610.38231"
  date: "2026.10"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks instruction-guided Blender program editing with multi-view checks and a multi-turn study in which independent visual reviews guide code revisions beyond executable-but-geometrically-wrong outputs.
    zh: 以多视角条件检查评测指令引导的 Blender 程序编辑，并通过多轮实验让独立视觉审查指导代码修订，检验“能执行但几何错误”的问题。
    ja: ''
- id: "2610.03715"
  title: "4DCodeBench: Benchmarking Agents on Inverse Graphics of Dynamic Scenes"
  url: "https://arxiv.org/abs/2610.03715"
  date: "2026.10"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - "3.3"
  tldr:
    en: Measures inverse graphics of dynamic videos through executable scene programs.
    zh: 要求 Agent 将真实或合成的动态视频重建成可执行图形程序，恢复场景的三维结构及其随时间发生的变化。基准同时比较画面和运动，并利用合成场景的三维真值作更直接的检查；实现方式可以是关键帧、解析轨迹或物理模拟。
    ja: ''
- id: "system:blenderworld"
  title: "BlenderWorld: Benchmarking Visual Agents for 3D Creation from Real-World References"
  url: "https://arxiv.org/abs/2610.23986"
  date: "2026.10"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  see_also:
  - "3.3"
  tldr:
    en: Evaluates reusable Blender creations produced from real-world references and specifications.
    zh: 提供来自建筑、产品、自然环境和科学可视化的 3D 创作任务，让 Agent 根据文字、图片、视频或规格文件，用 Blender 创建或编辑可复用的场景。评估时结合多视角渲染、原生场景检查和逐任务要求，判断最终作品是否完成创作意图。
    ja: ''
- id: "2610.12452"
  title: "BrickBench: Evaluating Agentic Brick Design"
  url: "https://arxiv.org/abs/2610.12452"
  date: "2026.10"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Benchmarks programmatic brick assemblies under size and inventory constraints, separately assessing collision/stability validity, multiview semantic alignment, and human-validated design preference.
    zh: 在规模与库存约束下评测程序化积木装配，分别检查碰撞／稳定性有效性、多视角语义一致性及人类验证的设计偏好。
    ja: ''
- id: "2610.16577"
  title: "CineRecon: Benchmarking Frontier Models for Agentic Cinematic Reconstruction"
  url: "https://arxiv.org/abs/2610.16577"
  date: "2026.10"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks agents that revise Blender Python scenes from time-aligned render–reference comparisons, separating camera, static, and dynamic fidelity across three appearance-detail settings.
    zh: 评测依据同时间点渲染—参考对照修订 Blender Python 场景的 Agent，在三档外观细节下分别衡量摄像机、静态与动态一致性。
    ja: ''
- id: "2610.04292"
  title: "LMBuild: Evaluating LLM Agents for Generating Buildable and Functional Structures"
  url: "https://arxiv.org/abs/2610.04292"
  date: "2026.10"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Builds part-based structures with executable CSG and assembly operations, feeding rendered views and diagnostics into later review rounds while evaluating soundness, affordance, design, and physical realization.
    zh: 通过可执行 CSG 和装配操作构建部件化结构，将渲染视图与诊断返回后续复核轮次，并评测结构健全、功能可供性、设计及物理实现。
    ja: ''
- id: "2609.40353"
  title: "AssemblyWorld: Rethinking 3D Assembly with General-Purpose Agents"
  url: "https://arxiv.org/abs/2609.40353"
  date: "2026.09"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Studies agents that inspect rendered views and revise fixed-part poses through MCP tools rather than authoring construction programs, exposing the gap between approximate assembly and geometric precision.
    zh: 研究 Agent 查看渲染视图、通过 MCP 工具修订既有零件位姿而非编写构建程序的装配任务，揭示近似装配与几何精度之间的差距。
    ja: ''
- id: "2609.15478"
  title: "BVB: Benchmarking Agentic Video Understanding via Programmatic Reconstruction in Blender"
  url: "https://arxiv.org/abs/2609.15478"
  date: "2026.09"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - "3.3"
  tldr:
    en: Uses programmatic Blender reconstruction to test agentic video understanding.
    zh: 让多模态 Agent 在统一预算和运行环境中，把真实视频重新写成带动画的 Blender 场景。通过渲染相似性以及原视频和重建视频中的时空事实是否一致，检验模型能否把视频理解转化为可复现的程序表达。
    ja: ''
- id: "2609.16251"
  title: "CADWorld: Computer-Use Benchmark for Long-Horizon Computer-Aided Design"
  url: "https://arxiv.org/abs/2609.16251"
  date: "2026.09"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates screenshot-guided GUI workflows in FreeCAD through executable checks on persistent native CAD artifacts, complementing code-driven generation with engineering-process and constraint validation.
    zh: 通过持久化原生 CAD 产物的可执行检查，评测截图驱动的 FreeCAD GUI 工作流，为代码生成研究补充工程过程与约束验证。
    ja: ''
- id: "2609.36777"
  title: "Code4Scene: Benchmarking Coding Agents for Constructing and Editing 3D Scenes"
  url: "https://arxiv.org/abs/2609.36777"
  date: "2026.09"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  see_also:
  - "3.3"
  tldr:
    en: Tests scene construction and precise editing through a shared Unreal Engine interface.
    zh: 在统一 Unreal Engine 接口下研究两类任务：根据文字构建新场景，以及根据参考图精确修改已有场景。它直接检查引擎中的场景状态，特别关注目标是否实现、资产是否完整，以及修改一个地方时有没有破坏其他内容。
    ja: ''
- id: "2609.37686"
  title: "EngiWorld: What Can Frontier Agents Deliver in Professional Engineering Environments?"
  url: "https://arxiv.org/abs/2609.37686"
  date: "2026.09"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates GUI- and CLI-based engineering workflows across six domains and 26 software platforms through artifact-level geometric, physical, and cross-tool consistency checks, including runtime-image-access ablations.
    zh: 以产物级几何、物理及跨工具一致性检查评估六类工程领域、26 个软件平台上的 GUI／CLI 工作流，并分析运行时图像访问的影响。
    ja: ''
- id: "2611.02659"
  title: "Parametric CAD Bench v3: Evaluating Agentic Parametric CAD Authoring from Text and Engineering Drawings"
  url: "https://arxiv.org/abs/2611.02659"
  date: "2026.09"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - "3.3"
  tldr:
    en: Tests native parametric CAD authoring from text, create-and-edit requests and engineering drawings.
    zh: 评测根据文字、先创建再编辑的要求和工程图纸，构建原生参数化 CAD 产物的能力。
    ja: ''
- id: "2608.05539"
  title: "OmniMech: All-in-one Multimodal Mechanical Benchmark for 3D Reconstruction"
  url: "https://arxiv.org/abs/2608.05539"
  date: "2026.08"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks executable, editable 3D CAD reconstruction from 251K dimensioned mechanical drawings, including a tool-augmented track that iterates through rendering, measurement, CAD execution, and verification.
    zh: 以 25.1 万组机械工程图—CAD 配对数据评测可执行、可编辑的 3D CAD 重建；工具增强 Track 通过渲染、测量、CAD 执行和验证进行迭代改进。
    ja: ''
- id: "2606.01057"
  title: "3DCodeBench: Benchmarking Agentic Procedural 3D Modeling Via Code"
  url: "https://arxiv.org/abs/2606.01057"
  demo: "https://www.3dcodebench.com/"
  date: "2026.05"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks coding agents on procedural 3D modeling with executable programs and rendered output evaluation.
    zh: 使用可执行程序和渲染输出评估，测试 Coding Agent 的程序化 3D 建模能力。
    ja: ''
- id: "2605.07807"
  title: Text-to-CAD Evaluation with CADTests
  url: "https://arxiv.org/abs/2605.07807"
  date: "2026.05"
  section: "1.5"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Evaluates CAD generation with executable geometry and topology tests, comparing test-driven repair with a four-view visual ReAct baseline; added visual feedback does not improve performance in this study.
    zh: 用可执行的几何与拓扑测试评估 CAD 生成，对比测试驱动修复与四视图视觉 ReAct 基线；该研究中额外的视觉反馈没有提高性能。
    ja: ''
- id: "2506.23329"
  title: "IR3D-Bench: Evaluating Vision-Language Model Scene Understanding as Agentic Inverse Rendering"
  url: "https://arxiv.org/abs/2506.23329"
  date: "2025.06"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - "3.3"
  tldr:
    en: Uses agentic inverse rendering to test whether visual understanding can produce an executable scene.
    zh: 给视觉语言 Agent 一张输入图，要求它主动使用编程和渲染工具，重新构造图像背后的三维场景。通过位置、数量、空间关系和外观等指标检查重建结果，研究模型是否能用实际创作展示场景理解，而不只是回答描述性问题。
    ja: ''
- id: "2504.01786"
  title: "BlenderGym: Benchmarking Foundational Model Systems for Graphics Editing"
  url: "https://arxiv.org/abs/2504.01786"
  date: "2025.04"
  section: "1.5"
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - "3.3"
  tldr:
    en: Benchmarks programmatic graphics edits and allocation of generation and verification compute.
    zh: 给 Agent 起始场景和目标效果，让它通过修改 Blender Python 程序完成几何、材质、光照、位置或形变编辑。基准量化编辑结果，并进一步研究如何在生成候选与验证候选之间分配推理计算，以提高图形编辑质量。
    ja: ''
- id: "2611.10768"
  title: "BlenderFORGE: Framework for Optimizing Reactive 3D-Graphics Editing Ability of MLLMs"
  url: "https://arxiv.org/abs/2611.10768"
  date: "2026.11"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  see_also:
  - "3.5"
  tldr:
    en: Trains an open-weight coding agent to revise explicit Blender scenes using executable edits and rendered feedback.
    zh: 通过可执行编辑与渲染反馈，训练开放权重 Coding Agent 修订显式 Blender 场景。
    ja: ''
- id: "2611.09894"
  title: "Video-Coder: Reinforcing Agentic Coding for Video Generation"
  url: "https://arxiv.org/abs/2611.09894"
  date: "2026.11"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Trains a Blender coding agent to revise dynamic scene programs using rendered-frame feedback, then conditions a fixed downstream video generator on the resulting structural draft.
    zh: 训练Blender编码Agent依据渲染帧反馈修订动态场景程序，再用得到的结构草稿条件化固定的下游视频生成模型。
    ja: ''
- id: "2610.22341"
  title: "3DCodeVerse: Exploring 3D Worlds as Code"
  url: "https://arxiv.org/abs/2610.22341"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Couples a multi-runtime 3D program corpus with a DAG-based coding harness that converts geometric measurements and multiview visual critiques into targeted, file-scoped program revisions.
    zh: 将跨运行环境的 3D 程序语料与 DAG 编程 Harness 结合，把几何测量和多视图视觉点评转为限定文件范围的定向程序修订。
    ja: ''
- id: "2610.09127"
  title: "CADFather: Autonomous CAD Reconstruction through Coordinated Tool Use"
  url: "https://arxiv.org/abs/2610.09127"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs meshes as CadQuery-based programs by inspecting target and candidate renders, coordinating learned proposals, geometric construction, and parameter optimization across a persistent candidate pool.
    zh: 观察目标与候选的渲染，将网格重建为 CadQuery 风格程序，并在持久候选池中协调学习式提案、几何构造与参数优化。
    ja: ''
- id: "2610.04262"
  title: "CADForge: Agentic Single-View CAD Reconstruction with Explicit Geometry Reasoning"
  url: "https://arxiv.org/abs/2610.04262"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs single-view objects as component-wise CadQuery programs, using explicit geometry calculations and highlighted multi-view reviews to route corrections back to parameter reasoning or code synthesis.
    zh: 通过显式几何计算逐部件重建单视图物体的 CadQuery 程序，再以高亮多视图审查把修正路由回参数推理或代码合成。
    ja: ''
- id: "2610.11215"
  title: "GATOR: Generative and Agentic 3D Object Reconstruction From Casual Images"
  url: "https://arxiv.org/abs/2610.11215"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Initializes a Blender edit–render–review loop with a pose-aware generative reconstruction, using input images and matched candidate renders to retain or revert local geometry and appearance repairs.
    zh: 以带场景位姿的生成式重建初始化 Blender 编辑—渲染—审查闭环，根据输入图像及匹配的候选渲染，保留或回退局部几何与外观修复。
    ja: ''
- id: "2610.23121"
  title: "Scene-Designer: Learning Design Intelligence for Agentic 3D Scene Generation"
  url: "https://arxiv.org/abs/2610.23121"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Learns scene construction and critique from consolidated editing trajectories and ranked scene perturbations, using rendered observations and critic-guided executable edits to improve indoor layouts.
    zh: 从压缩后的编辑轨迹与场景扰动排序中学习构建和批评能力，以渲染观测和 Critic 引导的可执行编辑持续改进室内布局。
    ja: ''
- id: "2610.09116"
  title: "SPLATIFY: Reproduce, Discover, Innovate! From Papers and Ideas to Trainable 3DGS Code"
  url: "https://arxiv.org/abs/2610.09116"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Turns 3D Gaussian Splatting papers and ideas into trainable plugins, repairing code through rendered-image critique, cross-view Gaussian diagnostics, and training-curve feedback.
    zh: 将 3D 高斯泼溅论文和想法转成可训练插件，根据渲染图像批评、跨视角高斯诊断与训练曲线反馈修复代码。
    ja: ''
- id: "2610.03799"
  title: "StepCAD: Mesh-to-CAD Code Generation via LLM Policy and Geometry-Guided Search"
  url: "https://arxiv.org/abs/2610.03799"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Alternates CadQuery action generation with execution and intermediate point-cloud conditioning, then refines the resulting program through geometry-guided parameter and structural search.
    zh: 交替进行 CadQuery 动作生成、执行与中间点云条件化，再通过几何引导的参数和结构搜索细化程序。
    ja: ''
- id: "2610.02021"
  title: Task-Adaptive Grounded 3D-Programmers Using 2D VLMs
  url: "https://arxiv.org/abs/2610.02021"
  date: "2026.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: "3D-Prog grounds Python/OpenUSD edits in canonical multiview coordinates, returning task-specific diagnostic visualizations and judge critiques for subsequent asset-generation and editing rounds."
    zh: "3D-Prog 以统一坐标系多视图支撑 Python／OpenUSD 修改，将任务诊断可视化和 Judge 点评传回后续资产生成、编辑轮次。"
    ja: ''
- id: "2609.07434"
  title: "CIT-CAD: Constraint Intent Tree-based CAD Code Generation and Verification"
  url: "https://arxiv.org/abs/2609.07434"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Repairs CadQuery programs against a constraint-intent tree using code analysis and post-execution spatial relations, accepting only revisions that reduce violations without breaking satisfied constraints.
    zh: 以约束意图树约束 CadQuery 修复，结合代码分析与执行后的空间关系，只接纳减少违约且不破坏已满足约束的修改。
    ja: ''
- id: "2609.34494"
  title: "ConCAD: Constraint-Aware Image-to-CAD Generation with Dual-Granularity Rewards"
  url: "https://arxiv.org/abs/2609.34494"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Trains image-to-CadQuery generation with code-constraint and executed-geometry rewards, evaluating relational design intent on B-reps rather than iteratively repairing the current artifact from visual feedback.
    zh: 以代码约束和执行几何奖励训练图像到 CadQuery 生成，在 B-rep 上评测关系设计意图，而非根据视觉反馈逐轮修复当前产物。
    ja: ''
- id: "2609.26793"
  title: "HARMONY: Hierarchical Agentic Reasoning for MONocular Image-to-Scene Synthesis"
  url: "https://arxiv.org/abs/2609.26793"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Combines VLM spatial reasoning with image, 3D, and geometry tools, revising renderer-consumed room, placement, and lighting specifications through staged reference–render critique.
    zh: 将 VLM 空间推理与图像、3D 和几何工具结合，通过逐阶段参考图—渲染点评修订渲染器消费的房间、摆放与灯光规格。
    ja: ''
- id: "2609.36380"
  title: "LEGO-Anything: Coding Agents for 3D Scene Reconstruction"
  url: "https://arxiv.org/abs/2609.36380"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs scenes as executable Blender programs and grounds iterative refinement in rendered views, reference-derived geometric residuals, and version control, separately evaluating artifact validity, geometry, and appearance.
    zh: 把场景重建为可执行 Blender 程序，以渲染视图、参考图导出的几何残差和版本控制约束迭代修正，并分别评估产物有效性、几何与外观。
    ja: ''
- id: "2609.11499"
  title: "Recursive Code World Models: Building Complex Worlds through Recursive Scene Programs"
  url: "https://arxiv.org/abs/2609.11499"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: "Builds complex Three.js worlds as recursive scene programs: each subworld receives its own render-observe-edit loop, then returned code is re-rendered and jointly repaired in the parent context."
    zh: 将复杂 Three.js 世界构造成递归场景程序：每个子世界拥有自己的“渲染—观察—改码”闭环，返回的代码还会在父级上下文中重新渲染并联合修复。
    ja: ''
- id: "2609.22325"
  title: "ReliCAD: From Uncertain LLM Generation to Reliable Parametric CAD Modeling"
  url: "https://arxiv.org/abs/2609.22325"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Generates kernel-executed parametric instructions from explicit design intent, then combines runtime evidence with rendered-view validation to route repairs to specifications, plans, or local modeling operations.
    zh: 从显式设计意图生成内核可执行的参数化指令，再结合运行证据与渲染验证，将修复定向到规格、计划或局部建模操作。
    ja: ''
- id: "2609.03811"
  title: "VisCAD: A Foundation Model Suite with Multimodal Industrial CAD Intelligence"
  url: "https://arxiv.org/abs/2609.03811"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Generates executable FreeCAD programs and evaluates a sequential variant that revises the program after inspecting six-view renders; the reported sequential loop does not improve quality, while parallel visual reranking does.
    zh: 生成可执行 FreeCAD 程序，并评测观察六视图渲染后继续改写程序的顺序版本；论文报告该顺序闭环没有提升，而并行视觉重排有效。
    ja: ''
- id: "2609.22688"
  title: "Vision2CAD: A Visual Agent Harness for Explicit Geometry Referencing and Localization in Parametric CAD Modeling"
  url: "https://arxiv.org/abs/2609.22688"
  date: "2026.09"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Generates FreeCAD operations through ID-tagged geometry views and a sketch-coordinate bridge, then feeds rejected modeling previews back into command selection while preserving parametric references.
    zh: 通过带 ID 的几何视图与草图坐标转换生成 FreeCAD 操作，并将被拒绝预览的原因反馈给命令选择，同时建立参数化几何引用。
    ja: ''
- id: "2608.17975"
  title: "aDSL: Agentic 3D Creation via Joint Agent-Program Design"
  url: "https://arxiv.org/abs/2608.17975"
  date: "2026.08"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Jointly designs the agent workflow and a domain-specific program representation for iterative 3D creation.
    zh: 联合设计 Agent 工作流与领域专用程序表示，以支持迭代式 3D 创建。
    ja: ''
- id: "2608.24020"
  title: "IterCAD: Iterative Program Repair for CAD Code Generation from Orthographic Views"
  url: "https://arxiv.org/abs/2608.24020"
  date: "2026.08"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Repairs CAD programs over multiple render-and-compare rounds using orthographic-view evidence.
    zh: 使用正交视图证据，在多轮渲染与比较中修复 CAD 程序。
    ja: ''
- id: "2608.26238"
  title: "Procedura: Agentic 3D Modeling with Procedural Control"
  url: "https://arxiv.org/abs/2608.26238"
  date: "2026.08"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds editable 3D assembly programs part by part with typed mates, then uses a separate visual critic to gate each code revision against fresh renders.
    zh: 通过带类型的配合约束逐部件构建可编辑 3D 装配程序，再由独立视觉 Critic 基于最新渲染结果约束每次代码修订。
    ja: ''
- id: "2608.05714"
  title: "RA-CAD: Learning Post-Execution Critique for State-Aware Text-to-CAD Generation"
  url: "https://arxiv.org/abs/2608.05714"
  date: "2026.08"
  section: "1.5"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Jointly learns CAD proposal, textual post-execution critique, and rewriting from complete trajectories, using executor diagnostics for repair and terminal geometry rewards for policy optimization.
    zh: 从完整轨迹中联合学习 CAD 提案、文字执行后批评与重写，用执行器诊断指导修复，并以终端几何奖励优化策略。
    ja: ''
- id: "2608.24169"
  title: "ViSculpt: Visual-Centric Agentic Geometry Editing"
  url: "https://arxiv.org/abs/2608.24169"
  date: "2026.08"
  section: "1.5"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Edits existing meshes through Blender GUI brush actions and before/after visual critique, complementing programmatic 3D creation with localized sculpting that preserves untouched regions.
    zh: 通过 Blender GUI 笔刷动作和前后截图批评编辑已有网格，以保持未修改区域的局部雕刻补充程序化 3D 创作。
    ja: ''
- id: "2608.05248"
  title: "WorldClaw: Agentic 3D Open-World Generation at Scale"
  url: "https://arxiv.org/abs/2608.05248"
  date: "2026.08"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds large 3D worlds through repeated code generation, rendering, visual auditing, and scene correction.
    zh: 通过反复代码生成、渲染、视觉审计和场景修正构建大型 3D 世界。
    ja: ''
- id: "2608.00084"
  title: "From Pixels to PCells: A Neurosymbolic Approach to Photonic Component Creation"
  url: "https://arxiv.org/abs/2608.00084"
  date: "2026.07"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Uses a parametric photonics DSL and deterministic visual verifier to drive repeated program revision and verifier-guided training.
    zh: 使用参数化光子 DSL 和确定性视觉 Verifier，驱动反复程序修改与 Verifier 引导训练。
    ja: ''
- id: "2606.31252"
  title: "Embodied CAD: Solver-Grounded LLM Agents for Parametric B-Rep Assembly Modeling"
  url: "https://arxiv.org/abs/2606.31252"
  date: "2026.06"
  section: "1.5"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Builds editable B-Rep assemblies through typed CAD skills and returns solver diagnostics, volumes, bounding boxes, and topology—rather than rendered perceptual feedback—to the planner.
    zh: 通过类型化 CAD Skills 构建可编辑 B-Rep 装配，并将求解器诊断、体积、包围盒和拓扑——而非渲染感知反馈——返回 Planner。
    ja: ''
- id: "2606.13368"
  title: "IterCAD: An Iterative Multimodal Agent for Visually-Grounded CAD Generation and Editing"
  url: "https://arxiv.org/abs/2606.13368"
  date: "2026.06"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Places a multimodal agent inside a CAD sandbox for repeated execution, visual inspection, editing, and recovery.
    zh: 将多模态 Agent 放入 CAD Sandbox，进行反复执行、视觉检查、编辑与恢复。
    ja: ''
- id: "2606.02580"
  title: "Thinking in Blender: Staged Executable Inverse Graphics with Vision-Language Models"
  url: "https://arxiv.org/abs/2606.02580"
  date: "2026.06"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Stages inverse-graphics reasoning as executable Blender programs whose renders reveal errors for later revisions.
    zh: 将逆图形推理组织为分阶段可执行 Blender 程序，通过渲染暴露错误以供后续修改。
    ja: ''
- id: "2604.15184"
  title: Agent-Aided Design for Dynamic CAD Models
  url: "https://arxiv.org/abs/2604.15184"
  date: "2026.04"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Supports iterative construction and revision of dynamic CAD programs through agent-guided execution feedback.
    zh: 通过 Agent 引导的执行反馈，支持动态 CAD 程序的迭代构建与修改。
    ja: ''
- id: "2603.26512"
  title: "CADSmith: Multi-Agent CAD Generation with Programmatic Geometric Validation"
  url: "https://arxiv.org/abs/2603.26512"
  date: "2026.03"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Combines CAD code generation with deterministic geometric validation and visual review in a repair loop.
    zh: 在修复循环中结合 CAD 代码生成、确定性几何验证和视觉审阅。
    ja: ''
- id: "2603.12238"
