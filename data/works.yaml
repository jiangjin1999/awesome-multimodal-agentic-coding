  - Data Curation
  - Inference
  - Environment
  - Verification
- id: system:vibegame
  title: 'VibeGame: Prompt-to-Game Development with AI-Native Engine and Self-Evolving Adversarial Agent Team'
  url: https://arxiv.org/abs/2610.33106
  date: null
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds editable 2D games with an AI-native Phaser engine whose frame-synchronous play-testing and adversarial runtime
      verification route observed failures back into code, asset, and configuration revisions.
    zh: 使用 AI 原生 Phaser 引擎构建可编辑的 2D 游戏；帧同步试玩与对抗式运行时验证会将观测到的失败反馈到代码、资源和配置修改中。
    ja: AI ネイティブの Phaser エンジンで編集可能な 2D ゲームを作る。フレーム同期の試遊と対抗的な実行時検証で見つけた失敗を、コード・素材・設定の修正へ返す。
  sources:
