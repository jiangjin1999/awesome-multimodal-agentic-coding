  date: '2026.10'
  section: '1.5'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Couples a multi-runtime 3D program corpus with a DAG-based coding harness that converts geometric measurements and
      multiview visual critiques into targeted, file-scoped program revisions.
    zh: 将跨运行环境的 3D 程序语料与 DAG 编程 Harness 结合，把几何测量和多视图视觉点评转为限定文件范围的定向程序修订。
    ja: 異なる実行環境の 3D プログラム群と DAG プログラミングハーネスを組み合わせ、形状測定と多視点の視覚的批評を対象ファイルを限定した修正へ変換する。
