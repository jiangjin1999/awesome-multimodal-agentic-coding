  - https://huggingface.co/datasets/Qwen/BlenderWorld
  verification:
    en: Editable scene structure · weighted requirement satisfaction · multi-view visual quality · human–judge agreement ·
      tool-use and failure trajectories.
    zh: 可编辑场景结构 · 加权需求满足度 · 多视角视觉质量 · 人类与判定器一致性 · 工具使用与失败轨迹。
