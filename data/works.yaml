- id: "2608.25518"
  title: Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models
  url: "https://arxiv.org/abs/2608.25518"
  date: "2026.08"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Introduces AWoMo and RLHEV, recording rendered evidence, engine checks, human review, and repair actions as multimodal trajectories for iterative world building and post-training.
    zh: 提出 AWoMo 与 RLHEV，将渲染证据、引擎检查、人工审阅和修复动作记录为多模态轨迹，用于迭代式世界构建与后训练。
    ja: ''
- id: "2608.25927"
  title: "Code World Model: Coding Agent as World Brain"
  url: "https://arxiv.org/abs/2608.25927"
  date: "2026.08"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Makes persistent, revisable code the world brain, compiles state into visual proxies, and returns execution results, tests, and world feedback to later agent decisions.
    zh: 将持久、可修改的代码作为“世界大脑”，把状态编译为视觉 Proxy，并让执行结果、测试和世界反馈影响 Agent 的后续决策。
