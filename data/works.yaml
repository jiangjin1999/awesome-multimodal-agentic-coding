- id: '2506.23329'
  title: 'IR3D-Bench: Evaluating Vision-Language Model Scene Understanding as Agentic Inverse Rendering'
  url: https://arxiv.org/abs/2506.23329
  date: '2025.06'
  section: '1.5'
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - '3.3'
  tldr:
    en: Uses agentic inverse rendering to test whether visual understanding can produce an executable scene.
    zh: 给视觉语言 Agent 一张输入图，要求它主动使用编程和渲染工具，重新构造图像背后的三维场景。通过位置、数量、空间关系和外观等指标检查重建结果，研究模型是否能用实际创作展示场景理解，而不只是回答描述性问题。
    ja: 入力画像から、視覚言語エージェントがプログラミングと描画ツールを能動的に使って三次元場面を再構築する。位置、数、空間関係、外観で検査し、説明への回答だけでなく実制作で場面理解を示せるかを研究する。
  sources:
  - https://arxiv.org/abs/2506.23329
  - https://arxiv.org/html/2506.23329
  verification:
    en: Image-space localization or masks are not equivalent to measured 3D physical state; the benchmark does not calibrate
      dynamics.
    zh: 没有动态物理校准；定位、掩码等指标要区分图像空间与真正的三维物理真值。
- id: '2504.01786'
  title: 'BlenderGym: Benchmarking Foundational Model Systems for Graphics Editing'
  url: https://arxiv.org/abs/2504.01786
  date: '2025.04'
  section: '1.5'
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - '3.3'
  tldr:
    en: Benchmarks programmatic graphics edits and allocation of generation and verification compute.
    zh: 给 Agent 起始场景和目标效果，让它通过修改 Blender Python 程序完成几何、材质、光照、位置或形变编辑。基准量化编辑结果，并进一步研究如何在生成候选与验证候选之间分配推理计算，以提高图形编辑质量。
    ja: 開始場面と目標を与え、Blender Python を修正して形状、材質、照明、位置、変形を編集させる。結果を定量評価し、候補生成と検証への推論計算の配分も研究する。
