  url: "https://arxiv.org/abs/2410.05340"
  date: "2024.10"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Studies visually grounded CAD code generation with executable feedback and iterative design correction.
    zh: 研究具有可执行反馈和迭代设计修正的视觉 Grounded CAD 代码生成。
    ja: ''
- id: "2407.17572"
