- id: '2610.18792'
  title: 'SEAR: Self-Evolving Agentic Robotics'
  url: https://arxiv.org/abs/2610.18792
  date: '2026.10'
  section: '3.5'
  sub: program-policy
  type: paper
  scope: core
  tldr:
    en: Compares several modes of agentic robot improvement.
    zh: 比较多种机器人自改进模式。
    ja: ロボットの自己改善における複数の方式を比較する。
  sources:
  - https://arxiv.org/abs/2610.18792
  verification:
    en: Seven models on 330 simulated tasks and five physical tasks compare retained libraries, fresh restarts, held-out states
      and transfer. After up to 12 hours of physical practice per task, frozen-code policies are tested on ten operator-staged
      scenes; live-agent policies use five. Practice streaks can overestimate held-out performance; physical scores include
      partial credit and tower height.
    zh: 七个模型在 330 项仿真任务及五项实机任务上比较保留技能库、重新尝试、留出状态与迁移。每项实机任务最多练习 12 小时，冻结代码策略再测十个操作者布置场景，在线 Agent 策略测五个。练习连胜可能高估留出表现；实机评分包含部分完成分与塔高。
