  date: '2026.11'
  section: '1.5'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Trains a Blender coding agent to revise dynamic scene programs using rendered-frame feedback, then conditions a fixed
      downstream video generator on the resulting structural draft.
    zh: 训练Blender编码Agent依据渲染帧反馈修订动态场景程序，再用得到的结构草稿条件化固定的下游视频生成模型。
    ja: 描画フレームのフィードバックで動的場面プログラムを修正する Blender エージェントを訓練し、得られた構造的な下書きを固定された下流動画生成モデルの条件に使う。
