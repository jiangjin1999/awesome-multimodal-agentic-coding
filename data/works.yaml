      for saving baseline changes.
    zh: 向 Coding Agent 返回视觉差异区域、裁剪图和精简 DOM 上下文；保存基线变更需要明确的人工授权。
    ja: 視覚差分の領域、切り抜き画像、要約した DOM 文脈をコーディングエージェントへ返す。基準画像の変更を保存するには明示的な人間の承認が必要となる。
