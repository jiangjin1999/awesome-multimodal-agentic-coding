- id: res:bpy-dev-blender-mcp
  title: bpy.dev Blender MCP
  url: https://github.com/bpy-dev/blender-mcp
  date: ''
  section: '1.5'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Adds saved-.blend subprocess execution, rendering/inspection, and runtime API lookup; agents can use returned renders
      for further edits. Timeouts and output limits are process safeguards, not an OS sandbox or a verified repair-performance
      guarantee. In the published run, the agent viewed renders; CLIP scored 270 checkpoints across 27 tasks offline and was
      never shown to the agent.
    zh: 增加保存 .blend 的子进程执行、渲染／检查与运行时 API 查询，Agent 可利用返回的渲染继续编辑；超时与输出限制是进程防护，不是操作系统沙箱或修复性能保证。 公开运行记录包含 27 题、270 个渲染检查点：Agent
      可看渲染结果，离线 CLIP 分数不回传。
    ja: .blend を保存するサブプロセス実行、レンダリングと確認、実行時 API の照会を追加し、Agent は返された画像を使って編集を続けられる。時間と出力量の制限はプロセス保護であり、OS のサンドボックスや修正性能の保証ではない。公開記録は
      27 問・270 描画確認点を含み、Agent は描画を見るがオフラインの CLIP 得点は受け取らない。
