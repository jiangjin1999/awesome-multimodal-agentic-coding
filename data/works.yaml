  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Translates biological modeling requests into interpreted procedural recipes, with user inspection and interactive revision of the resulting 3D structures.
    zh: 将生物结构建模需求转为可解释执行的程序化配方，由用户检查生成的 3D 结构并交互修订。
