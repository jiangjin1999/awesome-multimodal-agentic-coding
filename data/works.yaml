- id: '2611.03634'
  title: 'WebHarbor: Docking Real Websites for Evolving GUI Agent Environments'
  url: https://arxiv.org/abs/2611.03634
  date: '2026.11'
  section: '1.2'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Builds resettable full-stack website environments through task-scoped coding and human visual/workflow audits, supporting
      reproducible GUI evaluation and operator training.
    zh: 通过任务限定的全栈编码与人工视觉／流程审阅，构造可重置网站环境，支持可复现 GUI 评测与操作者训练。
    ja: タスクを限定したフルスタック開発と人間による画面・手順のレビューで、リセット可能な Web 環境を作り、再現可能な GUI 評価と操作エージェントの訓練を支援する。
  sources:
  - https://arxiv.org/abs/2611.03634
  - https://github.com/aiming-lab/WebHarbor
  - https://huggingface.co/datasets/ChilleD/WebHarbor-Tasks
  verification:
    en: Human visual and workflow audit · deterministic reset · task/reward checks · held-out GUI evaluation.
    zh: 人工视觉与流程审阅、确定性重置、任务／奖励核验、留出 GUI 评测。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Environment
  - Training
- id: '2610.26828'
  title: 'Agent World Model in the Wild: Computer-Use Agent Environment Synthesis'
  url: https://arxiv.org/abs/2610.26828
  date: '2026.10'
  section: '1.2'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Synthesizes replayable personal-computer worlds spanning GUI, MCP, and CLI, using heterogeneous rollouts and verifier-consistency
      gates to produce environment–task packages for computer-use training.
    zh: 合成覆盖 GUI、MCP 和 CLI 的可重放个人电脑世界，以异构执行轨迹和验证器一致性检查生成计算机使用训练的环境—任务包。
    ja: GUI、MCP、CLI を含む再生可能な PC 世界を合成し、多様な実行軌跡と検証器の一致確認から、計算機操作の訓練用環境・タスク群を作る。
  sources:
  - https://arxiv.org/abs/2610.26828
  - https://github.com/MSR-Orchard/WildAWM
  - https://huggingface.co/datasets/ChilleD/WildAWM
  verification:
    en: Deterministic reset/replay · solvability and difficulty · judge consistency and counterfactual probes · downstream
      computer-use generalization.
    zh: 确定性重置与重放 · 可解性与难度 · 判定一致性及反事实探测 · 下游计算机使用泛化。
  tags:
  - Method
  - Dataset
  - Data Curation
  - Training
  - Environment
  - Verification
- id: '2610.37567'
  title: 'Gym-Anything-RT: Scaling Real-Time Environments for Vision-Language Agents'
  url: https://arxiv.org/abs/2610.37567
  date: '2026.10'
  section: '1.2'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds real-time visual minigames through creator–auditor code revisions grounded in screenshots and recordings, then
      controls the environment clock to isolate latency from task capability.
    zh: 通过依据截图和录像的 Creator—Auditor 代码修订构建实时视觉小游戏，再控制环境时钟以区分动作延迟与任务能力。
    ja: スクリーンショットと録画に基づく Creator–Auditor のコード修正でリアルタイムの視覚ゲームを作り、環境時計を制御して行動の遅延とタスク能力を区別する。
  sources:
  - https://arxiv.org/abs/2610.37567
  - https://github.com/gym-anything/gym-anything-rt
  verification:
    en: 100 minigames · six capabilities · live/slow/paused comparisons · solvability and temporal audits; Core refers to
      environment construction.
    zh: 100 个小游戏 · 六类能力 · 实时／减速／暂停对照 · 可解性和时序审核；Core 指环境构建链条。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Environment
  - Verification
- id: '2610.12611'
  title: 'SoftwareGym: Scaling Computer-Use Agent Training with Diverse Synthesized Software Environments'
  url: https://arxiv.org/abs/2610.12611
  date: '2026.10'
  section: '1.2'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Synthesizes native Avalonia applications, using screenshot-grounded GUI test trajectories to repair their source across
      fixed-case rounds before collecting computer-use training data.
    zh: 合成原生 Avalonia 应用，以截图驱动的 GUI 测试轨迹在固定用例下逐轮修复源码，再收集计算机操作训练数据。
    ja: ネイティブ Avalonia アプリを合成し、画像に基づく GUI テスト軌跡で固定テストケース下のソース修正を繰り返した後、計算機操作の訓練データを集める。
  sources:
  - https://arxiv.org/abs/2610.12611
  - https://github.com/MrKiing-Jin/SoftwareGym
  verification:
    en: Build/launch validity · fixed-case GUI completion and repair ablations · design-token fidelity · 120-task SoftwareGym-Bench
      · transfer on a 244-task OSWorld subset.
    zh: 构建／启动有效性 · 固定用例 GUI 完成度与修复消融 · 设计 token 保真 · 120 任务 SoftwareGym-Bench · 244 任务 OSWorld 子集迁移。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Data Curation
  - Training
  - Inference
  - Environment
  - Verification
- id: '2610.30792'
  title: 'Trace2World: Reconstructing App Worlds from Real Interaction Traces for Scalable GUI Agent Training'
  url: https://arxiv.org/abs/2610.30792
  date: '2026.10'
  section: '1.2'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconciles real interaction traces into a fixed app-behavior model, then uses independent screenshot-grounded replay
      to guide bounded package repair before synthesizing GUI-agent training tasks.
    zh: 先从真实交互轨迹确定应用行为，再以独立截图重放定位缺陷、约束环境代码修复，随后生成 GUI Agent 训练任务。
    ja: 実際の操作軌跡からアプリの動作を定め、独立した画像再生で欠陥を特定して環境コードの修正を制約し、その後に GUI エージェントの訓練タスクを生成する。
  sources:
  - https://arxiv.org/abs/2610.30792
  verification:
    en: Six source-workflow obligations · reset/state contracts · environment-repair ablation · downstream GUI and real-device
      transfer.
    zh: 六类源工作流义务 · 重置／状态契约 · 环境修复消融 · 下游 GUI 与真实设备迁移。
  tags:
  - Method
  - Benchmark
  - Data Curation
  - Training
  - Environment
  - Verification
- id: '2610.37786'
  title: 'WebAnything: From the Wild Web to Scalable Agent Environments'
  url: https://arxiv.org/abs/2610.37786
  date: '2026.10'
  section: '1.2'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs resettable web-agent environments from source-site observations, using independent visual and interaction
      checks to drive code repair or targeted recapture before producing operator-training tasks.
    zh: 依据源站观测重建可重置Web Agent环境，以独立视觉与交互检查驱动代码修复或定向补采，再构造操作者训练任务。
    ja: 元サイトの観測からリセット可能な Web エージェント環境を再構築し、独立した視覚・操作検査でコード修正や追加収集を導いた後、操作エージェントの訓練タスクを作る。
  sources:
  - https://arxiv.org/abs/2610.37786
  - https://github.com/china-qijizhifeng/Web-Anything
  verification:
    en: Source fidelity, interaction and reset checks · traced feedback-to-repair cases · downstream GUI-operator training;
      244 historical artifacts are an inventory, while public code includes three limited demos.
    zh: 源站保真、交互与reset检查 · 反馈到修复的可追踪案例 · 下游GUI操作者训练；244项历史产物是清单，公开代码仅附三个有限Demo。
  tags:
  - Method
  - Environment
  - Data Curation
  - Inference
  - Verification
- id: '2605.25624'
  title: 'CUA-Gym: Scaling Verifiable Training Environments and Tasks for Computer-Use Agents'
  url: https://arxiv.org/abs/2605.25624
  date: '2026.05'
  section: '1.2'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Co-generates resettable software states, tasks, and executable rewards, returning disagreements between rollout screenshots
      and programmatic scores to the reward-writing agent for revision and another rollout.
    zh: 联合生成可重置的软件状态、任务与可执行奖励，将 rollout 截图判断与程序评分之间的分歧反馈给奖励编写 Agent，修改后重新执行验证。
    ja: リセット可能なソフトウェア状態、タスク、実行可能な報酬を同時に生成する。ロールアウト画像の判定とプログラム採点の不一致を報酬作成エージェントへ返し、修正後に再実行して検証する。
  sources:
  - https://arxiv.org/abs/2605.25624
  - https://github.com/xlang-ai/CUA-Gym
  - https://github.com/xlang-ai/CUA-Gym-Hub
  - https://huggingface.co/datasets/xlangai/CUA-Gym
  verification:
    en: Initial/golden-state reward checks · independent visual-score agreement · task feasibility · OSWorld/WebArena downstream
      transfer · 32,112 training tuples in the paper versus 10,910 tasks in the public release.
    zh: 初始／目标状态奖励检查 · 独立视觉评分一致性 · 任务可解性 · OSWorld／WebArena 下游迁移 · 区分论文的 32,112 个训练元组与公开发布的 10,910 个任务。
  tags:
  - Method
  - Dataset
  - Data Curation
  - Training
  - Environment
  - Verification
- id: '2610.19337'
  title: 'Beyond Initial Creation: Two Decades of Community-based Chart Revisions from Wikimedia Commons'
  url: https://arxiv.org/abs/2610.19337
  date: '2026.10'
  section: '1.3'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Releases longitudinal metadata and edit labels for 7,786 revisions of 1,664 Wikimedia charts, providing human revision
      histories for studying changes beyond initial chart creation.
    zh: 发布 1,664 张 Wikimedia 图表、7,786 次修订的历史元数据与编辑标签，为初次创建之后的图表变化提供人类编辑数据。
    ja: Wikimedia の図表 1,664 件と改訂 7,786 回の履歴メタデータ・編集ラベルを公開し、初回作成後の図表変更を研究するための人間の編集データを提供する。
  sources:
  - https://arxiv.org/abs/2610.19337
  - https://github.com/WikiVizEvolution/viz-revisions-dataset
  verification:
    en: Human-validated edit taxonomy · label reliability · chart-level longitudinal analysis.
    zh: 经人工验证的编辑分类、标签可靠性、图表级纵向分析。
  tags:
  - Dataset
  - Data Curation
- id: '2610.02399'
  title: 'VisAudit: Evaluating Multimodal Agents for Visual Diagnosis and Repair'
  url: https://arxiv.org/abs/2610.02399
  date: '2026.10'
  section: '1.3'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Diagnoses and revises visualization code through execution and rendered-chart feedback, separating defect recovery,
      preservation, and the decision to leave already-correct charts unchanged.
    zh: 通过执行与渲染图表反馈诊断并修订可视化代码，分别评测缺陷恢复、正确内容保持，以及对原本正确图表不作修改的判断。
    ja: 実行・描画フィードバックで可視化コードを診断・修正し、欠陥からの回復、正しい内容の保持、元から正しい図表を変更しない判断を別々に評価する。
  sources:
  - https://arxiv.org/abs/2610.02399
  verification:
    en: Executability · binary/graded recovery and preservation · correct-chart recognition · modality and interaction-budget
      ablations.
    zh: 可执行性 · 二值／分级恢复与保持 · 正确图表识别 · 证据模态与交互预算消融。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: '2609.38642'
  title: 'ChartRevise: A Dataset and Evaluation Protocol for Exact Chart Editing via Code'
  url: https://arxiv.org/abs/2609.38642
  date: '2026.09'
  section: '1.3'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Builds program-grounded chart edits through before/after rendering and judge-guided repair, then measures exactness
      by separating explicit requirements, coupled updates, and unrelated changes.
    zh: 通过修改前后渲染与判定器引导的修复构建程序化图表编辑，并将显式要求、关联更新和无关改动分开衡量编辑精确性。
    ja: 編集前後の描画と判定器に導かれた修正でプログラムによる図表編集を構築し、明示要件、関連する更新、無関係な変更を分けて編集精度を測る。
  sources:
  - https://arxiv.org/abs/2609.38642
  verification:
    en: Execution/rendering · requirement completion · coupled updates · unrelated-change preservation · judge agreement.
    zh: 执行与渲染 · 要求完成 · 关联更新 · 无关内容保持 · 判定一致性。
  tags:
  - Dataset
  - Benchmark
  - Data Curation
  - Training
  - Verification
- id: '2607.10301'
  title: 'ChartSync: A Benchmark for Visuo-Logical Cascading Chart Editing'
  url: https://arxiv.org/abs/2607.10301
  date: '2026.07'
  section: '1.3'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether chart-image edits propagate changed values into the corresponding geometry while preserving unrelated
      content, using program-rendered, expert-curated targets and independent visual evaluation.
    zh: 以程序渲染、专家校正的目标图及独立视觉评测，检查图表图像编辑能否让数值变化同步反映到对应几何，同时保持无关内容不变。
    ja: プログラム描画、専門家が修正した目標画像、独立した視覚評価により、数値の変更を対応する形状に反映しながら無関係な内容を保てるかを検査する。
  sources:
  - https://arxiv.org/abs/2607.10301
  - https://github.com/kaka-yjk/ChartSyncCodebase
  - https://huggingface.co/datasets/JiakangYu/ChartSync
  verification:
    en: 870 editing triplets, including 235 geometry-coupled cases · OCR/structural fidelity · geometric synchronization ·
      background preservation · human–judge agreement.
    zh: 870 组编辑三元组，其中 235 组涉及几何联动 · OCR／结构保真 · 几何同步 · 背景保持 · 人类与评估器一致性。
  tags:
  - Benchmark
  - Dataset
  - Data Curation
  - Verification
- id: '2603.25804'
  title: 'RealChart2Code: Advancing Chart-to-Code Generation with Real Data and Multi-Task Evaluation'
  url: https://arxiv.org/abs/2603.25804
  date: '2026.03'
  section: '1.3'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Uses real charts and underlying data to evaluate generation, editing, and iterative chart-code refinement.
    zh: 使用真实图表及其底层数据，评测生成、编辑与迭代式 Chart-to-code。
    ja: 実際の図表と元データを用いて、生成、編集、反復的な図表からコードへの変換を評価する。
  sources:
  - https://arxiv.org/abs/2603.25804
  - https://github.com/Speakn0w/RealChart2Code
  verification:
    en: Sandbox pass rate · eight-axis visual accuracy · data-pattern consistency · design quality.
    zh: 沙箱通过率 · 八维视觉准确性 · 数据模式一致性 · 设计质量。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: '2603.29139'
  title: 'SciVisAgentBench: A Benchmark for Evaluating Scientific Data Analysis and Visualization Agents'
  url: https://arxiv.org/abs/2603.29139
  date: '2026.03'
  section: '1.3'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Provides a rigorous multimodal, outcome-centric benchmark for scientific visualization agents without requiring a
      closed code-repair trajectory.
    zh: 提供严谨、以多模态结果为中心的科学可视化 Agent 评测，但不要求闭环代码修复轨迹。
    ja: マルチモーダルな出力を重視した厳密な科学可視化エージェントの評価を提供するが、閉ループのコード修復軌跡は必須としない。
  sources:
  - https://arxiv.org/abs/2603.29139
  - https://scivisagentbench.github.io/
  verification:
    en: ''
    zh: ''
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: '2602.15758'
  title: 'ChartEditBench: Evaluating Grounded Multi-Turn Chart Editing in Multimodal Language Models'
  url: https://arxiv.org/abs/2602.15758
  date: '2026.02'
  section: '1.3'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks grounded multi-turn edits in which each visual instruction must be reflected in an updated chart artifact.
    zh: 评测有现实依据的多轮图表编辑，要求每条视觉指令都反映在更新后的图表产物中。
    ja: 現実に根拠を持つ複数ターンの図表編集を評価し、各視覚指示が更新後の図表に反映されることを求める。
  sources:
  - https://arxiv.org/abs/2602.15758
