  - https://github.com/tettethu/VibeGame
  - https://github.com/tettethu/VibeGame/blob/main/technical_report.pdf
  - https://vibegame.tettet.org/
  verification:
    en: Schema/static validity · frame-synchronous runtime behavior · functionality/visual quality/playability (qualitative).
    zh: Schema／静态有效性 · 帧同步运行时行为 · 功能／视觉质量／可玩性（定性）。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
  aliases:
  - '2610.33106'
- id: res:agentic-gamedev-skills
