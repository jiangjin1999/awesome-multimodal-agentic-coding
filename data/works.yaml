- id: '2610.38231'
  title: '3DCodeEdit: Benchmarking Instruction-Guided 3D Program Editing'
  url: https://arxiv.org/abs/2610.38231
  date: '2026.10'
  section: '1.5'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks instruction-guided Blender program editing with multi-view checks and a multi-turn study in which independent
      visual reviews guide code revisions beyond executable-but-geometrically-wrong outputs.
    zh: 以多视角条件检查评测指令引导的 Blender 程序编辑，并通过多轮实验让独立视觉审查指导代码修订，检验“能执行但几何错误”的问题。
    ja: 複数視点の条件検査で指示に基づく Blender プログラム編集を評価する。反復実験では独立した視覚レビューでコード修正を導き、実行できても形状が誤っている問題を調べる。
  sources:
  - https://arxiv.org/abs/2610.38231
  - https://binjiew.github.io/3DCodeEdit/
  - https://github.com/BinjieW/3DCodeEdit
  - https://huggingface.co/datasets/BinjieW/3DCodeEdit
  verification:
    en: 2,592 tasks / 108 programs · six edit types · 312-task feedback subset · hidden grading versus reviewer-generated
      feedback.
    zh: 2,592 项任务／108 个程序 · 六类编辑 · 312 项多轮反馈子集 · 隐藏评分与 reviewer 反馈分离。
  tags:
  - Benchmark
  - Dataset
  - Inference
  - Verification
- id: '2610.03715'
  title: '4DCodeBench: Benchmarking Agents on Inverse Graphics of Dynamic Scenes'
  url: https://arxiv.org/abs/2610.03715
  date: '2026.10'
  section: '1.5'
  sub: eval
  type: paper
  scope: adjacent
  see_also:
  - '3.3'
  tldr:
    en: Measures inverse graphics of dynamic videos through executable scene programs.
    zh: 要求 Agent 将真实或合成的动态视频重建成可执行图形程序，恢复场景的三维结构及其随时间发生的变化。基准同时比较画面和运动，并利用合成场景的三维真值作更直接的检查；实现方式可以是关键帧、解析轨迹或物理模拟。
    ja: 実写または合成の動的動画を実行可能なグラフィックスプログラムへ再構築し、三次元構造と時間変化を復元する。画面と動きを比較し、合成場面の三次元正解でも検査する。実装にはキーフレーム、解析的軌道、物理シミュレーションを使える。
  sources:
  - https://arxiv.org/abs/2610.03715
  - https://arxiv.org/html/2610.03715
  verification:
    en: Rendered static/dynamic fidelity · 3D geometry · trajectory DTW · motion distribution · executable submission validity.
    zh: 渲染静态/动态保真度 · 三维几何 · 轨迹 DTW · 运动分布 · 可执行提交有效性。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: system:blenderworld
  title: 'BlenderWorld: Benchmarking Visual Agents for 3D Creation from Real-World References'
  url: https://arxiv.org/abs/2610.23986
  date: '2026.10'
  section: '1.5'
  sub: eval
  type: paper
  scope: core
  see_also:
