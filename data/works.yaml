- id: '2610.22355'
  title: 'OmniVerifier-C1: Decomposed Graded Verifier for Rule-Governed Generative World Modeling'
  url: https://arxiv.org/abs/2610.22355
  date: '2026.10'
  section: '1.7'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Decomposes visual requirements into graded checks for training image generators, using ground-truth reference images
      to reduce target-state reasoning errors in rule-governed visual tasks.
    zh: 将视觉要求拆为分项检查并汇总为训练图像生成器的分级奖励，在规则约束视觉任务中借助真实目标参考图减少目标状态推理错误。
    ja: 視覚要件を個別チェックへ分解して画像生成器の学習用報酬に集約し、規則に従う視覚タスクで実際の目標参考画像を使って目標状態の推論誤りを減らす。
  sources:
  - https://arxiv.org/abs/2610.22355
  - https://github.com/Cominclip/OmniVerifier
  verification:
    en: Visual critic generalization · text–image alignment · rule-task correctness · pointwise/pairwise and graded/binary
      comparisons; reference-based rewards require a target image.
    zh: 视觉评判泛化 · 图文对齐 · 规则任务正确性 · 单样本／参考图比较与分级／二值奖励对照；参考式奖励需要目标图像。
  tags:
  - Method
  - Training
  - Verification
- id: '2610.15924'
  title: Scalable Weak-to-Strong Verifier Hardening for Agent Environments
  url: https://arxiv.org/abs/2610.15924
  date: '2026.10'
  section: '1.7'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Iteratively audits and repairs sandboxed agent-environment verifiers with weaker models, checking retained legitimate
      solutions and fresh solver attempts before accepting each repair.
    zh: 用较弱模型迭代审计与修复沙箱内 Agent 环境的验证器，在接纳修复前回放合法解并检查新求解尝试。
    ja: 比較的弱いモデルでサンドボックス内のエージェント環境の検証器を反復監査・修復し、採用前に正当な解の再生と新たな解法の試行を確認する。
  sources:
  - https://arxiv.org/abs/2610.15924
  - https://verifier-hardening.github.io/
  verification:
    en: Held-out stronger-agent attack success · benign validity · iterative/static repair comparison · residual exploits
      and finite validation coverage.
    zh: 留出强模型的攻击成功率 · 合法解有效性 · 迭代／静态修复比较 · 残余漏洞与有限验证覆盖。
  tags:
  - Method
  - Environment
  - Verification
- id: '2610.10622'
  title: 'WorldBench: Evaluating LLMs on Three.js Voxel World Generation'
  url: https://arxiv.org/abs/2610.10622
  date: '2026.10'
  section: '1.7'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: The judge changes the viewpoint and clock in a running Three.js voxel world and checks code, rendered evidence, and
      feature-removal tests. During repair the generator receives only parser or console errors.
    zh: 评分器主动改变 Three.js 体素世界的视角与时间，将源码、运行画面和移除功能后的结果对照评分。生成器修订代码时只接收解析或控制台错误。
    ja: 評価器が Three.js のボクセル世界の視点と時刻を変え、ソース、実行画面、機能を除いた結果を比較して採点する。生成器への修正フィードバックは解析・コンソールのエラーに限られる。
  sources:
  - https://arxiv.org/abs/2610.10622
  - https://github.com/KrishBakshi/worldbench
  verification:
    en: Code–frame agreement · view-dependent coverage · mutation-test false credit · temporal/pixel checks · judge repeatability.
    zh: 代码与画面证据一致性 · 视角相关覆盖 · 功能移除后的错误得分 · 时间／像素检查 · 评审重复性。
  tags:
  - Benchmark
  - Empirical Study
  - Verification
- id: '2606.15693'
  title: 'Imperfect Visual Verification for Code Edition: A Case Study on TikZ'
  url: https://arxiv.org/abs/2606.15693
  date: '2026.04'
  section: '1.7'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Studies how imperfect visual verifiers score rendered TikZ edits and whether their feedback helps generators produce
      better code over multiple refinement steps.
    zh: 研究不完美视觉 Verifier 如何评分 TikZ 渲染编辑，以及反馈能否帮助多轮生成得到更好的代码。
    ja: 不完全な視覚検証器が TikZ の描画編集をどう採点し、そのフィードバックが複数ターンのコード生成に役立つかを研究する。
  sources:
  - https://arxiv.org/abs/2606.15693
  verification:
    en: Instruction-application detection · score accuracy · feedback usefulness · human agreement.
    zh: 指令应用检测 · 评分准确性 · 反馈有效性 · 人工一致性。
  tags:
  - Method
  - Inference
  - Verification
- id: '2604.18164'
  title: 'MM-JudgeBias: A Benchmark for Evaluating Compositional Biases in MLLM-as-a-Judge'
  url: https://arxiv.org/abs/2604.18164
  date: '2026.04'
  section: '1.7'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether multimodal judges use the full query–image–response evidence through nine controlled perturbations,
      separating sensitivity to missing or mismatched evidence from stability under irrelevant changes.
    zh: 通过九类受控扰动检验多模态裁判是否利用完整的问题—图像—回答证据，并区分缺失／错配证据敏感性与无关变化下的稳定性。
    ja: 九種類の制御された摂動で、マルチモーダル評価者が質問・画像・回答の証拠全体を使うかを検査する。欠落・不一致への感度と、無関係な変化への安定性を分ける。
  sources:
  - https://arxiv.org/abs/2604.18164
  - https://aclanthology.org/2026.acl-long.1162/
  - https://github.com/naver-ai/MM-JudgeBias
  - https://huggingface.co/datasets/naver-ai/MM-JudgeBias
  verification:
    en: 1,804 samples from 29 benchmarks · 26 judges · distinct Bias-Deviation/Bias-Conformity metrics · released evaluation
      data and code; not a closed-loop repair benchmark.
    zh: 来自29个基准的1,804样本、26个裁判、用途不同的BD／BC指标及公开评测数据与代码；不是闭环修复基准。
  tags:
  - Benchmark
  - Dataset
  - Verification
- id: '2511.15567'
  title: Computer-Use Agents as Judges for Generative User Interface
  url: https://arxiv.org/abs/2511.15567
  date: '2025.11'
  section: '1.7'
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Pairs a coding model with a computer-use agent that tests generated interfaces and returns visual interaction histories
      for redesign.
    zh: 将 Coding Model 与测试生成界面的 Computer-use Agent 配对，并把视觉交互历史返回用于重新设计。
    ja: コーディングモデルと生成画面をテストする計算機操作エージェントを組ませ、視覚的な操作履歴を再設計へ返す。
  sources:
  - https://arxiv.org/abs/2511.15567
  - https://github.com/showlab/AUI
  - https://showlab.github.io/AUI/
  verification:
    en: GUI task success · interaction solvability · verifier–human agreement.
    zh: GUI 任务成功率 · 交互可解性 · 验证器与人工一致性。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Data Curation
  - Inference
  - Environment
  - Verification
- id: '2610.38568'
  title: 'A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement'
  url: https://arxiv.org/abs/2610.38568
  date: '2026.10'
  section: '1.7'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Uses a fixed library of model-authored rendering programs to produce independently checkable visual tasks, refreshing
      the solver’s training pool when logged learning signals weaken rather than rewriting generators online.
    zh: 用固定的模型编写渲染程序生成可独立核对答案的视觉任务，在训练日志显示学习信号减弱时刷新求解器题池，而不是在线改写生成程序。
    ja: 固定モデルが描画プログラムを書き、正解を独立に確認できる視覚タスクを生成する。学習信号の低下が記録された際に解答者の問題群を更新し、生成プログラム自体はオンラインで書き換えない。
  sources:
  - https://arxiv.org/abs/2610.38568
  verification:
    en: Eleven-benchmark mean · fresh-task budget · fixed-pool and continuous-refresh comparisons · answer audits; single-run
      comparisons and missing matched-timing control limit causal claims.
    zh: 十一基准平均分 · 新任务预算 · 固定题池与持续刷新对比 · 答案审计；单次运行及缺少匹配刷新时刻的对照限制因果结论。
  tags:
  - Method
  - Data Curation
  - Training
  - Verification
- id: '2610.34921'
  title: 'PhysEvolve: Verifier-grounded Self-evolution for Physical Reasoning with Executable Worlds'
  url: https://arxiv.org/abs/2610.34921
  date: '2026.10'
  section: '1.7'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Co-trains a world-program proposer and visual solver through deterministic counterfactual simulations and exact answer-bound
      rewards, improving physical reasoning through policy updates across rounds.
    zh: 通过确定性反事实仿真和绑定准确答案的奖励，共同训练世界程序提议者与视觉解题者，以跨轮策略更新提升物理推理。
    ja: 決定論的な反実仮想シミュレーションと正解に結び付いた報酬で、世界プログラムの提案者と視覚的な解答者を共同訓練し、ラウンド間の方策更新で物理推論を改善する。
  sources:
  - https://arxiv.org/abs/2610.34921
  - https://yelonhu.github.io/physevolve-page/
  verification:
    en: PhysBench, CausalPhys, and ContPhy transfer · paired-branch and proposer-update ablations · reward-hacking audit;
      video reasoning rather than hardware control.
    zh: PhysBench、CausalPhys 与 ContPhy 迁移 · 配对分支与提议者更新消融 · 奖励投机审计；评测为视频推理而非硬件控制。
  tags:
  - Method
  - Data Curation
  - Training
  - Environment
  - Verification
- id: '2610.36077'
  title: 'The Trinity: Capability-Driven Recursive Self-Improvement for Multimodal Agents'
  url: https://arxiv.org/abs/2610.36077
  date: '2026.10'
  section: '1.7'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Couples verifiable world generation with capability-organized Harness evolution and routing, transferring selected
      Harness–skill configurations across heterogeneous tasks and two embodied settings.
    zh: 将可验证世界生成与按能力组织的 Harness 演化、路由结合，使所选 Harness—技能配置迁移到异构任务和两项具身场景。
    ja: 検証可能な世界生成と、能力別のハーネス進化・選択を組み合わせ、選ばれたハーネスとスキルの構成を異種タスクおよび二つの具身場面へ転用する。
  sources:
  - https://arxiv.org/abs/2610.36077
  - https://github.com/InfRec-Cardinal/The-Trinity
  - https://trinity-rsi.github.io/
  verification:
    en: Training/unseen task transfer · module inheritance and routing · two embodied tasks; module evolution and task-specific
      skill preparation are evaluated jointly.
    zh: 训练／未见任务迁移 · 模块继承与路由 · 两项具身任务；模块演化与任务专用技能准备被联合评价。
  tags:
  - Method
  - Training
  - Environment
  - Verification
- id: '2610.32120'
  title: 'ImageRSI: Verification-Driven Recursive Self-Improvement for Agentic Image Generation'
  url: https://arxiv.org/abs/2610.32120
  date: '2026.10'
  section: '2.1'
  type: paper
  scope: adjacent
  tldr:
    en: Repairs images with multimodal verification, admits reusable strategies through paired validation, and trains the
      judge offline while keeping the image generator frozen.
    zh: 通过多模态验证修复图像，以成对验证筛选可复用经验，并在冻结图像生成器的同时离线训练判别器。
    ja: マルチモーダル検証で画像を修復し、対にした検証で再利用可能な経験を選ぶ。画像生成器を凍結したまま判別器をオフラインで訓練する。
  sources:
  - https://arxiv.org/abs/2610.32120
  verification:
    en: Checklist strict accuracy · matched-budget repair · experience-reuse ablations · judge error; prompt and experience
      updates, with the judge fixed within each task.
    zh: 检查项严格准确率 · 等预算修复 · 经验复用消融 · 判别器误差；更新提示词与经验，单次任务内判别器固定。
  tags:
  - Method
  - Training
  - Inference
  - Verification
- id: '2610.07250'
  title: Internalizing Agent Experience into Diffusion Model Weights via On-Policy Context Distillation
  url: https://arxiv.org/abs/2610.07250
  date: '2026.10'
  section: '2.1'
  type: paper
  scope: adjacent
  tldr:
    en: Uses image-verification feedback to refine diffusion prompts and evolve textual skills, then distills part of that
      prompt-mediated experience into the generator before renewing harness adaptation.
    zh: 以图像核验反馈修订扩散模型提示词并演化文本技能，再将部分提示词经验蒸馏进生成器，随后重新适配 Agent 工作流。
    ja: 画像検証のフィードバックで拡散モデルのプロンプトを修正し、文章のスキルを進化させる。一部の経験を生成器へ蒸留した後、エージェントの手順を再調整する。
  sources:
  - https://arxiv.org/abs/2610.07250
  - https://github.com/Yummytanmo/D-OPCD-CoEvolution
  verification:
    en: Four-benchmark image quality · direct-generation versus harness gains · prompt/skill ablations · one generator-update
      and re-evolution cycle.
    zh: 四项图像质量基准 · 直接生成与 Agent 工作流收益 · 提示词／技能消融 · 单次生成器更新与再演化。
  tags:
  - Method
  - Training
  - Inference
  - Verification
- id: '2611.06518'
  title: 'EmoReward: Self-Evolving Reward Calibration for Emotional Video Generation RL'
  url: https://arxiv.org/abs/2611.06518
  date: '2026.11'
  section: '2.2'
  type: paper
  scope: adjacent
  tldr:
    en: Calibrates heterogeneous emotion-reward providers using current-video validity gates and a frozen table derived from
      earlier training traces, supplying better-grounded rewards for video-generator training.
    zh: 以当前视频的证据有效性门控和既往训练轨迹生成的冻结权重表校准异构情绪评分器，为视频生成器训练提供更有依据的奖励。
    ja: 現在の動画の証拠の有効性と、過去の訓練軌跡から作った固定重み表で異種の感情評価器を校正し、動画生成器の学習に根拠のある報酬を与える。
  sources:
  - https://arxiv.org/abs/2611.06518
  - https://emoreward-project.github.io/
  - https://github.com/Tencent-Hunyuan/EmoReward
  verification:
    en: Matched reward-policy ablations · generator/image-transfer studies · 18-participant ordinal ratings; one reference-to-calibrated
      transition, with reward providers fixed.
    zh: 匹配预算的奖励策略消融、生成器／图像迁移实验及18人等级评分；验证一次参考到校准运行的转移，奖励提供模型保持固定。
  tags:
  - Method
  - Training
  - Verification
- id: '2611.04418'
  title: 'VidUEU-Agent: A Data-Curation Agent for Multimodal Understanding, Editing, and Unified Tasks'
  url: https://arxiv.org/abs/2611.04418
  date: '2026.11'
  section: '2.2'
  type: paper
  scope: adjacent
  tldr:
    en: Coordinates visual tools and VLM checks to curate 100K traceable understanding/editing/unified instructions from videos,
      then adjusts sampling and routing from downstream training feedback.
    zh: 组织视觉工具与 VLM 检查，从视频构造10万条可追溯的理解、编辑和统一任务指令，再根据下游训练反馈调整采样与路由。
    ja: 視覚ツールと VLM の検査を組み合わせ、動画から追跡可能な理解・編集・統合タスクの指示を 10 万件作る。下流の訓練結果から抽出と振り分けを調整する。
  sources:
  - https://arxiv.org/abs/2611.04418
  - https://github.com/LRuca/VidUEU-Agent
  - https://huggingface.co/datasets/Lruca/VidUEU100k
  verification:
    en: Released instruction/metadata files · training comparisons · feedback-free benchmarks separated from test-score-guided
      data iteration; upstream visual assets retain source-specific terms.
    zh: 已发布指令／元数据文件与训练对比；未参与反馈的基准区分于测试分数引导的数据迭代，上游视觉资产沿用各自条款。
  tags:
  - Method
  - Dataset
  - Data Curation
  - Training
  - Verification
- id: '2610.20571'
  title: 'Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation'
  url: https://arxiv.org/abs/2610.20571
  date: '2026.10'
  section: '2.2'
  type: paper
  scope: adjacent
  tldr:
    en: ATAS compiles screenplays into scene-, camera-, and time-grounded requests, conditioning later shots on registered
      scene/event memories while separating film acceptance from admission of generated observations to memory.
    zh: ATAS 将剧本编译为有场景、相机和时间定位的请求，用配准后的场景／事件记忆引导后续镜头，并将成片验收与生成观测是否写入记忆分开。
    ja: ATAS は脚本を場面・カメラ・時刻付きの要求へ変換し、位置合わせした場面・出来事の記憶で後続ショットを導く。完成映像の検収と、生成時の観測を記憶へ書く判断を分ける。
  sources:
  - https://arxiv.org/abs/2610.20571
  - http://lhmd.top/atas
  - https://github.com/ziplab/ATAS
  verification:
    en: Four video backbones · spatial revisits and event recapture · memory/validation ablations · human evaluation · retry
      reduction versus added compute.
    zh: 四种视频生成底座 · 空间重访与事件重现 · 记忆／验证消融 · 人类评价 · 重试减少与额外计算开销。
  tags:
  - Method
  - System
  - Inference
  - Verification
- id: '2610.38352'
  title: 'WeVisCut: The Whole Editing Room in One Agent From Narration to Long-Form Video'
  url: https://arxiv.org/abs/2610.38352
  date: '2026.10'
  section: '2.2'
  type: paper
  scope: core
  tldr:
    en: Trains a shared editing policy to construct executable shot plans, orchestrate narration and media tools, and revise
      template content and timelines from render-grounded production feedback.
    zh: 训练共享编辑策略构建可执行镜头计划、编排旁白与媒体工具，并依据渲染产物的生产反馈修订模板内容和时间线。
    ja: 共通の編集方策を訓練して実行可能なショット計画を作り、ナレーションとメディアツールを編成する。描画成果物への制作フィードバックでテンプレートと時間軸を修正する。
  sources:
  - https://arxiv.org/abs/2610.38352
  - https://github.com/Tencent/WeVisCut
  - https://huggingface.co/tencent/WeVisCut
  - https://tencent.github.io/WeVisCut/
  verification:
    en: 100 held-out tasks · execution and delivery traces · quality/cost diagnostics · blinded human ratings; production
      feedback is separate from read-only final evaluation.
    zh: 100 项留出任务 · 执行与交付轨迹 · 质量／成本诊断 · 盲测人工评分；生产反馈与只读最终评测分开。
  tags:
  - Method
  - Data Curation
  - Training
  - Inference
  - Verification
- id: '2609.24997'
  title: 'VideoGen-Agent: Reinforcing Video Generation Agents'
  url: https://arxiv.org/abs/2609.24997
  date: '2026.09'
  section: '2.2'
  type: paper
  scope: adjacent
  tldr:
    en: Trains a multimodal policy to compose retrieval, simulation, video-generation, and visual-verification tools, using
      intermediate observations to choose subsequent calls or regenerate rather than rewrite the underlying tools.
    zh: 训练多模态策略组合检索、仿真、视频生成与视觉验证工具，依据中间观测选择后续调用或重新生成，而非改写底层工具。
    ja: 検索、シミュレーション、動画生成、視覚検証を組み合わせるマルチモーダル方策を訓練し、中間観測から次の呼び出しや再生成を選ぶ。下位ツール自体は書き換えない。
  sources:
  - https://arxiv.org/abs/2609.24997
  - https://andyca111.github.io/VideoGen_Agent/
  verification:
    en: Six-category VABench · tool-use/reward ablations · generator upgrades with a fixed agent · human preference · separate
      qualitative action-to-video extension, not robot execution.
    zh: 六类 VABench · 工具／奖励消融 · 固定 Agent 下升级生成器 · 人类偏好 · 独立的动作到视频定性扩展，不是机器人执行。
  tags:
  - Method
  - Benchmark
  - Training
  - Inference
  - Verification
- id: '2607.16355'
  title: 'PhysAgent: Reflective Agentic Physics Control for Physically Plausible Video Generation'
  url: https://arxiv.org/abs/2607.16355
  date: '2026.07'
  section: '2.2'
  type: paper
  scope: core
  tldr:
    en: Closes the loop among executable physical-program generation, simulation, stage-specific visual verification, and
      targeted program repair.
    zh: 闭合可执行物理程序生成、仿真、分阶段视觉验证与定向程序修复之间的循环。
    ja: 実行可能な物理プログラムの生成、シミュレーション、段階的な視覚検証、対象を絞ったプログラム修復を閉ループにする。
  sources:
  - https://arxiv.org/abs/2607.16355
  verification:
    en: Visual quality · temporal consistency · physical plausibility · prompt-event alignment.
    zh: 视觉质量 · 时间一致性 · 物理合理性 · 提示事件对齐。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: res:bernini
  title: 'Bernini: Latent Semantic Planning for Video Diffusion'
  url: https://github.com/bytedance/Bernini
  date: null
  section: '2.2'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Connects a Qwen2.5-VL semantic planner to a Wan2.2 diffusion renderer through a shared task interface; released full-pipeline
      and renderer-only variants provide reusable media tools.
    zh: 将 Qwen2.5-VL 语义规划器连接到 Wan2.2 扩散渲染器，以统一任务接口提供生成／编辑；完整管线与独立渲染器版本均可作为媒体工具。
    ja: Qwen2.5-VL の意味計画器と Wan2.2 の拡散レンダラを統一タスクインターフェースで結び、生成・編集を行う。完全なパイプライン版と単独レンダラ版をメディアツールとして使える。
  sources:
  - https://github.com/bytedance/Bernini
  - https://github.com/bytedance/Bernini/blob/main/docs/bernini.md
  - https://huggingface.co/ByteDance/Bernini-Diffusers
- id: res:supra-tex
  title: SUPRA-Tex
  url: https://arxiv.org/abs/2610.22352
  demo: https://huggingface.co/spaces/UniLat3D/Supra-Tex
  date: null
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Preserves reference text, logos, and patterns while completing unseen surfaces with albedo, metallic, and roughness
      properties. Geometry is supplied or generated upstream by Pixal3D; edited 2D views can update materials on the same
      mesh, providing an appearance-generation step for 3D asset workflows.
    zh: 保留参考图中的文字、Logo 与图案，并补全不可见表面的反照率、金属度和粗糙度。几何由外部提供或上游 Pixal3D 生成；编辑后的二维视图可更新同一 mesh 的材质，为 3D 资产工作流提供外观生成环节。
    ja: 参考画像の文字・ロゴ・模様を保持し、見えない表面の反射色・金属度・粗さを補う。形状は外部または上流の Pixal3D が提供し、編集した二次元画像から同じメッシュの材質を更新できる。
  sources:
  - https://arxiv.org/abs/2610.22352
  - https://github.com/Supra-3D/supra-tex
  - https://huggingface.co/spaces/UniLat3D/Supra-Tex
  - https://huggingface.co/supra3d/supra-tex
  - https://supra-3d.github.io/supratex/
- id: res:texgaussian
  title: TexGaussian
  url: https://arxiv.org/abs/2411.19654
  date: null
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Predicts octree-aligned Gaussian material channels and bakes their views into UV maps, supplying relightable surface
      appearance for downstream rendering; distinct from physical-dynamics modeling or agentic repair.
    zh: 预测八叉树对齐的高斯材质通道，再将多视图结果烘焙为 UV 贴图，为后续渲染提供可重光照的表面外观；不同于物理动力学建模或 Agent 自主修复。
    ja: 八分木に整列した Gaussian の材質チャネルを予測し、多視点結果を UV テクスチャへ焼き込む。再照明可能な外観を提供する機能であり、物理動力学のモデルやエージェントの自律修復とは区別する。
  sources:
  - https://arxiv.org/abs/2411.19654
  - https://3d-aigc.github.io/TexGaussian/
  - https://github.com/ymxbj/TexGaussian
  - https://huggingface.co/ymxbj/TexGaussian
- id: res:ultratex-2k-multi-view-diffusion
  title: UltraTex (2K Multi-View Diffusion)
  url: https://arxiv.org/abs/2609.23169
  date: null
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Supplies a surface-appearance module through high-resolution multi-view diffusion and texture baking; code and a G-buffer
      data release accompany the paper.
    zh: 以高分辨率多视角扩散与纹理烘焙提供表面外观能力，论文配套代码及G-buffer数据发布。
    ja: 高解像度の多視点拡散とテクスチャのベイクで表面外観を生成し、論文に対応するコードと G-buffer データを公開する。
  sources:
  - https://arxiv.org/abs/2609.23169
  - https://github.com/YiboZ2001/UltraTex
- id: '2611.02341'
  title: 'AgiWorld: An Agentic Video World Model for Building Persistent Worlds'
  url: https://arxiv.org/abs/2611.02341
  date: '2026.11'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Directs a video world model with metric camera paths and structured prompts, then reviews sampled frames and geometry
      to revise the layout, replan a route, or regenerate a chunk.
    zh: 用度量相机轨迹与结构化提示驱动视频世界模型，再检查抽帧与几何，修订布局、重规划路线或重生成片段。
    ja: 実寸尺度のカメラ軌道と構造化プロンプトで動画世界モデルを動かし、抽出フレームと形状を検査して配置修正、経路の再計画、部分動画の再生成を行う。
  sources:
  - https://arxiv.org/abs/2611.02341
  - https://bshfang.github.io/agiworld/
  verification:
    en: Revisit consistency · camera following · bounded regeneration · generated worlds only.
    zh: 重访一致性、相机跟随、有次数上限的局部重生成；仅生成世界。
  tags:
  - Method
  - Inference
  - Verification
- id: '2611.04870'
  title: 'PrimeSim: A Generalist World Model Simulator from Large-Scale Cross-Embodiment Demonstrations'
  url: https://arxiv.org/abs/2611.04870
  date: '2026.11'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Uses an action-conditioned multiview video model as a closed-loop policy simulator and tests whether policy rankings
      and short-budget RL gains transfer back to the LIBERO physics simulator.
    zh: 将动作条件多视角视频模型用作闭环策略仿真器，检验策略排序及短预算强化学习收益能否迁回 LIBERO 物理仿真器。
    ja: 行動条件付き多視点動画モデルを閉ループの方策シミュレータに使い、方策の順位と短い予算での強化学習の利得が LIBERO の物理シミュレータへ移るかを検査する。
  sources:
  - https://arxiv.org/abs/2611.04870
  - https://primebottech.github.io/PrimeSim-website
  verification:
    en: Eight-policy ranking fidelity · fixed initial states · RL gains checked in LIBERO; no real-robot transfer test.
    zh: 八策略排序保真度、固定初始状态、在 LIBERO 验证强化学习收益；未测试实机迁移。
  tags:
  - Method
  - Training
  - Verification
- id: '2610.01215'
  title: 'AutoGUIWorld: Image Generators as Visual World Models for GUI Agent'
  url: https://arxiv.org/abs/2610.01215
  date: '2026.10'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Synthesizes action-conditioned GUI screenshot trajectories with a planner and image generator, repairing target annotations
      and filtering inconsistent transitions before operator training without running the depicted applications.
    zh: 用规划器和图像生成器合成动作条件的 GUI 截图轨迹，修复目标标注、过滤不一致转移后训练操作者，无需运行所描绘的应用。
    ja: 計画器と画像生成器で行動条件付き GUI 画像軌跡を合成し、目標注釈を修復して不整合な遷移を除いた後、操作エージェントを訓練する。描かれたアプリ自体は実行しない。
  sources:
  - https://arxiv.org/abs/2610.01215
  - https://huggingface.co/YangC777/AGW-35B
  verification:
    en: 79,266 curated steps · grounding/transition audit · downstream desktop and scientific-task scores; generated visual
      transitions are distinct from executable software environments.
    zh: 79,266 条筛选步骤 · 定位／转移一致性审核 · 下游桌面和科学任务评分；生成式视觉转移与可执行软件环境分别评价。
  tags:
  - Method
  - Data Curation
  - Training
  - Verification
- id: '2610.36371'
  title: 'BoxWorld: Let World Engines Control and Video Generators Render'
  url: https://arxiv.org/abs/2610.36371
  date: '2026.10'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Separates agent-authored interaction rules from generative appearance through an object-centric state interface, streaming
      executable world-engine states into a causal video renderer.
    zh: 以对象状态接口分离 Agent 编写的交互规则与生成式外观，将可执行世界引擎的状态流传给因果视频渲染器。
    ja: 物体状態インターフェースで、エージェントが書く操作規則と生成的な外観を分け、実行可能な世界エンジンの状態列を因果的な動画レンダラへ渡す。
  sources:
  - https://arxiv.org/abs/2610.36371
  - https://boxworld-web.github.io/
  verification:
    en: Paired counterfactual interaction control · state-transition fidelity · video quality and streaming speed; rendered
      dynamics are not real-hardware validation.
    zh: 成对反事实交互控制 · 状态转换忠实度 · 视频质量与流式速度；渲染动力学不等于实机验证。
  tags:
  - Method
  - Benchmark
  - Inference
  - Environment
  - Verification
- id: '2610.21910'
  title: 'CoWorld Reasoner: Agentic Multimodal Reasoning with the Evolving Video World Model-Driven Harness'
  url: https://arxiv.org/abs/2610.21910
  date: '2026.10'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Lets a VLM choose video-world-model operations for visual reasoning, with development-set feedback revising tools,
      skills, and harness code before fixed-harness evaluation.
    zh: 让 VLM 选择视频世界模型的操作辅助视觉推理，在开发集反馈下修订工具、Skills 与 Harness 代码，再以固定 Harness 评测。
    ja: VLM が動画世界モデルの操作を選んで視覚推論を補助する。開発集合のフィードバックでツール、スキル、ハーネスコードを修正し、その後は固定ハーネスで評価する。
  sources:
  - https://arxiv.org/abs/2610.21910
  verification:
    en: Seven held-out reasoning benchmarks · generated-evidence and evolution ablations · operation-level traces · predicted
      videos, not physical execution.
    zh: 七项保留推理基准 · 生成证据与演化消融 · 操作级轨迹 · 预测视频而非物理执行。
  tags:
  - Method
  - System
  - Inference
  - Verification
- id: '2610.26811'
  title: 'State World Models: Execute the Rules, Generate the Pixels'
  url: https://arxiv.org/abs/2610.26811
  date: '2026.10'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Separates coding-agent-authored rules from frozen video rendering, compiling settled events into visual instructions
      and admitting rule-compatible video observations into subsequent world state.
    zh: 将 Coding Agent 编写的规则与冻结视频模型的渲染分离，把已结算事件编译成视觉指令，并将符合规则的视频观测纳入后续世界状态。
    ja: エージェントが書くルールと凍結動画モデルの描画を分離し、確定した出来事を視覚指示へ変換する。ルールに沿う動画観測を後続の世界状態へ取り込む。
  sources:
  - https://arxiv.org/abs/2610.26811
  - https://github.com/Zhangyr2022/StateWorldModel
  - https://huggingface.co/datasets/Louis0411/StateWorldModel
  - https://ivg-yanranzhang.github.io/StateWorldModel/
  verification:
    en: Hidden-state counterfactual pairs · required and forbidden outcomes · matched frozen-backbone comparison · multi-turn
      examples; runtime state feedback keeps the rule program fixed.
    zh: 隐藏状态反事实配对 · 必须／禁止结果 · 同一冻结骨干的对照 · 多轮示例；运行期状态反馈不改写规则程序。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Data Curation
  - Inference
  - Environment
  - Verification
- id: '2610.40339'
  title: 'Wizard: Manipulate Any World in Real Time via Agentic Control'
  url: https://arxiv.org/abs/2610.40339
  date: '2026.10'
  section: '2.4'
  type: paper
  scope: adjacent
  tldr:
    en: Orchestrates geometry, skeleton, motion and video-generation tools around explicit game state, using agent-controlled
      visual proxies to render interactive worlds while keeping mechanics outside the diffusion model.
    zh: 围绕显式游戏状态编排几何、骨架、动作与视频生成工具，由 Agent 控制的视觉代理驱动交互世界渲染，游戏机制由独立控制器维护。
    ja: 明示的なゲーム状態の周囲に形状、骨格、動作、動画の生成ツールを編成する。エージェントが制御する視覚代理が描画を動かし、ゲーム機構は独立した制御器が維持する。
  sources:
  - https://arxiv.org/abs/2610.40339
  - https://wyzardwu.github.io/wizard/
  verification:
    en: Unseen scene/character/motion examples · proxy–video alignment · explicit combat rules · long-rollout consistency
      and motion-library limits.
    zh: 未见场景／角色／动作示例 · 代理与视频对齐 · 显式战斗规则 · 长时一致性和动作库限制。
  tags:
  - Method
  - Inference
- id: res:cosmos3-nano-sim-auto
  title: Cosmos3-Nano-Sim-Auto
  url: https://huggingface.co/nvidia/Cosmos3-Nano-Sim-Auto
  date: null
  section: '2.4'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: A causal world-model tool with released weights and Cosmos Framework inference/adaptation skills; generated sensor
      feedback supports policy evaluation, with camera-rig and sim-to-real validity requiring separate checks.
    zh: 具备公开权重及 Cosmos Framework 推理／适配 Skills 的因果世界模型工具；生成传感器反馈可用于策略评估，相机配置适配与仿真到真实有效性需分别检查。
    ja: 重みと Cosmos Framework の推論・適応スキルが公開された因果的世界モデルツール。生成センサ情報は方策評価に使えるが、カメラ構成との適合や実世界への妥当性は個別の検査を要する。
  sources:
  - https://huggingface.co/nvidia/Cosmos3-Nano-Sim-Auto
  - https://developer.nvidia.com/blog/build-world-models-for-interactive-simulation-with-nvidia-cosmos/
  - https://github.com/NVIDIA/cosmos-framework/blob/main/docs/inference_sim_auto.md
- id: res:worldfoundry
  title: WorldFoundry
  url: https://arxiv.org/abs/2611.10771
  date: null
  section: '2.4'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Connects model-specific inputs, runtime requirements and output artifacts to common inference and evaluation workflows,
      with explicit readiness and eligibility states.
    zh: 将模型各自的输入、运行要求及输出产物接入统一推理和评测工作流，明确区分准备状态和评测资格。
    ja: 各モデルの入力、実行条件、出力を統一した推論・評価手順へ接続し、準備が整った状態と評価対象としての適格性を明確に分ける。
  sources:
  - https://arxiv.org/abs/2611.10771
  - https://github.com/OpenEnvision/WorldFoundry
- id: '2610.06955'
  title: 'ROMA: LLM System for Real-World Object-Centric Multi-Sensory Active Perception'
  url: https://arxiv.org/abs/2610.06955
  date: '2026.10'
  section: '2.5'
  type: paper
  scope: adjacent
  tldr:
    en: Selects objects, physical interactions, and sensory modalities to acquire missing evidence through a grasping interface,
      updating subsequent perception decisions without rewriting policy code.
    zh: 通过抓取接口选择物体、物理交互和感官模态以获取缺失证据，再调整后续主动感知决策，而非改写策略代码。
    ja: 把持インターフェースを通じて物体、物理的相互作用、感覚モダリティを選び、不足する証拠を得て次の能動知覚を調整する。方策コードは書き換えない。
  sources:
  - https://arxiv.org/abs/2610.06955
  - https://gewu-lab.github.io/ROMA/
  - https://github.com/GeWu-Lab/ROMA
  verification:
    en: Offline perception-chain accuracy · separate real-arm tasks · localization/grasp failures · modality selection · interaction
      cost.
    zh: 离线感知链准确率 · 独立实机任务 · 定位／抓取失败 · 模态选择 · 交互成本。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Data Curation
  - Training
  - Inference
  - Environment
  - Verification
- id: '2610.28354'
  title: 'S-Agent 2.0: Spatial Reasoning with a General Coding Agent'
  url: https://arxiv.org/abs/2610.28354
  date: '2026.10'
  section: '2.5'
  type: paper
  scope: adjacent
  tldr:
    en: Equips general coding agents with frozen perception tools, editable scene memory, and geometry-grounded readouts so
      they can inspect and correct evidence before answering spatial questions.
    zh: 为通用编码 Agent 配备冻结感知工具、可编辑场景记忆和几何依据明确的读数，使其在回答空间问题前检查并修正证据。
    ja: 汎用コーディングエージェントに固定の知覚ツール、編集可能な場面記憶、幾何学的根拠を持つ測定値を与え、空間質問に答える前に証拠を検査・修正させる。
  sources:
  - https://arxiv.org/abs/2610.28354
  - https://github.com/Ropedia/S-Agent-2.0
  - https://ropedia.github.io/S-Agent-2.0
  verification:
    en: Five offline multi-view/video reasoning benchmarks · tools/no-tools and interface ablations · harness transfer · coordinate-frame
      and viewpoint-grounding failures; not robot-execution evaluation.
    zh: 五项离线多视图／视频推理基准 · 有无工具与接口消融 · Harness 迁移 · 坐标系和假想视点理解失败；不属于机器人执行评测。
  tags:
  - Method
  - System
  - Inference
  - Verification
- id: res:gen4p
  title: Gen4P
  url: https://arxiv.org/abs/2610.22371
  date: null
  section: '2.5'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Adapts a video generator with single-pass encoding and on-demand decoding, optionally reusing a frozen depth adapter;
      supplies scene measurements rather than an autonomous action loop. Installation and usage remain work in progress.
    zh: 将视频生成器适配为单次编码、按需解码的感知工具，可复用冻结深度适配器；提供场景测量，而非自主行动闭环。安装与使用接口仍在开发中。
    ja: 動画生成器を、一度の符号化と必要時の復号を行う知覚ツールへ適応させ、固定の深度アダプタも再利用できる。場面測定を提供するが、自律行動ループではない。導入・利用インターフェースは開発中。
  sources:
  - https://arxiv.org/abs/2610.22371
  - https://gen4p.github.io/
  - https://github.com/yitongx/Gen4P
- id: res:mjev-spatial
  title: MJev-Spatial
  url: https://arxiv.org/abs/2610.22276
  date: null
  section: '2.5'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Uses native attention matching instead of answer-token generation; each decision is one pass, while scalar/point refinement
      can require multiple stages. A perception component evaluated offline, not evidence of robot execution.
    zh: 用原生注意力匹配代替答案 Token 生成；每次决策单次前向，标量／点位细化可能需多阶段。属于离线评测的感知组件，不是机器人执行证据。
    ja: 回答トークンの生成をネイティブな注意照合で置き換える。各判断は一度の順伝播で行い、スカラー・座標点の改善には複数段階を使う場合がある。オフライン評価の知覚部品であり、ロボット実行の証拠ではない。
  sources:
  - https://arxiv.org/abs/2610.22276
  - https://github.com/Fr0zenCrane/MJev-Spatial
  - https://huggingface.co/mindlab-research/MJev-Spatial-4B
- id: res:youtu-parsing-omni
  title: 'Youtu-Parsing-Omni: One Encoder, One Schema, All Modalities'
  url: https://arxiv.org/abs/2610.39301
  date: null
  section: '2.5'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Uses a shared encoder and OmniSchema to expose source-grounded content across ten parsing tasks, supporting agent
      perception and inspection; dense autoregressive decoding remains a throughput limitation.
    zh: 用共享编码器和 OmniSchema 在十类解析任务中提供可追溯到来源的内容，为 Agent 感知与检查提供接口；密集内容的自回归解码吞吐量仍受限。
    ja: 共有エンコーダと OmniSchema で十種類の解析タスクに出典へ遡れる内容を提供し、エージェントの知覚・検査を支援する。密な内容の自己回帰復号には処理速度の制約が残る。
  sources:
  - https://arxiv.org/abs/2610.39301
  - https://github.com/TencentCloudADP/youtu-parsing
  - https://huggingface.co/tencent/Youtu-Parsing-Omni
- id: '2611.05275'
  title: 'Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems'
  url: https://arxiv.org/abs/2611.05275
  date: '2026.11'
  section: '2.6'
  type: paper
  scope: adjacent
  tldr:
    en: Studies routing among heterogeneous models and robot policies under matched quality–cost comparisons; scene-conditioned
      selection saves policy time without editing the selected policies.
    zh: 在一致的质量—成本口径下研究异构模型和机器人策略路由；根据场景选择固定策略可减少策略推理耗时，不修改被选策略。
    ja: 統一した品質・費用の基準で異種モデルとロボット方策の選択を研究する。場面に応じた固定方策の選択で推論時間を減らせるが、選んだ方策自体は修正しない。
  sources:
  - https://arxiv.org/abs/2611.05275
  - https://github.com/InfRec-Cardinal/route-anything
  - https://huggingface.co/datasets/Lance1573/route-anything-data
  verification:
    en: Matched input sets and fallback rules · held-out RoboTwin tasks · cost and uncertainty intervals.
    zh: 统一输入集合及回退规则、留出 RoboTwin 任务、成本与不确定区间。
  tags:
  - Method
  - Inference
  - Verification
- id: '2610.19677'
  title: 'ACRO: Actor–Critic Rollout Orchestration'
  url: https://arxiv.org/abs/2610.19677
  date: '2026.10'
  section: '2.6'
  type: paper
  scope: adjacent
  tldr:
    en: Wraps a frozen VLA with a learned critic and trajectory-retraction actor that physically returns the robot to a promising
      visited state before resuming from a fresh observation, rather than rewriting control code.
    zh: 为冻结 VLA 增加学习得到的 Critic 与轨迹回退 Actor，让机器人实际返回更有希望的已访问状态，再从新观测继续执行，而非重写控制代码。
    ja: 凍結 VLA に学習した批評器と軌跡を戻す Actor を加え、ロボットを実際に有望な既訪問状態へ戻して、新しい観測から続行する。制御コードの書き直しではない。
  sources:
  - https://arxiv.org/abs/2610.19677
  verification:
    en: SimplerEnv/RoboCasa and real-robot success · intervention and return-motion costs · matched physical-step budgets
      · recovery ablations; physical-step budgets are not wall-clock budgets.
    zh: SimplerEnv／RoboCasa 与实机成功率 · 干预及回退运动成本 · 相同物理步数预算 · 恢复消融；物理步数预算不同于墙钟时间预算。
  tags:
  - Method
  - Training
  - Inference
  - Verification
- id: '2509.19571'
  title: 'Agentic Scene Policies: Unifying Space, Semantics, and Affordances for Robot Action'
  url: https://arxiv.org/abs/2509.19571
  date: '2025.09'
  section: '2.6'
  type: paper
  scope: adjacent
  tldr:
    en: Composes scene grounding, spatial queries, and vision-based affordance tools with existing motion-planning skills,
      refreshing object maps and retrying tool actions after failures.
    zh: 将场景接地、空间查询和视觉可供性工具与既有运动规划技能组合，失败后刷新对象地图并重试工具动作。
    ja: 場面の接地、空間質問、視覚的アフォーダンスのツールを既存の運動計画スキルと組み合わせ、失敗後に物体地図を更新してツール操作を再試行する。
  sources:
  - https://arxiv.org/abs/2509.19571
  - https://github.com/montrealrobotics/agentic-scene-policies
  - https://montrealrobotics.ca/agentic-scene-policies.github.io/
  verification:
    en: Zero-shot real-robot manipulation · affordance ablations · mobile spatial queries · perception failures and latency.
    zh: 真实机器人零样本操作 · 可供性消融 · 移动空间查询 · 感知失败与延迟。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: res:alpajudge
  title: AlpaJudge
  url: https://huggingface.co/nvidia/alpajudge
  date: null
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Provides separate reference-based and visual reference-free checkpoints for data selection and reasoning rewards;
      rationale quality complements trajectory and collision metrics rather than certifying driving behavior.
    zh: 提供依赖参考答案与视觉无参考两类权重，可用于数据筛选和推理奖励；理由质量应与轨迹及碰撞指标联合报告，不等同于驾驶行为验证。
    ja: 参考回答を使うモデルと、視覚情報に基づく参考なしモデルの重みを提供し、データ選別や推論報酬に使える。理由の品質は軌跡・衝突指標と併記すべきであり、運転動作の検証とは同一でない。
  sources:
  - https://huggingface.co/nvidia/alpajudge
  - https://github.com/NVlabs/alpajudge
- id: res:alpamayo-2-edge
  title: Alpamayo 2 Edge
  url: https://huggingface.co/nvidia/Alpamayo2-Edge
  date: null
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Combines a VLM backbone with a diffusion action expert; released weights and inference code support trajectory generation
      and simulation evaluation. Deployment latency and partner vehicle demonstrations have separate evidence from simulation
      scores.
    zh: 组合VLM骨干与扩散动作专家，公开权重和推理代码可用于轨迹生成及仿真评测；部署时延、合作方实车示范与仿真成绩分别理解。
    ja: VLM の主幹と拡散型行動エキスパートを結び、公開重みと推論コードで軌跡生成・シミュレーション評価を行える。配備時の遅延、協力先の実車デモ、仮想環境の成績は別々に解釈する。
  sources:
  - https://huggingface.co/nvidia/Alpamayo2-Edge
  - https://github.com/NVlabs/alpamayo2-edge
- id: res:bridgewam
  title: BridgeWAM
  url: https://arxiv.org/abs/2610.14746
  date: null
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Compresses video-expert features into latent bridge queries for a lightweight action expert; the default inference
      path skips future-video generation. Evaluated in simulation and real manipulation, as a reusable model capability rather
      than LLM-led code repair.
    zh: 用潜在桥接查询压缩视频专家特征，供轻量动作专家读取；默认推理不生成未来视频。在仿真和真实操控中评测，提供可复用模型能力，而非 LLM 主导的代码修复。
    ja: 潜在ブリッジクエリで動画エキスパートの特徴を圧縮し、軽量な行動エキスパートへ渡す。通常推論では未来動画を生成しない。仮想・実機操作で評価されたモデル能力であり、LLM 主導のコード修復ではない。
  sources:
  - https://arxiv.org/abs/2610.14746
  - https://github.com/jxfang04/BridgeWAM-code
  - https://huggingface.co/BridgeWAM/bridgewam
- id: res:gemini-robotics-2-5
  title: Gemini Robotics 2.5
  url: https://deepmind.google/blog/gemini-robotics-2-5-accelerates-real-world-physical-intelligence/
  date: null
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Google reports ER/action-model coordination in an Apollo 2 factory pilot and Argon-assisted simulation/data development.
      Access is rolling out to partners; vendor hardware results and development claims are distinct from open, independently
      reproduced evaluations.
    zh: Google报告ER／动作模型在Apollo 2工厂试点中的分工，以及Argon辅助仿真和数据开发；目前向合作伙伴开放，官方实机结果及研发描述区别于公开可复现评测。
    ja: Google は Apollo 2 の工場試験での ER・行動モデルの役割と、Argon を使うシミュレーション・データ開発を報告している。利用は協力先向けで、公式の実機結果と開発説明は公開再現可能な評価と区別する。
  sources:
  - https://deepmind.google/blog/gemini-robotics-2-5-accelerates-real-world-physical-intelligence/
- id: res:pi-api-beta
  title: Pi API beta
  url: https://www.pi.website/blog/api-beta
  date: null
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Lets developers adapt and deploy action models, then use real-robot failures to choose the next data collection round;
      this is a developer-led workflow with beta access, not an autonomous LLM repair claim.
    zh: 开发者适配并部署动作模型，再根据真实机器人失败决定下一轮数据采集；属于需申请 beta 的开发者主导工作流，不代表 LLM 自主修复。
    ja: 開発者が行動モデルを適応・配備し、実ロボットの失敗から次のデータ収集を決める。申請制ベータの開発者主導手順であり、LLM の自律修復を意味しない。
  sources:
  - https://www.pi.website/blog/api-beta
- id: res:vla-corrector
  title: 'VLA-Corrector: Lightweight Detect-and-Correct Inference for Adaptive Action Horizon'
  url: https://arxiv.org/abs/2607.01804
  date: null
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: A reusable ~40M external corrector for action-chunked VLAs; evaluated in simulation and on AgileX PiPER. Code is available;
      trained corrector weights and demonstration data are not included.
    zh: 面向分块动作 VLA 的约 40M 外部纠错器，已在仿真和 AgileX PiPER 上评测；提供代码，未包含训练后的纠错器权重与演示数据。
    ja: 行動をチャンク単位で出す VLA 向けの約 40M パラメータの外部訂正器。シミュレーションと AgileX PiPER で評価され、コードを提供するが、訓練済み訂正器の重みと実演データは含まれない。
  sources:
  - https://arxiv.org/abs/2607.01804
  - https://github.com/ZJU-OmniAI/vla-corrector
- id: '2611.12177'
  title: Embodied First Exam
  url: https://arxiv.org/abs/2611.12177
  date: '2026.11'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests general-purpose agents across robot embodiments while varying observation access, reset budgets and execution
      timing.
    zh: 跨机器人形态检验通用 Agent 的具身任务能力，明确比较观测权限、重置预算和执行时钟不同的运行方式。
    ja: 異なるロボット形態で汎用エージェントの具身タスク能力を調べ、観測権限、リセット予算、実行時計が異なる方式を明示的に比較する。
  sources:
  - https://arxiv.org/abs/2611.12177
  - https://arxiv.org/html/2611.12177
  verification:
    en: Hidden predicates and scene source remain outside Standard agents. Most suites still signal completion; removing that
      signal is a separate ablation. Results mix agent strategies and information regimes, so visual feedback does not establish
      code repair for every run.
    zh: Standard 不向 Agent 开放隐藏判定逻辑和场景源码，但大多数套件仍返回完成信号；去掉成功信号是单独消融。不同策略和信息权限须分开读，视觉反馈并不说明每条轨迹都发生代码修订。
- id: '2611.08209'
  title: 'RoboARCade: Benchmarking Agentic Robot Control'
  url: https://arxiv.org/abs/2611.08209
  date: '2026.11'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Benchmarks visual robot-control agents on randomized long-horizon MuJoCo tasks, separating interface effects, in-context
      demonstrations and cross-trial text-harness optimization.
    zh: 在随机化长程 MuJoCo 任务上评测视觉机器人控制 Agent，分别比较接口、上下文示范和跨尝试文本工作流优化。
    ja: ランダム化した長期 MuJoCo タスクで視覚ロボット制御エージェントを評価し、インターフェース、文脈内実演、試行をまたぐ文章手順の最適化を別々に比較する。
  sources:
  - https://arxiv.org/abs/2611.08209
  - http://roboarcade.org
  verification:
    en: 22 tasks, three embodiments · hidden task predicates · control cost and false-success analysis · five-task adaptation
      study; simulated control and harness updates, not construction-code repair.
    zh: 22 任务、三种机器人形态、隐藏任务判据、控制成本与误报成功分析，以及五任务适应实验；属于仿真控制和工作流更新。
  tags:
  - Benchmark
  - Inference
  - Verification
- id: '2611.02497'
  title: 'RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild'
  url: https://arxiv.org/abs/2611.02497
  date: '2026.11'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Compares frozen agents and VLA policies through matched, blinded real-robot trials across sites, with a separate adaptation
      track and explicit embodiment-dependent ranking analysis.
    zh: 通过跨站点、条件匹配的盲测实机试验比较冻结 Agent 与 VLA，并另设适配赛道分析不同机器人上的排名变化。
    ja: 拠点をまたぐ条件をそろえた実機の盲検試験で固定エージェントと VLA を比較し、別の適応トラックでロボットごとの順位変化を分析する。
  sources:
  - https://arxiv.org/abs/2611.02497
  - https://github.com/RoboColosseum
  - https://robocolosseum.ai/
  verification:
    en: Matched local trials · human success assessment · cross-site/rank uncertainty · adaptation tracked separately.
    zh: 本地匹配试验、人工成功判定、跨站点与排名不确定性、单列任务适配。
  tags:
  - Benchmark
  - Verification
- id: '2610.00854'
  title: Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena
  url: https://arxiv.org/abs/2610.00854
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Compares frontier VLM robot agents under shared budgets and source-task interfaces.
    zh: 在统一预算与源任务接口下比较前沿 VLM Agent 的机器人通用性，并区分修复程序运行与完成物理任务。
    ja: 統一予算と元タスクのインターフェースで先端 VLM エージェントのロボット汎用性を比較し、プログラムを動かす修復と物理タスクの達成を区別する。
  sources:
  - https://arxiv.org/abs/2610.00854
  - https://embodied-agent-arena.github.io/embodied-agent-arena/
  verification:
    en: Repairing a program so that it runs and completing the physical task are evaluated separately.
    zh: 将程序修复至可运行与完成物理任务分开评估。
- id: '2610.07594'
  title: 'BiGym 2.0: Benchmarking Learned and Agent-Developed Policies for Humanoid Household Manipulation'
  url: https://arxiv.org/abs/2610.07594
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Compares learned and agent-developed humanoid policies under matched onboard observations and whole-body controllers.
    zh: 在一致的机载观测和全身控制器下比较人形机器人学习策略与 Agent 开发的程序，并发布仿真中的人类 VR 示范。
    ja: 同じ機上観測と全身制御器の下で、人型ロボットの学習方策とエージェント作成プログラムを比較し、仮想環境での人間の VR 実演を公開する。
  sources:
  - https://arxiv.org/abs/2610.07594
  - https://github.com/swirl-uk/BiGym2
  verification:
    en: Released VR demonstrations come from simulation; paired observation interfaces matter when comparing policy families.
    zh: 本论文评测在仿真中进行；人类 VR 示范是仿真数据，不能列作真实机器人轨迹。
- id: '2610.27039'
  title: 'Embodied Playground: A Long-Horizon Agentic Robotics Benchmark for Physical, Strategic, and Spatial Reasoning'
  url: https://arxiv.org/abs/2610.27039
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests coordination of physical, strategic and spatial reasoning in long-horizon robot tasks.
    zh: 以长时序机器人任务评测 Agent 如何协调物理、空间和策略推理，并在执行反馈下保持任务进度。
    ja: 長期ロボットタスクで、エージェントが物理・空間・方策の推論を連携させ、実行フィードバックの下で進捗を維持する能力を評価する。
  sources:
  - https://arxiv.org/abs/2610.27039
  - https://winniechen2002.github.io/Agent-bench-website/
  verification:
    en: Task progress and execution feedback are central; environment presence does not make this a simulator-quality benchmark.
    zh: 重点是任务进展与执行反馈；使用仿真环境不代表评测对象是模拟器质量。
- id: '2610.16238'
  title: 'Embodied Skill Bench: Benchmarking How Well Agents with Embodied Skills Perform on Physical Tasks'
  url: https://arxiv.org/abs/2610.16238
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Compares native control, skill-only execution and agent selection or modification of embodied skills.
    zh: 在原生控制、仅用技能和 Agent 自主选择或修改技能三种条件下，评测具身 Skills 对物理任务的实际帮助。
    ja: ネイティブ制御、スキルのみ、エージェントによるスキルの選択・修正という三条件で、具身スキルが物理タスクに実際に役立つかを評価する。
  sources:
  - https://arxiv.org/abs/2610.16238
  - https://github.com/HanZhi306/EmbodiedSkill-Bench
  verification:
    en: Skill packages may contain code, instructions or action-model calls; hidden scoring signals are not necessarily agent
      inputs.
    zh: 统一观察与动作接口返回执行信息供 Agent 继续判断；评测器另记录任务成功、有效动作、token 和耗时，不能把所有评分信息当成 Agent 输入。
- id: '2610.30051'
  title: 'From Reasoning to Action: Benchmarking Frontier AI Models on LIBERO-10 Robot Manipulation Tasks'
  url: https://arxiv.org/abs/2610.30051
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Compares frontier models on LIBERO-10 using a shared interaction loop and control interface.
    zh: 在统一闭环与控制接口下比较前沿模型执行 LIBERO-10 操作任务的表现，避免把模型更换与接口更换混为一谈。
    ja: 統一した閉ループと制御インターフェースで先端モデルの LIBERO-10 操作を比較し、モデル変更とインターフェース変更の影響を分離する。
  sources:
  - https://arxiv.org/abs/2610.30051
  - https://github.com/IRVLUTD/LLM_LIBERO
  - https://irvlutd.github.io/LLM-LIBERO/
  verification:
    en: A controlled interface helps distinguish model differences from changes to the robot harness.
    zh: 受控接口有助于区分模型差异与机器人 Harness 变化的影响。
- id: '2610.22471'
  title: Has GPT-6-Astra Achieved Embodied Intelligence?
  url: https://arxiv.org/abs/2610.22471
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Studies demonstration-informed direct control and VLA-action review across twelve embodied benchmarks, separating
      gains from extended interaction budgets from zero-shot trials on eight real robot configurations.
    zh: 在十二项具身基准上研究示范辅助的直接控制与 VLA 动作审查，将扩大交互预算的收益与八种真实机器人配置上的零样本试验分别评估。
    ja: 十二の具身ベンチマークで実演を使う直接制御と VLA 行動レビューを研究する。操作予算を増やす効果と、八つの実機構成でのゼロショット試験を別々に評価する。
  sources:
  - https://arxiv.org/abs/2610.22471
  - https://sensenova.ai/has-gpt-6-astra-achieved-embodied-intelligence
  verification:
    en: Standard versus up-to-10× step budgets · frozen in-context knowledge · action-interface and token-cost ablations ·
      human context/safety supervision · hardware contact, latency, and recovery limits.
    zh: 标准与最高十倍步数预算 · 冻结的上下文知识 · 动作接口与 token 成本消融 · 人类上下文／安全监督 · 实机接触、延迟与恢复限制。
  tags:
  - Benchmark
  - Inference
  - Environment
  - Verification
  - Trajectory Analysis
- id: '2610.34527'
  title: 'LLM4Robot-Bench: How Far Can GPT-6 Astra Go in Robotic Manipulation? A Hierarchical, Paired Sim-Real Benchmark'
  url: https://arxiv.org/abs/2610.34527
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Originally released as PhysLadder, this benchmark tests GPT-6 Astra on geometric alignment, force regulation and contact
      reconfiguration in matched simulated and real dual-arm tasks.
    zh: 在配对的仿真与真实双臂任务中，测量 GPT-6 Astra 在几何对齐、力调节和接触重配置中的表现，基准原名 PhysLadder。
    ja: 対応する仮想・実機の双腕タスクで、GPT-6 Astra の幾何整合、力調節、接触の組み替えを測る。ベンチマークの旧名は PhysLadder。
  sources:
  - https://arxiv.org/abs/2610.34527
  - https://github.com/LLM4Robot/LLM4Robot-Bench
  - https://llm4robot.github.io/bench/
  verification:
    en: 16 tasks · three trials per task/environment · shared outcome criteria · physical/visual matching and failure analysis;
      single-model evidence, with different real/sim execution budgets.
    zh: 16 项任务 · 每项每环境三次试验 · 共享结果标准 · 物理／视觉匹配与失败分析；仅单一模型，实机和仿真的执行预算不同。
  tags:
  - Benchmark
  - Environment
  - Verification
- id: '2610.34649'
  title: 'RobotAgentBench: Towards Open-world Robot Autonomy'
  url: https://arxiv.org/abs/2610.34649
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks household robot autonomy with code-based, learned and hybrid executors, including visual-feedback-driven
      program execution and reusable control-tool refinement in its coding-agent configurations.
    zh: 通过任务发现、情境推理、物理执行与恢复环节评估开放世界机器人 Agent，而不仅测试给定目标的动作成功率。
    ja: 与えられた目標の達成率だけでなく、タスク発見、状況推論、物理実行、回復を通じてオープンワールドのロボットエージェントを評価する。
  sources:
  - https://arxiv.org/abs/2610.34649
  - https://aetherlabsai.github.io/RobotAgentBench/
  - https://github.com/AetherLabsAI/RobotAgentBench
  - https://huggingface.co/datasets/AetherLabs-AI/RobotAgentBench-assets
  verification:
    en: 50 simulated layouts · five task-level capabilities and four open-ended scenarios · matched sim/real subset · harness
      ablations; coding-agent and standalone-policy tracks are evaluated separately, with human-assisted scene calibration.
    zh: 50个仿真布局 · 五类任务能力与四种开放场景 · 配对仿真／实机子集 · Harness消融；代码Agent与独立策略分别评估，场景校准有人参与。
  tags:
  - Benchmark
  - Method
  - Environment
  - Inference
  - Verification
- id: '2610.10409'
  title: 'RobotWorld: Benchmarking Multimodal Agents for Robot Use Across Diverse Tasks and Embodiments'
  url: https://arxiv.org/abs/2610.10409
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates image- and state-grounded robot tool use across 84 simulated tasks and diverse embodiments, separating auxiliary
      computation from optional environment-side control code.
    zh: 在 84 项仿真任务和多种本体上评测图像、状态驱动的机器人工具使用，区分辅助计算与可选的环境侧控制代码。
    ja: 84 の仮想タスクと複数の身体構成で、画像・状態に基づくロボットのツール使用を評価し、補助計算と任意の環境側制御コードを区別する。
  sources:
  - https://arxiv.org/abs/2610.10409
  - https://github.com/robotworldai/robotworld
  - https://robotworldai.github.io/
  verification:
    en: Hidden-checker task success · action/non-action budgets · perception/control failures · cross-embodiment coverage.
    zh: 隐藏验收任务成功率 · 行动／非行动预算 · 感知／控制失败 · 跨本体覆盖。
  tags:
  - Benchmark
  - Environment
  - Verification
  - Trajectory Analysis
- id: '2610.25287'
  title: The Bitter Lesson Comes to Robotics
  url: https://arxiv.org/abs/2610.25287
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Studies general multimodal models operating physical robot arms through control interfaces.
    zh: 在物理机械臂上比较通用多模态模型通过控制接口执行任务的能力，观察模型、工具与执行设置对结果的影响。
    ja: 実際のロボットアームで汎用マルチモーダルモデルの制御インターフェースを介したタスク実行を比較し、モデル、ツール、実行設定の影響を調べる。
  sources:
  - https://arxiv.org/abs/2610.25287
  verification:
    en: Compares nine models in 15 configurations on six real bimanual RoboDojo tasks, with 20 trials per task and a 40-action
      budget. Camera-video grading records the highest cumulative subtask progress reached, even if later undone; time and
      API cost include unsuccessful attempts. Partial-progress scores therefore differ from retained final-state success,
      and complete tasks remain difficult within the budget.
    zh: 在六项真实双臂 RoboDojo 任务上比较九个模型、15 种配置，每任务 20 次试验、每次最多 40 个动作。相机视频评分记录曾达到的最高累积子任务进展，即使后续被撤销也计入；耗时和 API 成本包含失败尝试。因此部分进展分不同于最终状态保持成功，预算内完整完成任务仍较困难。
- id: '2609.33807'
  title: 'CodeActionBench: Evaluating Agentic Code-as-Policy for Embodied Manipulation'
  url: https://arxiv.org/abs/2609.33807
  date: '2026.09'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: core
  tldr:
    en: Agents execute Python manipulation programs in RoboTwin 2.0 simulation and use camera views, robot state, and contact
      feedback to revise their policies. A hidden verifier checks the final state independently of the agent’s completion
      claim.
    zh: 在 RoboTwin 2.0 双臂仿真中，Agent 执行 Python 操控程序，根据相机画面、机器人状态和接触反馈修订策略。隐藏验收器独立核对最终状态和 Agent 的完成声明。
    ja: RoboTwin 2.0 の双腕シミュレーションで Python 操作プログラムを実行し、画像、ロボット状態、接触情報から方策を修正する。非公開の検収器が最終状態と完了宣言を独立に検査する。
  sources:
  - https://arxiv.org/abs/2609.33807
  - https://codeactionbench.org/
  - https://github.com/lyhkk/CodeActionBench
  verification:
    en: 25 fixed simulated tasks · hidden outcome checks · spatial progress and failure stage · completion-claim accuracy
      · tool-call and simulated-time budgets.
    zh: 25 个固定仿真任务 · 隐藏状态验收 · 空间进展与失败阶段 · 完成声明正确性 · 调用与仿真时间预算。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
  - Trajectory Analysis
- id: '2609.01404'
  title: 'Evaluating Multimodal LLMs as Generalist Vision-Language-Action Agents for Drone Control: Commanding, Approaching,
    Tracking and Searching'
  url: https://arxiv.org/abs/2609.01404
  date: '2026.09'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates image-conditioned drone actions and commander–sub-agent coordination across simulators and real Tello flights,
      exposing latency and arrival-declaration failures.
    zh: 在仿真器与真实 Tello 飞行中评测图像条件动作及指挥员—子 Agent 协作，分析延迟与到达声明失误。
    ja: シミュレータと実際の Tello 飛行で、画像条件付き行動と指揮役・下位エージェントの協調を評価し、遅延と到達宣言の誤りを分析する。
  sources:
  - https://arxiv.org/abs/2609.01404
  - https://github.com/naver-ai/DroneCATS
  - https://huggingface.co/datasets/naver-ai/DroneCATS-Pilot-54K
  verification:
    en: Ten-model simulated benchmark · 100 single-drone and 18 two-drone real episodes · small per-cell samples; 54K RGB-D-derived
      supervision is not real-flight trajectory data.
    zh: 十模型仿真评测、100次单机与18次双机实飞；每组样本较少，54K来自RGB-D的监督数据不等于真实飞行轨迹。
  tags:
  - Benchmark
  - Training
  - Inference
  - Verification
- id: '2609.39507'
  title: 'LIBERO-Agent: Evaluating General-Purpose Agents for Direct Embodied Manipulation'
  url: https://arxiv.org/abs/2609.39507
  date: '2026.09'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Turns LIBERO into an interactive setting where general agents inspect observations, use their own tools and issue
      native actions.
    zh: 把 LIBERO 改造成通用 Agent 可主动检查观测、使用自己的工具并发出原生动作的交互测试环境。
    ja: LIBERO を、汎用エージェントが能動的に観測を調べ、自分のツールを使い、ネイティブ行動を発行できる対話的なテスト環境へ変える。
  sources:
  - https://arxiv.org/abs/2609.39507
  verification:
    en: The 30-task primary simulation suite separates perception, short-horizon manipulation and long-horizon composition
      within a 200-task framework. Primary runs use full observations, no demonstrations and a 1,800-second wall-clock limit;
      agents compose bounded native action sequences while a separate evaluator retains private task checkers. Performance
      drops on harder and longer tasks, so easy-task success does not establish broad manipulation reliability.
    zh: 在整合 200 项任务的框架中，30 项主要仿真任务区分感知、短程操作与长程组合。主实验提供完整观测、不提供示范，并设置 1,800 秒墙钟时限；Agent 组合有界原生动作序列，独立评测器保留私有任务判定。困难与长程任务表现下降，容易任务上的成功不代表广泛的操作可靠性。
- id: '2609.40325'
  title: 'WorldAuditBench: Interactive 3D World Auditing with Multimodal Agents'
  url: https://arxiv.org/abs/2609.40325
  date: '2026.09'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Measures an agent’s ability to explore interactive worlds and substantiate anomalies with evidence.
    zh: 衡量 Agent 主动探索交互世界、发现异常并提供证据的能力，覆盖物理、空间、时间与语义问题。
    ja: 対話世界を能動的に探索して異常を見つけ、証拠を示す能力を測る。物理、空間、時間、意味の問題を扱う。
  sources:
  - https://arxiv.org/abs/2609.40325
  - https://arxiv.org/html/2609.40325
  - https://ucsb-nlp-chang.github.io/WorldAuditBench/
  verification:
    en: Anomaly identification · exploration budget · evidence gathering · action–reasoning coupling.
    zh: 异常识别 · 探索预算 · 证据获取 · 动作与推理耦合。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: '2607.04434'
  title: 'RoboDojo: A Unified Sim-and-Real Benchmark for Comprehensive Evaluation of Generalist Robot Manipulation Policies'
  url: https://arxiv.org/abs/2607.04434
  date: '2026.07'
  section: '3.1'
  sub: capability-eval
  type: resource
  scope: resource
  tldr:
    en: Offers paired simulation and real-robot protocols for manipulation across tasks and environments.
    zh: 提供统一仿真与实机操作评测协议，已被 CaPtain 等编程 Agent 研究用于检验跨任务和跨环境表现。
    ja: 統一した仮想・実機操作の評価手順を提供し、CaPtain などのコーディングエージェント研究でタスク・環境をまたぐ性能の検査に使われている。
  sources:
  - https://arxiv.org/abs/2607.04434
  - http://robodojo-benchmark.com/
  - https://github.com/RoboDojo-Benchmark/RoboDojo
  - https://robodojo-benchmark.com/
  - https://robodojo-benchmark.com/leaderboard
  verification:
    en: Used to evaluate transfer of code-policy agents; simulation scores and hardware success remain separate measures.
    zh: 用于评估代码策略 Agent 的迁移表现；仿真分数与真实硬件成功率仍是不同指标。
- id: '2604.25788'
  title: 'KinDER: A Physical Reasoning Benchmark for Robot Learning and Planning'
  url: https://arxiv.org/abs/2604.25788
  date: '2026.04'
  section: '3.1'
  sub: capability-eval
  type: resource
  scope: resource
  tldr:
    en: Provides resettable physical-reasoning tasks, parameterized skills and an evaluation interface for planning and learning.
    zh: 提供可重置的物理推理任务、参数化技能与统一评测接口，已被通用 Coding Agent 求解任务—运动规划的研究直接使用。
    ja: リセット可能な物理推論タスク、パラメトリックなスキル、統一評価インターフェースを提供し、汎用コーディングエージェントによるタスク・運動計画の研究で直接利用されている。
  sources:
  - https://arxiv.org/abs/2604.25788
  - https://prpl-group.com/kinder-site/
  verification:
    en: A supporting benchmark used by coding-agent task-and-motion planning studies, not itself a new agent.
    zh: 为 Coding Agent 的任务与运动规划研究提供评测支持，基准本身不是新的 Agent。
- id: '2603.22435'
  title: 'CaP-X: A Framework for Benchmarking and Improving Coding Agents for Robot Manipulation'
  url: https://arxiv.org/abs/2603.22435
  date: '2026.03'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks and improves agents that write manipulation code, execute it, observe outcomes, and repair failed behaviors.
    zh: 评测并改进编写操作代码、执行、观察结果和修复失败行为的 Agent。
    ja: 操作コードを作成・実行し、結果を観察して失敗した動作を修復するエージェントを評価・改善する。
  sources:
  - https://arxiv.org/abs/2603.22435
  verification:
    en: Compilation success · dense task reward · task success · privileged-vs-RGB-D robustness.
    zh: 编译成功 · 稠密任务奖励 · 任务成功率 · 特权感知与 RGB-D 鲁棒性。
  tags:
  - Method
  - Benchmark
  - Data Curation
  - Inference
  - Environment
  - Verification
- id: '2601.19510'
  title: 'ALRM: Agentic LLM for Robotic Manipulation'
  url: https://arxiv.org/abs/2601.19510
  date: '2026.01'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Compares control-code generation with stepwise tool use within a shared ReAct manipulation framework.
    zh: 在同一 ReAct 框架下比较生成控制代码与逐步调用工具两种机器人执行模式，并提供语言多样化操作任务。
    ja: 同じ ReAct 枠組みで制御コード生成と段階的なツール呼び出しを比較し、多様な言語表現の操作タスクを提供する。
  sources:
  - https://arxiv.org/abs/2601.19510
  verification:
    en: Language-varied tasks compare execution interfaces; do not attribute interface changes solely to the model.
    zh: 在语言表述变化的任务中比较执行接口；接口变化带来的影响不能完全归因于模型。
- id: '2601.20334'
  title: Demonstration-Free Robotic Control via LLM Agents
  url: https://arxiv.org/abs/2601.20334
  date: '2026.01'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Connects a software-engineering agent framework directly to robot control without demonstrations.
    zh: 将原用于软件工程的 Agent 框架直接接入机器人控制，在可读取特权环境状态的设置中评估免示范任务执行。
    ja: ソフトウェア工学向けのエージェント枠組みをロボット制御へ直接つなぎ、特権的な環境状態を読める設定で実演なしの実行を評価する。
  sources:
  - https://arxiv.org/abs/2601.20334
  - https://github.com/robiemusketeer/faea-sim
  verification:
    en: The evaluated configuration can access privileged environment state; it is not a sensor-only deployment result.
    zh: 主要实验向 Agent 开放特权环境状态；不能直接与仅 RGB/RGB-D 的接口比较。
- id: '2402.14623'
  title: 'RoboScript: Code Generation for Free-Form Manipulation Tasks across Real and Simulation'
  url: https://arxiv.org/abs/2402.14623
  date: '2024.02'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Connects free-form robot code generation to ROS, perception and motion tools across simulation and real hardware.
    zh: 把机器人代码生成接入 ROS、感知与运动工具，并以仿真和实机任务检验程序的可执行性与部署差距。
    ja: ロボットのコード生成を ROS、知覚、運動ツールへ接続し、仮想・実機タスクで実行可能性と配備時の差を調べる。
  sources:
  - https://arxiv.org/abs/2402.14623
  verification:
    en: Simulation execution and real-robot deployment expose different sources of failure.
    zh: 多视角 RGB-D 经工具转成三维对象信息，并更新规划场景；生成程序读取这些几何参数组织动作。执行验证与在线模型修订是需要分别判断的环节。
- id: '2311.11183'
  title: Deploying and Evaluating LLMs to Program Service Mobile Robots
  url: https://arxiv.org/abs/2311.11183
  date: '2023.11'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: CodeBotler generates service-robot programs in a Python-embedded language; RoboEval tests action order, conditions
      and task execution.
    zh: 提出 CodeBotler 与 RoboEval，用 Python 嵌入式领域语言生成服务机器人程序，并评测动作顺序、条件逻辑和任务执行。
    ja: CodeBotler と RoboEval を提案し、Python 内の専用言語でサービスロボットのプログラムを生成して、動作順序、条件分岐、タスク実行を評価する。
  sources:
  - https://arxiv.org/abs/2311.11183
  - https://amrl.cs.utexas.edu/codebotler/
  verification:
    en: Program validity and successful physical execution are separate outcomes.
    zh: 程序有效性与真实物理执行成功是不同的结果。
- id: '2306.03310'
  title: 'LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning'
  url: https://arxiv.org/abs/2306.03310
  date: '2023.06'
  section: '3.1'
  sub: capability-eval
  type: resource
  scope: resource
  tldr:
    en: Provides resettable manipulation tasks, demonstrations and shared interfaces for studying lifelong transfer.
    zh: 提供可重置的长期机器人学习任务、统一接口与示范，是 Code-as-Policy Agent 与后训练研究常用的执行和评测底座。
    ja: リセット可能な長期ロボット学習タスク、統一インターフェース、実演を提供し、Code-as-Policy エージェントや事後学習研究の実行・評価基盤として使われる。
  sources:
  - https://arxiv.org/abs/2306.03310
  - https://libero-project.github.io
  verification:
    en: An execution and evaluation substrate used by code-policy agents; the benchmark itself is not a coding-agent method.
    zh: 为代码策略 Agent 提供执行与评估环境；基准本身不是一种 Coding Agent 方法。
- id: '2611.03585'
  title: 'Seeing Through the Illusion: Test-Time Scaling for World Action Models'
  url: https://arxiv.org/abs/2611.03585
  date: '2026.11'
  section: '3.1'
  sub: delegation
  type: paper
  scope: adjacent
  tldr:
    en: Selects frozen world–action model rollouts by combining action validity, inverse-dynamics agreement with imagined
      motion, and task progress, then executes the chosen action chunk and replans from fresh observations.
    zh: 组合动作有效性、想象运动的逆动力学一致性与任务进度，为冻结世界—动作模型选择候选轨迹，执行动作块后依据新观测重规划。
    ja: 行動の有効性、想像した運動の逆動力学的一貫性、タスク進捗を組み合わせて固定の世界・行動モデルの候補軌跡を選び、行動チャンク実行後に新しい観測で再計画する。
  sources:
  - https://arxiv.org/abs/2611.03585
  verification:
    en: 'RoboLab: 50 simulated episodes · LIBERO: 2,000 episodes per method · matched four-candidate comparisons · component
      and runtime analysis; small gains over the strongest matched-budget selectors.'
    zh: RoboLab：50仿真回合 · LIBERO：每方法2,000回合 · 同为四候选的比较 · 组件与运行耗时分析；相对同预算最强选择器的提升较小。
  tags:
  - Method
  - Inference
  - Verification
- id: system:the-harness-corl2026
  title: 'The Harness: One Agent Harness for Anything that Acts'
  url: https://web.eecs.umich.edu/~stellayu/publication/2026harnessCoRLL.html
  date: '2026.11'
  section: '3.1'
  sub: delegation
  type: paper
  scope: adjacent
  tldr:
    en: Combines agent-written programs, bounded VLA skills and reactive guards in a shared control hierarchy.
    zh: 把 Agent 编写的程序、有界 VLA 技能和快速反应守卫组合成共享控制层级。
    ja: エージェントが書くプログラム、範囲を限定した VLA スキル、高速な反応ガードを共通の階層制御へ組み合わせる。
  sources:
  - https://web.eecs.umich.edu/~stellayu/publication/2026harnessCoRLL.html
  - https://web.eecs.umich.edu/~stellayu/publication/doc/2026harnessCoRLL.pdf
  verification:
    en: RoboDojo simulation and component ablations; the short report supports event-driven orchestration, without establishing
      a full code-repair trajectory.
    zh: 验证来自 RoboDojo 仿真与组件消融；短报告支持事件驱动的编排机制，尚不足以建立完整代码修复轨迹。
- id: '2610.21453'
  title: 'CarryOn: A Dual-Loop Harness for Personalized and Reliable Robot Assistance'
  url: https://arxiv.org/abs/2610.21453
  date: '2026.10'
  section: '3.1'
  sub: delegation
  type: paper
  scope: adjacent
  tldr:
    en: Coordinates persistent user/scene memory, a frozen VLA, geometric shielding, and visual failure recovery, while offline
      reflection revises recovery strategies and parameters for later attempts.
    zh: 协调持久用户／场景记忆、冻结 VLA、几何安全过滤与视觉失败恢复，并通过离线反思修订恢复策略和参数，供后续尝试复用。
    ja: 持続する利用者・場面記憶、固定 VLA、幾何的な安全フィルタ、視覚的な失敗回復を連携させる。オフラインの振り返りで回復方策とパラメータを修正し、次の試行へ再利用する。
  sources:
  - https://arxiv.org/abs/2610.21453
  - https://github.com/JIA-Lab-research/CarryOn
  - https://vincent2311.github.io/Projects/CarryOn/
  verification:
    en: Preference-consistent planning · scene-memory correction · simulation and hardware safety/recovery tests · cumulative
      retry success, distinct from single-attempt success.
    zh: 偏好一致的规划 · 场景记忆纠正 · 仿真与实机安全／恢复测试 · 区分累计重试成功率与单次成功率。
  tags:
  - Method
  - System
  - Inference
  - Environment
  - Verification
- id: '2610.42053'
  title: 'REA: A Routed Embodied Agent Runtime for Asynchronous Brain-Cerebellum Control'
  url: https://arxiv.org/abs/2610.42053
  date: '2026.10'
  section: '3.1'
  sub: delegation
  type: paper
  scope: adjacent
  tldr:
    en: Separates fast robot execution from asynchronous model judging and route selection, coordinating fixed code policies
      and action models with visual outcome checks at policy-return boundaries.
    zh: 将快速机器人执行与异步模型判断、路径选择分离，在策略返回边界通过视觉结果检查协调固定代码策略和动作模型。
    ja: 高速なロボット実行と非同期のモデル判断・経路選択を分離し、方策から戻る境界で視覚的な結果を確認して固定コード方策と行動モデルを調整する。
  sources:
  - https://arxiv.org/abs/2610.42053
  - https://mikeeeeeeeeeeeeee.github.io/REA/
  verification:
    en: 3,000 LIBERO-PRO episodes · shared recovery budgets · simulation versus small hardware studies · fixed test-time code
      and routing.
    zh: 3,000 回合 LIBERO-PRO · 共享恢复预算 · 仿真与小规模实机分列 · 测试时代码及路由固定。
  tags:
  - Method
  - Inference
  - Verification
- id: '2609.29166'
  title: 'HarnessPAI: An Evolving Harness for Physical AI'
  url: https://arxiv.org/abs/2609.29166
  date: '2026.09'
  section: '3.1'
  sub: delegation
  type: paper
  scope: core
  tldr:
    en: Synthesizes programs over perception and motion primitives, then evolves them across rollouts and extracts reusable
      skills.
    zh: 以可执行代码组织底层动作原语，并依据交互反馈演化机器人程序，使稳定程序还能生成下游策略训练数据。
    ja: 実行可能なコードで下位の行動プリミティブをまとめ、相互作用のフィードバックでロボットプログラムを進化させる。安定したプログラムは下流方策の訓練データも生成できる。
  sources:
  - https://arxiv.org/abs/2609.29166
  - https://darwin-agent.github.io/HarnessPAI
  verification:
    en: A program is fixed within a rollout; feedback used inside that program differs from later LLM-driven program revision.
    zh: 同一次执行中，程序根据观察检查抓取或放置是否成立，再决定是否推进；执行结束后的轨迹与失败信息才用于下一轮改程序和整理技能。
- id: '2608.11246'
  title: Towards the Harness of Embodied Agents
  url: https://arxiv.org/abs/2608.11246
  date: '2026.08'
  section: '3.1'
  sub: delegation
  type: paper
  scope: adjacent
  tldr:
    en: Uses a persistent scene graph and semantically meaningful tool returns to organize robot abilities and task progress.
    zh: 用持久场景图和带成功、失败原因的执行返回值，将机器人能力组织为 Agent 可理解和调用的工具。
    ja: 持続的なシーングラフと、成功・失敗理由を含む実行結果で、ロボットの能力をエージェントが理解して呼び出せるツールにまとめる。
  sources:
  - https://arxiv.org/abs/2608.11246
  - https://eit-hai.github.io/thea
  verification:
    en: Skills and existing policies execute below the agent; feedback specifies success or the cause of failure.
    zh: 模型每轮读取最新观测、持久场景信息和带语义的执行结果，判断是否成功、失败原因以及下一步；上下文和记忆管理控制哪些历史继续保留。
- id: '2607.08448'
  title: 'Harness VLA: Steering Frozen VLAs into Reliable Manipulation Primitives via Memory-Guided Agents'
  url: https://arxiv.org/abs/2607.08448
  date: '2026.07'
  section: '3.1'
  sub: delegation
  type: paper
  scope: adjacent
  tldr:
    en: Lets a coding agent combine analytic motion primitives with calls to a frozen VLA, assigning language subgoals, budgets
      and stopping conditions.
    zh: 让 Coding Agent 编排冻结 VLA 与解析动作原语
    ja: コーディングエージェントに、固定 VLA と解析的な行動プリミティブを組み合わせさせる。
  sources:
  - https://arxiv.org/abs/2607.08448
  verification:
    en: After each call, images, depth, robot state and diagnostics inform whether to retry, change the scene or continue;
      VLA execution has its own observation loop.
    zh: 工具返回后，上层得到图像、深度、机器人状态与执行诊断，决定继续、调整物体或重新设置条件；VLA 内部也用自己的观测持续控制。
