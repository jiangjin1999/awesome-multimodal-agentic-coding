- id: '2610.40565'
  title: 'Gym-Anything for Robotics: Scaling physical simulations with digital agents'
  url: https://arxiv.org/abs/2610.40565
  date: '2026.10'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Coding agents construct physical simulators and revise them using independent audits.
    zh: 把仿真器本身作为 Coding Agent 任务，用独立物理审计反复修订场景、动力学和验证证据。
    ja: シミュレーター自体を Coding Agent のタスクとし、独立した物理監査によってシーン、力学、検証の証拠を繰り返し修正する。
