  scope: core
  tldr:
    en: Layered physical tests guide construction and repair of deformable assets.
    zh: 分层建立几何、物理模型和材料，再用受约束物理探测与机器人交互修订可变形资产。
    ja: 幾何、物理モデル、材料を階層的に構築し、制約付きの物理的な試行とロボットとの相互作用によって変形可能なアセットを修正する。
  sources:
  - https://arxiv.org/abs/2609.18620
  - https://arxiv.org/html/2609.18620v2
  - https://can-lee.github.io/DeformSmith_web/
  verification:
    en: Physical validity and stability · deformation/material plausibility · robot contact and force budgets · manipulation
      success · replay consistency.
    zh: 物理有效性与稳定性 · 形变／材料合理性 · 机器人接触与力预算 · 操作成功率 · 重放一致性。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: '2609.23103'
  title: 'DiagGen: Agentic Generation of Deformable Assets with Sim-based Diagnostics for Robotic Simulation'
  url: https://arxiv.org/abs/2609.23103
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Active manipulation probes route asset defects back to their generating stages.
    zh: 让诊断 Agent 主动抓取和扰动生成资产，把行为异常回送给负责的生成阶段。
    ja: 診断 Agent が生成アセットを能動的につかんだり揺さぶったりし、挙動の異常を担当する生成段階へ返す。
  sources:
  - https://arxiv.org/abs/2609.23103
  - https://arxiv.org/html/2609.23103v1
  - https://diaggen.github.io/
  verification:
    en: Part–material consistency · paired interaction plausibility · controlled probe replay · repair attribution · simulator
      loadability.
    zh: 部件—材料一致性 · 配对交互合理性 · 受控探测重放 · 修复归因 · 仿真可加载性。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: '2609.37067'
  title: 'FACT: Fidelity-Aware Construction of Articulated Twins'
  url: https://arxiv.org/abs/2609.37067
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Geometry, contact and response fidelity are developed as distinct stages of articulated-twin construction.
    zh: 把关节孪生分为几何、接触和动态保真三阶段，用局部测量与仿真残差驱动 Agent 修改模型。
    ja: 関節を持つデジタルツインを幾何・接触・動力学の忠実度という三段階に分け、局所計測とシミュレーション残差によって Agent のモデル修正を導く。
  sources:
  - https://arxiv.org/abs/2609.37067
  - https://arxiv.org/html/2609.37067v2
  verification:
    en: Geometry, simulated interaction and held-out passive-video prediction are evaluated. Results cover sampled configurations
      and observed responses, not active real-robot manipulation.
    zh: 评测 21 物体几何、仿真交互与真实物体留出被动视频预测，碰撞阶段 ISR 为 99.47%，动态 TMSE 为 0.0252，但未验证主动机器人真机操作且只覆盖采样姿态与所观测响应。
- id: '2609.05927'
  title: 'GIF: Agentic Generation of Interactive and Functional Object Compositions for Robot Learning'
  url: https://arxiv.org/abs/2609.05927
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Generated object combinations are refined for functional contact relationships.
    zh: 用图像与 3D 模型生成独立物体，再修正精细接触关系，构成可以用于机器人训练的操作场景。
    ja: 画像と 3D モデルから独立した物体を生成し、細かな接触関係を修正して、ロボット訓練に利用できる操作シーンを構築する。
  sources:
  - https://arxiv.org/abs/2609.05927
  - https://fufumeichi.github.io/gif-project-page/
  - https://fufumeichi.github.io/gif-project-page/assets/paper.pdf
  verification:
    en: One hundred twenty scenes test appearance, contact relations, collision and human preferences, followed by simulated
      and real manipulation with synthetic-data-trained policies. The main scope is rigid-object combinations.
    zh: 以 120 个场景检查外观、接触关系、碰撞和人工偏好，并测试合成数据训练策略后的仿真及实机操作；主体范围是刚体物体组合。
- id: '2609.37089'
  title: 'Real2Gym: Building Gyms from Videos, Bringing Skills to Robots'
  url: https://arxiv.org/abs/2609.37089
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Human or robot demonstrations become visually aligned, executable task environments.
    zh: 把人类或机器人演示变成视觉对齐、物理可执行的 Gym，并以执行结果修订场景与动作。
    ja: 人やロボットの実演を、視覚的に整合し物理的に実行できる Gym 環境へ変換し、実行結果でシーンと動作を修正する。
  sources:
  - https://arxiv.org/abs/2609.37089
  - https://arxiv.org/html/2609.37089v1
  - https://real2gym.github.io/
  verification:
    en: Twenty-four reconstructed environments test visual fidelity, task success and token cost. Transfer is evaluated on
      four Franka task families and is limited to parallel-gripper settings.
    zh: 在 24 个重建环境上评测视觉保真、任务成功与 token 开销，技能 Agent 仿真成功率为 87.5%，并在四类 Franka 实机任务测试迁移，实机覆盖仅限平行夹爪。
- id: '2609.05594'
  title: 'SceneMosaic: Efficient and Diverse Simulation-Ready Scene Generation via Hybrid Agentic Layout Evolution'
  url: https://arxiv.org/abs/2609.05594
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Local layout units make simulation-ready scene variation more efficient.
    zh: 先从一张图快速重建，再让 Agent 分块调整布局，组合出多个可仿真的场景。
    ja: まず一枚の画像から素早く再構成し、Agent が領域ごとに配置を調整して、複数のシミュレーション可能なシーンを組み立てる。
  sources:
  - https://arxiv.org/abs/2609.05594
  - https://arxiv.org/html/2609.05594
  - https://github.com/rxjfighting/SceneMosaic
  - https://rxjfighting.github.io/SceneMosaic/
  verification:
    en: SceneEval-100 tests semantic placement, orientation, collisions, bounds, navigability, time and diversity, with human
      ratings. It is not a real-robot task evaluation.
    zh: 在 SceneEval-100 上评估语义位置与朝向、碰撞／越界／可导航性、生成耗时和布局多样性，并辅以人工评分；不是实机任务验证。
- id: '2609.36593'
  title: 'Text2Sim: Agentic Physics-Based Simulation Generation with Distilled Expertise'
  url: https://arxiv.org/abs/2609.36593
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: A planner delegates simulation modules and directs repairs using execution evidence.
    zh: 把物理过程需求拆成场景、物体、动作和渲染程序，并按执行证据定向修复。
    ja: 物理過程の要件をシーン、物体、動作、レンダリングのプログラムに分解し、実行の証拠に基づいて対象を絞って修正する。
  sources:
  - https://arxiv.org/abs/2609.36593
  - https://arxiv.org/html/2609.36593v2
  verification:
    en: Executable simulation · agent-assessed physical requirements · video quality · blinded human preference · role/card
      ablations, not certified real-world validity.
    zh: 可执行仿真 · Agent 评判的物理需求 · 视频质量 · 盲测人类偏好 · 角色／经验卡消融，不等于真实世界有效性认证。
  tags:
  - Method
  - System
  - Inference
  - Environment
  - Verification
- id: '2609.33208'
  title: 'WorldAgent: Verification-Guided Agentic Physical World Construction'
  url: https://arxiv.org/abs/2609.33208
  date: '2026.09'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: World specifications make physical scene construction and revision addressable by object and time.
    zh: 将故事、实体、空间关系和镜头写成世界规格，以几何和仿真检查持续修订物理世界。
    ja: 物語、実体、空間関係、カメラを世界の仕様として記述し、幾何とシミュレーションの確認によって物理世界を継続的に修正する。
  sources:
  - https://arxiv.org/abs/2609.33208
  - https://arxiv.org/html/2609.33208v1
  verification:
    en: Scale/support/connectivity · static and dynamic interpenetration · causal behavior · conservation/stability · task
      alignment.
    zh: 尺度/支撑/连通性 · 静态与动态穿透 · 因果行为 · 守恒/稳定性 · 任务对齐。
  tags:
  - Method
  - Benchmark
  - Data Curation
  - Inference
  - Environment
  - Verification
- id: '2608.18840'
  title: 'Beyond Placement and Articulation: Usage-Driven Code Scenes for Embodied Interaction'
  url: https://arxiv.org/abs/2608.18840
  date: '2026.08'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Usage requirements become articulated rooms with executable interaction rules.
    zh: 用程序同时构建房间、可动资产和使用规则，让“按按钮开灯”等跨部件交互真正发生。
    ja: プログラムで部屋、可動アセット、使用規則を同時に構築し、「ボタンを押すと照明が点く」といった部品間の相互作用を実現する。
  sources:
  - https://arxiv.org/abs/2608.18840
  - https://arxiv.org/html/2608.18840
  verification:
    en: Twenty-eight room prompts evaluate spatial and semantic constraints and supported interactions. Simulated robot examples
      are reported, without hardware validation.
    zh: 用28个房间提示评估空间与语义约束、可交互对象和协调行为数量，并展示仿真机器人关门、按键；未报告实机验证。
- id: '2608.27549'
  title: 'Code as Worlds: Agentic Discovery of Executable World Representations for Physical Reasoning'
  url: https://arxiv.org/abs/2608.27549
  date: '2026.08'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Executable world hypotheses connect multimodal evidence to inspectable representations.
    zh: 将文字或视频解释成可执行世界程序，通过投影与观测差异迭代修订物体、状态和外观。
    ja: 文章や動画を実行可能な世界プログラムとして解釈し、投影像と観測の差を使って物体、状態、外観を反復的に修正する。
  sources:
  - https://arxiv.org/abs/2608.27549
  - https://arxiv.org/html/2608.27549v2
  - https://mirros-lab.github.io/code-as-world
  verification:
    en: Simulator execution · visual alignment (silhouette/depth/RGB) · object IoU · trajectory/velocity fidelity.
    zh: 仿真器执行 · 视觉对齐（轮廓／深度／RGB）· 物体 IoU · 轨迹／速度保真度。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: '2610.01863'
  title: 'LiteReality-Agent: An Agentic System for Interactable 3D Indoor Scene Reconstruction'
  url: https://arxiv.org/abs/2610.01863
  date: '2026.08'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: An editable room program unifies scan geometry, generated assets and reconstruction feedback.
    zh: 把 RGB-D 房间重建写成可执行的 Room.py，并通过观察、编辑和检查持续完善。
    ja: RGB-D による部屋の再構成を実行可能な Room.py として記述し、観察、編集、確認によって継続的に改善する。
  sources:
  - https://arxiv.org/abs/2610.01863
  - https://arxiv.org/html/2610.01863v1
  - https://litereality.github.io/agent/
  verification:
    en: Matched-view fidelity · metric geometry · support/intersection checks · perceptual assessment · articulated simulation
      export.
    zh: 同视角保真度 · 度量几何 · 支撑／相交检查 · 感知质量评估 · 关节仿真导出。
  tags:
  - Method
  - System
  - Inference
  - Environment
  - Verification
- id: '2608.30821'
  title: 'Lucida: Parse, Generate, and Place for Composable Real-to-Sim Scene Modeling'
  url: https://arxiv.org/abs/2608.30821
  date: '2026.08'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: A visual editing agent aligns generated assets to measured scene evidence.
    zh: 先聚合每个物体的多视图证据，再由 GizmoAct 反复看图并编辑姿态完成场景对齐。
    ja: 各物体の複数視点の証拠を集約し、GizmoAct が画像の確認と姿勢編集を繰り返してシーンを整合させる。
  sources:
  - https://arxiv.org/abs/2608.30821
  - https://arxiv.org/html/2608.30821v1
  - https://lucida-r2s.github.io/
  verification:
    en: R2S, CA-1M and ADT evaluations measure 3D detection, pose accuracy and scene geometry. Physical interaction and hardware
      transfer are not tested.
    zh: 论文在 R2S、CA-1M 与 ADT 上比较 3D 检测、ADD-SB 位姿和场景 F-score 等，CA-1M ADD-SB@0.05 达 83.4%，未验证物理交互或实机迁移。
- id: '2607.19190'
  title: 'Agentic Real2Sim: Physics-based World Modeling with Vision-Language Agents'
  url: https://arxiv.org/abs/2607.19190
  date: '2026.07'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Robot episodes are reconstructed and refined through recorded-trajectory replay.
    zh: 由视觉语言 Agent 编排感知、物理先验与重放优化，把真实机器人交互变成可运行孪生。
    ja: 視覚言語 Agent が知覚、物理的な事前知識、再生の最適化を組み合わせ、実際のロボットとの相互作用を動作可能なデジタルツインへ変換する。
  sources:
  - https://arxiv.org/abs/2607.19190
  - https://agentic-real2sim.github.io/
  - https://arxiv.org/html/2607.19190v5
  verification:
    en: Five hundred DROID episodes retain failures in the replay-success denominator. Additional appearance and pose metrics
      and six real-task policy-evaluation comparisons are reported.
    zh: 500 条 DROID episode 的重放成功率为 48.4%，349 条可测样本另报 PSNR、SSIM、ADD-S，外加六个实机任务的仿真评估代理验证，失败样本保留在成功率分母内。
- id: '2607.07459'
  title: 'EmbodiedGen V2: An Agentic, Simulation-Ready 3D World Engine for Embodied AI'
  url: https://arxiv.org/abs/2607.07459
  date: '2026.07'
  section: '3.2'
  type: resource
  scope: resource
  tldr:
    en: Physical assets, relational placement and stateful editing form a reusable world-building pipeline.
    zh: 以统一物理资产表示、场景图放置和有状态编辑，把任务意图变成可执行 3D 世界。
    ja: 統一された物理アセット表現、シーングラフによる配置、状態を持つ編集を使い、タスクの意図を実行可能な 3D 世界へ変換する。
  sources:
  - https://arxiv.org/abs/2607.07459
  - https://arxiv.org/html/2607.07459v3
  - https://horizonrobotics.github.io/EmbodiedGen/
  verification:
    en: Asset acceptance, scripted simulated grasp-lift and layout experiments are reported. Real-robot improvements summarized
      in the paper come from separate downstream VLA studies.
    zh: 200 个资产上人工接纳率为 96.5%、SAPIEN 脚本抓取抬升成功率为 98.6%，另有布局实验，论文汇总的实机提升来自独立下游 VLA 研究。
- id: '2607.21522'
  title: 'GS-Agent: Creating 4D Physical Worlds With Generative Simulation'
  url: https://arxiv.org/abs/2607.21522
  date: '2026.07'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Generative simulation connects scene language to editable physical programs.
    zh: Agent 编写物体、材料、运动与镜头程序，在物理引擎中运行并修订动态世界。
    ja: Agent が物体、材料、運動、カメラのプログラムを書き、物理エンジンで実行して動的な世界を修正する。
  sources:
  - https://arxiv.org/abs/2607.21522
  - https://arxiv.org/html/2607.21522
  - https://umass-embodied-agi.github.io/gs-agent/
  verification:
    en: Physics invariants, text alignment, aesthetics and human ratings assess generated dynamic scenes. Policy training
      and real-robot transfer are not evaluated.
    zh: 在物理规律与复杂交互场景上比较视频／状态物理不变量、图文对齐、美学及人工评分；未评估机器人策略训练或实机迁移。
- id: '2607.01766'
  title: 'SimWorlds: A Multi-Agent System for Dynamic 3D Scene Creation'
  url: https://arxiv.org/abs/2607.01766
  date: '2026.07'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: A staged coding system builds editable scenes that include animated and simulated processes.
    zh: 以固定构建阶段和场景协议约束 Blender 编程，联合渲染评审与引擎状态检查修复动态世界。
    ja: 固定した構築段階とシーンの規約で Blender プログラミングを制約し、レンダリングのレビューとエンジン状態の確認を組み合わせて動的な世界を修正する。
  sources:
  - https://arxiv.org/abs/2607.01766
  - https://arxiv.org/html/2607.01766v1
  - https://dynsimworlds.github.io/
  verification:
    en: 4DBuildBench evaluates 50 scenes using requirement and simulation checks, with additional visual and Blender benchmarks.
      The results concern digital scenes, not real-world dynamics calibration.
    zh: 50 场景 4DBuildBench 的独立引擎审计 MPR 达 0.87、结构 SPR 0.89，并以 VLM 逐项评分和 BlenderBench 编辑比较验证，属于数字内容实验且 SPR 有分组公平性限制。
- id: '2607.13586'
  title: 'UniPhysGen: Unified Physical Grounding for Simulation-Ready 3D Assets'
  url: https://arxiv.org/abs/2607.13586
  date: '2026.07'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Asset decomposition and learned physical grounding produce articulated simulation assets.
    zh: 资产分解与物理语义学习生成可仿真的关节资产。
    ja: アセットの分解と物理的な意味の学習により、シミュレーション可能な関節アセットを生成する。
  sources:
  - https://arxiv.org/abs/2607.13586
  - https://github.com/breezexian/UniPhysGen
  - https://huggingface.co/datasets/spatialverse/UniPhys-Bench
  verification:
    en: UniPhys-40K and 1,927-object UniPhys-Bench · rotated/decomposition-shift tests · simulation consistency and Isaac
      Sim interaction examples; physical admissibility does not establish real-world parameter accuracy.
    zh: UniPhys-40K与1,927物体UniPhys-Bench · 旋转及部件分解变化测试 · 仿真一致性和Isaac Sim交互示例；仿真可接受性不等于真实物理参数精度。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Training
  - Verification
- id: '2606.14168'
  title: 'MUSE: Agentic 3D Scene Authoring via Memory-Grounded Incremental Requirement Satisfaction'
  url: https://arxiv.org/abs/2606.14168
  date: '2026.06'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: An architect–builder–inspector workflow incrementally realizes editable indoor requirements.
    zh: 把场景要求拆成逐项可验证的目标，在局部编辑时保护已经正确的内容。
    ja: シーン要件を個別に検証できる目標へ分解し、局所編集の際にすでに正しい内容を保護する。
  sources:
  - https://arxiv.org/abs/2606.14168
  - https://arxiv.org/html/2606.14168
  - https://xujay111.github.io/muse_githubio/
  verification:
    en: AuthorBench measures requirement satisfaction, preservation under edits, collisions, bounds and human preference.
      Navigation continuity is inspected, but dynamics calibration and real-robot transfer are not demonstrated.
    zh: 在 AuthorBench 上评估需求满足率、编辑保留率、碰撞／越界与人工偏好，并用占用栅格检查导航课程连续性；不是动力学或实机评测。
- id: '2606.04226'
  title: 'PerceptTwin: Semantic Scene Reconstruction for Iterative LLM Planning and Verification'
  url: https://arxiv.org/abs/2606.04226
  date: '2026.06'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: An object-centric reconstruction adds executable affordances for checking robot plans.
    zh: 把机器人感知得到的开放词汇地图转成可操作的场景，用于审查和修订任务计划。
    ja: ロボットの知覚から得たオープン語彙の地図を操作可能なシーンへ変換し、タスク計画の点検と修正に用いる。
  sources:
  - https://arxiv.org/abs/2606.04226
  - https://arxiv.org/html/2606.04226v1
  - https://percept-twin.github.io/
  verification:
    en: Visual reconstruction, a 93-person interpretability study and plan success, error and safety tests are reported. Simulation-based
      plan verification does not establish successful real-robot execution.
    zh: 通过可视化对比、93 人计划可解释性研究及三种 LLM 的计划成功／错误／安全判定评测，约 39% 的计划成功提升来自模拟验证，不是实机动作执行验证。
- id: '2606.28276'
  title: 'SimFoundry: Modular and Automated Scene Generation for Policy Learning and Evaluation'
  url: https://arxiv.org/abs/2606.28276
  date: '2026.06'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Real-video reconstruction expands into task-conditioned digital cousins for policy evaluation and training.
    zh: 把一段现实视频转成可交互数字孪生，再沿物体、布局和任务三个维度生成可训练的变体。
    ja: 現実の動画を対話可能なデジタルツインへ変換し、物体・配置・タスクの三つの軸で訓練用の派生環境を生成する。
  sources:
  - https://arxiv.org/abs/2606.28276
  - https://arxiv.org/html/2606.28276v4
  - https://github.com/NVlabs/SimFoundry
  - https://research.nvidia.com/labs/gear/simfoundry/
  verification:
    en: Seven tasks and five policy families support simulated–real policy comparisons, including reported mean correlation
      0.911 and MMRV 0.018. These are policy-ranking measures, not absolute reconstruction error.
    zh: 在 7 个操作任务、5 类策略及 DROID／YAM 真实机器人上比较仿真与实测成功率，平均 Pearson 相关系数为 0.911、MMRV 为 0.018，并报告数字变体训练的实机泛化收益。
- id: '2605.15187'
  title: 'Articraft: An Agentic System for Scalable Articulated 3D Asset Generation'
  url: https://arxiv.org/abs/2605.15187
  date: '2026.05'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: A single editable part program is tested with geometric and articulation probes before export.
    zh: 用受限 SDK 编写可执行关节资产程序，并通过结构检查与几何探针迭代修复。
    ja: 制約された SDK で実行可能な関節アセットのプログラムを書き、構造の確認と幾何プローブによって反復的に修正する。
  sources:
  - https://arxiv.org/abs/2605.15187
  - https://articraft3d.github.io/
  - https://arxiv.org/html/2605.15187v1
  verification:
    en: Experiments cover 46 object classes, five prompts each and 125 participants with about 5,000 preferences. Isaac Sim
      demonstrations assess generated joint data; there is no real-robot transfer test.
    zh: 46 类各五条提示的生成结果由 125 人完成约 5000 次偏好比较，另测关节模型数据增益并展示 Isaac Sim 操作，未提供实机控制成功率。
- id: '2605.14398'
  title: 'ChronoAgentic: A Code-based Multi-Agent World Simulator for Physically Grounded Simulation Construction'
  url: https://arxiv.org/abs/2605.14398
  date: '2026.05'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: A coding agent uses visual and numerical execution reports to build Chrono simulations.
    zh: 从人可审阅的物理仿真计划出发，生成、执行并逐步修复独立 PyChrono 程序。
    ja: 人が確認できる物理シミュレーション計画から出発し、独立した PyChrono プログラムを生成・実行して段階的に修正する。
  sources:
  - https://arxiv.org/abs/2605.14398
  - https://arxiv.org/html/2605.14398v3
  - https://uwsbel.github.io/chrono-agentic-website/
  verification:
    en: Static-lint validity · semantic adherence · physical correctness · full-video temporal behavior.
    zh: 静态 Lint 有效性 · 语义遵循 · 物理正确性 · 完整视频时序行为。
  tags:
  - Method
  - Benchmark
  - Data Curation
  - Inference
  - Environment
  - Verification
- id: '2605.09586'
  title: 'DeformMaster: An Interactive Physics-Neural World Model for Deformable Objects from Videos'
  url: https://arxiv.org/abs/2605.09586
  date: '2026.05'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: A differentiable deformable model recovers material behavior and contact from video.
    zh: 从真实交互视频优化可执行软体动力学，将物理滚动、神经残差和高斯外观耦合。
    ja: 実際の相互作用を記録した動画から実行可能な軟体力学を最適化し、物理シミュレーションの展開、ニューラル残差、ガウス表現による外観を結合する。
  sources:
  - https://arxiv.org/abs/2605.09586
  - https://arxiv.org/html/2605.09586v2
  - https://can-lee.github.io/deformmaster-web/
  verification:
    en: Twenty real PhysTwin sequences evaluate future geometry, tracks and images. The model is assessed as a dynamics foundation;
      robot-control transfer is not established, and thin structures remain difficult.
    zh: 20 段真实 PhysTwin 序列按未来帧的 Chamfer、Track、IoU、PSNR、SSIM、LPIPS 评测，整体 Chamfer 为 0.011、Track 为 0.024，薄片 Track 仍落后 PhysTwin且不是实机控制实验。
- id: '2605.21572'
  title: 'PhysX-Omni: Unified Simulation-Ready Physical 3D Generation for Rigid, Deformable, and Articulated Objects'
  url: https://arxiv.org/abs/2605.21572
  date: '2026.05'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: A multimodal asset model predicts geometry together with articulated and physical structure.
    zh: 以模板游程编码让 VLM 直接预测高分辨几何与物理属性，统一生成多类可仿真资产。
    ja: テンプレートのランレングス符号化によって VLM が高解像度の幾何と物理属性を直接予測し、複数種のシミュレーション可能なアセットを統一的に生成する。
  sources:
  - https://arxiv.org/abs/2605.21572
  - https://arxiv.org/html/2605.21572v1
  - https://physx-omni.github.io/
  verification:
    en: PhysXVerse, PhysXMobility and six-dimensional PhysXBench assess asset properties, with simulation demonstrations.
      These do not establish real-robot transfer; the name does not identify the PhysX engine.
    zh: 在 PhysXVerse、PhysX-Mobility 上比较几何和物理属性并用六维 PhysX-Bench 评估，机器人与场景应用主要为仿真展示，正文未给实机策略验证。
- id: '2605.19587'
  title: 'SceneCode: Executable World Programs for Editable Indoor Scenes with Articulated Objects'
  url: https://arxiv.org/abs/2605.19587
  date: '2026.05'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Room planning and part-level programs produce editable scenes with physical asset metadata.
    zh: 把房间里的每个物体继续拆成可执行的部件程序，再编译为带关节和物理属性的场景。
    ja: 部屋にある各物体を実行可能な部品プログラムへさらに分解し、関節と物理属性を持つシーンへコンパイルする。
  sources:
  - https://arxiv.org/abs/2605.19587
  - https://arxiv.org/html/2605.19587v1
  - https://github.com/wangpuyi/SceneCode
  - https://scene-code.github.io/
  verification:
    en: Thirty prompts across six room types, SceneEval and a nine-user study evaluate scenes and assets. MuJoCo door and
      sliding demonstrations show execution, not a broad robot-policy benchmark.
    zh: 在六类房间的 30 个提示上做 SceneEval 与九人用户研究，并比较物体拓扑、UV 和 PBR 指标；MuJoCo 的开门／滑动操作是模拟交互演示，未报告实机或策略成功率。
- id: '2605.09423'
  title: 'SimWorld Studio: Automatic Environment Generation with Evolving Coding Agent for Embodied Agent Learning'
  url: https://arxiv.org/abs/2605.09423
  date: '2026.05'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Environment construction and policy-learning feedback jointly shape simulated task curricula.
    zh: 让 Coding Agent 在 UE5 中持续开发任务环境，并根据学习者表现调整后续训练场景。
    ja: Coding Agent が UE5 でタスク環境を継続的に開発し、学習者の成績に応じて後続の訓練シーンを調整する。
  sources:
  - https://arxiv.org/abs/2605.09423
  - https://arxiv.org/html/2605.09423v2
  - https://github.com/SimWorld-AI/SimWorld-Studio
  verification:
    en: Three simulated navigation settings use success, SPL, SoftSPL and nDTW. Reported co-evolution gains concern simulated
      policies; SimCoder model weights remain fixed while context and skills change.
    zh: 三组模拟导航案例评估生成有效性及 SR、SPL、SoftSPL、nDTW，共同演化的成功率比固定环境学习高 18 个百分点、比未训练 Agent 高 40 个百分点，未报告实机迁移。
- id: '2604.10992'
  title: 'ArtiCAD: Articulated CAD Assembly Design via Multi-Agent Code Generation'
  url: https://arxiv.org/abs/2604.10992
  date: '2026.04'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Part-local CAD programs and explicit connectors support repairable articulated assembly.
    zh: 预先约定部件连接器，再通过多 Agent 代码生成、装配和回滚构造可动 CAD。
    ja: 部品間の接続仕様をあらかじめ定め、複数 Agent によるコード生成、組み立て、ロールバックを通じて可動 CAD を構築する。
  sources:
  - https://arxiv.org/abs/2604.10992
  - https://arxiv.org/html/2604.10992v2
  - https://shui-yuan.github.io/articad/
  verification:
    en: Script execution · shape/proportion/orientation · placement/interference · joint-motion fidelity.
    zh: 脚本执行 · 形状／比例／方向 · 放置／干涉 · 关节运动保真度。
  tags:
  - Method
  - Benchmark
  - Data Curation
  - Inference
  - Environment
  - Verification
- id: '2602.12311'
  title: Perceptual Self-Reflection in Agentic Physics Simulation Code Generation
  url: https://arxiv.org/abs/2602.12311
  date: '2026.02'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Feeds rendered animation frames to a physics validator so that generated simulation code can be diagnosed and self-corrected.
    zh: 将渲染动画帧交给物理 Validator，使生成的仿真代码能够被诊断并自我修正。
    ja: レンダリングしたアニメーションのフレームを物理 Validator に渡し、生成したシミュレーションコードの診断と自己修正を可能にする。
  sources:
  - https://arxiv.org/abs/2602.12311
  verification:
    en: Code execution · frame-level task criteria · dynamic physical correctness.
    zh: 代码执行 · 帧级任务条件 · 动态物理正确性。
  tags:
  - Method
  - Inference
  - Verification
- id: '2602.10116'
  title: 'SAGE: Scalable Agentic 3D Scene Generation for Embodied AI'
  url: https://arxiv.org/abs/2602.10116
  date: '2026.02'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Visual and physical critics guide the generation of diverse robot-learning scenes.
    zh: 用可组合的场景工具和双重 critic，把机器人任务变为稳定的可交互 3D 场景。
    ja: 組み合わせ可能なシーンツールと二つの critic を使い、ロボットタスクを安定した対話可能な 3D シーンへ変換する。
  sources:
  - https://arxiv.org/abs/2602.10116
  - https://arxiv.org/html/2602.10116v2
  - https://research.nvidia.com/labs/dir/sage/
  verification:
    en: Scene appearance, collisions, stability and downstream imitation learning are evaluated in simulation. SAGE-10k provides
      generated environments; real-robot transfer is not established.
    zh: 论文以视觉评分、碰撞率和仿真稳定性及下游模仿策略成功率评测，完整 critic 配置稳定性达 99.6%，没有对应实机泛化实验。
- id: '2602.09153'
  title: 'SceneSmith: Agentic Generation of Simulation-Ready Indoor Scenes'
  url: https://arxiv.org/abs/2602.09153
  date: '2026.02'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Hierarchical agents generate physical scenes from architecture down to small objects.
    zh: 从建筑到家具再到小物体，逐层生成可直接进入物理模拟的密集室内场景。
    ja: 建築、家具、小物の順に段階的に生成し、物理シミュレーションへ直接投入できる密な室内シーンを構築する。
  sources:
  - https://arxiv.org/abs/2602.09153
  - https://arxiv.org/html/2602.09153v2
  - https://scenesmith.github.io/
  verification:
    en: Evaluation uses 210 prompts, 205 participants and SceneEval. Drake tests on 179 rooms report collision and stability
      measures; these remain simulation checks.
    zh: 在 210 个场景提示上结合 205 人用户研究、SceneEval 与 Drake 物理检查评估，179 个房间场景的物体碰撞率为 1.2%、稳定率为 95.6%，机器人应用也在仿真中评测。
- id: '2509.20414'
  title: 'SceneWeaver: All-in-One 3D Scene Synthesis with an Extensible and Self-Reflective Agent'
  url: https://arxiv.org/abs/2509.20414
  date: '2025.09'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Persistent scene state supports iterative generation, completion and local editing.
    zh: 按当前场景最需要解决的问题选择构建工具，在渲染与几何反馈中逐步完善室内环境。
    ja: 現在のシーンで最も解決が必要な問題に応じて構築ツールを選び、レンダリングと幾何のフィードバックで室内環境を段階的に改善する。
  sources:
  - https://arxiv.org/abs/2509.20414
  - https://arxiv.org/html/2509.20414v2
  - https://github.com/Scene-Weaver/SceneWeaver
  - https://proceedings.neurips.cc/paper_files/paper/2025/hash/cd2b3c429c8a2ca57656970e010b4b60-Abstract-Conference.html
  - https://scene-weaver.github.io/
  verification:
    en: Room diversity, visual quality and human preference are measured. USD export and a virtual G1 demonstration in Isaac
      Sim show simulation compatibility, not real-robot validation.
    zh: 在常见房间和八类开放词汇房间上评估碰撞、越界、VLM 视觉语义分数与用户偏好，并展示 USD 导入 Isaac Sim 后的虚拟 Unitree G1 交互，没有证明真实机器人迁移。
- id: '2411.01775'
  title: 'Eurekaverse: Environment Curriculum Generation via Large Language Models'
  url: https://arxiv.org/abs/2411.01775
  date: '2024.11'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Policy-learning outcomes drive an expanding curriculum of procedurally coded terrains.
    zh: 根据四足策略的学习表现迭代生成可执行地形代码，形成适应能力的跑酷课程。
    ja: 四足歩行方策の学習成績に応じて実行可能な地形コードを反復生成し、適応能力を養うパルクールのカリキュラムを作る。
  sources:
  - https://arxiv.org/abs/2411.01775
  - https://arxiv.org/html/2411.01775v1
  - https://eureka-research.github.io/eurekaverse/
  verification:
    en: Twenty simulated obstacles and real Go1 parkour evaluate downstream locomotion. Improvements update terrain curricula
      and control policies, not the coding model weights.
    zh: 论文在 20 类多难度仿真跑酷障碍及 Unitree Go1 的爬箱、越沟、斜坡、楼梯实机任务上比较成功率，验证的是课程对策略的作用。
- id: '2410.13882'
  title: 'Articulate-Anything: Automatic Modeling of Articulated Objects via a Vision-Language Foundation Model'
  url: https://arxiv.org/abs/2410.13882
  date: '2024.10'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: Image and motion feedback guide code that reconstructs articulated objects.
    zh: 让 VLM 编写可编译为 URDF 的 Python，并对照参考与模拟运动反复修正关节资产。
    ja: VLM が URDF にコンパイルできる Python を書き、参照資料とシミュレーション中の運動を比較して関節アセットを繰り返し修正する。
  sources:
  - https://arxiv.org/abs/2410.13882
  - https://articulate-anything.github.io/
  - https://arxiv.org/html/2410.13882v4
  - https://github.com/vlongle/articulate-anything
  verification:
    en: PartNet-Mobility construction tests are complemented by real Franka tests using four generated assets. Those small-scope
      results should not be treated as general transfer across all reconstructions.
    zh: 在 PartNet-Mobility 上报告约 75% 的关节构建成功率，并将四个生成资产上的模拟训练策略部署到真实 Franka，报告四项任务均为 100% 成功。
- id: '2410.15536'
  title: 'GRS: Generating Robotic Simulation Tasks from Real-World Images'
  url: https://arxiv.org/abs/2410.15536
  date: '2024.10'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Real RGB-D scenes seed executable robot tasks whose code and tests are iteratively repaired.
    zh: 从单张 RGB-D 图生成可运行的机器人任务与测试，再由错误路由选择修订仿真或测试。
    ja: 一枚の RGB-D 画像から実行可能なロボットタスクとテストを生成し、エラーの振り分けによってシミュレーションとテストのどちらを修正するか選択する。
  sources:
  - https://arxiv.org/abs/2410.15536
  - https://openaccess.thecvf.com/content/CVPR2025W/CV2/papers/Zook_GRS_Generating_Robotic_Simulation_Tasks_from_Real-World_Images_CVPRW_2025_paper.pdf
  verification:
    en: Ten scenes with 30 generations each are evaluated. Mean reward excludes runtime failures, and the reported task results
      do not establish calibrated real-world dynamics or real-policy transfer.
    zh: 在 10 个场景、每场景 30 次任务生成中评测 oracle 平均奖励（运行错误案例被排除），完整流程为 0.71 对比无 router 0.65，未验证训练策略的真机迁移。
- id: '2409.17652'
  title: 'FactorSim: Generative Simulation via Factorized Representation'
  url: https://arxiv.org/abs/2409.17652
  date: '2024.09'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Factored state and transition models help generate task environments with limited context.
    zh: 用因子化 POMDP 限制每步需要的代码上下文，从语言规格生成完整仿真。
    ja: 因子化 POMDP により各段階で必要なコードのコンテキストを制限し、言語による仕様から完全なシミュレーションを生成する。
  sources:
  - https://arxiv.org/abs/2409.17652
  - https://arxiv.org/html/2409.17652v2
  - https://cs.stanford.edu/~sunfanyun/factorsim/
  verification:
    en: Eight games and 50 GenSim tasks assess code validity, human-rated requirements and simulated reinforcement-learning
      transfer. Oracle-controller checks constrain the interpretation of task solvability.
    zh: 在八种 2D 游戏和 GenSim 的 50 项机器人任务上检验代码正确性、人工规格符合度及 RL 零样本迁移，均为模拟环境且机器人 oracle 完成率受控制器能力限制。
- id: '2409.02920'
  title: 'RoboTwin: Dual-Arm Robot Benchmark with Generative Digital Twins'
  url: https://arxiv.org/abs/2409.02920
  date: '2024.09'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Reconstructed assets and language-generated motion programs produce bimanual demonstrations.
    zh: 以单张真实图像生成物体数字孪生，并围绕功能坐标系生成双臂专家轨迹程序。
    ja: 一枚の実画像から物体のデジタルツインを生成し、機能に対応した座標系を基準に双腕のエキスパート軌道プログラムを生成する。
  sources:
  - https://arxiv.org/abs/2409.02920
  - https://arxiv.org/html/2409.02920v3
  - https://robotwin-benchmark.github.io/early-version/
  verification:
    en: The early RoboTwin study evaluates six tasks with 10, 20 and 50 demonstrations for DP3. Policy-learning gains measure
      data utility, not calibrated scene physics or visual repair by the generator.
    zh: 早期版以六项任务上由 10／20／50 条专家示范训练的 DP3 成功率验证数据效用，结果不能单独证明自动构建的物理精度或视觉修复闭环。
- id: '2406.08474'
  title: 'Real2Code: Reconstruct Articulated Objects via Code Generation'
  url: https://arxiv.org/abs/2406.08474
  date: '2024.06'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Multiview reconstruction and a specialized code model recover articulated object descriptions.
    zh: 用部件包围盒连接视觉重建与代码生成，预测可以直接模拟的对象关节结构。
    ja: 部品のバウンディングボックスで視覚再構成とコード生成をつなぎ、そのままシミュレーションできる物体の関節構造を予測する。
  sources:
  - https://arxiv.org/abs/2406.08474
  - https://arxiv.org/html/2406.08474v2
  - https://real2code.github.io/
  verification:
    en: PartNet-based tests measure mesh distance and joint errors, including unseen objects with up to ten parts and examples
      from real views. Real-policy transfer is not evaluated.
    zh: 在 PartNet-Mobility 未见物体上评估 mesh Chamfer Distance 及关节类型、轴向和位置误差，并展示最多 10 个关节部件与真实多视角图像的重建，不包含实机策略迁移实验。
- id: '2405.15568'
  title: 'OMNI-EPIC: Open-endedness via Models of human Notions of Interestingness with Environments Programmed in Code'
  url: https://arxiv.org/abs/2405.15568
  date: '2024.05'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: An archive of task outcomes supports open-ended generation of executable learning environments.
    zh: 借助任务档案和学习反馈持续编写新的环境、奖励与成功判定代码。
    ja: タスクのアーカイブと学習フィードバックを利用し、新しい環境、報酬、成功判定のコードを継続的に記述する。
  sources:
  - https://arxiv.org/abs/2405.15568
  - https://arxiv.org/html/2405.15568v3
  - https://dub.sh/omniepic
  verification:
    en: Diversity, open-endedness and simulated policy learning are measured, including long-running task generation. These
      results do not demonstrate physical-robot deployment.
    zh: 以任务嵌入覆盖度和 ANNECS-OMNI 衡量多样性与累计新任务学习进展，长运行采用模拟学习、短运行实际训练 RL，验证范围均为仿真。
- id: '2312.09067'
  title: 'Holodeck: Language Guided Generation of 3D Embodied AI Environments'
  url: https://arxiv.org/abs/2312.09067
  date: '2023.12'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Language-guided spatial constraints turn retrieved assets into interactive indoor environments.
    zh: 把文字里的房间需求拆成建筑结构、物体清单和空间约束，组装为可导航的室内环境。
    ja: 文章中の部屋の要件を建築構造、物体一覧、空間制約へ分解し、移動可能な室内環境として組み立てる。
  sources:
  - https://arxiv.org/abs/2312.09067
  - https://arxiv.org/html/2312.09067v2
  - https://github.com/allenai/Holodeck
  - https://yueyang1996.github.io/holodeck/
  verification:
    en: A 680-person study evaluates generated scenes; NoveltyTHOR experiments measure ObjectNav improvement after training.
      Navigation gains are simulated downstream utility, not real-world reconstruction accuracy.
    zh: 通过 680 人参与的人类偏好评测和模拟环境 NoveltyTHOR 的 ObjectNav 成功率、SPL 评估，Holodeck 微调后的平均成功率为 20.40%，未报告实机导航。
- id: '2311.01455'
  title: 'RoboGen: Towards Unleashing Infinite Data for Automated Robot Learning via Generative Simulation'
  url: https://arxiv.org/abs/2311.01455
  date: '2023.11'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Task, environment and supervision generation automate diverse simulated robot-skill learning.
    zh: 让 LLM 提议任务、组合场景并选择学习算法，批量形成机器人技能训练问题。
    ja: LLM がタスクを提案し、シーンを組み合わせ、学習アルゴリズムを選び、多数のロボットスキル訓練課題を作る。
  sources:
  - https://arxiv.org/abs/2311.01455
  - https://arxiv.org/html/2311.01455v3
  - https://robogen-ai.github.io/
  verification:
    en: The paper describes 106 diverse tasks and learning results on 69 tasks. Reported simulated success reflects downstream
      skills, without demonstrating learned updates to the environment-writing agent.
    zh: 106 个生成任务用于多样性比较，69 个任务的技能学习平均成功率为 77.4%，均为仿真结果，不能等同于构建者学习或实机泛化。
- id: '2310.18308'
  title: 'Gen2Sim: Scaling up Robot Learning in Simulation with Generative Models'
  url: https://arxiv.org/abs/2310.18308
  date: '2023.10'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Image-derived physical assets and generated rewards support simulated manipulation learning.
    zh: 把物体图像转成带物理属性的资产，再由 LLM 生成任务分解与奖励程序。
    ja: 物体画像を物理属性付きのアセットに変換し、LLM がタスク分解と報酬のプログラムを生成する。
  sources:
  - https://arxiv.org/abs/2310.18308
  - https://arxiv.org/html/2310.18308v1
  - https://gen2sim.github.io/
  verification:
    en: Isaac Gym experiments assess assets and policy learning. The real demonstration replays optimized trajectories open
      loop; it does not establish closed-loop visual policy transfer.
    zh: 论文比较资产多视图外观并展示 Isaac Gym 长时序任务学习及实机执行，但实机仅回放仿真优化的开环轨迹，未验证闭环视觉策略迁移。
- id: '2310.01361'
  title: 'GenSim: Generating Robotic Simulation Tasks via Large Language Models'
  url: https://arxiv.org/abs/2310.01361
  date: '2023.10'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Executable task generation scales demonstration collection and downstream robot-policy training.
    zh: 把任务描述变成可执行的机器人任务类，扩展模拟任务库与示范数据。
    ja: タスク記述を実行可能なロボットタスクのクラスに変換し、シミュレーションタスク集と実演データを拡張する。
  sources:
  - https://arxiv.org/abs/2310.01361
  - https://arxiv.org/html/2310.01361v2
  - https://github.com/liruiw/GenSim
  - https://liruiw.github.io/gensim
  verification:
    en: Seventy GPT-4-generated tasks support pretraining; twelve real tasks evaluate downstream policies. Real-task success
      concerns learned policies, not automatic calibration of generated environments.
    zh: 评估任务代码生成、模拟策略成功率及真实桌面操作迁移，使用 70 个 GPT-4 任务预训练后的策略在 12 个真实任务上达到平均 62.5% 成功率。
- id: res:aha-3d
  title: 'AHa-3D: Agentic Tool Use for Real2Sim with GPT-6 Astra'
  url: https://github.com/KevinXu02/aha-3d
  date: null
  section: '3.2'
  type: resource
  scope: resource
  tldr:
    en: KevinXu02's workflow combines geometry, segmentation and motion tools with coding-agent scene authoring and staged
      visual reviews; the office walkthrough includes Gallery/X-ray refinement, with separate third-party model requirements.
    zh: KevinXu02 的工作流结合几何、分割和运动工具，由 Coding Agent 编写场景并分阶段视觉核查；office 示例展示 Gallery/X-ray 修订，各模型及第三方资产独立配置。
    ja: KevinXu02 のワークフローは幾何、セグメンテーション、運動のツールを組み合わせ、Coding Agent がシーンを記述して段階ごとに視覚確認する。office の例では Gallery/X-ray による修正を示し、各モデルと外部アセットは個別に設定する。
  sources:
  - https://github.com/KevinXu02/aha-3d
  - https://github.com/KevinXu02/aha-3d/blob/main/docs/GETTING_STARTED.md
- id: mujoco-workbench
  title: mujoco-workbench
  url: https://github.com/Hebbian-Robotics/mujoco-workbench
  date: null
  section: '3.2'
  type: resource
  scope: resource
  tldr:
    en: A CLI and agent skills support rapid construction and inspection of MuJoCo scenes.
    zh: CLI 与 Agent Skills 支持快速构建和检查 MuJoCo 场景。
    ja: CLI と Agent Skills により、MuJoCo シーンの迅速な構築と確認を支援する。
  sources:
  - https://github.com/Hebbian-Robotics/mujoco-workbench
  verification:
    en: Official examples and diagnostics establish available tooling, not calibrated digital-twin accuracy or a controlled
      agent benchmark.
    zh: 官方示例与诊断说明工具接口能力，不构成经校准的数字孪生精度或受控 Agent 评测。
- id: '2611.05802'
  title: 'GREP: Grounding Generated Room Evaluation in Principles'
  url: https://arxiv.org/abs/2611.05802
  date: '2026.11'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: An evaluation agent diagnoses generated rooms using scene-specific principles and active inspection.
    zh: 提出一个检查生成房间的评估 Agent：根据具体场景主动寻找问题，调用几何工具并选择观察视角，从物理有效性、视觉协调和日常使用逻辑三个方面给出分数与诊断报告。报告还能作为反馈，帮助生成系统修订场景。
    ja: 生成した部屋を点検する評価 Agent を提案する。シーンに応じて能動的に問題を探し、幾何ツールと観察視点を選び、物理的な妥当性、視覚的な調和、日常利用の論理を採点・診断する。報告は生成システムによるシーン修正にも利用できる。
  sources:
  - https://arxiv.org/abs/2611.05802
  - https://arxiv.org/html/2611.05802
  verification:
    en: Collision, support, boundary and access checks primarily establish static quality. An evaluator inspecting a scene
      is distinct from its generator observing and repairing it.
    zh: 碰撞、支撑、边界与通行等主要是静态检查；不能据此断言动力学模拟正确。评估器的主动观察也不等于构建 Agent 的修复闭环。
- id: '2611.02928'
  title: 'Lab2Sim: Turning Real-World Experiment Videos into Interactive Virtual Experiments'
  url: https://arxiv.org/abs/2611.02928
  date: '2026.11'
  section: '3.3'
  type: paper
  scope: core
  tldr:
    en: Benchmarks interactive browser reconstructions of filmed experiments and uses a separate verifier to compare replayed
      states with video evidence before revising assets or state-machine logic.
    zh: 逐步重放网页实验，将截图和状态与实拍视频对照，评测交互还原度，并根据独立验证器的诊断修正器材素材或状态机。
    ja: ウェブ上の実験を段階的に再生し、画面と状態を実写動画と照合して操作の再現性を評価する。独立した検証器の診断に基づいて、器具の素材や状態機械を修正する。
  sources:
  - https://arxiv.org/abs/2611.02928
  - https://black1948.github.io/lab2sim
  verification:
    en: Runnable rate vs. operation and transition fidelity · invalid-action tests · repair ablations.
    zh: 区分可运行率与操作／状态还原度；测试非法操作及修复消融。
  tags:
  - Method
  - Benchmark
  - Verification
- id: '2611.13576'
  title: 'PhyRubric: Rubric-Grounded Diagnostic Evaluation of Physical Commonsense in Text-to-Video Generation'
  url: https://arxiv.org/abs/2611.13576
  date: '2026.11'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Diagnoses visible physical-commonsense failures in generated videos through caption-specific rubrics.
    zh: 以针对描述预先制定的 rubric，逐项诊断生成视频中可见的物理常识错误。
    ja: 記述に対して事前に定めた評価基準を使い、生成動画に見られる物理的な常識の誤りを項目ごとに診断する。
  sources:
  - https://arxiv.org/abs/2611.13576
  - https://github.com/chenyil6/phyRubric
  - https://huggingface.co/datasets/kittyhy/PhyRubric-Bench
  - https://huggingface.co/datasets/kittyhy/PhyRubric-Train
  - https://huggingface.co/kittyhy/PhyRubric-Judge
  verification:
    en: Ten video generators · five physical domains and 34 categories · human-judgment correlations and rubric ablations;
      evaluates visible video plausibility, not executable dynamics or hardware.
    zh: 10种视频生成器 · 5个物理领域与34类别 · 人类判断相关性及判据消融；评估可见视频合理性，不代表可执行动力学或硬件验证。
  tags:
  - Benchmark
  - Dataset
  - Verification
  - Training
- id: '2610.15166'
  title: 'ExeWorldBench: Benchmarking Code-Based Executable 3D World Modeling'
  url: https://arxiv.org/abs/2610.15166
  date: '2026.10'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates executable worlds spanning isolated mechanisms, coupled systems and goal-driven design.
    zh: 让 Coding Agent 从视觉参考或高层目标出发，编写一个能够运行的 3D 世界；任务从单个机械机制逐步扩展到多阶段联动系统和目标驱动的世界设计。它研究模型能否把对结构、运动和因果关系的理解落实为可执行产物。
    ja: 視覚的な参照や高水準の目標から、Coding Agent が動作する 3D 世界を記述する。単一の機械機構から多段階の連動システム、目標に沿う世界設計へとタスクを拡張し、構造・運動・因果関係の理解を実行可能な成果物にできるか調べる。
  sources:
  - https://arxiv.org/abs/2610.15166
  - https://arxiv.org/html/2610.15166
  - https://helen1p.github.io/ExeWorldBench/
  - https://huggingface.co/datasets/HelenPeng/ExeWorldBench
  verification:
    en: Execution-penalized and execution-conditioned scores · visual/mechanical/causal judgments · chain-length and motion-reference
      analyses; API execution-error repair is distinct from visual mechanism revision.
    zh: 执行失败惩罚与条件化分数 · 视觉／机械／因果判断 · 链长度及运动参考分析；API 执行错误修复与视觉机制修订分开。
  tags:
  - Benchmark
  - Dataset
  - Data Curation
  - Environment
  - Verification
- id: '2610.17288'
  title: 'PhysCodeGym: Benchmarking Coding Agents for Physically Verifiable 4D Reconstruction'
  url: https://arxiv.org/abs/2610.17288
  date: '2026.10'
  section: '3.3'
  type: paper
  scope: core
  tldr:
    en: Tests coding agents that reconstruct physical video phenomena as executable Blender scenes.
    zh: 让 Coding Agent 观察物理过程的视频，自主编写、运行和修订 Blender 场景程序，重建刚体、液体、可变形物体及风驱动现象。除了比较重建画面，还检查程序和场景中的物理机制，并在部分任务中改变条件后重新仿真。
    ja: Coding Agent が物理過程の動画を観察し、Blender のシーンプログラムを自律的に記述・実行・修正して、剛体、液体、変形体、風による現象を再構成する。映像比較に加えてプログラムとシーンの物理機構を確認し、一部のタスクでは条件を変えて再シミュレーションする。
  sources:
  - https://arxiv.org/abs/2610.17288
  - https://arxiv.org/html/2610.17288
  - https://github.com/ShaoShuai0605/PhysCodeGym
  verification:
    en: Visual/event/motion fidelity · native-scene physical validity · counterfactual interventions · completed repair traces
      · execution-budget effects.
    zh: 视觉／事件／运动保真度 · 原生场景物理有效性 · 反事实干预 · 实际完成的修复轨迹 · 执行预算影响。
  tags:
  - Benchmark
  - Dataset
  - Data Curation
  - Environment
  - Verification
  - Trajectory Analysis
- id: '2610.37326'
  title: 'ScIntBench: Physical Interaction Plausibility in 3D Scene Generation'
  url: https://arxiv.org/abs/2610.37326
  date: '2026.10'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether generated indoor scenes support prescribed physical interactions.
    zh: 把文字生成的室内场景放进物理仿真，按统一协议执行推、开合和表面探测等动作，检查场景是否真的支持交互。它要揭示的是：物体摆得合理、静止时没有明显错误，并不保证动起来以后仍然可用。
    ja: テキストから生成した室内シーンを物理シミュレーションに入れ、統一手順で押す、開閉する、表面を探るなどの動作を行い、実際に操作できるか確認する。配置や静止状態が妥当に見えても、動かした際の使用可能性は保証されないことを調べる。
  sources:
  - https://arxiv.org/abs/2610.37326
  - https://arxiv.org/html/2610.37326
  - https://scintbench.github.io/
  verification:
    en: 12 generation systems · 10 room types · simulation-based interaction and integrity · independent visual judging; no
      generator repair loop.
    zh: 12 个生成系统 · 10 类房间 · 仿真交互与完整性 · 独立视觉评价；不包含生成器修复闭环。
  tags:
  - Benchmark
  - Verification
- id: '2610.04432'
  title: 'Video2World: Benchmarking Coding Agents for Interactive World Modeling from Embodied Videos'
  url: https://arxiv.org/abs/2610.04432
  date: '2026.10'
  section: '3.3'
  type: paper
  scope: core
  tldr:
    en: Evaluates joint reconstruction of simulated environments and robot behavior from embodied videos.
    zh: 把机器人或人类示范视频转化为一项端到端软件工程任务：Agent 既要重建模拟环境，也要编写对应的机器人行为，并根据执行反馈反复修改。最终检查空间结构、动态过程和交互任务能否在生成世界中重现。
    ja: ロボットまたは人の実演動画を、一貫したソフトウェア開発タスクに変換する。Agent は模擬環境と対応するロボット動作を作り、実行フィードバックで反復修正する。生成世界が空間構造、動的過程、操作タスクを再現できるかを最終的に確認する。
  sources:
  - https://arxiv.org/abs/2610.04432
  - https://aetherlabsai.github.io/Video2World
  - https://arxiv.org/html/2610.04432
  - https://github.com/AetherLabsAI/Video2World
  - https://github.com/AetherLabsAI/Video2World/blob/main/docs/benchmark.md
  - https://huggingface.co/datasets/AetherLabs-AI/Video2World
  - https://arxiv.org/html/2610.04432#S10.SS1
  - https://arxiv.org/html/2610.04432#S8.SS1
  verification:
    en: Build rate · geometric fidelity · object-motion fidelity · physical task progress and success.
    zh: 构建成功率 · 几何保真度 · 物体运动保真度 · 物理任务进展与成功率。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: '2610.08720'
  title: 'WorldSolver: Can LLM Agents Simulate the Physical Dynamics via Solver Generation?'
  url: https://arxiv.org/abs/2610.08720
  date: '2026.10'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Asks language-model agents to implement the dynamics solver within a prepared simulation framework.
    zh: 把经典物理模拟问题变成编程任务：给 Agent 一个已经准备好场景和执行接口的代码框架，让它补全决定系统如何随时间演化的求解器。随后运行程序，分别检查执行成功、目标现象的再现程度和物理合理性。
    ja: 古典的な物理シミュレーション問題をプログラミング課題にする。シーンと実行 API を備えたコードのひな形を Agent に与え、時間発展を決めるソルバーを補完させる。実行の成功、対象現象の再現度、物理的な妥当性をそれぞれ確認する。
  sources:
  - https://arxiv.org/abs/2610.08720
  - https://arxiv.org/html/2610.08720
  - https://github.com/sirujiang/WorldSolver
  verification:
    en: Execution validity · event/interaction fidelity · temporal coherence · conservation/contact residuals · solver delivery.
    zh: 执行有效性 · 事件与交互忠实度 · 时间连贯性 · 守恒/接触残差 · 求解器交付。
  tags:
  - Benchmark
  - Data Curation
  - Environment
  - Verification
- id: '2610.17521'
  title: 'YUBI-Real2Sim: 3DGS Scene Verification for Reliable Policy Evaluation'
  url: https://arxiv.org/abs/2610.17521
  date: '2026.10'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Studies whether reconstructed 3DGS scenes preserve real robot policy rankings.
    zh: 把真实机器人场景重建为 3D 高斯视觉场景，并接入 MuJoCo 进行策略测试；通过真实与仿真的配对实验，研究重建中的孔洞、漂浮伪影等缺陷会怎样改变策略表现和排名。重点是判断这样的数字场景能否可靠地替代部分实机评测。
    ja: 実機ロボットのシーンを 3D ガウス表現で再構成し、MuJoCo に接続して方策を試験する。実環境と模擬環境の対応実験で、穴や浮遊アーティファクトなどの再構成の欠陥が方策の成績や順位に与える影響を調べ、実機評価の一部を代替できるか検討する。
  sources:
  - https://arxiv.org/abs/2610.17521
  - https://arxiv.org/html/2610.17521
  - https://github.com/airoa-org/yubi-real2sim
  - https://huggingface.co/datasets/airoa-org/yubi-real2sim-assets
  - https://research.airoa.io/publications/yubi-real2sim/
  verification:
    en: Visual scores alone do not reliably predict ranking failures. The released assets and policies cover declared configurations;
      assets require access approval and are not an unrestricted open download.
    zh: 视觉分数不足以可靠识别策略排名失败；仍需物理／控制对齐。已发布的资产和策略覆盖明确的配置，资产需申请访问，并非无条件开放下载。
- id: '2606.01538'
  title: 'MPMWorlds: Material-Point-Method Simulations for Inferring and Extrapolating Physical Dynamics'
  url: https://arxiv.org/abs/2606.01538
  date: '2026.06'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Compares program-based physical inference with video prediction in synthetic 2D material-point worlds.
    zh: 构建包含可变形体、流体和多种材料的二维 MPM 模拟数据，让模型根据一段已观测视频及不同程度的场景信息预测后续过程。它对比两条路线：生成并运行模拟程序，或者直接生成未来视频，研究两者在物理推断和长时外推上的差别。
    ja: 変形体、流体、複数の材料を含む二次元 MPM データを構築し、観測済みの動画と詳細度の異なるシーン情報から後続の過程を予測させる。シミュレーションプログラムの生成・実行と、未来動画の直接生成を比較し、物理推論と長期外挿の違いを調べる。
  sources:
  - https://arxiv.org/abs/2606.01538
  - https://arxiv.org/html/2606.01538
  verification:
    en: Evaluation mainly compares rendered videos rather than native particle trajectories. The dataset and benchmark are
      contributions of the same work.
    zh: 评测阶段主要比较输出视频，未直接使用粒子轨迹或物理状态；限于合成 2D MPM 世界。此处引用评测贡献，数据资源不重复计为独立论文。
- id: '2606.01869'
  title: 'WorldCoder-Bench: Benchmarking Physically Grounded 3D World Synthesis'
  url: https://arxiv.org/abs/2606.01869
  date: '2026.06'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether generated interactive 3D programs satisfy executable world contracts.
    zh: 要求模型根据自然语言生成浏览器中的交互式 3D 程序，任务包括模拟、渲染和应用。其 StateProbe 评估器会实际运行程序、执行动作并检查隐藏的状态要求，用来发现画面正常但交互逻辑或状态变化错误的产物。
    ja: 自然言語から、ブラウザーで動く対話型 3D プログラムを生成する課題を設け、シミュレーション、レンダリング、アプリを扱う。StateProbe はプログラムを実行して操作と隠れた状態要件を確認し、見た目は正常でも操作ロジックや状態変化が誤った成果物を検出する。
  sources:
  - https://arxiv.org/abs/2606.01869
  - https://arxiv.org/html/2606.01869
  verification:
    en: Its suite also contains rendering and application tasks. The physical subset offers contract checks, not proof of
      real-world parameter calibration.
    zh: 这里只关注其物理模拟相关任务；整套基准还覆盖渲染和应用，运行状态满足契约不等于真实世界参数已校准。
- id: '2605.20576'
  title: 'Δynamics: Language-Based Representation for Inferring Rigid-Body Dynamics From Videos'
  url: https://arxiv.org/abs/2605.20576
  date: '2026.05'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Represents video-inferred rigid-body systems as structured simulator configurations.
    zh: 训练视觉语言模型从视频运动线索中推断物体形状、初始状态、物理属性和相机参数，并以结构化文本输出完整场景配置。配置交给物理引擎重新模拟，再通过采样和搜索改进匹配，研究语言表示能否连接视频理解与刚体动力学重建。
    ja: 視覚言語モデルを訓練し、動画の運動から物体形状、初期状態、物理属性、カメラパラメーターを推定して、完全なシーン設定を構造化テキストで出力する。物理エンジンで再シミュレーションし、サンプリングと探索で一致を改善して、言語表現による動画理解と剛体力学再構成の接続を研究する。
  sources:
  - https://arxiv.org/abs/2605.20576
  - https://arxiv.org/html/2605.20576
  verification:
    en: Structured configuration prediction is not necessarily a general coding-agent loop. Real-video pseudo-labels do not
      amount to independently measured physical ground truth.
    zh: 输出主要是结构化配置，不等同于通用 Coding Agent；真实视频使用模型生成的伪标注，不能当作直接测得的全部物理真值。
- id: '2604.23580'
  title: 'PhysCodeBench: Benchmarking Physics-Aware Symbolic Simulation of 3D Scenes via Self-Corrective Multi-Agent Refinement'
  url: https://arxiv.org/abs/2604.23580
  date: '2026.04'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates simulation code for described physical phenomena and studies targeted multi-agent correction.
    zh: 将自然语言描述的物理现象转化为模拟代码生成任务，检查程序是否运行、画面是否符合要求以及物理断言是否成立。论文还提出专门负责生成与物理纠错的多 Agent 流程，研究有针对性的错误修正能否提升模拟的物理准确性。
    ja: 自然言語による物理現象の記述をシミュレーションコード生成の課題とし、プログラムの動作、画面の要件充足、物理的なアサーションを確認する。生成と物理的な誤りの修正を分担する複数 Agent の流れも提案し、対象を絞った修正が物理精度を高めるか調べる。
  sources:
  - https://arxiv.org/abs/2604.23580
  - https://arxiv.org/html/2604.23580
  verification:
    en: A composite visual score and a physical-assertion result answer different questions; a high overall score alone does
      not establish physical correctness.
    zh: 综合分中的视觉指标与另行报告的物理断言不是同一件事；不能只看总分就宣称物理正确。
- id: '2604.13035'
  title: 'SceneCritic: A Symbolic Evaluator for 3D Indoor Scene Synthesis'
  url: https://arxiv.org/abs/2604.13035
  date: '2026.04'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Provides explainable symbolic assessment of indoor layouts and feedback for revision.
    zh: 从已有室内数据中整理空间常识和约束，建立直接检查布局与物体关系的符号评估器，指出具体哪些摆放合理、哪些关系违规。论文还比较规则、文本模型和视觉模型提供的反馈，研究不同反馈怎样影响场景修订。
    ja: 既存の室内データから空間常識と制約を整理し、配置と物体関係を直接確認する記号的評価器を構築する。妥当な配置と違反する関係を具体的に示し、規則、テキストモデル、視覚モデルのフィードバックがシーン修正に与える影響を比較する。
  sources:
  - https://arxiv.org/abs/2604.13035
  - https://arxiv.org/html/2604.13035
  verification:
    en: These are chiefly static semantic and geometric checks, not validation of physical time evolution.
    zh: 偏静态语义和几何质量，不直接验证物理时间演化；并非仅针对 Coding Agent。
- id: '2603.16432'
  title: 'IRIS: A Real-World Benchmark for Inverse Recovery and Identification of Physical Dynamic Systems from Monocular
    Video'
  url: https://arxiv.org/abs/2603.16432
  date: '2026.03'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Benchmarks inverse identification of physical systems using real videos and independent measurements.
    zh: 提供带独立物理测量和不确定性标注的真实动态视频，要求方法从视频推断系统的物理参数或支配方程。它建立统一协议，检查推断是否准确、参数能否辨认，以及恢复的模型能否解释后续时间和不同条件下的运动。
    ja: 独立した物理計測と不確実性の注釈を備える実際の動的動画を提供し、物理パラメーターや支配方程式を推定させる。統一手順で推定精度、パラメーターの識別可能性、復元モデルによる後続時間や異なる条件での運動の説明能力を確認する。
  sources:
  - https://arxiv.org/abs/2603.16432
  - https://arxiv.org/html/2603.16432
  verification:
    en: A stronger reference for physical calibration, but not a whole-scene coding-agent benchmark. Measurements and their
      uncertainty remain essential to interpretation.
    zh: 提供带不确定性的独立物理测量参照，但不是专门面向 Coding Agent 的整场景构建基准。
- id: '2603.29798'
  title: 'SceneTeract: Probing and Improving Agent-Aware Activity Reasoning in 3D Indoor Scenes'
  url: https://arxiv.org/abs/2603.29798
  date: '2026.03'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether a scene can support an activity for a specified body and uses verification feedback to improve activity
      reasoning.
    zh: 输入一个室内场景、一项活动以及执行者的身体条件，把活动拆成针对物体的具体动作，再检查可达范围、操作空间和路径是否允许这些动作。系统返回失败原因，并利用这些验证反馈训练视觉语言模型，使其更准确判断场景能否支持活动。
    ja: 室内シーン、活動、実行者の身体条件を入力し、活動を物体に対する具体的な動作へ分解する。到達範囲、操作空間、経路が動作を許すか確認して失敗理由を返し、その検証フィードバックで視覚言語モデルを訓練して、活動を支えられるシーンの判定を改善する。
  sources:
  - https://arxiv.org/abs/2603.29798
  - https://arxiv.org/html/2603.29798
  verification:
    en: Functional geometric feasibility and a model’s feasibility judgment are distinct from executing robot dynamics in
      the real world.
    zh: 用于场景的功能可用性检查，同时评测模型判断可行性的能力；不是机器人真实动力学执行验证。
- id: '2602.10840'
  title: Training and Benchmarking Code Generation for Physics-Inspired Animations
  url: https://arxiv.org/abs/2602.10840
  date: '2026.02'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Trains and evaluates language models that express physical concepts through executable animations.
    zh: 围绕多种物理概念收集动画场景描述，训练和评测 LLM 编写可执行代码，把这些现象表现为动画。论文还让视觉语言模型检查生成视频，并把视觉奖励用于强化学习；目标是物理启发动画的表达质量，而非严格验证动力学求解。
    ja: さまざまな物理概念を含むアニメーションの記述を集め、実行可能なコードで現象を表す LLM を訓練・評価する。視覚言語モデルによる動画確認と視覚報酬を使う強化学習も行う。対象は物理に着想を得たアニメーションの表現品質であり、力学ソルバーの厳密な検証ではない。
  sources:
  - https://arxiv.org/abs/2602.10840
  - https://arxiv.org/html/2602.10840
  verification:
    en: The current title explicitly concerns physics-inspired animations. Depicting qualitative dynamics is different from
      numerically solving the underlying system.
    zh: 目标是物理启发动画的可执行性和定性表现；视觉上呈现物理现象不等于数值上正确求解其动力学。
- id: '2602.13294'
  title: 'VisPhyWorld: Probing Physical Reasoning via Code-Driven Video Reconstruction'
  url: https://arxiv.org/abs/2602.13294
  date: '2026.02'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Probes physical reasoning by reconstructing controlled videos as simulator programs.
    zh: 要求多模态模型把看到的物理视频写成能够运行的模拟器代码，使其对世界的理解变成可检查、可修改的程序。配套 VisPhyBench 用受控场景比较重建的外观与运动，研究模型能否从视觉线索恢复合理的物理过程。
    ja: マルチモーダルモデルが観察した物理動画を実行可能なシミュレーターコードにし、世界の理解を検査・修正できるプログラムとして表す。VisPhyBench は制御されたシーンで外観と運動の再構成を比較し、視覚情報から妥当な物理過程を復元できるか調べる。
  sources:
  - https://arxiv.org/abs/2602.13294
  - https://arxiv.org/html/2602.13294
  verification:
    en: These visual and judgment proxies do not establish comprehensive recovery of real physical parameters.
    zh: 主要指标是视觉／运动及评审代理量，不是全面的真实物理参数恢复；输入还可含首帧结构信息。
- id: '2511.03001'
  title: Apples on the Table? Evaluating Text-Guided 3D Scene Synthesis via Fine-Grained Constraint Verification
  url: https://arxiv.org/abs/2511.03001
  date: '2025.11'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates text-guided scenes by verifying fine-grained requirements individually.
    zh: 针对文字生成 3D 场景，提供带人工约束标注和参考场景的 LEGO 数据，并提出 LEGO-Eval。评估器把一句描述拆成物体、属性和相对位置等具体要求，再调用工具逐项核对，从而说明生成场景到底满足或遗漏了什么。
    ja: テキストからの 3D シーン生成に向け、人が制約を注釈した LEGO データと参照シーン、LEGO-Eval を提供する。評価器は記述を物体、属性、相対位置などの要件に分解し、ツールで個別に照合して、生成シーンが満たす条件と欠落を示す。
  sources:
  - https://arxiv.org/abs/2511.03001
  - https://arxiv.org/html/2511.03001
  verification:
    en: Requirement fulfillment is complementary to dynamic physical testing. LEGO and LEGO-Eval are contributions of one
      paper.
    zh: 侧重需求符合度和空间关系，不能替代动态物理测试；LEGO 和 LEGO-Eval 为同一论文的相关贡献。
- id: '2503.14756'
  title: 'SceneEval: Evaluating Semantic Coherence in Text-Conditioned 3D Indoor Scene Synthesis'
  url: https://arxiv.org/abs/2503.14756
  date: '2025.03'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Provides fine-grained semantic and static checks for text-conditioned indoor scene generation.
    zh: 为文字条件的室内场景生成建立一套细粒度评估框架和标注测试集。它同时核对文字明确提出的物体、属性与关系，以及用户通常不会写出的支撑、碰撞和通行要求，提供可解释的场景质量诊断。
    ja: テキスト条件の室内シーン生成に対する詳細な評価枠組みと注釈付きテストセットを構築する。明示された物体・属性・関係に加え、通常は記述されない支持、衝突、通行の要件を確認し、説明可能な品質診断を行う。
  sources:
  - https://arxiv.org/abs/2503.14756
  - https://arxiv.org/html/2503.14756
  verification:
    en: Primarily a static scene-quality framework; its geometric consistency tests do not validate dynamic simulation.
    zh: 主要检查静态场景的语义和几何一致性，不能据此断言动态物理模拟正确。
- id: '2405.05941'
  title: Evaluating Real-World Robot Manipulation Policies in Simulation
  url: https://arxiv.org/abs/2405.05941
  date: '2024.05'
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Studies whether simulation can predict real-world manipulation policy performance.
    zh: 针对实机策略评测昂贵且难复现的问题，构建与常见真实机器人设置对应的仿真环境，并减少视觉与控制差异。通过同一策略在仿真和实机中的配对测试，检查仿真能否反映真实表现及其对环境变化的敏感性。
    ja: 高コストで再現が難しい実機方策の評価に対し、一般的な実ロボット設定に対応した模擬環境を構築して、視覚と制御の差を減らす。同じ方策を実機とシミュレーションで比較し、実際の成績と環境変化への感度を模擬環境が反映できるか確認する。
  sources:
  - https://arxiv.org/abs/2405.05941
  - https://arxiv.org/html/2405.05941
  verification:
    en: This evaluates usefulness for policy assessment rather than autonomous scene reconstruction. Results depend on visual,
      controller and dynamics alignment.
    zh: 评测对象主要是策略评估的可信度，不是 Coding Agent 重建；结果也受视觉、控制与动力学对齐影响。
- id: real2sim-benchmark
  title: Real2Sim Benchmark
  url: https://www.real2sim.bot/
  date: null
  section: '3.3'
  type: paper
  scope: adjacent
  tldr:
    en: Tests reconstruction of robot episodes through frozen-scene rendering, action replay and policy execution.
    zh: 给 Coding Agent 真实机器人片段、相机标定和动作记录，让它重建对应的仿真场景。提交后冻结场景，再分别比较渲染结果、重放真实动作的结果和固定机器人策略的闭环表现，以检查重建世界的外观及使用价值。
    ja: Coding Agent に実機ロボットの動画、カメラ校正、動作記録を与え、対応する模擬シーンを再構成させる。提出後はシーンを固定し、レンダリング、実動作の再生、固定されたロボット方策の閉ループ性能をそれぞれ比較して、外観と利用価値を確認する。
  sources:
  - https://www.real2sim.bot/
  verification:
    en: The reported open-loop review is not blinded. Closed-loop failures without a successful known-good scene control cannot
      be assigned solely to reconstruction.
    zh: 当前版本用 LPIPS 与整图 DINOv2 相似度；开放环结果由知晓系统身份的人工评审判断，闭环尚无成功且缺少 known-good 场景对照，因此失败不能完全归因于重建。
- id: '2611.06817'
  title: 'Open-HumanWAM: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models'
  url: https://arxiv.org/abs/2611.06817
  date: '2026.11'
  section: '3.4'
  sub: real-data
  type: paper
  scope: adjacent
  tldr:
    en: Curates human manipulation experience and aligned actions for world–action model pretraining and robot adaptation.
    zh: 整理人类操作经验及对齐动作，用于世界—动作模型预训练与机器人适配。
    ja: 人の操作経験と対応する動作を整理し、世界・動作モデルの事前学習とロボットへの適応に利用する。
  sources:
  - https://arxiv.org/abs/2611.06817
  - https://dagroup-pku.github.io/open-humanwam/
  - https://github.com/DAGroup-PKU/HumanNet/tree/Open-HumanWAM
  - https://huggingface.co/datasets/DAGroup-PKU/Open-HumanWAM-50K
  verification:
    en: RoboTwin and RoboDojo simulation · 20-task real-robot zero-shot study · data-scale, diversity and action-alignment
      ablations · goal-conditioned demonstrations; long-horizon policies receive task-specific post-training.
    zh: RoboTwin／RoboDojo仿真 · 20任务实机零样本评测 · 数据规模、多样性与动作对齐消融 · 目标图像条件演示；长流程策略经过任务后训练。
  tags:
  - Method
  - Dataset
  - Training
  - Inference
- id: '2406.18915'
  title: 'Manipulate-Anything: Automating Real-World Robots using Vision-Language Models'
  url: https://arxiv.org/abs/2406.18915
  date: '2024.06'
  section: '3.4'
  sub: real-data
  type: paper
  scope: adjacent
  tldr:
    en: Collects real demonstrations with visual-language feedback.
    zh: 用视觉语言反馈自动采集真实示范。
    ja: 視覚言語フィードバックを使い、実環境での実演を自動収集する。
  sources:
  - https://arxiv.org/abs/2406.18915
  - https://robot-ma.github.io/
  verification:
    en: Real trajectories train a downstream policy; initial human-provided code examples are part of the setup.
    zh: 真实轨迹训练下游策略，初始化包含人工提供的代码例子。
- id: '2403.12945'
  title: 'DROID: A Large-Scale In-The-Wild Robot Manipulation Dataset'
  url: https://arxiv.org/abs/2403.12945
  date: '2024.03'
  section: '3.4'
  sub: real-data
  type: resource
  scope: resource
  tldr:
    en: Supplies real observations for robot-learning pipelines.
    zh: 提供机器人学习所需的真实观测来源。
    ja: ロボット学習に必要な実際の観測データ源を提供する。
  sources:
  - https://arxiv.org/abs/2403.12945
  - https://droid-dataset.github.io/
  verification:
    en: Released teleoperation data do not inherently contain agent reasoning, tool calls or code-repair traces.
    zh: 开放遥操作数据本身不包含 Agent 推理、工具调用或代码修复轨迹。
- id: '2611.12411'
  title: 'PhysOPSD: Code as Privilege for Physically Plausible Video Generation'
  url: https://arxiv.org/abs/2611.12411
  date: '2026.11'
  section: '3.4'
  sub: synthetic-data
  type: paper
  scope: core
  tldr:
    en: Constructs executable physical scenes and paired visual supervision for video-generator post-training.
    zh: 构建可执行物理场景及配对视觉监督，用于视频生成器后训练。
    ja: 実行可能な物理シーンと対応する視覚教師データを構築し、動画生成モデルの事後学習に用いる。
  sources:
  - https://arxiv.org/abs/2611.12411
  - https://haroldchen19.github.io/PhysOPSD-site/
  verification:
