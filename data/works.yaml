  verification:
    en: Tests sim-to-sim transfer and physical plate stowing, towel folding and barcode scanning. Five adaptation trials per
      physical task take about ten minutes of robot interaction, with human resets; subsequent evaluation succeeds in 26 of
      30 trials versus at most 3 for any baseline. Simulated discovery and sandbox-guided repair have separate ablations.
    zh: 检验仿真间迁移，以及实机餐盘收纳、毛巾折叠和条码扫描。每项实机任务用五次适配试验、约十分钟机器人交互，期间人工复位；随后 30 次评测成功 26 次，各基线最多成功 3 次。仿真能力发现与沙箱指导修复分别消融。
