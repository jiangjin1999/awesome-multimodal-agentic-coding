  demo: https://haoyue-yang.github.io/GameGo/games/
  date: '2026.10'
  section: '1.6'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Turns game seeds into compact, asset-grounded requirements and executable React development trajectories for training,
      with separate multimodal play-and-quality evaluation of completed games.
    zh: 将游戏种子转换为精简且有资产依据的需求及可执行 React 开发轨迹，用于模型训练，再对完成的游戏独立开展多模态试玩与质量评估。
    ja: ゲームの種から素材に根拠を持つ簡潔な要件と実行可能な React 開発軌跡を作ってモデルを訓練し、完成ゲームには独立したマルチモーダル試遊と品質評価を行う。
  sources:
  - https://arxiv.org/abs/2610.06910
  - https://github.com/Haoyue-Yang/GameGo
  - https://haoyue-yang.github.io/GameGo/games/
  verification:
    en: Build/runtime admission · requirement satisfaction · visual/interaction quality · human preference · task-compression
      and training ablations.
    zh: 构建／运行准入 · 需求满足 · 视觉／交互质量 · 人类偏好 · 任务压缩与训练消融。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Data Curation
  - Training
  - Inference
  - Verification
- id: '2610.08621'
  title: 'Recursive Game Creator: An Agentic Product-Level Experience-Oriented Game Harness'
  url: https://arxiv.org/abs/2610.08621
  date: '2026.10'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Separates policy-driven gameplay collection from visual experience review, using version-linked trajectories, screenshots,
      and user preferences to guide repeated game-code revisions and checkpoint retention.
    zh: 将策略驱动的试玩采集与视觉体验审查分离，利用绑定版本的轨迹、截图和用户偏好指导反复修改游戏代码及保留检查点。
    ja: 方策による試遊データ収集と視覚的な体験レビューを分離し、版に結び付いた軌跡、画像、利用者の選好でコードの反復修正とチェックポイントの保持を導く。
  sources:
  - https://arxiv.org/abs/2610.08621
  verification:
    en: Runtime requirements · replay-grounded experience · visual coherence · preference alignment · version retention ·
      testing cost.
    zh: 运行要求 · 重放证据支撑的体验 · 视觉一致性 · 偏好对齐 · 版本保留 · 测试成本。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: system:3agamefactory
  title: '3AGameFactory: Open-Source 3A Game Generation Skills and Asset Framework'
  url: https://github.com/OpenDCAI/GameFactory-3A
  date: '2026.09'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Uses a coding agent to assemble editable assets, gameplay, UI, and engine code across UE5, Unity, Godot, Blender,
      and Three.js; rendered asset sheets and in-engine captures expose visual defects for regeneration or targeted repair.
    zh: 使用 Coding Agent 跨 UE5、Unity、Godot、Blender 与 Three.js 组装可编辑资产、玩法、UI 和引擎代码；渲染资产图与引擎内录制会暴露视觉缺陷，以触发重新生成或定向修复。
    ja: コーディングエージェントで UE5、Unity、Godot、Blender、Three.js の編集可能な素材、ゲーム動作、UI、エンジンコードを組み立てる。素材描画とエンジン内の録画で欠陥を発見し、再生成や局所修復を行う。
  sources:
  - https://github.com/OpenDCAI/GameFactory-3A
  verification:
    en: Structural/provenance gates · multi-view asset review · in-engine orientation/scale/clipping/material/animation checks
      · native builds/tests and gameplay captures.
    zh: 结构／来源门控 · 多视图资产审阅 · 引擎内朝向／比例／穿插／材质／动画检查 · 原生构建／测试与实机画面。
  tags:
  - System
  - Inference
  - Environment
  - Verification
- id: '2609.39045'
  title: 'RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement'
  url: https://arxiv.org/abs/2609.39045
  date: '2026.09'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Improves Godot and Phaser projects through evidence-grounded playtest–edit–verify loops, using an evolving checklist
      and replay-based checkpoint comparison to preserve progress before distilling successful development experience.
    zh: 通过证据驱动的试玩—编辑—复验循环改进 Godot 与 Phaser 项目，以演化清单和回放比较保留最佳版本，并将成功开发经验用于训练。
    ja: 証拠に基づく試遊・編集・再検証で Godot と Phaser のプロジェクトを改善する。進化するチェックリストと再生比較で最良版を保持し、成功した開発経験を訓練に用いる。
  sources:
  - https://arxiv.org/abs/2609.39045
  - https://github.com/WenyiWU0111/RSIGame
  verification:
    en: Replay-based mechanics/visual quality · grounded diagnosis · regression detection · checkpoint selection · development
      cost.
    zh: 回放中的机制与视觉质量 · 诊断证据支撑 · 回归检测 · 版本选择 · 开发成本。
  tags:
  - Method
  - Data Curation
  - Training
  - Inference
  - Verification
- id: '2608.25518'
  title: Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models
  url: https://arxiv.org/abs/2608.25518
  date: '2026.08'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Introduces AWoMo and RLHEV, recording rendered evidence, engine checks, human review, and repair actions as multimodal
      trajectories for iterative world building and post-training.
    zh: 提出 AWoMo 与 RLHEV，将渲染证据、引擎检查、人工审阅和修复动作记录为多模态轨迹，用于迭代式世界构建与后训练。
    ja: AWoMo と RLHEV を提案し、描画証拠、エンジン検査、人間のレビュー、修復操作をマルチモーダルな軌跡として記録して、反復的な世界構築と事後学習に使う。
  sources:
  - https://arxiv.org/abs/2608.25518
  - https://github.com/LanceZPF/cardinal-preview
  verification:
    en: Script/engine validity · collider/navmesh/test-suite checks · rendered playtest evidence · human acceptance.
    zh: 脚本／引擎有效性 · 碰撞体／导航网格／测试套件检查 · 渲染试玩证据 · 人工验收。
  tags:
  - Method
  - Benchmark
  - Dataset
  - Data Curation
  - Training
  - Inference
  - Environment
  - Verification
- id: '2608.25927'
  title: 'Code World Model: Coding Agent as World Brain'
  url: https://arxiv.org/abs/2608.25927
  date: '2026.08'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Makes persistent, revisable code the world brain, compiles state into visual proxies, and returns execution results,
      tests, and world feedback to later agent decisions.
    zh: 将持久、可修改的代码作为“世界大脑”，把状态编译为视觉 Proxy，并让执行结果、测试和世界反馈影响 Agent 的后续决策。
    ja: 持続的で変更可能なコードを世界の中枢に使い、状態を視覚的な代理表現へ変換する。実行結果、テスト、世界からのフィードバックが次の判断に影響する。
  sources:
  - https://arxiv.org/abs/2608.25927
  - https://buaacyw.github.io/cwm/
  - https://github.com/buaacyw/code-world-model
  verification:
    en: Executable/player-controllable world · proxy adherence in entity motion/layout/camera · temporal continuity (qualitative).
    zh: 世界可执行／可控制 · Proxy 对实体运动／布局／相机的遵循 · 时间连续性（定性）。
  tags:
  - Method
  - System
  - Inference
  - Environment
  - Verification
- id: '2608.14490'
  title: 'Twin: Playing an Unknown Game with a Test-Time Digital Twin'
  url: https://arxiv.org/abs/2608.14490
  demo: https://arc-agi-3-twin.vercel.app/
  date: '2026.08'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Learns an executable digital twin from interaction counterexamples, validates past transitions, and plans inside the
      repaired model.
    zh: 从交互反例中学习可执行数字孪生，验证历史状态转移，并在修复后的模型中规划。
    ja: 相互作用から得られる反例で実行可能なデジタルツインを学び、過去の状態遷移を検証して修復後のモデルで計画する。
  sources:
  - https://arxiv.org/abs/2608.14490
  - https://arc-agi-3-twin.vercel.app/
  verification:
    en: Interaction-log replay · transition prediction · level completion · action efficiency.
    zh: 交互日志回放 · 状态转移预测 · 关卡完成 · 动作效率。
  tags:
  - Method
  - Benchmark
  - Inference
  - Environment
  - Verification
- id: '2607.28287'
  title: 'Tycho: Active Abstraction with Programmatic World Models for ARC-AGI-3'
  url: https://arxiv.org/abs/2607.28287
  date: '2026.07'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds, tests, repairs, uses, or bypasses executable game hypotheses as new rendered interaction evidence arrives.
    zh: 随着新的渲染交互证据到来，构建、测试、修复、使用或绕过可执行游戏假设。
    ja: 新たな描画・操作の証拠に応じて、実行可能なゲーム仮説を構築、テスト、修復、利用、または迂回する。
  sources:
  - https://arxiv.org/abs/2607.28287
  - https://github.com/NIMI-research/Tycho
  verification:
    en: Known-cell accuracy and coverage · outcome correctness · replay consistency · game score/action efficiency.
    zh: 已知单元准确率与覆盖率 · 结果正确性 · 回放一致性 · 游戏得分／动作效率。
  tags:
  - Method
  - Benchmark
  - Inference
  - Environment
  - Verification
- id: '2605.05138'
  title: Executable World Models for ARC-AGI-3 in the Era of Coding Agents
  url: https://arxiv.org/abs/2605.05138
  date: '2026.05'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Maintains, validates, and refactors a Python world model as new game observations arrive, then uses it for planning.
    zh: 随着新游戏观测到来维护、验证和重构 Python 世界模型，再使用它进行规划。
    ja: 新しいゲーム観測に応じて Python の世界モデルを維持、検証、再構成し、計画に利用する。
  sources:
  - https://arxiv.org/abs/2605.05138
  verification:
    en: Recorded-transition replay · predicted/observed frame match · planner reachability · game score.
    zh: 已记录转移回放 · 预测／观测帧匹配 · Planner 可达性 · 游戏得分。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: '2605.28258'
  title: GUI Agents for Continual Game Generation
  url: https://arxiv.org/abs/2605.28258
  demo: https://continual-game-generation.vercel.app/
  date: '2026.05'
  section: '1.6'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Couples a game-coding agent with a GUI-playing agent whose experience reports drive continued code changes.
    zh: 将游戏 Coding Agent 与 GUI 游玩 Agent 配对，以后者的体验报告驱动持续代码修改。
    ja: ゲームを実装するエージェントと GUI で遊ぶエージェントを組ませ、後者の体験報告で継続的なコード修正を導く。
