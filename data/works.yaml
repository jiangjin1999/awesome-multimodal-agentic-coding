    zh: Playbot 连接 Unity 与 Godot；Astra 编辑场景、游玩并测试游戏、验证修改、发现 Bug，再继续改进可玩产物。OpenAI 报告的客户结果为人工修复减少 50%。
    ja: Playbot が Unity と Godot を接続し、Astra が場面編集、試遊、テスト、変更の検証、バグ発見を繰り返す。OpenAI は顧客事例として、人間による修復が 50% 減ったと報告している。
