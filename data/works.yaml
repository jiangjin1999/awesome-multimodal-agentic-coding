    zh: 完整试玩 Agent 检查现场状态与截图，返回结论、复现步骤及重放证据；它本身不编辑项目，修复需交回开发 Agent。厂商演示不等于独立基准证据。
    ja: 試遊エージェントが現場の状態と画像を検査し、判定、再現手順、再生証拠を返す。プロジェクト自体は編集せず、開発エージェントへ修復を渡す。ベンダーのデモは独立評価とは区別する。
