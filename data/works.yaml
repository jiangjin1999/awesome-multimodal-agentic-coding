- id: res:game-playtest
  title: Game Playtest
  url: https://github.com/openai/plugins/blob/main/plugins/game-studio/skills/game-playtest/SKILL.md
  date: null
  section: '1.6'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Organizes input and scene-transition tests, screenshot-based canvas/WebGL review, HUD and camera checks, and reproducible
      issue reports for the next repair pass.
    zh: 组织输入与场景切换测试、基于截图的 Canvas/WebGL 检查、HUD 与相机检查，并输出可复现问题报告，供下一轮修复使用。
    ja: 入力と場面切替のテスト、画像による Canvas/WebGL 検査、HUD とカメラの検査を整理し、次の修正に使える再現可能な問題報告を出す。
