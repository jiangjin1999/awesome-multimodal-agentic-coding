  date: "2026.10"
  section: "1.7"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Iteratively audits and repairs sandboxed agent-environment verifiers with weaker models, checking retained legitimate solutions and fresh solver attempts before accepting each repair.
    zh: 用较弱模型迭代审计与修复沙箱内 Agent 环境的验证器，在接纳修复前回放合法解并检查新求解尝试。
    ja: ''
- id: "2610.10622"
  title: "WorldBench: Evaluating LLMs on Three.js Voxel World Generation"
  url: "https://arxiv.org/abs/2610.10622"
  date: "2026.10"
  section: "1.7"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: The judge changes the viewpoint and clock in a running Three.js voxel world and checks code, rendered evidence, and feature-removal tests. During repair the generator receives only parser or console errors.
    zh: 评分器主动改变 Three.js 体素世界的视角与时间，将源码、运行画面和移除功能后的结果对照评分。生成器修订代码时只接收解析或控制台错误。
    ja: ''
- id: "2606.15693"
  title: "Imperfect Visual Verification for Code Edition: A Case Study on TikZ"
  url: "https://arxiv.org/abs/2606.15693"
  date: "2026.04"
  section: "1.7"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Studies how imperfect visual verifiers score rendered TikZ edits and whether their feedback helps generators produce better code over multiple refinement steps.
    zh: 研究不完美视觉 Verifier 如何评分 TikZ 渲染编辑，以及反馈能否帮助多轮生成得到更好的代码。
    ja: ''
- id: "2604.18164"
  title: "MM-JudgeBias: A Benchmark for Evaluating Compositional Biases in MLLM-as-a-Judge"
  url: "https://arxiv.org/abs/2604.18164"
  date: "2026.04"
  section: "1.7"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether multimodal judges use the full query–image–response evidence through nine controlled perturbations, separating sensitivity to missing or mismatched evidence from stability under irrelevant changes.
    zh: 通过九类受控扰动检验多模态裁判是否利用完整的问题—图像—回答证据，并区分缺失／错配证据敏感性与无关变化下的稳定性。
    ja: ''
- id: "2511.15567"
  title: Computer-Use Agents as Judges for Generative User Interface
  url: "https://arxiv.org/abs/2511.15567"
  date: "2025.11"
  section: "1.7"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Pairs a coding model with a computer-use agent that tests generated interfaces and returns visual interaction histories for redesign.
    zh: 将 Coding Model 与测试生成界面的 Computer-use Agent 配对，并把视觉交互历史返回用于重新设计。
    ja: ''
- id: "2610.38568"
  title: "A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement"
  url: "https://arxiv.org/abs/2610.38568"
  date: "2026.10"
  section: "1.7"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Uses a fixed library of model-authored rendering programs to produce independently checkable visual tasks, refreshing the solver’s training pool when logged learning signals weaken rather than rewriting generators online.
    zh: 用固定的模型编写渲染程序生成可独立核对答案的视觉任务，在训练日志显示学习信号减弱时刷新求解器题池，而不是在线改写生成程序。
    ja: ''
- id: "2610.34921"
  title: "PhysEvolve: Verifier-grounded Self-evolution for Physical Reasoning with Executable Worlds"
  url: "https://arxiv.org/abs/2610.34921"
  date: "2026.10"
  section: "1.7"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Co-trains a world-program proposer and visual solver through deterministic counterfactual simulations and exact answer-bound rewards, improving physical reasoning through policy updates across rounds.
    zh: 通过确定性反事实仿真和绑定准确答案的奖励，共同训练世界程序提议者与视觉解题者，以跨轮策略更新提升物理推理。
    ja: ''
- id: "2610.36077"
  title: "The Trinity: Capability-Driven Recursive Self-Improvement for Multimodal Agents"
  url: "https://arxiv.org/abs/2610.36077"
  date: "2026.10"
  section: "1.7"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Couples verifiable world generation with capability-organized Harness evolution and routing, transferring selected Harness–skill configurations across heterogeneous tasks and two embodied settings.
    zh: 将可验证世界生成与按能力组织的 Harness 演化、路由结合，使所选 Harness—技能配置迁移到异构任务和两项具身场景。
    ja: ''
- id: "2610.32120"
  title: "ImageRSI: Verification-Driven Recursive Self-Improvement for Agentic Image Generation"
  url: "https://arxiv.org/abs/2610.32120"
  date: "2026.10"
  section: "2.1"
  type: paper
  scope: adjacent
  tldr:
    en: Repairs images with multimodal verification, admits reusable strategies through paired validation, and trains the judge offline while keeping the image generator frozen.
    zh: 通过多模态验证修复图像，以成对验证筛选可复用经验，并在冻结图像生成器的同时离线训练判别器。
    ja: ''
- id: "2610.07250"
  title: Internalizing Agent Experience into Diffusion Model Weights via On-Policy Context Distillation
  url: "https://arxiv.org/abs/2610.07250"
  date: "2026.10"
  section: "2.1"
  type: paper
  scope: adjacent
  tldr:
    en: Uses image-verification feedback to refine diffusion prompts and evolve textual skills, then distills part of that prompt-mediated experience into the generator before renewing harness adaptation.
    zh: 以图像核验反馈修订扩散模型提示词并演化文本技能，再将部分提示词经验蒸馏进生成器，随后重新适配 Agent 工作流。
    ja: ''
- id: "2611.06518"
  title: "EmoReward: Self-Evolving Reward Calibration for Emotional Video Generation RL"
  url: "https://arxiv.org/abs/2611.06518"
  date: "2026.11"
  section: "2.2"
  type: paper
  scope: adjacent
  tldr:
    en: Calibrates heterogeneous emotion-reward providers using current-video validity gates and a frozen table derived from earlier training traces, supplying better-grounded rewards for video-generator training.
    zh: 以当前视频的证据有效性门控和既往训练轨迹生成的冻结权重表校准异构情绪评分器，为视频生成器训练提供更有依据的奖励。
    ja: ''
- id: "2611.04418"
  title: "VidUEU-Agent: A Data-Curation Agent for Multimodal Understanding, Editing, and Unified Tasks"
  url: "https://arxiv.org/abs/2611.04418"
  date: "2026.11"
  section: "2.2"
  type: paper
  scope: adjacent
  tldr:
    en: Coordinates visual tools and VLM checks to curate 100K traceable understanding/editing/unified instructions from videos, then adjusts sampling and routing from downstream training feedback.
    zh: 组织视觉工具与 VLM 检查，从视频构造10万条可追溯的理解、编辑和统一任务指令，再根据下游训练反馈调整采样与路由。
    ja: ''
- id: "2610.20571"
  title: "Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation"
  url: "https://arxiv.org/abs/2610.20571"
  date: "2026.10"
  section: "2.2"
  type: paper
  scope: adjacent
  tldr:
    en: ATAS compiles screenplays into scene-, camera-, and time-grounded requests, conditioning later shots on registered scene/event memories while separating film acceptance from admission of generated observations to memory.
    zh: ATAS 将剧本编译为有场景、相机和时间定位的请求，用配准后的场景／事件记忆引导后续镜头，并将成片验收与生成观测是否写入记忆分开。
    ja: ''
- id: "2610.38352"
  title: "WeVisCut: The Whole Editing Room in One Agent From Narration to Long-Form Video"
  url: "https://arxiv.org/abs/2610.38352"
  date: "2026.10"
  section: "2.2"
  type: paper
  scope: core
  tldr:
    en: Trains a shared editing policy to construct executable shot plans, orchestrate narration and media tools, and revise template content and timelines from render-grounded production feedback.
    zh: 训练共享编辑策略构建可执行镜头计划、编排旁白与媒体工具，并依据渲染产物的生产反馈修订模板内容和时间线。
    ja: ''
- id: "2609.24997"
  title: "VideoGen-Agent: Reinforcing Video Generation Agents"
  url: "https://arxiv.org/abs/2609.24997"
  date: "2026.09"
  section: "2.2"
  type: paper
  scope: adjacent
  tldr:
    en: Trains a multimodal policy to compose retrieval, simulation, video-generation, and visual-verification tools, using intermediate observations to choose subsequent calls or regenerate rather than rewrite the underlying tools.
    zh: 训练多模态策略组合检索、仿真、视频生成与视觉验证工具，依据中间观测选择后续调用或重新生成，而非改写底层工具。
    ja: ''
- id: "2607.16355"
  title: "PhysAgent: Reflective Agentic Physics Control for Physically Plausible Video Generation"
  url: "https://arxiv.org/abs/2607.16355"
  date: "2026.07"
  section: "2.2"
  type: paper
  scope: core
  tldr:
    en: Closes the loop among executable physical-program generation, simulation, stage-specific visual verification, and targeted program repair.
    zh: 闭合可执行物理程序生成、仿真、分阶段视觉验证与定向程序修复之间的循环。
    ja: ''
- id: "res:bernini"
  title: "Bernini: Latent Semantic Planning for Video Diffusion"
  url: "https://github.com/bytedance/Bernini"
  date: null
  section: "2.2"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Connects a Qwen2.5-VL semantic planner to a Wan2.2 diffusion renderer through a shared task interface; released full-pipeline and renderer-only variants provide reusable media tools.
    zh: 将 Qwen2.5-VL 语义规划器连接到 Wan2.2 扩散渲染器，以统一任务接口提供生成／编辑；完整管线与独立渲染器版本均可作为媒体工具。
    ja: ''
- id: "res:supra-tex"
  title: SUPRA-Tex
  url: "https://arxiv.org/abs/2610.22352"
  demo: "https://huggingface.co/spaces/UniLat3D/Supra-Tex"
  date: null
  section: "2.3"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Preserves reference text, logos, and patterns while completing unseen surfaces with albedo, metallic, and roughness properties. Geometry is supplied or generated upstream by Pixal3D; edited 2D views can update materials on the same mesh, providing an appearance-generation step for 3D asset workflows.
    zh: 保留参考图中的文字、Logo 与图案，并补全不可见表面的反照率、金属度和粗糙度。几何由外部提供或上游 Pixal3D 生成；编辑后的二维视图可更新同一 mesh 的材质，为 3D 资产工作流提供外观生成环节。
    ja: ''
- id: "res:texgaussian"
  title: TexGaussian
  url: "https://arxiv.org/abs/2411.19654"
  date: null
  section: "2.3"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Predicts octree-aligned Gaussian material channels and bakes their views into UV maps, supplying relightable surface appearance for downstream rendering; distinct from physical-dynamics modeling or agentic repair.
    zh: 预测八叉树对齐的高斯材质通道，再将多视图结果烘焙为 UV 贴图，为后续渲染提供可重光照的表面外观；不同于物理动力学建模或 Agent 自主修复。
    ja: ''
- id: "res:ultratex-2k-multi-view-diffusion"
  title: UltraTex (2K Multi-View Diffusion)
  url: "https://arxiv.org/abs/2609.23169"
  date: null
  section: "2.3"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Supplies a surface-appearance module through high-resolution multi-view diffusion and texture baking; code and a G-buffer data release accompany the paper.
    zh: 以高分辨率多视角扩散与纹理烘焙提供表面外观能力，论文配套代码及G-buffer数据发布。
    ja: ''
- id: "2611.02341"
  title: "AgiWorld: An Agentic Video World Model for Building Persistent Worlds"
  url: "https://arxiv.org/abs/2611.02341"
  date: "2026.11"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Directs a video world model with metric camera paths and structured prompts, then reviews sampled frames and geometry to revise the layout, replan a route, or regenerate a chunk.
    zh: 用度量相机轨迹与结构化提示驱动视频世界模型，再检查抽帧与几何，修订布局、重规划路线或重生成片段。
    ja: ''
- id: "2611.04870"
  title: "PrimeSim: A Generalist World Model Simulator from Large-Scale Cross-Embodiment Demonstrations"
  url: "https://arxiv.org/abs/2611.04870"
  date: "2026.11"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Uses an action-conditioned multiview video model as a closed-loop policy simulator and tests whether policy rankings and short-budget RL gains transfer back to the LIBERO physics simulator.
    zh: 将动作条件多视角视频模型用作闭环策略仿真器，检验策略排序及短预算强化学习收益能否迁回 LIBERO 物理仿真器。
    ja: ''
- id: "2610.01215"
  title: "AutoGUIWorld: Image Generators as Visual World Models for GUI Agent"
  url: "https://arxiv.org/abs/2610.01215"
  date: "2026.10"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Synthesizes action-conditioned GUI screenshot trajectories with a planner and image generator, repairing target annotations and filtering inconsistent transitions before operator training without running the depicted applications.
    zh: 用规划器和图像生成器合成动作条件的 GUI 截图轨迹，修复目标标注、过滤不一致转移后训练操作者，无需运行所描绘的应用。
    ja: ''
- id: "2610.36371"
  title: "BoxWorld: Let World Engines Control and Video Generators Render"
  url: "https://arxiv.org/abs/2610.36371"
  date: "2026.10"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Separates agent-authored interaction rules from generative appearance through an object-centric state interface, streaming executable world-engine states into a causal video renderer.
    zh: 以对象状态接口分离 Agent 编写的交互规则与生成式外观，将可执行世界引擎的状态流传给因果视频渲染器。
    ja: ''
- id: "2610.21910"
  title: "CoWorld Reasoner: Agentic Multimodal Reasoning with the Evolving Video World Model-Driven Harness"
  url: "https://arxiv.org/abs/2610.21910"
  date: "2026.10"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Lets a VLM choose video-world-model operations for visual reasoning, with development-set feedback revising tools, skills, and harness code before fixed-harness evaluation.
    zh: 让 VLM 选择视频世界模型的操作辅助视觉推理，在开发集反馈下修订工具、Skills 与 Harness 代码，再以固定 Harness 评测。
    ja: ''
- id: "2610.26811"
  title: "State World Models: Execute the Rules, Generate the Pixels"
  url: "https://arxiv.org/abs/2610.26811"
  date: "2026.10"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Separates coding-agent-authored rules from frozen video rendering, compiling settled events into visual instructions and admitting rule-compatible video observations into subsequent world state.
    zh: 将 Coding Agent 编写的规则与冻结视频模型的渲染分离，把已结算事件编译成视觉指令，并将符合规则的视频观测纳入后续世界状态。
    ja: ''
- id: "2610.40339"
  title: "Wizard: Manipulate Any World in Real Time via Agentic Control"
  url: "https://arxiv.org/abs/2610.40339"
  date: "2026.10"
  section: "2.4"
  type: paper
  scope: adjacent
  tldr:
    en: Orchestrates geometry, skeleton, motion and video-generation tools around explicit game state, using agent-controlled visual proxies to render interactive worlds while keeping mechanics outside the diffusion model.
    zh: 围绕显式游戏状态编排几何、骨架、动作与视频生成工具，由 Agent 控制的视觉代理驱动交互世界渲染，游戏机制由独立控制器维护。
    ja: ''
- id: "res:cosmos3-nano-sim-auto"
  title: Cosmos3-Nano-Sim-Auto
  url: "https://huggingface.co/nvidia/Cosmos3-Nano-Sim-Auto"
  date: null
  section: "2.4"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: A causal world-model tool with released weights and Cosmos Framework inference/adaptation skills; generated sensor feedback supports policy evaluation, with camera-rig and sim-to-real validity requiring separate checks.
    zh: 具备公开权重及 Cosmos Framework 推理／适配 Skills 的因果世界模型工具；生成传感器反馈可用于策略评估，相机配置适配与仿真到真实有效性需分别检查。
    ja: ''
- id: "res:worldfoundry"
  title: WorldFoundry
  url: "https://arxiv.org/abs/2611.10771"
  date: null
  section: "2.4"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Connects model-specific inputs, runtime requirements and output artifacts to common inference and evaluation workflows, with explicit readiness and eligibility states.
    zh: 将模型各自的输入、运行要求及输出产物接入统一推理和评测工作流，明确区分准备状态和评测资格。
    ja: ''
- id: "2610.06955"
  title: "ROMA: LLM System for Real-World Object-Centric Multi-Sensory Active Perception"
  url: "https://arxiv.org/abs/2610.06955"
  date: "2026.10"
  section: "2.5"
  type: paper
  scope: adjacent
  tldr:
    en: Selects objects, physical interactions, and sensory modalities to acquire missing evidence through a grasping interface, updating subsequent perception decisions without rewriting policy code.
    zh: 通过抓取接口选择物体、物理交互和感官模态以获取缺失证据，再调整后续主动感知决策，而非改写策略代码。
    ja: ''
- id: "2610.28354"
  title: "S-Agent 2.0: Spatial Reasoning with a General Coding Agent"
  url: "https://arxiv.org/abs/2610.28354"
  date: "2026.10"
  section: "2.5"
  type: paper
  scope: adjacent
  tldr:
    en: Equips general coding agents with frozen perception tools, editable scene memory, and geometry-grounded readouts so they can inspect and correct evidence before answering spatial questions.
    zh: 为通用编码 Agent 配备冻结感知工具、可编辑场景记忆和几何依据明确的读数，使其在回答空间问题前检查并修正证据。
    ja: ''
- id: "res:gen4p"
  title: Gen4P
  url: "https://arxiv.org/abs/2610.22371"
  date: null
  section: "2.5"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Adapts a video generator with single-pass encoding and on-demand decoding, optionally reusing a frozen depth adapter; supplies scene measurements rather than an autonomous action loop. Installation and usage remain work in progress.
    zh: 将视频生成器适配为单次编码、按需解码的感知工具，可复用冻结深度适配器；提供场景测量，而非自主行动闭环。安装与使用接口仍在开发中。
    ja: ''
- id: "res:mjev-spatial"
  title: MJev-Spatial
  url: "https://arxiv.org/abs/2610.22276"
  date: null
  section: "2.5"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Uses native attention matching instead of answer-token generation; each decision is one pass, while scalar/point refinement can require multiple stages. A perception component evaluated offline, not evidence of robot execution.
    zh: 用原生注意力匹配代替答案 Token 生成；每次决策单次前向，标量／点位细化可能需多阶段。属于离线评测的感知组件，不是机器人执行证据。
    ja: ''
- id: "res:youtu-parsing-omni"
  title: "Youtu-Parsing-Omni: One Encoder, One Schema, All Modalities"
  url: "https://arxiv.org/abs/2610.39301"
  date: null
  section: "2.5"
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Uses a shared encoder and OmniSchema to expose source-grounded content across ten parsing tasks, supporting agent perception and inspection; dense autoregressive decoding remains a throughput limitation.
    zh: 用共享编码器和 OmniSchema 在十类解析任务中提供可追溯到来源的内容，为 Agent 感知与检查提供接口；密集内容的自回归解码吞吐量仍受限。
    ja: ''
- id: "2611.05275"
  title: "Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems"
  url: "https://arxiv.org/abs/2611.05275"
  date: "2026.11"
  section: "2.6"
  type: paper
  scope: adjacent
  tldr:
    en: Studies routing among heterogeneous models and robot policies under matched quality–cost comparisons; scene-conditioned selection saves policy time without editing the selected policies.
    zh: 在一致的质量—成本口径下研究异构模型和机器人策略路由；根据场景选择固定策略可减少策略推理耗时，不修改被选策略。
    ja: ''
- id: "2610.19677"
  title: "ACRO: Actor–Critic Rollout Orchestration"
  url: "https://arxiv.org/abs/2610.19677"
  date: "2026.10"
  section: "2.6"
  type: paper
  scope: adjacent
  tldr:
    en: Wraps a frozen VLA with a learned critic and trajectory-retraction actor that physically returns the robot to a promising visited state before resuming from a fresh observation, rather than rewriting control code.
    zh: 为冻结 VLA 增加学习得到的 Critic 与轨迹回退 Actor，让机器人实际返回更有希望的已访问状态，再从新观测继续执行，而非重写控制代码。
    ja: ''
- id: "2509.19571"
  title: "Agentic Scene Policies: Unifying Space, Semantics, and Affordances for Robot Action"
  url: "https://arxiv.org/abs/2509.19571"
  date: "2025.09"
  section: "2.6"
  type: paper
  scope: adjacent
  tldr:
    en: Composes scene grounding, spatial queries, and vision-based affordance tools with existing motion-planning skills, refreshing object maps and retrying tool actions after failures.
