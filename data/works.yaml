- id: "2609.39045"
  title: "RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement"
  url: "https://arxiv.org/abs/2609.39045"
  date: "2026.09"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Improves Godot and Phaser projects through evidence-grounded playtest–edit–verify loops, using an evolving checklist and replay-based checkpoint comparison to preserve progress before distilling successful development experience.
    zh: 通过证据驱动的试玩—编辑—复验循环改进 Godot 与 Phaser 项目，以演化清单和回放比较保留最佳版本，并将成功开发经验用于训练。
