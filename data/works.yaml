- id: "2610.35138"
  title: "Co-Design Bench: Multimodal Collaborative Coding Evaluation for Agentic Models"
  url: "https://arxiv.org/abs/2610.35138"
  date: "2026.10"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates edits to existing applications against hidden requirements using source, rendered interfaces, and interaction evidence, with an independent refutation stage that challenges positive judgments.
    zh: 用源代码、渲染界面和交互证据检查已有应用的修改是否满足隐藏需求，并通过独立反驳阶段复核正向判定。
    ja: ''
- id: "2610.29014"
  title: "GenXR-Bench: Benchmarking Coding Agents for Interactive XR Development"
  url: "https://arxiv.org/abs/2610.29014"
  date: "2026.10"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates XR feature implementation, bug repair, and app generation using simulated hand and environment inputs with held-out programmatic and visual tests, validated against expert reviews on XR hardware.
    zh: 使用模拟手部与环境输入、隐藏程序及视觉测试评估 XR 功能实现、缺陷修复和应用生成，并对照 XR 真机上的专家评审验证测试器。
    ja: ''
- id: "2610.10374"
  title: "TaoD2C-Bench: Benchmarking MLLMs for Industrial UI Code Generation Beyond Visual Fidelity"
  url: "https://arxiv.org/abs/2610.10374"
  date: "2026.10"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Separates industrial UI requirement inference from code realization, evaluating generated component and layout constraints through source/runtime evidence alongside final rendered fidelity.
    zh: 将工业 UI 需求推断与代码实现分开评测，结合源码和运行时证据检查组件与布局约束，并独立比较最终渲染忠实度。
    ja: ''
- id: "2610.33149"
  title: "WebUniverse: Scaling Verified Training Data for Agentic Web Development"
  url: "https://arxiv.org/abs/2610.33149"
  date: "2026.10"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Builds paired web-development environments and verified trajectories, combining functional and visual checks with independent attempts and failure continuations for supervised agent training.
    zh: 构建配套网页开发环境与经验证的轨迹，结合功能和视觉检查、独立尝试及失败续写，为 Agent 监督训练提供数据。
    ja: ''
- id: "2609.32600"
  title: "CUA-SWE: When Computer-Use Agents Meet Visual Software Engineering"
  url: "https://arxiv.org/abs/2609.32600"
  date: "2026.09"
  section: "1.1"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Unifies source editing and screenshot-based computer use across web, game, mobile, and DevOps repairs, with visual runtime evidence guiding further edits and independent tests checking behavior and regressions.
    zh: 在 Web、游戏、移动应用和 DevOps 修复中统一源码编辑与截图驱动的计算机操作，用运行时视觉证据指导后续修改，并通过独立测试检查行为与回归。
    ja: ''
- id: "2609.15387"
  title: "IWC-Bench: Evaluating Web Application Generation from a Software Testing Perspective"
  url: "https://arxiv.org/abs/2609.15387"
  date: "2026.09"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Uses runtime code coverage to guide exploration of generated web applications, then judges screenshots and interaction evidence for aesthetics, usability, and requirement alignment without feeding those scores into code revision.
    zh: 以运行时代码覆盖率引导对生成网页的探索，再依据截图与交互证据评估美观度、可用性和需求对齐；评分不回传到代码修订。
    ja: ''
- id: "2608.03474"
  title: "MT-Web2Code: Benchmarking Coding Agents on Multi-Turn Regional Reconstruction and Localized Modification"
  url: "https://arxiv.org/abs/2608.03474"
  date: "2026.08"
  section: "1.1"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks multi-turn agents on localized web reconstruction and modification instead of one-shot screenshot imitation.
    zh: 评测多轮 Agent 的局部网页重建与修改，而不是一次性截图模仿。
    ja: ''
- id: "2604.27419"
  title: "InteractWeb-Bench: Can Multimodal Agent Escape Blind Execution in Interactive Website Generation?"
  url: "https://arxiv.org/abs/2604.27419"
  date: "2026.04"
  section: "1.1"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Evaluates a Clarify–Implement–Verify–Submit loop in which browser inspection returns failure screenshots and grounded diagnostics for the agent's next code revision.
    zh: 评测“澄清—实现—验证—提交”闭环：浏览器检查返回失败截图与有依据的诊断，指导 Agent 下一轮代码修改。
    ja: ''
- id: "2604.18224"
  title: "WebCompass: Towards Multimodal Web Coding Evaluation for Code Language Models"
  url: "https://arxiv.org/abs/2604.18224"
  date: "2026.04"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Covers web generation, editing, and repair with visual and interactive evaluation, but does not require a same-agent render-observe-recode trajectory.
    zh: 覆盖网页生成、编辑与修复的视觉和交互评测，但不要求同一个 Agent 完成“渲染—观察—再编码”轨迹。
    ja: ''
- id: "2602.18548"
  title: "1D-Bench: A Benchmark for Iterative UI Code Generation with Visual Feedback in Real-World"
  url: "https://arxiv.org/abs/2602.18548"
  date: "2026.02"
  section: "1.1"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Measures real-world UI coding performance over multiple visual-feedback rounds and localized code updates.
    zh: 衡量真实环境中多轮视觉反馈和局部代码更新下的 UI Coding 表现。
    ja: ''
- id: "2507.04952"
  title: "ArtifactsBench: Bridging the Visual-Interactive Gap in LLM Code Generation Evaluation"
  url: "https://arxiv.org/abs/2507.04952"
  date: "2025.07"
  section: "1.1"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates completed interactive artifacts through rendered visuals and runtime behavior, without returning the resulting feedback to a later coding action.
    zh: 通过渲染视觉与运行时行为评估已完成的交互产物，但不会把所得反馈返回给后续编码动作。
    ja: ''
- id: "2502.18525"
  title: "Programming with Pixels: Can Computer-Use Agents do Software Engineering?"
  url: "https://arxiv.org/abs/2502.18525"
  demo: "https://programmingwithpixels.com/"
  date: "2025.02"
  section: "1.1"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Evaluates coding agents that must observe and operate a visual IDE rather than relying on direct text-only tool access.
    zh: 评测必须观察并操作视觉 IDE、而不能只依赖文本工具接口的 Coding Agent。
    ja: ''
- id: "2611.12112"
  title: "LiveWorkspace: Externalizing Visual Understanding as Persistent Shared State for Screenshot-to-Code Agents"
  url: "https://arxiv.org/abs/2611.12112"
  date: "2026.11"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Maintains target and executed interfaces in a shared visual state, using measured geometry/style differences and source bindings to guide repeated code repair and localized edits.
    zh: 把目标界面与实际执行界面维护为共享视觉状态，依据实测几何／样式差异及源码绑定持续修复代码并完成局部编辑。
    ja: ''
- id: "2610.04981"
  title: "TeleGen: Improving LLM-Based Web Application Generation via Runtime Telemetry"
  url: "https://arxiv.org/abs/2610.04981"
  date: "2026.10"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Repairs generated web applications with compressed runtime telemetry and task feedback, combining screenshot-based WebVoyager judgments with code revision in its WebGen-Bench configuration.
    zh: 以压缩运行遥测和任务反馈修复生成的 Web 应用，在 WebGen-Bench 配置中将 WebVoyager 的截图判定结果传入代码修订。
    ja: ''
- id: "2610.23104"
  title: "WebCoder: Scaling General Frontend Development with Artifact-Grounded Agentic Reinforcement Learning"
  url: "https://arxiv.org/abs/2610.23104"
  date: "2026.10"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Trains a frontend builder with artifact-grounded reinforcement learning, using rendered feedback to revise a persistent application and assigning long-horizon credit through changes in requirement satisfaction.
    zh: 以产物进展为依据训练前端构建者，通过渲染反馈持续修订同一应用，并按需求满足度的变化分配长轨迹强化学习信用。
    ja: ''
- id: "2610.02617"
  title: "WebUIProof: Benchmarking WebUI Code Generators with UI-Agent Execution Harness"
  url: "https://arxiv.org/abs/2610.02617"
  date: "2026.10"
  section: "1.1"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates generated Web/3D interfaces with structured interaction tests and visual UI agents, using outcome-level rewards to train generators rather than visually repair the current artifact.
    zh: 用结构化交互测试与视觉 UI Agent 评测生成的 Web／3D 界面，将结果级奖励用于训练生成器，而不是对当前产物进行视觉代码修复。
    ja: ''
- id: "2609.15078"
  title: Enabling Creative Exploration for Vibe Design Agents
  url: "https://arxiv.org/abs/2609.15078"
  date: "2026.09"
  section: "1.1"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Samples structured theme and asset directions before fixed-setting UI code generation, measuring rendered diversity, model-judge preference, and deployed user behavior as separate outcomes.
    zh: 在固定设置的 UI 代码生成前抽样结构化主题与资产方向，并分别衡量渲染多样性、模型裁判偏好及线上用户行为。
    ja: ''
- id: "2609.18805"
  title: "ProgramDistill: From Interactive Web Apps to Verifiable Reference-Guided SWE Tasks"
  url: "https://arxiv.org/abs/2609.18805"
  date: "2026.09"
  section: "1.1"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Turns working web applications into replay-verifiable reconstruction tasks, studying observe–edit–validate behavior through structured text-based browser observations rather than screenshot inputs.
    zh: 将可运行网页转化为可重放验证的重建任务，通过结构化文本式浏览器观测而非截图输入，研究“观察—编辑—验证”行为。
    ja: ''
- id: "2609.22000"
  title: "RecreationWorld: Scalable and Verifiable Environments for Hybrid Computer-Use Agents"
  url: "https://arxiv.org/abs/2609.22000"
  date: "2026.09"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Recreates applications across desktop, Android, and Web by interleaving reference exploration, source implementation, execution, and visual checks, and trains hybrid agents on verified reconstruction trajectories.
    zh: 在桌面、Android 与 Web 上交替探索参考应用、编写源码、运行与视觉检查，并用通过验证的重建轨迹训练混合交互 Agent。
    ja: ''
- id: "2609.02088"
  title: "Rendering-in-the-Loop: An Execution-Driven Agent for Interactive Web Development"
  url: "https://arxiv.org/abs/2609.02088"
  date: "2026.09"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Replays reference interactions in a real browser, scores both behavior and rendering, and turns multimodal runtime evidence into repeated tool-assisted code repairs.
    zh: 在真实浏览器中重放参考交互，同时评估行为与渲染，再将多模态运行证据转化为多轮工具辅助代码修复。
    ja: ''
- id: "2608.24138"
  title: Rubrics as Visual-Repair Context for Self-Evolving UI-to-Code Generation
  url: "https://arxiv.org/abs/2608.24138"
  date: "2026.08"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Uses persistent visual-repair rubrics to select scoped edits and reduce regression across repeated UI refinement rounds.
    zh: 使用持久化视觉修复 Rubric 选择限定范围的修改，减少多轮 UI 细化中的回归。
    ja: ''
- id: "2608.30530"
  title: "WebWorld: The Browser as a World Model for Self-Improving Web Code"
  url: "https://arxiv.org/abs/2608.30530"
  date: "2026.08"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Turns screenshot-grounded critiques into scoped HTML repairs and replayable browser contracts, retaining only transitions that improve the target without regressing previously verified behavior.
    zh: 将截图证据支持的点评转化为限定范围的 HTML 修复和可重放浏览器契约，仅保留推进目标且不破坏已验证行为的状态转移。
    ja: ''
- id: "2607.14075"
  title: "VisualRepair: Dynamic Tool Calling and Region Focusing for Visual Software Issue Repair"
  url: "https://arxiv.org/abs/2607.14075"
  date: "2026.07"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Dynamically selects visual tools and zooms into suspicious regions while iteratively repairing screenshot-grounded software issues.
    zh: 在迭代修复截图驱动的软件问题时，动态选择视觉工具并聚焦可疑区域。
    ja: ''
- id: "2604.19742"
  title: "PlayCoder: Making LLM-Generated GUI Code Playable"
  url: "https://arxiv.org/abs/2604.19742"
  date: "2026.04"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Automatically runs and operates generated GUIs, then converts interaction failures into subsequent code repairs.
    zh: 自动运行并操作生成的 GUI，再把交互失败转化为后续代码修复。
    ja: ''
- id: "2604.05839"
  title: Vision-Guided Iterative Refinement for Frontend Code Generation
  url: "https://arxiv.org/abs/2604.05839"
  date: "2026.04"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Feeds rendered frontend differences back into repeated code revisions rather than stopping after initial generation.
    zh: 将前端渲染差异反馈到反复代码修改中，而不是在初次生成后停止。
    ja: ''
- id: "2604.19750"
  title: "Coding with Eyes: Visual Feedback Unlocks Reliable GUI Code Generating and Debugging"
  url: "https://arxiv.org/abs/2604.19750"
  date: "2026.03"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Coordinates visual understanding, GUI interaction, code generation, and refactoring in an execution-grounded debugging loop.
    zh: 在执行驱动的调试闭环中协调视觉理解、GUI 交互、代码生成与重构。
    ja: ''
- id: "2603.17826"
  title: "FailureMem: A Failure-Aware Multimodal Framework for Autonomous Software Repair"
  url: "https://arxiv.org/abs/2603.17826"
  date: "2026.03"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Retrieves prior multimodal failure trajectories to guide diagnosis and subsequent repository-level repair actions.
    zh: 检索既往多模态失败轨迹，指导诊断及后续仓库级修复动作。
    ja: ''
- id: "2602.06090"
  title: "SVRepair: Structured Visual Reasoning for Automated Program Repair"
  url: "https://arxiv.org/abs/2602.06090"
  date: "2026.02"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Structures screenshots into localized visual evidence and iterates between scene understanding, code localization, and patching.
    zh: 将截图结构化为局部视觉证据，在场景理解、代码定位与补丁生成之间迭代。
    ja: ''
- id: "2602.05998"
  title: "VisRefiner: Learning from Visual Differences for Screenshot-to-Code Generation"
  url: "https://arxiv.org/abs/2602.05998"
  date: "2026.02"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Learns from target-versus-render visual differences and applies the resulting evidence to iterative code refinement.
    zh: 从目标与渲染结果的视觉差异中学习，并将证据用于迭代代码细化。
    ja: ''
- id: "2601.04203"
  title: "FronTalk: Benchmarking Front-End Development as Conversational Code Generation with Multi-Modal Feedback"
  url: "https://arxiv.org/abs/2601.04203"
  date: "2025.12"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Introduces multi-turn visual front-end conversations and AceCoder, which interacts with rendered sites, critiques failures, and regenerates improved code.
    zh: 引入多轮视觉前端对话与 AceCoder；后者与渲染网站交互、批评失败并重新生成改进代码。
    ja: ''
- id: "2511.08195"
  title: "UI2Code^N: UI-to-Code Generation as Interactive Visual Optimization"
  url: "https://arxiv.org/abs/2511.08195"
  date: "2025.11"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Recasts UI-to-code as execution, visual inspection, and repeated refinement optimized with relative visual feedback.
    zh: 将 UI-to-code 重构为执行、视觉检查和反复细化，并以相对视觉反馈进行优化。
    ja: ''
- id: "2511.06251"
  title: "WebVIA: A Web-based Vision-Language Agentic Framework for Interactive and Verifiable UI-to-Code Generation"
  url: "https://arxiv.org/abs/2511.06251"
  demo: "https://zheny2751-dotcom.github.io/webvia.github.io/"
  date: "2025.11"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Explores source interfaces through repeated perception-action-verification, synthesizes executable interactive code, and validates recovered behaviors.
    zh: 通过反复的感知—行动—验证探索源界面，合成可执行交互代码并验证恢复出的行为。
    ja: ''
- id: "2510.11498"
  title: "ReLook: Vision-Grounded RL with a Multimodal LLM Critic for Agentic Web Coding"
  url: "https://arxiv.org/abs/2510.11498"
  date: "2025.10"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Feeds screenshot-grounded MLLM critiques into subsequent code revisions during training rollouts and critic-assisted use; its fast inference variant omits the external critic.
    zh: 在训练 Rollout 与带 Critic 设置中，将基于截图的 MLLM 诊断反馈给后续代码修改；快速推理变体会移除外部 Critic。
    ja: ''
- id: "2509.22644"
  title: "WebGen-Agent: Enhancing Interactive Website Generation with Multi-Level Feedback and Step-Level Reinforcement Learning"
  url: "https://arxiv.org/abs/2509.22644"
  date: "2025.09"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Uses screenshots, GUI-agent testing, backtracking, and step-level rewards to iteratively improve website codebases.
    zh: 使用截图、GUI Agent 测试、回溯和步骤级奖励，迭代改进网站代码库。
    ja: ''
- id: "2507.20766"
  title: "Learning Only with Images: Visual Reinforcement Learning with Reasoning, Rendering, and Visual Feedback"
  url: "https://arxiv.org/abs/2507.20766"
  date: "2025.07"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Runs generated chart and web code, turns target-versus-render discrepancies into visual feedback, and uses it to guide the next code-generation turn.
    zh: 运行生成的图表与网页代码，将目标和渲染结果的差异转为视觉反馈，并指导下一轮代码生成。
    ja: ''
- id: "2506.13663"
  title: "DesignCoder: Hierarchy-Aware and Self-Correcting UI Code Generation with Large Language Models"
  url: "https://arxiv.org/abs/2506.13663"
  date: "2025.06"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Captures rendered mobile UIs, compares component-level visual evidence, and iteratively applies localized code repairs.
    zh: 捕获渲染后的移动端 UI，比较组件级视觉证据，并迭代应用局部代码修复。
    ja: ''
- id: "2506.16136"
  title: "Seeing is Fixing: Cross-Modal Reasoning with Multimodal LLMs for Visual Software Issue Fixing"
  url: "https://arxiv.org/abs/2506.16136"
  date: "2025.06"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Combines image-to-code understanding with code-to-image validation to close the loop on visual software issue repair.
    zh: 结合图像到代码理解与代码到图像验证，闭合视觉软件问题修复循环。
    ja: ''
- id: "2411.01606"
  title: "DesignRepair: Dual-Stream Design Guideline-Aware Frontend Repair with Large Language Models"
  url: "https://arxiv.org/abs/2411.01606"
  date: "2024.11"
  section: "1.1"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Jointly reasons over frontend source code and rendered views, using design guidelines to guide iterative visual repair.
    zh: 联合推理前端源码和渲染视图，并使用设计规范指导迭代式视觉修复。
    ja: ''
- id: "res:agent-visual-diff"
  title: agent-visual-diff
  url: "https://github.com/lbframe/agent-visual-diff"
  date: null
  section: "1.1"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Compares two PNGs and returns bounding boxes ranked by changed-pixel count in JSON. Optional shift detection flags content that moved together so an agent can inspect the layout and compare again after a fix.
    zh: 比较两张 PNG，以 JSON 返回按变化像素数排序的区域边界框。可选的位移检测会标出一起移动的内容，供 Agent 检查布局并在修改后再次比对。
    ja: ''
- id: "res:applitools-eyes-mcp"
  title: Applitools Eyes MCP
  url: "https://support.applitools.com/solutions/agentic-testing/"
  date: null
  section: "1.1"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Returns visual-diff regions, cropped images, and focused DOM context to coding agents, with explicit human authorization for saving baseline changes.
    zh: 向 Coding Agent 返回视觉差异区域、裁剪图和精简 DOM 上下文；保存基线变更需要明确的人工授权。
    ja: ''
- id: "demo:autoclaw-design"
  title: AutoClaw Design
  url: "https://autoclaw.z.ai/blog/product/product-brief-to-ui-design-with-autoclaw/"
  date: null
  section: "1.1"
  sub: tools
  type: demo
  scope: demo
  tldr:
    en: Combines reference-guided drafts, conversational or canvas edits, device previews and HTML/project exports; users review interactions and request corrections.
    zh: 结合参考素材生成、对话／画布编辑、设备预览和 HTML／项目导出，由用户检查交互并提出修正。
    ja: ''
- id: "res:figma-mcp-server"
  title: Figma MCP server
  url: "https://developers.figma.com/docs/figma-mcp-server/"
  demo: "https://www.figma.com/blog/the-figma-canvas-is-now-open-to-agents/"
  date: null
  section: "1.1"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Lets an agent inspect design context, generate implementation code, and create or update native Figma content.
    zh: 允许 Agent 检查设计上下文、生成实现代码，并创建或更新原生 Figma 内容。
    ja: ''
- id: "res:playwright-mcp"
  title: Playwright MCP
  url: "https://github.com/microsoft/playwright-mcp"
  date: null
  section: "1.1"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Exposes accessibility structure, screenshots, interaction, console and network evidence, and performance traces.
    zh: 暴露可访问性结构、截图、交互、控制台与网络证据，以及性能 Trace。
    ja: ''
- id: "res:reprosight"
  title: ReproSight
  url: "https://github.com/tungcorn/ReproSight"
  date: null
  section: "1.1"
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Gives an external coding agent browser geometry, screenshots, CSS source candidates, isolated workspaces, and target/regression checks before human review; its flagship demo uses a deterministic mock provider, not a real-model accuracy benchmark.
    zh: 向外部 Coding Agent 提供浏览器几何、截图、CSS 源码候选、隔离工作区及目标／回归检查，再交由人工审阅；其主要 Demo 使用确定性的模拟提供器，并非真实模型准确率基准。
    ja: ''
- id: "2611.03634"
  title: "WebHarbor: Docking Real Websites for Evolving GUI Agent Environments"
  url: "https://arxiv.org/abs/2611.03634"
  date: "2026.11"
  section: "1.2"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Builds resettable full-stack website environments through task-scoped coding and human visual/workflow audits, supporting reproducible GUI evaluation and operator training.
    zh: 通过任务限定的全栈编码与人工视觉／流程审阅，构造可重置网站环境，支持可复现 GUI 评测与操作者训练。
    ja: ''
- id: "2610.26828"
  title: "Agent World Model in the Wild: Computer-Use Agent Environment Synthesis"
  url: "https://arxiv.org/abs/2610.26828"
  date: "2026.10"
  section: "1.2"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Synthesizes replayable personal-computer worlds spanning GUI, MCP, and CLI, using heterogeneous rollouts and verifier-consistency gates to produce environment–task packages for computer-use training.
    zh: 合成覆盖 GUI、MCP 和 CLI 的可重放个人电脑世界，以异构执行轨迹和验证器一致性检查生成计算机使用训练的环境—任务包。
    ja: ''
- id: "2610.37567"
  title: "Gym-Anything-RT: Scaling Real-Time Environments for Vision-Language Agents"
  url: "https://arxiv.org/abs/2610.37567"
  date: "2026.10"
  section: "1.2"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds real-time visual minigames through creator–auditor code revisions grounded in screenshots and recordings, then controls the environment clock to isolate latency from task capability.
    zh: 通过依据截图和录像的 Creator—Auditor 代码修订构建实时视觉小游戏，再控制环境时钟以区分动作延迟与任务能力。
    ja: ''
- id: "2610.12611"
  title: "SoftwareGym: Scaling Computer-Use Agent Training with Diverse Synthesized Software Environments"
  url: "https://arxiv.org/abs/2610.12611"
  date: "2026.10"
  section: "1.2"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Synthesizes native Avalonia applications, using screenshot-grounded GUI test trajectories to repair their source across fixed-case rounds before collecting computer-use training data.
    zh: 合成原生 Avalonia 应用，以截图驱动的 GUI 测试轨迹在固定用例下逐轮修复源码，再收集计算机操作训练数据。
    ja: ''
- id: "2610.30792"
  title: "Trace2World: Reconstructing App Worlds from Real Interaction Traces for Scalable GUI Agent Training"
  url: "https://arxiv.org/abs/2610.30792"
  date: "2026.10"
  section: "1.2"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconciles real interaction traces into a fixed app-behavior model, then uses independent screenshot-grounded replay to guide bounded package repair before synthesizing GUI-agent training tasks.
    zh: 先从真实交互轨迹确定应用行为，再以独立截图重放定位缺陷、约束环境代码修复，随后生成 GUI Agent 训练任务。
    ja: ''
- id: "2610.37786"
  title: "WebAnything: From the Wild Web to Scalable Agent Environments"
  url: "https://arxiv.org/abs/2610.37786"
  date: "2026.10"
  section: "1.2"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Reconstructs resettable web-agent environments from source-site observations, using independent visual and interaction checks to drive code repair or targeted recapture before producing operator-training tasks.
    zh: 依据源站观测重建可重置Web Agent环境，以独立视觉与交互检查驱动代码修复或定向补采，再构造操作者训练任务。
    ja: ''
- id: "2605.25624"
  title: "CUA-Gym: Scaling Verifiable Training Environments and Tasks for Computer-Use Agents"
  url: "https://arxiv.org/abs/2605.25624"
  date: "2026.05"
  section: "1.2"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Co-generates resettable software states, tasks, and executable rewards, returning disagreements between rollout screenshots and programmatic scores to the reward-writing agent for revision and another rollout.
    zh: 联合生成可重置的软件状态、任务与可执行奖励，将 rollout 截图判断与程序评分之间的分歧反馈给奖励编写 Agent，修改后重新执行验证。
    ja: ''
- id: "2610.19337"
  title: "Beyond Initial Creation: Two Decades of Community-based Chart Revisions from Wikimedia Commons"
  url: "https://arxiv.org/abs/2610.19337"
  date: "2026.10"
  section: "1.3"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Releases longitudinal metadata and edit labels for 7,786 revisions of 1,664 Wikimedia charts, providing human revision histories for studying changes beyond initial chart creation.
    zh: 发布 1,664 张 Wikimedia 图表、7,786 次修订的历史元数据与编辑标签，为初次创建之后的图表变化提供人类编辑数据。
    ja: ''
- id: "2610.02399"
  title: "VisAudit: Evaluating Multimodal Agents for Visual Diagnosis and Repair"
  url: "https://arxiv.org/abs/2610.02399"
  date: "2026.10"
  section: "1.3"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Diagnoses and revises visualization code through execution and rendered-chart feedback, separating defect recovery, preservation, and the decision to leave already-correct charts unchanged.
    zh: 通过执行与渲染图表反馈诊断并修订可视化代码，分别评测缺陷恢复、正确内容保持，以及对原本正确图表不作修改的判断。
    ja: ''
- id: "2609.38642"
  title: "ChartRevise: A Dataset and Evaluation Protocol for Exact Chart Editing via Code"
  url: "https://arxiv.org/abs/2609.38642"
  date: "2026.09"
  section: "1.3"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Builds program-grounded chart edits through before/after rendering and judge-guided repair, then measures exactness by separating explicit requirements, coupled updates, and unrelated changes.
    zh: 通过修改前后渲染与判定器引导的修复构建程序化图表编辑，并将显式要求、关联更新和无关改动分开衡量编辑精确性。
    ja: ''
- id: "2607.10301"
  title: "ChartSync: A Benchmark for Visuo-Logical Cascading Chart Editing"
  url: "https://arxiv.org/abs/2607.10301"
  date: "2026.07"
  section: "1.3"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether chart-image edits propagate changed values into the corresponding geometry while preserving unrelated content, using program-rendered, expert-curated targets and independent visual evaluation.
    zh: 以程序渲染、专家校正的目标图及独立视觉评测，检查图表图像编辑能否让数值变化同步反映到对应几何，同时保持无关内容不变。
    ja: ''
- id: "2603.25804"
  title: "RealChart2Code: Advancing Chart-to-Code Generation with Real Data and Multi-Task Evaluation"
  url: "https://arxiv.org/abs/2603.25804"
  date: "2026.03"
  section: "1.3"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Uses real charts and underlying data to evaluate generation, editing, and iterative chart-code refinement.
    zh: 使用真实图表及其底层数据，评测生成、编辑与迭代式 Chart-to-code。
    ja: ''
- id: "2603.29139"
  title: "SciVisAgentBench: A Benchmark for Evaluating Scientific Data Analysis and Visualization Agents"
  url: "https://arxiv.org/abs/2603.29139"
  date: "2026.03"
  section: "1.3"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Provides a rigorous multimodal, outcome-centric benchmark for scientific visualization agents without requiring a closed code-repair trajectory.
    zh: 提供严谨、以多模态结果为中心的科学可视化 Agent 评测，但不要求闭环代码修复轨迹。
    ja: ''
- id: "2602.15758"
  title: "ChartEditBench: Evaluating Grounded Multi-Turn Chart Editing in Multimodal Language Models"
  url: "https://arxiv.org/abs/2602.15758"
  date: "2026.02"
  section: "1.3"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks grounded multi-turn edits in which each visual instruction must be reflected in an updated chart artifact.
    zh: 评测有现实依据的多轮图表编辑，要求每条视觉指令都反映在更新后的图表产物中。
    ja: ''
- id: "2510.09724"
  title: "InteractScience: Programmatic and Visually-Grounded Evaluation of Interactive Scientific Demonstration Code Generation"
  url: "https://arxiv.org/abs/2510.09724"
  date: "2025.10"
  section: "1.3"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Combines programmatic interaction tests with visual comparison for generated scientific demonstrations, but stops at evaluation.
    zh: 将程序化交互测试与视觉比较结合来评估科学 Demo 代码，但流程止于评测。
    ja: ''
- id: "2611.10840"
  title: Simple Test-Time Refinement for Plot-to-Code Generation via Visual-Code Diagnostics
  url: "https://arxiv.org/abs/2611.10840"
  date: "2026.11"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Trains a compact verifier to localize discrepancies between reference and rendered charts in their plotting code, then guides patch-based refinement across repeated renders.
    zh: 训练小型验证器，将参考图与渲染图的差异定位到绘图代码，再通过反复渲染驱动局部补丁修复。
    ja: ''
- id: "2610.08106"
  title: "ChartBmkAgent: Harness-Governed Multi-Agent Construction of Chart QA Benchmarks from Sparse Error-Taxonomy Specifications"
  url: "https://arxiv.org/abs/2610.08106"
  date: "2026.10"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Constructs diagnostic chart-QA samples from sparse error descriptions, using evidence-gated multimodal critique to revise plotting programs while preserving frozen data and the intended error mechanism.
    zh: 从稀疏错误描述构建诊断性图表问答，以证据门控的多模态批评修订绘图程序，同时保持冻结数据及预定错误机制。
    ja: ''
- id: "2610.28282"
  title: "ChartEvo: Self-Evolving Agent Harnesses for Long-Tail Chart Reasoning"
  url: "https://arxiv.org/abs/2610.28282"
  date: "2026.10"
  section: "1.3"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Evolves chart-specific skills, executable visual/numerical tools, and reusable toolchains using supervised task feedback, then reuses them for long-tail chart reasoning.
    zh: 利用有监督任务反馈演化图表专用 Skills、可执行视觉／数值工具及可复用工具链，支持长尾图表推理。
    ja: ''
- id: "2610.06852"
  title: "One Figure, Every Canvas: Editable Flowchart Relayout via Agentic Pipeline"
  url: "https://arxiv.org/abs/2610.06852"
  date: "2026.10"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Relayouts raster flowcharts into editable draw.io XML for new aspect ratios, combining graph and layout constraints with rendered visual critiques to correct parsing, styling, and placement.
    zh: 把栅格流程图重排为适应新画布比例的可编辑 draw.io XML，结合图结构、布局约束和渲染视觉点评，纠正解析、风格与摆放。
    ja: ''
- id: "2610.41260"
  title: "SketchDirector: Complex Scene Sketching via Agentic Layout Reasoning and Detail Refinement"
  url: "https://arxiv.org/abs/2610.41260"
  date: "2026.10"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds editable scene sketches through object-level SVG programs, revises layouts using geometric and visual-semantic feedback with reusable memory, and then refines curves with diffusion priors.
    zh: 通过对象级 SVG 程序构建可编辑场景草图，以几何与视觉语义反馈及可复用记忆修订布局，再用扩散先验细化曲线。
    ja: ''
- id: "2610.13502"
  title: "Stride: Scale-Aware Multi-Agent Evolutionary Refinement for Infographic Generation"
  url: "https://arxiv.org/abs/2610.13502"
  date: "2026.10"
  section: "1.3"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Routes infographic failures between frozen-generator redraws and localized text/formula repairs using separate rubric verification and visual grounding, retaining only candidates with improved internal scores.
    zh: 结合独立的约束评分与视觉定位，将信息图错误分派给冻结生成器重画或局部文字／公式修补，并保留内部评分提升的候选。
    ja: ''
- id: "2609.16598"
  title: "CATVis: A Collaborative Multi-Agent Workflow for Turbomachinery Simulation Data Visualization"
  url: "https://arxiv.org/abs/2609.16598"
  date: "2026.09"
  section: "1.3"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Converts turbomachinery analysis requests into executable visualization DAGs through staged planning and error-aware refinement, leaving visual camera and workflow adjustments to an interactive human review step.
    zh: 通过分阶段规划和错误感知修订，将涡轮机械分析需求转为可执行可视化 DAG，并由交互式人工审阅进一步调整相机与工作流。
    ja: ''
- id: "2609.32413"
  title: "IChart2Code: Benchmarking Multimodal Large Language Models for Interactive Chart Code Generation"
  url: "https://arxiv.org/abs/2609.32413"
  date: "2026.09"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Benchmarks chart appearance, data fidelity, and interactive state changes, with TRAIL using browser-observed trajectories to diagnose failures and revise HTML/JavaScript.
    zh: 同时评测图表外观、数据忠实度与交互状态变化，TRAIL 根据浏览器观测轨迹诊断失败并修订 HTML/JavaScript。
    ja: ''
- id: "2609.14874"
  title: "MedVA: An End-to-End Neuro-Symbolic Agentic System for Medical Volume Visualization"
  url: "https://arxiv.org/abs/2609.14874"
  date: "2026.09"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Builds structured JSON visualization specifications and refines ROI opacity using renderer-computed full-scene versus isolated visibility, combining anatomical ontology checks with multi-model segmentation.
    zh: 构建结构化 JSON 可视化规格，根据渲染器测得的完整场景与独立区域可见性迭代调整 ROI 不透明度，并结合解剖本体检查与多模型分割。
    ja: ''
- id: "2609.33386"
  title: "SIVIA-RSI: Source-Grounded Adaptation of Diagramming Skills"
  url: "https://arxiv.org/abs/2609.33386"
  date: "2026.09"
  section: "1.3"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Adapts reusable raster-diagram instructions from source-linked visual critiques and evaluates every proposed skill on fresh diagrams, separating selection preference from cross-paper relation fidelity.
    zh: 根据关联源段落的视觉批评调整可复用栅格绘图指令，并用全新图像评测每个候选，区分选择偏好与跨论文关系忠实度。
    ja: ''
- id: "2609.15182"
  title: "VisInteract: Towards Dynamic Interactive Text-to-Visualization under Imperfect Queries"
  url: "https://arxiv.org/abs/2609.15182"
  date: "2026.09"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Executes Altair programs and uses a simulated user's rendered-chart critiques and textual clarifications to steer subsequent code search toward underspecified visualization intent.
    zh: 执行 Altair 程序，让模拟用户评阅渲染图表，并将视觉点评与文字澄清反馈用于后续代码搜索，逐步还原不完整需求中的可视化意图。
    ja: ''
- id: "2608.00548"
  title: "DrawAI: Agentic Benchmark and Workflow for Making Raster Images Editable"
  url: "https://arxiv.org/abs/2608.00548"
  demo: "https://github.com/Renaissance-Mind/DrawAI"
  date: "2026.08"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Turns raster references into editable structured graphics through an agentic generation, rendering, and correction workflow.
    zh: 通过 Agentic 生成、渲染与修正流程，将 Raster 参考图转成可编辑结构化图形。
    ja: ''
- id: "2609.16014"
  title: "ViCo: Visual-oriented Coding with Self-Reflection for Chart Replication"
  url: "https://arxiv.org/abs/2609.16014"
  date: "2026.08"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Trains chart-coding agents to compare their previous render with a reference, turn discrepancies into explicit reflections, and implement those reflections through counterfactual-credit-guided code refinement.
    zh: 训练图表编程 Agent 对比上一轮渲染与参考图，将差异写成明确反思，并通过反事实信用分配指导代码修订、落实反思。
    ja: ''
- id: "2608.10408"
  title: "VisEditBench: Can Vision-Language Models Edit Visualization Code from Multimodal Feedback?"
  url: "https://arxiv.org/abs/2608.10408"
  date: "2026.08"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Introduces chart-repair and restyling tasks plus VisEditAgent, whose execution and visual-validation loop refines candidate code while preserving data semantics.
    zh: 提出图表修复与风格迁移任务，并以 VisEditAgent 反复执行、视觉验证和修改候选代码，同时保持数据语义。
    ja: ''
- id: "2607.09839"
  title: Exploring Agentic Workflows for Generating High Quality Math Visual Aids
  url: "https://arxiv.org/abs/2607.09839"
  date: "2026.07"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Generates TikZ diagrams, asks QA questions about the rendered image, and feeds unsatisfied visual checks into subsequent code regeneration.
    zh: 生成 TikZ Diagram，对渲染图像提出 QA 问题，并把未满足的视觉检查反馈给后续代码再生成。
    ja: ''
- id: "2607.28073"
  title: "GVR-Coder: A Visual-Feedback Framework for Structured SVG Generation in Complex Document and Meeting Scenarios"
  url: "https://arxiv.org/abs/2607.28073"
  date: "2026.07"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Implements a generate-visualize-refine loop for structured SVG programs under complex document requirements.
    zh: 在复杂文档需求下，为结构化 SVG 程序实现“生成—可视化—细化”循环。
    ja: ''
- id: "2607.27699"
  title: "RefineSVG: Visual Feedback-Driven Reinforcement Learning for Image-to-SVG Generation"
  url: "https://arxiv.org/abs/2607.27699"
  date: "2026.07"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Renders an initial SVG, converts target-versus-render residuals into correction signals, and trains a draft-then-refine policy.
    zh: 渲染初始 SVG，将目标与渲染残差转为纠错信号，并训练 Draft-then-refine 策略。
    ja: ''
- id: "2605.23527"
  title: "LiveFigure: Generating Editable Scientific Illustration with VLM Agents"
  url: "https://arxiv.org/abs/2605.23527"
  date: "2026.05"
  section: "1.3"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Generates editable scientific figures as executable artifacts and uses visual feedback to diagnose and revise them.
