    en: 50-task RoboTwin success · three real-robot tasks with task-specific demonstrations · action-selection, memory and
      expert ablations; future video generation is used in training, not explicit inference-time rollout scoring.
    zh: 50 项 RoboTwin 任务成功率 · 使用任务示教训练的三项实机任务 · 动作选择、记忆与专家消融；未来视频生成用于训练，不是推理时的显式视频试演评分。
  tags:
  - Method
  - Training
  - Inference
  - Environment
  - Verification
- id: '2610.34186'
  title: 'HuGe: Scaling Humanoid Generalist Vision-Language-Action Models with Egocentric Experience'
  url: https://arxiv.org/abs/2610.34186
  date: '2026.10'
  section: '2.6'
  sub: null
  type: paper
  scope: adjacent
  tldr:
    en: Aligns egocentric human experience with humanoid observations and SONIC action latents for staged VLA training, connecting
      large-scale motion data to a frozen whole-body controller.
    zh: 将人类第一视角经验与人形机器人观测及 SONIC 动作潜变量对齐，用于分阶段 VLA 训练，并通过冻结全身控制器执行动作。
    ja: 人の一人称視点の経験を、人型ロボットの観測および SONIC の動作潜在表現と対応付けて段階的な VLA 訓練に使い、固定した全身コントローラーで動作を実行する。
  sources:
  - https://arxiv.org/abs/2610.34186
  - https://github.com/yliu-cs/HuGe
  - https://yliu-cs.github.io/HuGe/
  verification:
    en: HumanoidArena simulation · pseudo-proprioception/data ablations · 30 trials per configuration on one G1 pick-and-drop
      task; limited hardware scope.
    zh: HumanoidArena 仿真 · 伪本体状态／数据消融 · 单项 G1 抓取放置每配置 30 次试验；实机验证范围有限。
  tags:
  - Method
  - Data Curation
  - Training
- id: '2606.19930'
  title: 'MobileForge: Annotation-Free Adaptation for Mobile GUI Agents with Hierarchical Feedback-Guided Policy Optimization'
  url: https://arxiv.org/abs/2606.19930
  date: '2026.06'
  section: '1.2'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Adapts mobile GUI operators by mining tasks from real-app exploration, reusing visual-critic hints across attempts,
      and converting selected decisions into feedback-conditioned step-level policy updates.
    zh: 从真实 App 探索中挖掘任务，跨尝试复用视觉 Critic 的纠错提示，并把优选决策转为带反馈条件的步骤级策略更新。
    ja: 実際のアプリ探索からタスクを抽出し、視覚 Critic の修正指示を試行間で再利用する。優れた判断をフィードバック条件付きのステップ単位の方策更新に変換する。
  sources:
  - https://arxiv.org/abs/2606.19930
  - https://github.com/kwai/MobileForge
  - https://huggingface.co/collections/lgy0404/mobileforge-datasets
  - https://mobile-forge.github.io/
  verification:
    en: AndroidWorld Pass@1/2/3 · held-out MobileWorld transfer · hint, evaluator and task-filtering ablations; learns the
      operator rather than constructing the app.
    zh: AndroidWorld Pass@1/2/3 · 留出 MobileWorld 泛化 · 提示、评估器与任务筛选消融；学习对象是操作者。
  tags:
  - Method
  - Dataset
  - Training
  - Verification
- id: '2610.36925'
  title: Vision-Language Agents Can Learn in Their Own Latent Worlds
  url: https://arxiv.org/abs/2610.36925
  date: '2026.10'
  section: '2.4'
  sub: null
  type: paper
  scope: adjacent
  tldr:
    en: Shares a frozen VLM backbone between latent-world and policy adapters, using imagined transitions and environment
      experience to improve visual decisions without reconstructing future images.
    zh: 让潜在世界模型与策略适配器共享冻结 VLM 主干，结合想象转移和环境经验改进视觉决策，无需生成未来图像。
    ja: 潜在世界モデルと方策アダプターで重みを固定した VLM 基盤を共有し、想像上の状態遷移と環境での経験を組み合わせて、未来画像を生成せずに視覚的な意思決定を改善する。
  sources:
  - https://arxiv.org/abs/2610.36925
  - https://github.com/Tom111-lhx/Dwell
  verification:
    en: Five visual/simulated environments · matched interaction budgets · task-dependent success/compute gains; EB-ALFRED
      uses a fixed world model and behavior-cloning support.
    zh: 五类视觉／仿真环境 · 相同交互预算 · 因任务而异的成功率与计算收益；EB-ALFRED使用固定世界模型与行为克隆辅助。
  tags:
  - Method
  - Training
  - Environment
  - Verification
- id: '2610.36013'
  title: 'OmniBrain-0: A Unified Agentic Model for Embodied Intelligence'
  url: https://arxiv.org/abs/2610.36013
  date: '2026.10'
  section: '3.5'
  sub: post-training
  type: paper
  scope: adjacent
  tldr:
    en: Consolidates manipulation and navigation experts into a compact multimodal agent that coordinates specialist tools,
      while rubric-guided feedback supplies reminders and verified trajectories for further learning.
    zh: 将操控与导航专家蒸馏为紧凑的多模态 Agent 来协调专用工具，并把 rubric 引导的执行反馈转为提醒与已验证轨迹以持续学习。
    ja: 操作とナビゲーションのエキスパートを小型のマルチモーダル Agent に蒸留して専用ツールを調整する。評価基準に沿った実行フィードバックを注意事項と検証済み軌跡に変換し、継続学習に利用する。
  sources:
  - https://arxiv.org/abs/2610.36013
  - https://github.com/luo-yc17/OmniBrain-0
  - https://public-bots.github.io/OmniBrain-0/
  verification:
    en: Five simulated task suites · tool-matched distillation/RSI ablations · three real manipulation tasks, 20 trials per
      task and method; low-level skill reliability remains a dependency.
    zh: 五组仿真任务 · 相同工具条件下的蒸馏／RSI消融 · 三项实机操控、每任务每方法20次试验；仍依赖底层技能可靠性。
  tags:
  - Method
  - Training
  - Inference
  - Verification
- id: system:mka
  title: 'MKA: Evaluating Multimodal Knowledge Agents on end-to-end professional tasks'
  url: https://storage.googleapis.com/deepmind-media/papers/mka_tech_paper.pdf
  date: '2026.11'
  section: '1.4'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates visual multi-file knowledge work and professional deliverables with a shared tool harness, expert-weighted
      rubrics and a separate visual/programmatic autorater.
    zh: 通过统一工具Harness、专家加权准则及独立视觉／程序化评审器，评估视觉多文件知识工作与专业交付物。
    ja: 統一されたツール Harness、専門家による重み付きの基準、独立した視覚・プログラム評価器を使い、視覚情報を伴う複数ファイルの知識作業と専門的な成果物を評価する。
  sources:
  - https://storage.googleapis.com/deepmind-media/papers/mka_tech_paper.pdf
  - https://artificialanalysis.ai/evaluations/mka
  - https://huggingface.co/datasets/google/multimodal-knowledge-agent
  verification:
    en: 200 private tasks · image-tool ablation · 50-task autorater agreement study · 10 disjoint public showcase tasks; final
      grading is separate from the generation trajectory.
    zh: 200个私有任务 · 看图工具消融 · 50任务评审一致性研究 · 10个不重叠公开示例；最终评分与生成轨迹分离。
  tags:
  - Benchmark
  - Dataset
  - Inference
  - Verification
- id: '2610.38425'
  title: 'IntReal: A Real-World Dataset and Benchmark for Multimodal Interleaved Generation'
  url: https://arxiv.org/abs/2610.38425
  date: '2026.10'
  section: '1.4'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Pairs real-source interleaved text–image data with specialist evaluators for holistic quality and context-conditioned
      fidelity, distinguishing post-generation evaluation from the generator’s own feedback loop.
    zh: 结合真实来源的图文交错数据与专家评测器，分别诊断整体质量和上下文条件下的图像忠实度，并区分生成后评测与生成器自身的反馈闭环。
    ja: 実際の出典に由来する画像と文章が交互に現れるデータと専門評価器を組み合わせ、全体品質と文脈条件下での画像の忠実度を別々に診断する。生成後の評価と生成器自身のフィードバックループを区別する。
  sources:
  - https://arxiv.org/abs/2610.38425
  - https://github.com/yushaohan/IntReal
  - https://huggingface.co/datasets/yushaohan/IntReal-100K
  - https://yushaohan.github.io/IntReal/
  verification:
    en: 600 test tasks across four categories · seven metrics · expert-preference agreement · selected cross-judge ranking
      checks · post-training utility; image-count and human-preference checks are distinct.
    zh: 四类共 600 项测试任务 · 七项指标 · 专家偏好一致性 · 部分指标的跨评测器排名核对 · 后训练效果；图像数量检查与人工偏好验证分开。
  tags:
  - Benchmark
  - Dataset
  - Training
  - Verification
- id: '2611.01815'
  title: When Does Latent Prediction Error Support Physical Surprise Claims in Video World Models?
  url: https://arxiv.org/abs/2611.01815
  date: '2026.11'
  section: '3.3'
  sub: null
  type: paper
  scope: adjacent
  tldr:
    en: Tests whether a video world model’s native prediction error distinguishes physical violations from appearance changes
      and whether a fixed threshold transfers to new scenes.
    zh: 检验视频世界模型的原生预测误差能否区分物理违规与外观变化，以及固定阈值能否迁移到新场景。
    ja: 動画世界モデル本来の予測誤差が、物理的な違反と外観の変化を区別できるか、また固定した閾値を新しいシーンへ転用できるかを検証する。
  sources:
  - https://arxiv.org/abs/2611.01815
  - https://github.com/3-ml/jepa-surprise
  verification:
    en: Matched action and appearance controls · error ordering · false alarms and misses after threshold transfer.
    zh: 动作与外观对照、误差排序，以及阈值迁移后的误报和漏报。
  tags:
  - Benchmark
  - Verification
- id: '2610.31670'
  title: 'Sensorimotor Alignment: A Platonic Proxy for Embodied Policy Success'
  url: https://arxiv.org/abs/2610.31670
  date: '2026.10'
  section: '3.1'
  sub: capability-eval
  type: paper
  scope: adjacent
  tldr:
    en: Measures alignment between sensory embeddings and recorded motion neighborhoods as an offline proxy for prioritizing
      embodied models before costly closed-loop evaluation.
    zh: 度量感知嵌入与已记录运动轨迹的近邻结构一致性，为昂贵闭环评测前的具身模型筛选提供离线代理指标。
    ja: 知覚埋め込みと記録された運動軌跡の近傍構造の一致を測り、高価な閉ループ評価の前に具身モデルを選別するためのオフライン代理指標を提供する。
  sources:
  - https://arxiv.org/abs/2610.31670
  - https://github.com/yunfeixie233/sensorimotor-alignment
  - https://yunfeixie233.github.io/s2/
  verification:
    en: Cross-family correlations · embodiment mismatch and confound controls · reused hardware results; the strongest real-policy
      correlation uses an exploratory horizon.
    zh: 跨模型家族相关性 · 具身不匹配与混杂控制 · 复用实机结果；最强真实策略相关性来自探索性时间范围。
  tags:
  - Benchmark
  - Verification
- id: '2611.03626'
  title: 'Isekai3D SDG: A Platform for Diverse Synthetic Gameplay Visual Data'
  url: https://arxiv.org/abs/2611.03626
  date: '2026.11'
  section: '1.6'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Records gameplay state, actions, and camera tracks once in Unreal Engine, then replays the same events under different
      capture settings to generate aligned visual training data.
    zh: 在 Unreal Engine 中一次记录游戏状态、动作与相机轨迹，再用不同采集设置回放同一事件，生成对齐的视觉训练数据。
    ja: Unreal Engine でゲーム状態、動作、カメラ軌道を一度記録し、同じ出来事を異なる取得設定で再生して、対応の取れた視覚訓練データを生成する。
  sources:
  - https://arxiv.org/abs/2611.03626
  - https://research.nvidia.com/publication/2026-10_isekai3d-sdg-platform-diverse-synthetic-gameplay-visual-data
  verification:
    en: Replay alignment · camera and rendering controls · RGB/depth outputs; data-generation platform.
    zh: 回放对齐、相机与渲染控制、RGB／深度输出；属于数据生成平台。
  tags:
  - Method
  - Data Curation
- id: '2610.37257'
  title: 'GameVerse: A Minute-Scale Gameplay Dataset for Long-Horizon Interactive World Modeling'
  url: https://arxiv.org/abs/2610.37257
  date: '2026.10'
  section: '2.4'
  sub: null
  type: paper
  scope: adjacent
  tldr:
    en: Pairs minute-scale gameplay clip metadata with estimated camera trajectories and hierarchical scene/action captions
      to support long-horizon video world modeling; the release provides annotations and source timestamps rather than redistributing
      MP4s.
    zh: 将分钟级游戏片段索引与估计相机轨迹、分层场景／动作描述配对，用于长时序视频世界建模；实际发布标注与源视频时间戳，不再分发 MP4。
    ja: 分単位のゲーム動画の索引を、推定カメラ軌道と階層的なシーン・動作記述に対応付け、長期的な動画世界モデリングに用いる。公開物は注釈と元動画のタイムスタンプで、MP4 は再配布しない。
  sources:
  - https://arxiv.org/abs/2610.37257
  - https://github.com/kangverse/GameVerse
  - https://huggingface.co/datasets/Kangverse/GameVerse
  - https://kangverse.github.io/GameVerse/
  verification:
    en: Same-backbone fine-tuning · 30-second VBench/WorldScore evaluation · caption audit · release metadata and samples;
      non-commercial research license.
    zh: 同骨干微调 · 30秒VBench／WorldScore评测 · 描述人工审查 · 发布清单与样例；非商业研究许可。
  tags:
  - Dataset
  - Data Curation
  - Training
  - Verification
- id: '2611.05163'
  title: 'RoboTryOn: Synthesizing Dexterous Robot Demonstrations from Human Videos via Virtual Try-On'
  url: https://arxiv.org/abs/2611.05163
  date: '2026.11'
  section: '3.4'
  sub: synthetic-data
  type: paper
  scope: adjacent
  tldr:
    en: Translates human demonstrations into target-robot videos, infers pseudo-actions with inverse dynamics and wrist correction,
      and uses the resulting data to train policies evaluated on two real robot platforms.
    zh: 将真人示范转换为目标机器人视频，通过逆动力学和腕部校正生成伪动作，训练策略并在两种真实机器人上评估。
    ja: 人の実演を対象ロボットの動画へ変換し、逆動力学と手首補正で疑似動作を生成する。方策を訓練し、二種類の実機ロボットで評価する。
  sources:
  - https://arxiv.org/abs/2611.05163
  - https://ryan-seungyong-lee.github.io/RoboTryOn
  verification:
    en: Open-loop action replay in simulation · two real robots and 11 tasks · visual/action-gap ablations.
    zh: 仿真开环动作回放、两种实机与 11 个任务、视觉及动作差距消融。
  tags:
  - Method
  - Data Curation
  - Training
- id: '2611.06083'
  title: 'SleuthVLM: Do We Really Need Audio-in-Video for Omni Video Understanding?'
  url: https://arxiv.org/abs/2611.06083
  date: '2026.11'
  section: '2.5'
  sub: null
  type: paper
  scope: adjacent
  tldr:
    en: Uses timed transcription as an index for a VLM to inspect frames and clips adaptively, with an optional audio-model
      tool for evidence that speech transcripts cannot supply.
    zh: 将带时间戳的转写用作索引，让 VLM 自适应查看帧与片段，并可调用音频模型补充语音转写无法提供的证据。
    ja: タイムスタンプ付きの文字起こしを索引として使い、VLM がフレームやクリップを適応的に確認する。音声モデルを呼び出し、文字起こしでは得られない証拠を補うこともできる。
  sources:
  - https://arxiv.org/abs/2611.06083
  - https://wpr001.github.io/sleuthVLM/
  verification:
    en: Four audiovisual QA benchmarks · transcript/timestamp ablations · optional audio-captioning study · logged access
      audit; evidence acquisition rather than artifact repair.
    zh: 四个音视频问答基准、转写／时间戳消融、可选音频描述工具实验及访问日志审计；验证的是证据获取而非产物修复。
  tags:
  - Method
  - Inference
  - Verification
- id: '2609.15818'
  title: 'Atria Dawn: The Dawn of Agentic Superintelligence'
  url: https://arxiv.org/abs/2609.15818
  date: '2026.09'
  section: '1.7'
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Trains an agentic model through externally verified tool interactions and illustrates interactive applications and
      CAD generation, offering a foundation for artifact-building workflows alongside a study of human–AI collaboration.
    zh: 通过外部验证的工具交互训练 Agent 模型，展示交互应用与 CAD 生成，为产物构建工作流提供基础，并研究人机协作中的责任分工。
    ja: 外部で検証したツール操作を通じて Agent モデルを訓練し、対話型アプリと CAD の生成を示す。成果物構築の基盤を提供するとともに、人と AI の協働における責任分担を研究する。
  sources:
  - https://arxiv.org/abs/2609.15818
  - https://huggingface.co/internlm/Atria-Dawn-Preview
  - https://www.atria-asi.ai/
  verification:
    en: ''
    zh: ''
  tags:
  - System
  - Training
  - Inference
- id: '2610.41432'
  title: 'Hybrid Computer Use: A Unified Programmatic, Semantic, and Visual Interface for General Agents'
  url: https://arxiv.org/abs/2610.41432
  date: '2026.10'
  section: '1.2'
  sub: tools
  type: paper
  scope: adjacent
  tldr:
    en: Lets agents combine programmatic tools, accessibility actions and visual interaction, using live-state guards, batched
      verification and returned AX changes to guide subsequent operations.
    zh: 让 Agent 组合程序工具、可访问性动作与视觉交互，通过实时状态检查、批次内验证及返回的 AX 变化指导后续操作。
    ja: Agent がプログラムによるツール、アクセシビリティ操作、視覚的な操作を組み合わせ、実時間の状態確認、バッチ内の検証、返された AX の変化によって後続の操作を導く。
  sources:
  - https://arxiv.org/abs/2610.41432
  verification:
    en: OSWorld comparisons · channel/skill ablations · macOS, Windows and browser workflows · cost and stale-target recovery;
      AX changes are semantic state feedback.
    zh: OSWorld 对比、通道／Skill 消融、macOS／Windows／浏览器流程、成本与过期目标恢复；AX 变化属于语义状态反馈。
  tags:
  - Method
  - Inference
  - Verification
- id: res:moviedit
  title: MoviEdit
  url: https://arxiv.org/abs/2611.02737
  date: ''
  section: '2.2'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Source video + edit text or edited reference frames → consistently edited multi-shot video. A global draft guides
      full-resolution autoregressive editing; 64-video/128-scenario benchmark materials accompany the method. The project
      provides demonstrations and evaluation manifests, without a released model download.
    zh: 源视频＋编辑文字或编辑后的参考帧 → 跨镜头一致的编辑视频。以全局草稿指导全分辨率自回归编辑，配套64视频／128场景评测；项目提供演示和评测清单，尚无模型下载入口。
    ja: 元動画と編集指示、または編集後の参照フレームから、ショット間で一貫した編集動画を生成する。全体の下書きでフル解像度の自己回帰編集を導き、64 動画・128 シーンの評価を備える。デモと評価一覧は公開されているが、モデルのダウンロード先はまだない。
  sources:
  - https://arxiv.org/abs/2611.02737
  - https://multi-shot-edit.github.io/
  - https://multi-shot-edit.github.io/benchmark.html
- id: res:semo3d
  title: SeMo3D
  url: https://arxiv.org/abs/2611.02568
  date: ''
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Reference image, optional text/points, edit region and cached latents → textured 3D asset. Selectively models geometry
      and texture while preserving untouched regions; an agent can combine image generation with successive user-requested
      edits. Code and weights are announced but not yet released.
    zh: 参考图、可选文本／点、编辑区域及缓存潜变量 → 带纹理三维资产。选择性生成几何和纹理，保留未编辑区域；Agent 可组织图像生成与用户连续提出的局部修改。代码与权重已公告、尚未发布。
    ja: 参照画像、任意のテキストや点、編集領域、キャッシュした潜在変数から、テクスチャ付き 3D アセットを生成する。幾何とテクスチャを選択的に生成して未編集領域を保持し、Agent は画像生成とユーザーの連続した局所修正を組み合わせられる。コードと重みは予告されているが未公開。
  sources:
  - https://arxiv.org/abs/2611.02568
  - https://xiaokunsun.github.io/SeMo3D.github.io/
- id: res:know-then-draw-a-new-learning-paradigm-for-visual-generation
  title: 'Know, then Draw: A New Learning Paradigm for Visual Generation'
  url: https://arxiv.org/abs/2610.37626
  date: ''
  section: '2.1'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Text → semantic autoregressive tokens → diffusion-rendered image. Separates semantic acquisition from pixel rendering,
      using language-supervised visual tokens to condition a diffusion renderer; provides a paper-described text-to-image
      generation component.
    zh: 文本 → 自回归语义 token → 扩散渲染图像。将语义学习与像素渲染分开，用语言监督的视觉 token 为扩散渲染器提供条件；为文本生图提供语义与渲染分工的模型组件。
    ja: テキストから自己回帰的な意味トークンを生成し、拡散モデルで画像を描画する。意味学習とピクセル描画を分離し、言語で教師付けした視覚トークンを条件として使う、テキストからの画像生成に向けたモデル部品。
  sources:
  - https://arxiv.org/abs/2610.37626
- id: res:omnishowcase-omnidirectional-subject-consistent-video-generation-from-multi-view-images
  title: 'OmniShowcase: Omnidirectional Subject-Consistent Video Generation from Multi-View Images'
  url: https://arxiv.org/abs/2610.35684
  date: ''
  section: '2.2'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Multiple reference images + motion prompt → subject-consistent video, conditioned on reconstructed surface-normal
      turntables. Combines multi-view reconstruction with a LoRA-adapted video generator for viewpoint changes around static
      subjects; non-rigid motion remains limited, and code/data release is planned.
    zh: 多张参考图 + 相机运动提示 → 以重建法线转台为条件的主体一致视频。结合多视角重建与 LoRA 视频生成器，支持围绕静态主体的视角变化；非刚体运动仍受限，代码和数据处于发布计划中。
    ja: 複数の参照画像とカメラ移動の指示から、再構成した法線のターンテーブルを条件に、被写体が一貫した動画を生成する。多視点再構成と LoRA 動画生成器を組み合わせて静的な被写体の周囲の視点変化に対応するが、非剛体の運動には制限があり、コードとデータは公開予定。
  sources:
  - https://arxiv.org/abs/2610.35684
  - https://github.com/justin4ai/OmniShowcase
  - https://justin4ai.github.io/OmniShowcase/
- id: res:hairdeck-animation-ready-stylized-hair-cards-from-a-single-image
  title: 'HairDeck: Animation-Ready Stylized Hair Cards from a Single Image'
  url: https://arxiv.org/abs/2610.40599
  date: ''
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Single image → separate hair-card geometry, per-card UVs and spring-bone chains; GLB / VRM export. Uses set diffusion
      to generate artist-style hair primitives and a second model for their animation rig; supplies editable avatar assets,
      with no texture generation or agent repair loop.
    zh: 单张图像 → 独立发片几何、逐片 UV 和弹簧骨链；支持 GLB／VRM 导出。用集合扩散生成艺术家式发片基元，再由第二模型生成动画骨链，为角色工作流提供可编辑资产；不生成纹理，也不自带 Agent 修复闭环。
    ja: 一枚の画像から独立したヘアカードの幾何、各カードの UV、スプリングボーンの鎖を生成し、GLB／VRM に書き出せる。集合拡散と別のボーン生成モデルで編集可能なキャラクター用アセットを作る。テクスチャ生成や Agent の修正ループは含まない。
  sources:
  - https://arxiv.org/abs/2610.40599
  - https://github.com/hyz317/HairDeck
  - https://huggingface.co/hyz317/HairDeck
- id: res:texture-consolidation-of-generated-multi-view-renderings
  title: Texture Consolidation of Generated Multi-View Renderings
  url: https://arxiv.org/abs/2610.36098
  date: ''
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: UV-atlased triangle mesh + sparse renders/photos + camera parameters → one coherent color texture. Aligns multi-view
      appearance with mesh-based optical flow and confidence-aware gradient-domain stitching; complements image generators
      while preserving the mesh geometry.
    zh: 带 UV 图集的三角网格 + 稀疏渲染／照片 + 相机参数 → 连贯颜色纹理。以网格光流和置信度加权的梯度域拼接对齐多视图外观，在保留网格几何的同时补充图像生成器的纹理整合能力。
    ja: UV アトラス付き三角形メッシュ、少数のレンダリング画像や写真、カメラ情報から、一貫した色テクスチャを生成する。メッシュの光フローと信頼度付きの勾配領域合成で多視点の外観を合わせ、幾何を保持したまま画像生成器のテクスチャ統合を補う。
  sources:
  - https://arxiv.org/abs/2610.36098
  - https://github.com/hliuw/TextureConsolidation
- id: res:dynamesh
  title: DynaMesh
  url: https://arxiv.org/abs/2610.05529
  date: ''
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Mesh + effect prompt → one fixed mesh with a time-varying texture sequence. Combines a reference video with temporal
      conditioning and per-shape adapters on a 3D generator; appearance evolves while geometry stays fixed, supplying reusable
      surface effects rather than physical dynamics.
    zh: Mesh + 效果提示词 → 固定 mesh 与随时间变化的纹理序列。将参考视频与 3D 生成器的时序条件、逐形状适配器结合；几何固定而外观演化，可为资产工作流提供表面效果，不是物理动力学模拟。
    ja: メッシュと効果の指示から、固定したメッシュと時間変化するテクスチャ列を生成する。参照動画、3D 生成器の時間条件、形状別のアダプターを組み合わせる。幾何を変えずに表面の外観を変化させる機能であり、物理的な動力学シミュレーションではない。
  sources:
  - https://arxiv.org/abs/2610.05529
  - https://threedle.github.io/dynamesh/
- id: res:tex-zero
  title: Tex-Zero
  url: https://arxiv.org/abs/2609.34621
  date: ''
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Geometry + multiview reference images → geometry-aligned 3D surface colors. Learns a shared image/texture representation
      from image-derived training samples, providing a texturing capability without requiring real textured 3D assets for
      training.
    zh: 几何 + 多视图参考图 → 与几何对齐的 3D 表面颜色。用图像构造的训练样本学习图像／纹理共享表示，提供不依赖真实带纹理 3D 资产作为训练数据的纹理生成能力。
    ja: 幾何と多視点の参照画像から、幾何に整合する 3D 表面色を生成する。画像から構成した訓練例で画像とテクスチャの共通表現を学び、実際のテクスチャ付き 3D アセットを訓練データとして必要としない。
  sources:
  - https://arxiv.org/abs/2609.34621
  - https://github.com/wangjiangshan0725/Tex-Zero
- id: res:videomatgen
  title: VideoMatGen
  url: https://arxiv.org/abs/2603.16566
  date: ''
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: UV-mapped mesh + text, optionally a reference image → base color, roughness, metallicity, and height maps. Jointly
      generates intrinsic material views with a video diffusion model and bakes them into renderable textures; a documented
      asset-generation capability, not evidence of agentic repair or physical transfer.
    zh: 带 UV 的 mesh + 文本，可选参考图 → 基色、粗糙度、金属度和高度贴图。用视频扩散模型联合生成材质本征属性的多视图，再烘焙为可渲染纹理；是已有文档说明的资产生成能力，不等于 Agent 自主修复或真实物理迁移。
    ja: UV 付きメッシュ、テキスト、任意の参照画像から、ベースカラー、粗さ、金属度、高さのマップを生成する。動画拡散モデルで材質の固有属性を多視点で共同生成し、描画可能なテクスチャへベイクする。文書化されたアセット生成機能であり、Agent
      の自律修正や実世界への物理転移を意味しない。
  sources:
  - https://arxiv.org/abs/2603.16566
  - https://research.nvidia.com/labs/rtr/publication/hasselgren2026videomatgen/
- id: res:l3g-world-real-time-infinite-world-generation-with-latent-3d-gaussian-memory
  title: 'L3G-World: Real-Time Infinite World Generation with Latent 3D Gaussian Memory'
  url: https://arxiv.org/abs/2610.40614
  date: ''
  section: '2.4'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Image + text + camera trajectory → video chunks and persistent latent 3D Gaussian memory. Alternates video diffusion
      with selective Gaussian-memory updates and renders memory directly into latent space for consistent revisits; predicts
      visual worlds, with code and checkpoints listed as planned releases.
    zh: 图像 + 文本 + 相机轨迹 → 视频块和持久潜在 3D 高斯记忆。交替运行视频扩散与选择性高斯记忆更新，将记忆直接渲染到潜空间以保持重访一致性；提供视觉世界预测，代码和权重仍列为待发布。
    ja: 画像、テキスト、カメラ軌道から動画ブロックと永続的な潜在 3D ガウス記憶を生成する。動画拡散と選択的な記憶更新を交互に行い、記憶を潜在空間へ直接描画して再訪時の一貫性を保つ。視覚的な世界予測を提供し、コードと重みは公開予定。
  sources:
  - https://arxiv.org/abs/2610.40614
  - https://cvlab-kaist.github.io/L3G-World/
  - https://github.com/cvlab-kaist/L3G-World
- id: res:when-black-box-robot-policies-fail-online-sensor-diagnosis-and-repair-with-a-transparent-surrogate
  title: 'When Black-Box Robot Policies Fail: Online Sensor Diagnosis and Repair with a Transparent Surrogate'
  url: https://arxiv.org/abs/2610.36852
  date: ''
  section: '2.6'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Sensor streams + frozen-policy actions + healthy gait references → fault diagnosis and repaired policy inputs. MBD/PRR
      uses an additive surrogate to diagnose sensor faults and repair inputs without policy gradients; evaluated on simulated
      quadrupeds, with no demonstrated LLM orchestration or hardware deployment.
    zh: 传感器流 + 冻结策略动作 + 健康步态参考 → 故障诊断与修复后的策略输入。MBD／PRR通过可加性代理诊断传感器故障并修复输入，无需策略梯度；验证限于仿真四足机器人，未展示LLM编排或硬件部署。
    ja: センサーストリーム、固定した方策の動作、正常歩行の参照から、故障診断と修復済みの方策入力を得る。MBD／PRR は加法的な代理モデルでセンサーを診断・補正し、方策の勾配を必要としない。検証は模擬四足ロボットに限られ、LLM による編成や実機配備は示していない。
  sources:
  - https://arxiv.org/abs/2610.36852
- id: res:genie-4
  title: Genie 4
  url: https://deepmind.google/blog/genie-4-a-new-generation-of-world-simulation/
  date: ''
  section: '2.4'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Prompts, reference images, navigation, and live edits → interactive audiovisual worlds. Research preview that combines
      generative simulation with Gemini planning and frame-based checks; access is limited to trusted testers. Spatial accuracy,
      physical interactions, and long-term consistency remain limitations; robotics examples are generated simulations.
    zh: 提示、参考图像、导航和实时编辑 → 可交互视听世界。将生成式模拟与 Gemini 规划和逐帧检查结合的研究预览，仅面向可信测试者；空间准确性、物理交互与长程一致性仍有限，机器人案例为生成式仿真。
    ja: 指示、参照画像、移動、実時間の編集から、対話可能な視聴覚世界を生成する。生成的シミュレーションを Gemini の計画とフレーム単位の確認に組み合わせた研究プレビューで、信頼されたテスター向けに限定される。空間精度、物理的な相互作用、長期的一貫性には制限があり、ロボット例は生成的シミュレーションである。
  sources:
  - https://deepmind.google/blog/genie-4-a-new-generation-of-world-simulation/
- id: res:rendley-video-editing-skill
  title: Rendley video-editing-skill
  url: https://github.com/rendleyhq/video-editing-skill
  date: ''
  section: '1.4'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Passes an editing brief and media to Rendley's hosted agent through MCP or REST and returns an editable project; the
      MIT skill is an integration layer requiring a service connection, not a local editing engine.
    zh: 经 MCP／REST 将编辑需求与媒体交给 Rendley 托管 Agent，返回可编辑项目；MIT Skill 属于需服务连接的集成层，不是本地剪辑引擎。
    ja: MCP／REST を介して編集要求とメディアを Rendley のホスト型 Agent に渡し、編集可能なプロジェクトを受け取る。MIT ライセンスの Skill はサービス接続が必要な統合層で、ローカルの編集エンジンではない。
  sources:
  - https://github.com/rendleyhq/video-editing-skill
  - https://github.com/rendleyhq/video-editing-skill/blob/main/SKILL.md
- id: res:cc-blender-skill
  title: cc-blender-skill
  url: https://github.com/RobLe3/cc-blender-skill
  date: ''
  section: '1.5'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Turns text/reference briefs into staged modeling, materials, animation, render checks and exports; documents bounded
      Blender 5.1.1 checks and remaining engine/provider gaps.
    zh: 将文字／参考需求组织为建模、材质、动画、渲染检查与导出步骤，并说明 Blender 5.1.1 的有限测试及引擎／服务验证缺口。
    ja: 文章や参照資料から、モデリング、材質、アニメーション、レンダリング確認、書き出しの手順を構成する。Blender 5.1.1 での限定的な試験と、エンジン・サービスの検証上の不足を説明している。
  sources:
  - https://github.com/RobLe3/cc-blender-skill
  - https://github.com/RobLe3/cc-blender-skill/blob/main/docs/test-results/v1.4.0-integration.md
- id: res:blender-ai-plugin
  title: Blender AI Plugin
  url: https://github.com/proyecto26/blender-ai-plugin
  date: ''
  section: '1.5'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Routes briefs and references to specialist skills, pairs stage gates with viewport captures, and records geometry/export
      checks; supplies a reusable production workflow rather than a measured autonomous-agent benchmark.
    zh: 将需求与参考图路由到专业技能，把阶段检查与视口截图结合，并记录几何和导出结果，提供可复用制作流程；不是经过测量的自主 Agent 基准。
    ja: 要求と参照画像を専門スキルへ振り分け、段階ごとの確認とビューポート画像を組み合わせて幾何と書き出し結果を記録する、再利用可能な制作手順。測定済みの自律 Agent ベンチマークではない。
  sources:
  - https://github.com/proyecto26/blender-ai-plugin
- id: res:agent-qa
  title: agent-qa
  url: https://vostride.com
  date: ''
  section: '1.1'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Exposes natural-language web, Android and iOS tests, screenshots, console/network evidence and verdict corrections
      to coding agents; persistent memidex memory and evidence-gated self-improvement retain validated lessons across runs.
    zh: 向编码 Agent 提供自然语言网页、Android 和 iOS 测试、截图、控制台/网络证据及判定纠正；持久 memidex 记忆与基于证据的自我改进在多次运行间保留已验证经验。
    ja: コーディング Agent に、自然言語によるウェブ・Android・iOS のテスト、画面、コンソールとネットワークの証拠、判定の訂正を提供する。永続的な memidex 記憶と証拠に基づく自己改善で、検証済みの経験を実行間に保持する。
  sources:
  - https://vostride.com
  - https://vostride.com/docs/agent-qa/mcp
- id: res:shotback
  title: Shotback
  url: https://github.com/DCCA/shotback
  date: ''
  section: '1.1'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Packages annotated screenshots with CSS selectors, React component paths, viewport context, and readable failed requests;
      supports before/after recapture for human-guided repairs.
    zh: 将标注截图与 CSS 选择器、React 组件路径、视口上下文及可读取的失败请求一起交付，并支持前后重截图比较，辅助人工反馈驱动的修复。
    ja: 注釈付きの画面、CSS セレクター、React コンポーネントのパス、ビューポート情報、読み取り可能な失敗リクエストを一緒に渡す。修正前後の再撮影比較にも対応し、人のフィードバックによる修正を補助する。
  sources:
  - https://github.com/DCCA/shotback
- id: res:orkas-uidesigner
  title: Orkas UIDesigner
  url: https://github.com/Orkas-AI/Orkas
  date: ''
  section: '1.1'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Turns briefs, screenshots, Figma references, or existing UI code into editable mockups and specs, using HTML by default.
      After the final edit, it checks HTML structure and local file references. It compares the rendered result with the reference
      when the task requires it and rendering is available. Verifying a pixel-exact match requires fresh renders of both the
      reference and the mockup with the same viewport, UI state, theme, and locale.
    zh: 根据需求、截图、Figma 参考或现有 UI 源码制作可编辑的设计稿与规范，默认以 HTML 交付。最终编辑后检查 HTML 结构和本地文件引用。任务需要且具备渲染条件时，再将渲染结果与参考对照。若要确认像素级一致，须在相同的视口、界面状态、主题和语言区域设置下重新渲染参考界面与设计稿。
    ja: 要求、画面、Figma の参照、既存 UI のソースから編集可能なデザインと仕様を作り、標準では HTML で納品する。最終編集後に構造とローカル参照を確認し、必要かつ描画可能な場合に参照と比較する。ピクセル単位の一致を確認するには、同じ画面幅、UI
      状態、テーマ、ロケールで双方を再描画する必要がある。
  sources:
  - https://github.com/Orkas-AI/Orkas
  - https://github.com/Orkas-AI/Orkas/blob/c7c0e21fad7ff55f5a72a575b7a464f3cf9bc3a1/resources/builtin/marketplace/agents/bcfcb4921dce/agent.json
  - https://github.com/Orkas-AI/Orkas/blob/c7c0e21fad7ff55f5a72a575b7a464f3cf9bc3a1/resources/builtin/marketplace/agents/bcfcb4921dce/skills/ui-design-source/SKILL.md#L156-L165
- id: res:text-to-cad
  title: text-to-cad
  url: https://github.com/earthtojake/text-to-cad
  date: ''
  section: '1.5'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Covers CAD generation and editing, browser preview, STEP/DXF/robot formats, manufacturability checks, slicing, and
      handoff—not only one-shot geometry generation.
    zh: 覆盖 CAD 生成与编辑、浏览器预览、STEP/DXF/机器人格式、可制造性检查、切片和交付，而不只是一次性几何生成。
    ja: CAD の生成・編集、ブラウザープレビュー、STEP／DXF／ロボット向け形式、製造可能性の確認、スライス、納品までを扱い、一度限りの幾何生成にとどまらない。
  sources:
  - https://github.com/earthtojake/text-to-cad
- id: res:openscad-agent
  title: OpenSCAD Agent
  url: https://github.com/iancanderson/openscad-agent
  date: ''
  section: '1.5'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Writes versioned .scad files, compares current/previous PNG previews, and exports STL with OpenSCAD warning summaries;
      export diagnostics are not an independent geometry or manufacturing-safety check.
    zh: 编写版本化 .scad，对照当前／上一轮 PNG，并导出含 OpenSCAD 警告摘要的 STL；导出诊断不等于独立几何或制造安全检查。
