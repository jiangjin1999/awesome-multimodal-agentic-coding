  url: "https://arxiv.org/abs/2603.12238"
  date: "2026.03"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Inspects rendered 3D scenes and translates detected object, layout, and appearance errors into further scene edits.
    zh: 检查渲染后的 3D 场景，并将物体、布局和外观错误转成后续场景编辑。
    ja: ''
- id: "2603.29847"
  title: "CADReasoner: Iterative Program Editing for CAD Reverse Engineering"
  url: "https://arxiv.org/abs/2603.29847"
  date: "2026.02"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Rewrites runnable CadQuery programs using discrepancies between the target and the current reconstruction, combining multi-view renders with point-cloud feedback at each step.
    zh: 根据目标与当前重建的几何差异，结合多视角渲染和点云反馈，逐步重写可运行的 CadQuery 程序。
