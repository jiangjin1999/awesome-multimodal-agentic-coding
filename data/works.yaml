  verification:
    en: '273 tasks / 2,331 criteria in the paper · strict vs. full completion · model–harness sensitivity; public release:
      96 ME tasks / 521 criteria.'
    zh: 论文评测 273 任务／2,331 项标准 · 严格完成与全项通过 · 模型—Harness 敏感性；公开 96 个 ME 任务／521 项标准。
