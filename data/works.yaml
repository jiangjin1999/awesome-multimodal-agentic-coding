    zh: 同一个开放式需求生成卡尔维诺城市的两种程序化 Three.js 演绎；作者比较设计与执行体验，而非提供受控的视觉修复基准。
    ja: 同じ自由度の高い要求から、カルヴィーノの都市を手続き的な Three.js で二通りに表現する。作者は設計と実行の体験を比較しており、統制された視覚修正ベンチマークを提供しているわけではない。
  sources:
  - https://quesma.com/blog/invisible-cities-one-shot/
  - https://github.com/stared/invisible-cities-astra
  - https://github.com/stared/invisible-cities-opus-5.5
