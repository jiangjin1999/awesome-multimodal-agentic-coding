      checks before human review; its flagship demo uses a deterministic mock provider, not a real-model accuracy benchmark.
    zh: 向外部 Coding Agent 提供浏览器几何、截图、CSS 源码候选、隔离工作区及目标／回归检查，再交由人工审阅；其主要 Demo 使用确定性的模拟提供器，并非真实模型准确率基准。
    ja: 外部コーディングエージェントにブラウザの形状情報、画像、CSS ソース候補、隔離作業領域、目標・回帰チェックを提供し、人間のレビューへつなぐ。主なデモは決定論的な模擬プロバイダを使い、実モデルの精度評価ではない。
  sources:
