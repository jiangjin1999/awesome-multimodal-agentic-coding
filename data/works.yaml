      rendered observations and critic-guided executable edits to improve indoor layouts.
    zh: 从压缩后的编辑轨迹与场景扰动排序中学习构建和批评能力，以渲染观测和 Critic 引导的可执行编辑持续改进室内布局。
    ja: 圧縮した編集軌跡と場面の摂動順位から構築・批評能力を学び、描画観測と批評器に導かれる実行可能な編集で室内配置を改善する。
