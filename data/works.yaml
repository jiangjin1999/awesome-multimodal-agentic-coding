- id: '2610.13862'
  title: 'BT-Agent: Deploying Onboard Robot Agents with Behavior Trees and Multi-Fidelity Evaluation'
  url: https://arxiv.org/abs/2610.13862
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Composes perception and physical-action tools through fixed behavior-tree skills, using structured failures to retry
      or change task decisions while local guards supervise operator-approved onboard motion.
    zh: 通过固定行为树 Skill 组织感知与物理动作工具，以结构化失败反馈重试或改变任务决策，本地 Guard 则监督经操作员批准的机载运动。
    ja: 固定の行動木スキルで知覚・物理行動ツールをまとめ、構造化された失敗情報で再試行や判断変更を行う。ローカルのガードが操作者の承認を得た機上運動を監督する。
  sources:
  - https://arxiv.org/abs/2610.13862
  verification:
    en: Text/Habitat task alignment · perception and motion failures · real-robot task completion · guard interruption · interface/feedback
      ablations.
    zh: 文本／Habitat 任务对齐 · 感知与运动失败 · 真机任务完成 · Guard 中断 · 接口／反馈消融。
  tags:
  - Method
  - Benchmark
  - Inference
  - Environment
  - Verification
- id: '2610.29702'
  title: 'CausGround: Causal Interaction Grounding for Adaptive Embodied Planning'
  url: https://arxiv.org/abs/2610.29702
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Grounds RGB observations in object-level causal mechanisms and retrieves action preconditions and effects to guide
      a frozen planner’s skill selection, with simulation, recorded-skill replay, and qualitative robot demonstrations.
    zh: 将 RGB 观测落地为对象级因果机制，检索动作前提和效果以引导冻结规划器选择技能，并通过仿真、录制技能回放与定性机器人演示验证。
    ja: RGB 観測から物体単位の因果機構を表し、行動の前提条件と効果を検索して、重みを固定したプランナーのスキル選択を導く。シミュレーション、記録済みスキルの再生、定性的なロボット実演で検証する。
  sources:
  - https://arxiv.org/abs/2610.29702
  - https://causground.github.io/
  verification:
    en: Task success and progress · causal-library ablations · renderer-corrected VirtualHome · replay-based RoboCasa; two
      qualitative hardware tasks.
    zh: 任务成功率与进度 · 因果机制库消融 · 渲染校正的 VirtualHome · 回放式 RoboCasa；两项定性实机任务。
  tags:
  - Method
  - Inference
  - Environment
- id: '2610.01939'
  title: 'Fewer Tokens, Better Action: GPT-6 Astra Robot Agents with 14% Higher Success Rate but 65% Fewer Tokens'
  url: https://arxiv.org/abs/2610.01939
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Batches robot primitives, computation, conditions and local retries inside Python cells, returning selected outputs
      to the model.
    zh: 让 Agent 在 Python 单元中组合机器人原语、局部检查和重试，减少回传上下文，并探索小型编程模型的强化学习。
    ja: Agent が Python セル内でロボットの基本操作、局所的な確認、再試行を組み合わせ、戻すコンテキスト量を減らす。小型コードモデルの強化学習も検討する。
  sources:
  - https://arxiv.org/abs/2610.01939
  verification:
    en: Local program feedback and the model's next reasoning turn occur at different frequencies; the work also studies RL
      for a smaller coder.
    zh: 中间动作结果可留在运行时供程序判断；只有选中的状态、文本和图像在代码块结束后进入 LLM 上下文，再用于整体重规划。
- id: '2610.23479'
  title: 'HexaShell: A Universal Harness for Robot Coding Agents in Simulation and the Real World'
  url: https://arxiv.org/abs/2610.23479
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Lets a robot coding agent write a Python cell each turn against shared motion, perception and state tools, with optional
      task skills drafted from earlier runs.
    zh: 让机器人编程 Agent 在每轮编写一段 Python，调用共享的运动、感知与状态工具，也可复用从历史执行记录提炼的任务 Skills。
    ja: ロボットプログラミング Agent が各ラウンドで Python を書き、共通の運動・知覚・状態ツールを呼び出す。過去の実行記録から抽出したタスクスキルも再利用できる。
  sources:
  - https://arxiv.org/abs/2610.23479
  - https://github.com/HexaFuture/HexaShell
  verification:
    en: GPT-6 Astra across four simulation benchmarks · nine dual-arm hardware tasks, 76/90 episodes judged successful · GPT-6.1
      Terra wrote the hardware code and GPT-6 Astra judged the outcomes.
    zh: GPT-6 Astra 在四套仿真基准上评测。双臂实机覆盖 9 个任务，90 次试验中 76 次判定成功，GPT-6.1 Terra 编写实机代码，GPT-6 Astra 判定结果。
  tags:
  - Method
  - System
  - Inference
  - Environment
  - Verification
  - Trajectory Analysis
- id: '2610.02459'
  title: 'OpenRUA: Robot-Use Agents Are Zero-Shot Visuomotor Policies'
  url: https://arxiv.org/abs/2610.02459
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Gives an existing coding agent a terminal, ROS 2 documentation and a robot workspace for writing perception and motion
      programs.
    zh: 仅向现成 Coding Agent 提供终端、ROS 2 文档与机器人工作区，检验直接编程使用原生机器人接口的零样本能力。
    ja: 既存の Coding Agent に端末、ROS 2 の文書、ロボットの作業環境だけを与え、ロボット固有のインターフェースを直接プログラミングするゼロショット能力を調べる。
  sources:
  - https://arxiv.org/abs/2610.02459
  - https://github.com/terminalworld/OpenRUA
  verification:
    en: The agent chooses when to inspect images and sensor readings; script-level force or position feedback is distinct
      from LLM updates.
    zh: 图像文件、传感器读数、命令输出和运行错误进入工作区与 Agent 上下文；Agent 可据此修改脚本，也可让脚本在运动中读取力或位置反馈。
- id: '2610.06843'
  title: Recursive Video In-Context Learning for Agentic Robot
  url: https://arxiv.org/abs/2610.06843
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Lets robot agents query a hierarchical demonstration on demand and compare it with live camera views to adapt frozen
      VLA and analytic primitive calls, while retaining the underlying execution harness.
    zh: 让机器人 Agent 按需查询分层示范视频，与实时相机对比后调整冻结 VLA 和解析动作原语的调用，同时保留底层执行框架。
    ja: ロボット Agent が階層化された実演動画を必要に応じて参照し、実時間のカメラ映像と比較して、重みを固定した VLA と解析的な基本動作の呼び出しを調整する。低レベルの実行基盤は維持する。
  sources:
  - https://arxiv.org/abs/2610.06843
  - https://github.com/BWR-hhh/rvicl
  verification:
    en: LIBERO-PRO/Plus success · demonstration-access ablations · retrieval budgets · failure-conditioned re-entry.
    zh: LIBERO-PRO／Plus 成功率 · 示范访问消融 · 检索预算 · 失败驱动的再次查询。
  tags:
  - Method
  - Inference
  - Verification
- id: '2610.04929'
  title: 'RobotUse: Allocating Computation, Context, and Decisions'
  url: https://arxiv.org/abs/2610.04929
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Allocates physical task decisions and detailed interactions to subagents while the parent receives compact results
      and constraints.
    zh: 围绕物理动作组织计算、上下文与决策，并用持久执行手册积累机器人 Agent 的任务经验。
    ja: 物理的な行動を中心に計算、コンテキスト、意思決定を構成し、永続的な実行マニュアルにロボット Agent のタスク経験を蓄積する。
  sources:
  - https://arxiv.org/abs/2610.04929
  - https://robotuse-team.github.io/
  verification:
    en: Perception and motion backends realize geometric choices; persistent execution guidance is a separate source of experience.
    zh: 候选姿态与执行结果可供视觉检查；局部详细交互保存在子 Agent 上下文，主 Agent 接收任务结果、当前状态和仍未解决的约束。
- id: '2610.12457'
  title: 'SpatialHarness: Test-Time Spatial Scaffolding for Fine Robotic Manipulation'
  url: https://arxiv.org/abs/2610.12457
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Maintains a simulation scene synchronized with real execution and renders task-specific auxiliary viewpoints.
    zh: 维持与真实执行同步的模拟场景，按任务需要渲染补充视角，为冻结的多模态机器人策略提供空间支架。
    ja: 実際の実行と同期する模擬シーンを維持し、タスクに応じて補助視点をレンダリングすることで、重みを固定したマルチモーダルロボット方策に空間的な手掛かりを与える。
  sources:
  - https://arxiv.org/abs/2610.12457
  - https://emilia113.github.io/SpatialHarness/
  verification:
    en: Spatial scaffolding supports a frozen policy; synchronized geometry does not by itself demonstrate accurate full dynamics.
    zh: 动作后用新观测修正数字场景，向模型提供更新的物体位姿和补充视角；模型据此检查遮挡、空间关系与操作位置，再决定下一步。
- id: '2610.30043'
  title: 'TARSphere: A Robot-Oriented Full-Stack Framework for Long-Horizon Embodied Agents in Evolving Physical and Social
    Environments'
  url: https://arxiv.org/abs/2610.30043
  date: '2026.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Organizes long-horizon robot action using hierarchical executable skills, task memory and execution feedback around
      a frozen model.
    zh: 为冻结多模态模型提供分层可执行技能、任务记忆和执行反馈，组织长时序机器人行动及环境变化处理。
    ja: 重みを固定したマルチモーダルモデルに、階層的な実行可能スキル、タスク記憶、実行フィードバックを与え、長期的なロボット行動と環境変化への対処を構成する。
  sources:
  - https://arxiv.org/abs/2610.30043
  - https://github.com/xuyicheng-zju/TARSphere
  - https://xuyicheng-zju.github.io/TARSphere/
  verification:
    en: Evaluates eight frozen MLLMs on 360 simulated episodes across 30 indoor scenes, pairing navigate-and-report and fetch-and-deliver
      tasks with five changing-world conditions. Event-dependent scoring checks delivered information and physical completion;
      collisions, falls and execution fidelity are examined separately from task quality. These are simulated robot and NPC
      interactions, not real-world deployment results.
    zh: 在 30 个室内场景、360 个仿真回合上评测八个冻结 MLLM，将导航汇报与取送任务配对到五类变化条件。依赖事件的评分检查信息实际送达和物理完成，另行分析碰撞、跌倒及执行保真度。这些结果来自仿真机器人与 NPC 交互，不是现实部署结果。
- id: '2609.12541'
  title: Agent as Policy for Robotic Manipulation
  url: https://arxiv.org/abs/2609.12541
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Lets a general agent inspect visual evidence, write programs and issue motion requests throughout a manipulation episode.
    zh: 让通用 Agent 持续读取视觉证据、编写程序并发出运动指令，根据物理执行结果调整下一步行动。
    ja: 汎用 Agent が視覚的な証拠を継続的に読み、プログラムと運動指令を生成し、物理的な実行結果に応じて次の行動を調整する。
  sources:
  - https://arxiv.org/abs/2609.12541
  verification:
    en: Subsequent decisions depend on physical execution results, with the actual observation and action interface defining
      the setting.
    zh: 后续决策依赖物理执行结果，具体观测和动作接口决定评测设置。
- id: '2609.20822'
  title: Coding Agents with an Obstacle-Aware Harness for Safe Robot Manipulation
  url: https://arxiv.org/abs/2609.20822
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Equips code-as-policy agents with visually grounded route checks and contact constraints, replanning from the observed
      stopped pose when execution encounters an obstacle or an unmodeled physical constraint.
    zh: 为 Code-as-policy Agent 增加视觉定位的路径检查与接触约束，并在执行遭遇障碍或未建模物理限制时，根据观测到的停止位姿重新规划后续动作。
    ja: Code-as-policy Agent に視覚位置推定に基づく経路確認と接触制約を追加する。障害物や未モデル化の物理的制約に遭遇した場合、観測した停止姿勢から後続動作を再計画する。
  sources:
  - https://arxiv.org/abs/2609.20822
  verification:
    en: Task success · collision avoidance · route clearance · recovery under execution-time constraints.
    zh: 任务成功率 · 避碰率 · 路径净空 · 执行约束下的恢复。
  tags:
  - Method
  - Inference
  - Environment
  - Verification
- id: '2609.38078'
  title: 'MotorMind: Scaffolding General Vision Language Models for Zero-Shot Robot Manipulation'
  url: https://arxiv.org/abs/2609.38078
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Combines mid-level parameterized actions, deterministic control and asynchronous monitoring around a frozen VLM.
    zh: 用中层动作、确定性控制和异步监测连接通用 VLM 与机械臂，考察推理频率与执行可靠性的关系。
    ja: 中間レベルの動作、決定的な制御、非同期監視を介して汎用 VLM とロボットアームを接続し、推論頻度と実行の信頼性の関係を調べる。
  sources:
  - https://arxiv.org/abs/2609.38078
  verification:
    en: The model checks task progress and can interrupt subgoals; it does not output every servo command.
    zh: 相机图像、实际工具位姿和夹爪状态用于下一次决策；并行监测发现进展异常时可触发中断，子目标完成后还需要核验结果。
- id: '2609.29389'
  title: 'Robo-Harness K1: Harnessing Robot-Use Agents via Perception Augmentation'
  url: https://arxiv.org/abs/2609.29389
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Provides depth, spatial measurement and grasp-candidate tools to a robot-use agent without retraining its visual encoder.
    zh: 把三维感知作为可调用工具提供给 Robot-Use Agent，增强几何定位能力而不重新训练视觉编码器。
    ja: 3D 知覚を Robot-Use Agent が呼び出せるツールとして提供し、視覚エンコーダーを再学習せずに幾何学的な位置推定能力を高める。
  sources:
  - https://arxiv.org/abs/2609.29389
  verification:
    en: Annotated images and calibrated geometry support the agent's next measurement or motion decision.
    zh: 测量返回标注图像、三维位置和候选抓取姿态；动作后返回新图像、实际位姿及目标误差，模型据此补测、微调或检查抓取是否成功。
- id: '2610.14018'
  title: 'RoboHarness: A Simple Harness Outperforms VLA and World Action Models'
  url: https://arxiv.org/abs/2610.14018
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Gives an LLM a visual-geometric control panel for zero-shot manipulation using existing robot tools.
    zh: 给 LLM Agent 提供视觉几何控制面板，研究简单工具接口能否支持零样本机器人操作。
    ja: LLM Agent に視覚幾何の操作パネルを与え、単純なツールインターフェースがゼロショットのロボット操作を支えられるか調べる。
  sources:
  - https://arxiv.org/abs/2610.14018
  verification:
    en: Results concern the complete harness-and-model configuration, not a standalone action model.
    zh: 结果对应完整的 Harness 与模型配置，而非独立动作模型的能力。
- id: '2609.10522'
  title: 'Show-Harness: Just a VLM Agent Can Play Robots'
  url: https://arxiv.org/abs/2609.10522
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Connects a general VLM to a robot interpreter through a compact semantic action interface.
    zh: 以紧凑语义动作接口连接通用 VLM 与机器人解释器，研究将数字 Agent 式交互迁移到物理控制的条件。
    ja: 簡潔な意味的動作インターフェースで汎用 VLM とロボットインタープリターを接続し、デジタル Agent 型の対話を物理制御に移す条件を検討する。
  sources:
  - https://arxiv.org/abs/2609.10522
  - https://showlab.github.io/Show-Harness
  verification:
    en: The interface delegates motion realization; model reasoning and downstream control are separate responsibilities.
    zh: 接口将运动实现委派给下游模块；模型推理与底层控制承担不同职责。
- id: '2609.29964'
  title: 'World Action Agent: Harnessing VLMs for Robot Manipulation via World Action Rehearsal'
  url: https://arxiv.org/abs/2609.29964
  date: '2026.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Gives VLMs interaction-centered views, editable action rehearsals, and demonstration-derived skills to revise manipulation
      decisions through numerical planning tools without generating policy code.
    zh: 为 VLM 提供交互局部视图、可编辑的动作预演和示范提炼的技能，通过数值规划工具持续修正操控决策，而不生成策略代码。
    ja: VLM に操作対象の局所視点、編集可能な動作プレビュー、実演から抽出したスキルを与える。方策コードを生成せず、数値計画ツールによって操作判断を継続的に修正する。
  sources:
  - https://arxiv.org/abs/2609.29964
  verification:
    en: LIBERO-Pro/robosuite simulation · frozen-skill transfer · perception-source variants · local recovery cases · smaller-pilot
      distillation with unchanged frontier-model subagents.
    zh: LIBERO-Pro／robosuite 仿真 · 冻结技能迁移 · 感知来源变体 · 局部失败恢复 · 保持前沿模型子 Agent 的小模型主控蒸馏。
  tags:
  - Method
  - System
  - Training
  - Inference
  - Environment
  - Verification
- id: chemautoagent
  title: 'ChemAutoAgent: A Multi-Agent System for Evidence-Controlled Laboratory Instrument Driver Generation from Text-Based
    Manuals'
  url: https://www.mdpi.com/2076-3417/16/16/8291
  date: '2026.08'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Builds instrument drivers from source-linked manuals within deterministic protocol scaffolds, repairing them through
      hardware tests.
    zh: 让 Agent 从带出处的设备手册生成驱动内容，在确定性协议骨架和硬件测试中修复错误，再把可复用接口提供给后续实验 Agent。
    ja: 出典付きの機器マニュアルから Agent がドライバーを生成し、決定的なプロトコルの骨格とハードウェア試験を使って誤りを修正する。その後、再利用可能なインターフェースを実験 Agent に提供する。
  sources:
  - https://www.mdpi.com/2076-3417/16/16/8291
  - https://www.mdpi.com/2076-3417/16/16/8291/notes
  verification:
    en: Three instruments are tested with human confirmation; command-only baselines are not equivalent to matched hardware
      trials.
    zh: §3.2、3.6：三种真实仪器测试，人工确认参与；直接生成基线未做同等硬件测试，不能把其命令检查与多 Agent 实测视为同一协议。文中代码开放承诺不等于已核实数据集发布。
- id: '2608.03924'
  title: 'ETA: A New Agentic Paradigm for Embodied Tasks'
  url: https://arxiv.org/abs/2608.03924
  date: '2026.08'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Connects digital agents to observation, target marking and motion through a lightweight embodied interface.
    zh: 通过 OpenETA 将观察、标记目标与运动能力接入 Codex 等数字 Agent，研究轻量接口如何支持物理任务。
    ja: OpenETA を介して観察、対象の指定、運動の機能を Codex などのデジタル Agent に接続し、軽量なインターフェースによる物理タスクの実行を研究する。
  sources:
  - https://arxiv.org/abs/2608.03924
  verification:
    en: Fresh observations and execution receipts govern whether the next state-dependent action can proceed.
    zh: 每次改变环境后，执行回执与新观测必须先进入上下文，才能继续依赖当前状态的动作；观测失败或执行状态未知时，不能沿用旧画面盲目推进。
- id: '2607.05369'
  title: 'GaP: A Graph-as-Policy Multi-Agent Self-Learning Harness For Variational Automation Tasks'
  url: https://arxiv.org/abs/2607.05369
  date: '2026.07'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Builds typed computation graphs connecting perception, planning and control skills, then rehearses and revises the
      graph in simulation.
    zh: 由多 Agent 编写连接感知、规划与控制节点的计算图，以可组合机器人技能库支持可变自动化任务。
    ja: 複数の Agent が知覚・計画・制御ノードを接続する計算グラフを記述し、組み合わせ可能なロボットスキルライブラリで多様な自動化タスクを支える。
  sources:
  - https://arxiv.org/abs/2607.05369
  - https://graph-robots.github.io/gap
  verification:
    en: The optimized graph can execute without invoking the LLM at every action.
    zh: 内部仿真执行图后返回任务结果与问题，Agent 在部署前据此修订；优化后的图由解释器在机器人上重复执行，不要求每次动作都调用 LLM。
- id: '2607.16636'
  title: 'PhyAgentOS: A Self-Evolving Operating System for Embodied Agents with Decoupled Cognitive Planning and Physical
    Execution'
  url: https://arxiv.org/abs/2607.16636
  date: '2026.07'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Separates cognitive planning from physical execution through file-based state contracts, tools and persistent execution
      records.
    zh: 用文件化状态契约分离 Agent 推理与机器人执行，让工具调用、状态记录和经验更新能够跨运行层衔接。
    ja: ファイルで表す状態契約によって Agent の推論とロボットの実行を分離し、ツール呼び出し、状態記録、経験の更新を実行層の間でつなぐ。
  sources:
  - https://arxiv.org/abs/2607.16636
  verification:
    en: Track which state and experience reach the agent across runtime boundaries.
    zh: 需要明确哪些状态与经验跨越运行时边界，实际到达 Agent。
- id: '2605.26637'
  title: Enabling Extensible Embodied Capabilities with Tools
  url: https://arxiv.org/abs/2605.26637
  date: '2026.05'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Defines an Embodied Tool Protocol for registering, discovering and invoking perception, reasoning and execution capabilities.
    zh: 提出 Embodied Tool Protocol，将机器人感知、推理与执行能力统一为可注册、发现和调用的工具，支撑 Agent 组合现有能力。
    ja: Embodied Tool Protocol を提案し、ロボットの知覚・推論・実行機能を登録、発見、呼び出し可能なツールに統一することで、Agent が既存の能力を組み合わせられるようにする。
  sources:
  - https://arxiv.org/abs/2605.26637
  verification:
    en: The protocol exposes existing capabilities; task success still depends on the connected agent and tools.
    zh: 协议暴露已有能力；任务是否成功仍取决于接入的 Agent 和工具。
- id: '2511.00917'
  title: 'MAESTRO: Orchestrating Robotics Modules with Coding Agents for Zero-Shot Generalist Robots'
  url: https://arxiv.org/abs/2511.00917
  date: '2025.11'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Orchestrates perception, planning and control modules through generated programs, checking visual and execution feedback
      for recovery.
    zh: 让 VLM 编写机器人程序来组织感知、规划和控制模块，通过视觉与执行反馈验证结果及恢复失败。
    ja: VLM がロボットプログラムを書いて知覚・計画・制御モジュールを構成し、視覚と実行のフィードバックで結果の検証と失敗からの復帰を行う。
  sources:
  - https://arxiv.org/abs/2511.00917
  - https://github.com/penn-pal-lab/maestro
  - https://maestro-robot.github.io
  verification:
    en: Real-robot tests cover eight tabletop tasks on a Franka/DROID platform and four mobile-manipulation tasks on a Go2-W
      with a PiPER arm, using five settings per task. Human reviewers score progress independently of the agent monitor. Tabletop
      comparisons and tool/harness ablations exclude the VLA tool; mobile tests have no competing baseline, and cross-trial
      improvement is demonstrated through separate case studies.
    zh: 真实机器人测试覆盖 Franka／DROID 平台上的八项桌面任务，以及 Go2-W 搭载 PiPER 机械臂的四项移动操作任务，每项使用五种设置。人工评审独立于 Agent 监测器评分任务进展。桌面对照和工具／Harness
      消融不调用 VLA 工具；移动测试没有竞争基线，跨回合改进另以案例研究展示。
- id: '2510.21302'
  title: 'Towards Reliable Code-as-Policies: A Neuro-Symbolic Framework for Embodied Task Planning'
  url: https://arxiv.org/abs/2510.21302
  date: '2025.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Combines code-policy generation with symbolic verification and exploratory programs that obtain missing observations.
    zh: 将机器人策略代码生成与符号验证结合，通过探索程序补全缺失观测并验证行动条件。
    ja: ロボット方策のコード生成と記号的検証を組み合わせ、探索プログラムによって不足する観測を補い、行動条件を検証する。
  sources:
  - https://arxiv.org/abs/2510.21302
  verification:
    en: Verification depends on the modeled conditions and observed evidence, rather than guaranteeing every physical outcome.
    zh: 验证依赖建模所覆盖的条件和实际观测证据，不能保证所有物理执行结果。
- id: '2505.07532'
  title: 'RAI: Flexible Agent Framework for Embodied AI'
  url: https://arxiv.org/abs/2505.07532
  date: '2025.05'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Connects language models, agents, ROS and simulators through modular tools and reusable robot runtime components.
    zh: 以模块化工具接口把语言模型、多 Agent、ROS 与仿真连接起来，为机器人 Agent 提供可复用的运行基础。
    ja: モジュール化したツールインターフェースで言語モデル、複数 Agent、ROS、シミュレーションを接続し、ロボット Agent に再利用可能な実行基盤を提供する。
  sources:
  - https://arxiv.org/abs/2505.07532
  verification:
    en: Inspect the concrete tools and robot configuration when interpreting demonstrations.
    zh: 理解演示结果时，需要结合实际接入的工具和机器人配置。
- id: '2503.21969'
  title: Robotic Long-Horizon Manipulation with Progressive In-Context Code Generation and Episodic Feedback
  url: https://arxiv.org/abs/2503.21969
  date: '2025.03'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: core
  tldr:
    en: Uses progressive in-context examples to generate robot programs, then a visual reporter summarizes each episode for
      replanning.
    zh: 用递进式上下文生成机器人程序，再由视觉报告器在每轮执行后总结结果并指导重规划。
    ja: 段階的なコンテキストからロボットプログラムを生成し、各回の実行後に視覚レポーターが結果を要約して再計画を導く。
  sources:
  - https://arxiv.org/abs/2503.21969
  verification:
    en: Feedback is episodic rather than necessarily returned to the LLM after every primitive.
    zh: 整段程序执行结束后才由 VLM 报告并修订，不能描述为每个动作都获得闭环反馈。
- id: '2412.04455'
  title: 'Code-as-Monitor: Constraint-aware Visual Programming for Reactive and Proactive Robotic Failure Detection'
  url: https://arxiv.org/abs/2412.04455
  date: '2024.12'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Generates executable spatial and temporal constraint monitors, using visual tracking to detect failures or impending
      violations.
    zh: 让 VLM 编写可执行的时空约束监测程序，利用视觉跟踪检查机器人执行中的失败和潜在违规。
    ja: VLM が実行可能な時空間制約の監視プログラムを記述し、視覚追跡によってロボット実行中の失敗や潜在的な違反を確認する。
  sources:
  - https://arxiv.org/abs/2412.04455
  - https://zhoues.github.io/Code-as-Monitor/
  verification:
    en: Monitoring code can trigger replanning; the action policy is a separate component.
    zh: 视觉模块把相关物体或部件定位为三维几何元素，跟踪结果进入监测器；检测到违反约束后，将失败原因交给上层重新规划。
- id: '2410.06472'
  title: 'Enabling Novel Mission Operations and Interactions with ROSA: The Robot Operating System Agent'
  url: https://arxiv.org/abs/2410.06472
  date: '2024.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Exposes ROS queries, diagnosis and operations as callable tools for language agents across robot platforms.
    zh: 将 ROS 查询、诊断与操作封装为语言 Agent 可调用的工具，支持不同机器人平台的自然语言任务交互。
    ja: ROS の照会、診断、操作を言語 Agent が呼び出せるツールとしてまとめ、異なるロボット基盤で自然言語によるタスク操作を支援する。
  sources:
  - https://arxiv.org/abs/2410.06472
  verification:
    en: Tool availability and demonstrated tasks define its scope; a ROS bridge alone does not establish autonomous recovery.
    zh: 能力范围取决于已接入工具和展示的任务；仅有 ROS 工具桥不能证明自主恢复能力。
- id: bounded-motion
  title: Language-guided Manipulator Motion Planning with Bounded Task Space
  url: https://proceedings.mlr.press/v270/oelerich25a.html
  date: '2024.10'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Generates Python calls to a constrained path planner; BoundMPC then realizes smooth robot trajectories.
    zh: 让语言模型根据视觉信息编写 Python 调用受约束路径规划器，再由 BoundMPC 执行平滑轨迹，连接语义推理与机器人运动约束。
    ja: 言語モデルが視覚情報に基づいて Python を書き、制約付き経路プランナーを呼び出す。BoundMPC が滑らかな軌道を実行し、意味的な推論とロボットの運動制約をつなぐ。
  sources:
  - https://proceedings.mlr.press/v270/oelerich25a.html
  - https://www.acin.tuwien.ac.at/42d2/
  verification:
    en: Includes simulation and physical arms; trajectory constraints are enforced by the planner, not learned dynamics inside
      the LLM.
    zh: 包含模拟和实体机械臂实验；路径与轨迹约束由规划器承担，不能归为模型自身学会底层动力学。
- id: '2312.04474'
  title: 'Chain of Code: Reasoning with a Language Model-Augmented Code Emulator'
  url: https://arxiv.org/abs/2312.04474
  date: '2023.12'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Executes explicit program logic in an interpreter and asks a language model to emulate unresolved semantic operations.
    zh: 用解释器执行明确的程序逻辑，并把未定义的语义计算交给语言模型模拟；机器人实验展示代码与模型调用的组合方式。
    ja: 明示的なプログラムロジックをインタープリターで実行し、未定義の意味的な計算を言語モデルによる模擬実行に任せる。ロボット実験でコードとモデル呼び出しの組み合わせを示す。
  sources:
  - https://arxiv.org/abs/2312.04474
  - https://chain-of-code.github.io
  verification:
    en: Robot examples demonstrate composition of code and model calls, not a universal physical controller.
    zh: 除通用推理实验外，附录有实体机器人任务；本目录只引用其机器人代码/API 使用贡献。
- id: '2306.09523'
  title: 'Tell Me Where to Go: A Composable Framework for Context-Aware Embodied Robot Navigation'
  url: https://arxiv.org/abs/2306.09523
  date: '2023.06'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Uses generated Python as an intermediate layer between language reasoning, visual scene descriptions and mobile navigation.
    zh: 用生成的 Python 中间层连接语言推理、视觉环境描述和移动机器人导航接口，支持依赖上下文的导航指令。
    ja: 生成した Python の中間層で言語推論、視覚的な環境記述、移動ロボットのナビゲーション API を接続し、文脈に依存する移動指示に対応する。
  sources:
  - https://arxiv.org/abs/2306.09523
  verification:
    en: Context-dependent navigation tests the composed system rather than learning low-level locomotion inside the LLM.
    zh: 情境相关的导航任务检验的是组合系统，不表示 LLM 内部学习了底层运动控制。
- id: '2305.11176'
  title: 'Instruct2Act: Mapping Multi-modality Instructions to Robotic Actions with Large Language Model'
  url: https://arxiv.org/abs/2305.11176
  date: '2023.05'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Generates Python to connect SAM, CLIP and action APIs, turning multimodal instructions into perception, planning and
      execution.
    zh: 由 LLM 生成 Python 程序，调用 SAM、CLIP 与动作 API，把多模态指令组织成感知、规划和执行流程。
    ja: LLM が Python プログラムを生成して SAM、CLIP、動作 API を呼び出し、マルチモーダルな指示を知覚・計画・実行の流れにまとめる。
  sources:
  - https://arxiv.org/abs/2305.11176
  - https://github.com/OpenGVLab/Instruct2Act
  verification:
    en: Tests six selected VIMABench tabletop meta-tasks in PyBullet across L1 placement, L2 combination and L3 novel-object
      generalization. Success is determined from the final simulated state; comparisons also vary instruction modality, prompt
      elements and perception backbones. The reported experiments are simulation-only, constrained by the supplied action
      primitives; they do not demonstrate post-action visual code repair.
    zh: 在 PyBullet 中测试六项选定的 VIMABench 桌面元任务，覆盖 L1 摆放、L2 组合和 L3 新物体泛化。成功依据最终仿真状态判断，另比较指令模态、提示组成和感知模型。报告的实验仅限仿真并受所提供动作原语限制，不能据此证明行动后的视觉代码修复。
- id: '2306.17582'
  title: 'ChatGPT for Robotics: Design Principles and Model Abilities'
  url: https://arxiv.org/abs/2306.17582
  date: '2023.02'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Combines robot function libraries, prompting and human dialogue to generate and revise programs for arms, drones and
      mobile robots.
    zh: 通过函数库、提示设计和人机对话，让 ChatGPT 为机械臂、无人机与移动机器人编写和修改任务程序。
    ja: 関数ライブラリ、プロンプト設計、人との対話を用いて、ChatGPT がロボットアーム、ドローン、移動ロボットのタスクプログラムを記述・修正する。
  sources:
  - https://arxiv.org/abs/2306.17582
  - https://www.microsoft.com/en-us/research/publication/chatgpt-for-robotics-design-principles-and-model-abilities/
  verification:
    en: Distinguish automatically returned observations from corrections supplied by a human in individual demonstrations.
    zh: 不同案例把用户纠正、仿真测试或机器人执行结果带回对话。需要逐例区分自动返回的状态与人工观察后给出的意见。
- id: '2209.07753'
  title: 'Code as Policies: Language Model Programs for Embodied Control'
  url: https://arxiv.org/abs/2209.07753
  date: '2022.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Recursively generates Python policies that combine perception results, geometric calculations and robot APIs.
    zh: 用语言模型递归生成 Python 策略，组合感知结果、几何计算与控制 API，是机器人 Code-as-Policy 的早期基础；程序内反馈不等于写码模型根据执行结果重写程序。
    ja: 言語モデルが Python 方策を再帰的に生成し、知覚結果、幾何計算、制御 API を組み合わせる、ロボット Code-as-Policy の初期的な基盤。プログラム内のフィードバックは、コードを書くモデルが実行結果からプログラムを書き直すことを意味しない。
  sources:
  - https://arxiv.org/abs/2209.07753
  - https://code-as-policies.github.io
  verification:
    en: The generated program uses feedback; this does not establish that the language model observes every action and rewrites
      code.
    zh: 生成程序读取感知模块返回的位置等信息，并据此计算下一条控制指令。这里主要是程序在使用反馈，不能等同于 LLM 每次行动后重新看图改代码。
- id: '2209.11302'
  title: 'ProgPrompt: Generating Situated Robot Task Plans using Large Language Models'
  url: https://arxiv.org/abs/2209.11302
  date: '2022.09'
  section: '3.1'
  sub: tools-interfaces
  type: paper
  scope: adjacent
  tldr:
    en: Generates program-like plans using available objects, actions and assertions, with recovery steps when action preconditions
      fail.
    zh: 用可用动作、对象和断言组织程序式提示，使语言模型生成能够检查前置条件并恢复的机器人任务计划。
    ja: 利用可能な動作、物体、アサーションを使って手続き的なプロンプトを構成し、前提条件の確認と復帰処理を行えるロボットタスク計画を言語モデルに生成させる。
  sources:
  - https://arxiv.org/abs/2209.11302
  - http://progprompt.github.io
  verification:
    en: Program assertions and action-success feedback available to the model are different mechanisms.
    zh: 执行时检查动作前提是否成立，例如抓取前是否已靠近目标；不成立时运行计划中的恢复步骤。论文也指出，动作成功反馈并未全面提供给 Agent。
- id: '2611.10602'
  title: 'Agentic discrete-event simulation for manufacturing system design: an open 3D simulator, a benchmark and an industrial
    case'
  url: https://arxiv.org/abs/2611.10602
  date: '2026.11'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: SimuLean gives agents verified modeling components for manufacturing simulation.
    zh: SimuLean 为 Agent 提供经过验证的制造系统建模组件。
    ja: SimuLean は、検証済みの製造システムモデリング部品を Agent に提供する。
  sources:
  - https://arxiv.org/abs/2611.10602
  - https://arxiv.org/html/2611.10602v2
  verification:
    en: Across 18 modeling tasks, one frontier agent builds valid models in 93/108 attempts. A welding-workshop case agrees
      within 1% with a corrected reference; residual errors can survive build/run checks. No hardware deployment is established.
    zh: 18 项建模任务中，一个前沿 Agent 在 108 次尝试中构建 93 个有效模型。焊接车间案例与纠正后的参考结果相差 1% 内；残余错误可能通过构建／运行检查，未证明实机部署。
- id: '2611.02691'
  title: Closing the Dynamics Gap through Self-Directed Robotic Interaction
  url: https://arxiv.org/abs/2611.02691
  date: '2026.11'
  section: '3.2'
  type: paper
  scope: core
  tldr:
    en: An agent designs physical probes, measures their outcomes and calibrates an executable model.
    zh: 通过自主击球探索获取动力学证据，让 Agent 同时构建轨迹测量、拟合仿真参数并选择下一次实验。
    ja: 自律的な打撃探索から力学的な証拠を得て、Agent が軌道計測の構築、シミュレーションパラメーターの推定、次の実験の選択を行う。
  sources:
  - https://arxiv.org/abs/2611.02691
  - https://arxiv.org/html/2611.02691v1
  - https://cue-dynamics.github.io/
  verification:
    en: Hidden-physics sim-to-sim tests use 25 conditions and at most 30 shots each; 0.91 cm error and the reported 72% reduction
      refer to these tests. A real tabletop deployment is reported separately.
    zh: 25 个隐藏物理条件、每条件最多 30 次击球的 sim-to-sim 测试中误差降至 0.91 cm（较最强基线降 72%），真实小台球桌另做部署展示，不能把该数值当作实机误差。
- id: '2611.11344'
  title: 'Spatial Harness: Grounding Spatial Reasoning in Executable World States with Physics Engines'
  url: https://arxiv.org/abs/2611.11344
  date: '2026.11'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: An executable proxy scene grounds spatial reasoning in explicit geometry.
    zh: 可执行代理场景将空间推理落实到明确几何状态。
    ja: 実行可能な代理シーンによって、空間推論を明示的な幾何状態に結び付ける。
  sources:
  - https://arxiv.org/abs/2611.11344
  - https://arxiv.org/html/2611.11344v1
  - https://github.com/tmlr-group/Spatial-Harness
  verification:
    en: Four spatial-reasoning benchmarks · matched ground-truth-layout controls · perception and feedback ablations; static
      spatial reasoning, not dynamic prediction or hardware control.
    zh: 四个空间推理基准 · 匹配真实布局的对照 · 感知与反馈消融；属于静态空间推理，不是动力学预测或硬件控制。
  tags:
  - Method
  - Inference
  - Verification
- id: '2610.30679'
  title: 'AgentDreamer: Agentic 3D Motion Reasoning for Text-Controllable Physics Simulation'
