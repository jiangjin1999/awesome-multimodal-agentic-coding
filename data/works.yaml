  date: '2026.10'
  section: '3.2'
  type: paper
  scope: adjacent
  tldr:
    en: Laboratory videos become editable assets, trajectories and spatially constrained events.
    zh: 从实验视频构建可编辑的资产、场景、轨迹和事件，把操作事件转换为空间时间约束。
    ja: 実験動画から編集可能なアセット、シーン、軌道、イベントを構築し、操作イベントを時空間制約に変換する。
