  scope: adjacent
  tldr:
    en: Measures Roblox scene/script authoring through state-reading and editing tools, separating pre-edit dependency exploration from final scene and simulated client–server gameplay verification.
    zh: 通过状态读取与编辑工具测量 Roblox 场景／脚本开发，将修改前的依赖探索与最终场景、模拟客户端—服务端玩法验证分别分析。
    ja: ''
- id: "2610.04253"
  title: "Spec2Game: Can LLMs Generate Complete Playable Games from Detailed Specifications?"
  url: "https://arxiv.org/abs/2610.04253"
  date: "2026.10"
  section: "1.6"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates staged Pygame generation on controlled specification variants using source, runtime, and visual evidence, separating executability, requirement realization, code quality, and user-facing quality without feedback-driven repair.
    zh: 结合源码、运行和视觉证据评估受控规格变体上的分阶段 Pygame 生成，区分可执行性、需求实现、代码质量及用户界面质量，生成协议不接收反馈修复。
    ja: ''
- id: "2610.35980"
  title: "UnityBench-Mini3D: Evaluating LLM Agents for 3D Game Development in Unity"
  url: "https://arxiv.org/abs/2610.35980"
  date: "2026.10"
  section: "1.6"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Evaluates complete Unity projects with hidden in-engine milestone tests, including an Excavator trajectory where scene-image diagnosis guides motion-path and carry-angle repairs.
    zh: 以引擎内隐藏里程碑测试评测完整 Unity 项目，并记录 Excavator 中场景图诊断驱动运动路径与搬运角度修复的轨迹。
    ja: ''
- id: "2610.02331"
  title: "World Editing: Intervening on Executable Worlds at Increasing Depth"
  url: "https://arxiv.org/abs/2610.02331"
  date: "2026.10"
  section: "1.6"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Benchmarks modifications to Minecraft and Terraria across increasing intervention depth, checking native builds, in-game behavior, targeted regressions, and semantic/style consistency of introduced assets.
    zh: 按递增干预深度评测 Minecraft 和 Terraria 的修改，检查原生构建、游戏行为、定向回归及新增资产的语义与风格一致性。
    ja: ''
- id: "2609.39564"
  title: "A2Z GameSpec-Bench: How Faithfully Can Coding Agents Generate Games from Game Design Specifications?"
  url: "https://arxiv.org/abs/2609.39564"
  date: "2026.09"
  section: "1.6"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Evaluates games against fixed dependency-aware contracts from long-form design documents, feeding requirement-linked source, replay-frame, and adaptive-playtest evidence into subsequent revisions.
    zh: 将长篇游戏设计文档转为固定的依赖感知契约，以需求对齐的源码、回放画面和自适应试玩证据驱动后续修订。
    ja: ''
- id: "2609.23142"
  title: "CraftBench-UE: Deterministic Evaluation for Coding Agents in Unreal Engine"
  url: "https://arxiv.org/abs/2609.23142"
  date: "2026.09"
  section: "1.6"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Reconstructs saved Unreal Engine submissions in clean projects and deterministically checks builds, native assets, and gameplay, contrasting matched C++ and Blueprint implementations with observed authoring workflows.
    zh: 在干净项目中重建保存的 Unreal Engine 提交，以确定性检查验证构建、原生资产和玩法，并对比匹配的 C++／Blueprint 实现及实际开发工作流。
    ja: ''
- id: "2609.21562"
  title: "GameLogicBench: Evaluating Coding Agents on Runtime Game Logic with Tick-Level State Assertions"
  url: "https://arxiv.org/abs/2609.21562"
  date: "2026.09"
  section: "1.6"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Tests Godot gameplay code with deterministic tick-level state assertions across evaluator-selected scenarios, calibrating judges against correct implementations and mutants to expose transient rule violations.
    zh: 以覆盖评测方指定场景的确定性逐 tick 状态断言测试 Godot 玩法代码，并用正确实现与变异实现校准判定器，揭示运行中短暂的规则违规。
    ja: ''
- id: "2609.22308"
  title: "GameReplica: A Benchmark for Black-Box Visual Game Replication by Vision-Language Agents"
  url: "https://arxiv.org/abs/2609.22308"
  date: "2026.09"
  section: "1.6"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Tests black-box game replication from screenshot-only exploration, then has agents run, visually inspect, and revise their HTML replicas before separate implementation, rule-consistency, and appearance evaluation.
    zh: 测试从仅截图探索出发的黑箱游戏复刻，让 Agent 运行、目视检查并修订自己的 HTML 副本，再分别评估实现、规则一致性与外观。
    ja: ''
- id: "2609.33678"
  title: "SWE-Game: Can Coding Agents Build the Games We Want?"
  url: "https://arxiv.org/abs/2609.33678"
  date: "2026.09"
  section: "1.6"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates construction, repair, completion, and Godot-to-Unity porting from executable reference games, combining final state/replay checks with a separate visual rubric and matched no-input controls.
    zh: 以可执行参考游戏评测构建、修复、补全及 Godot 到 Unity 移植，将最终状态／回放检查与独立视觉量表、配对无输入对照结合。
    ja: ''
- id: "2608.21833"
  title: "GameXpert-Bench: How Far Are Coding Agents from Expert Game Development?"
  url: "https://arxiv.org/abs/2608.21833"
  date: "2026.08"
  section: "1.6"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Rigorously evaluates generation, deterministic game repair, and human-requested multi-turn optimization, but does not make a same-trajectory multimodal feedback loop a benchmark requirement.
    zh: 严谨评测游戏生成、确定性修复和由人工请求驱动的多轮优化，但没有把同轨迹多模态反馈闭环设为 Benchmark 必备条件。
    ja: ''
- id: "2606.17861"
  title: "GameCraft-Bench: Can Agents Build Playable Games End-to-End in a Real Game Engine?"
  url: "https://arxiv.org/abs/2606.17861"
  date: "2026.06"
  section: "1.6"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks complete Godot games and documents screenshot-guided project repair in its Kimi-K2.6 rollouts, distinct from final replay-based judging.
    zh: 评测完整 Godot 游戏，并在 Kimi-K2.6 轨迹中记录截图驱动的项目修复，明确区别于提交后的回放评分。
    ja: ''
- id: "2602.11103"
  title: "GameDevBench: Evaluating Agentic Capabilities Through Game Development"
  url: "https://arxiv.org/abs/2602.11103"
  date: "2026.02"
  section: "1.6"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Evaluates coding agents on real game-engine projects requiring multimodal specifications, assets, execution, and debugging.
    zh: 在需要多模态需求、资源、执行和调试的真实游戏引擎项目中评测 Coding Agent。
    ja: ''
- id: "2602.10814"
  title: "See, Plan, Snap: Evaluating Multimodal GUI Agents in Scratch"
  url: "https://arxiv.org/abs/2602.10814"
  date: "2026.02"
  section: "1.6"
  sub: eval
  type: paper
  scope: core
  tldr:
    en: Benchmarks agents that visually operate Scratch to create, execute, inspect, and debug programs through the GUI.
    zh: 评测通过视觉操作 Scratch，并在 GUI 中创建、执行、检查与调试程序的 Agent。
    ja: ''
- id: "2610.12374"
  title: "AgentGarten: Code Worlds for Evolving Agents"
  url: "https://arxiv.org/abs/2610.12374"
  date: "2026.10"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Separates executable world state and rules from a shared neural renderer, with coding agents using model tools and multi-camera rollout checks to repair scene programs before deployed agents evolve their playbooks.
    zh: 将可执行世界状态、规则与共享神经渲染器分离，编码 Agent 调用模型工具并以多相机 rollout 检查修复场景程序，部署后的 Agent 再通过玩法笔记积累经验。
    ja: ''
- id: "2610.05033"
  title: "Code2Games: Enabling Coding Agents for Gaming World Generation"
  url: "https://arxiv.org/abs/2610.05033"
  date: "2026.10"
  section: "1.6"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Connects Blender scene structure, visually guided gameplay placement, and Unreal Engine logic through persistent element identities, repairing engine adaptation with compilation diagnostics and scripted gameplay tests.
    zh: 以持久实体身份连接 Blender 场景结构、视觉引导的玩法摆放与 Unreal Engine 逻辑，并用编译诊断和脚本化玩法测试修复引擎迁移。
    ja: ''
- id: "2610.16776"
