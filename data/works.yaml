- id: reading:koray-kavukcuoglu-google-introducing-gemini-4-hydrogen
  title: Koray Kavukcuoglu / Google — Introducing Gemini 4 Hydrogen
  url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/
  date: '2026.11'
  section: '1.7'
  sub: tools
  type: reading
  scope: reading
  tldr:
    en: '*Topic link:* Describes routing between Carbon and Hydrogen for coordination, execution and verification, with a
      video-to-slides example that audits and repairs layout; these are attributed vendor demonstrations.'
    zh: '*主题关联：* 介绍Carbon与Hydrogen在协调、执行和验证之间的模型分工，并展示视频到幻灯片的布局审查与修复；属于署名厂商演示。'
    ja: Carbon と Hydrogen による調整・実行・検証の分担を紹介し、動画からスライドを作る際の配置レビューと修正を示す、著者名を明記した提供企業のデモ。
  sources:
  - https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/
- id: reading:lance-martin-anthropic-the-components-of-agent-memory
  title: Lance Martin / Anthropic — The components of agent memory
  url: https://www.anthropic.com/research/components-of-agent-memory
  date: '2026.11'
  section: '3.5'
  sub: experience-skill
  type: reading
  scope: reading
  tldr:
    en: '*Topic link:* Connects experience to later actions through selective notes, transcript-grounded memory correction
      and offline consolidation; Pokémon and document examples are attributed engineering observations, with memory updates
      distinct from model training.'
    zh: '*主题关联：* 以选择性笔记、基于原轨迹的记忆纠错和离线整理连接经验与后续行动；Pokémon与文档案例属于署名工程观察，记忆更新区别于模型训练。'
    ja: 選択的なメモ、元の軌跡に基づく記憶の訂正、オフラインの整理によって経験と後続の行動をつなぐ。Pokémon と文書の例は著者名付きの開発上の観察であり、記憶更新はモデル訓練と区別される。
  sources:
  - https://www.anthropic.com/research/components-of-agent-memory
- id: reading:kanishka-rao-google-gemini-4-argon-for-robotics
  title: Kanishka Rao / Google — Gemini 4 Argon for Robotics
  url: https://developers.googleblog.com/gemini-4-argon-for-robotics
  date: '2026.10'
  section: '3.1'
  sub: skills-runtime
  type: reading
  scope: reading
  tldr:
    en: '*Topic link:* Illustrates model-tool use, video-world-model steering, MuJoCo twin construction, and hardware-feedback
      refinement across generated video, simulation, and real robots; these are attributed vendor demonstrations, not independent
      validation.'
    zh: '*与本主题的关联：* 展示模型工具调用、视频世界模型引导、MuJoCo 数字孪生构建与硬件反馈修订；文中的代表性提示词和厂商案例应区分生成视频、仿真及真实机器人结果，不等同于独立验证。'
    ja: モデルのツール呼び出し、動画世界モデルによる誘導、MuJoCo デジタルツインの構築、ハードウェアのフィードバックによる修正を示す。代表的なプロンプトと提供企業の事例では、生成動画、シミュレーション、実機結果を区別する必要があり、独立した検証とは同一視できない。
  sources:
  - https://developers.googleblog.com/gemini-4-argon-for-robotics
- id: reading:tim-hinds-applitools-bridging-the-probabilistic-validation-gap-deterministic-visual-ai-guardrails-for-the-agentic-sdlc
  title: 'Tim Hinds / Applitools — Bridging the “Probabilistic Validation Gap”: Deterministic Visual AI Guardrails for the
    Agentic SDLC'
  url: https://applitools.com/blog/probabilistic-validation-gap-agentic-sdlc/
  date: '2026.09'
  section: '1.1'
  sub: tools
  type: reading
  scope: reading
  tldr:
    en: '*Topic link:* The “Probabilistic Validation Gap” motivates returning visual-diff coordinates and DOM context to coding
      agents, while keeping baseline changes behind human review; the product claims are an industry perspective, not an independent
      benchmark.'
    zh: '*与本主题的关联：* “Probabilistic Validation Gap” 强调把视觉差异坐标与 DOM 上下文返回给 Coding Agent，同时保留基线变更的人工审核；文中的产品主张属于产业观点，而非独立 Benchmark
      结论。'
    ja: 「Probabilistic Validation Gap」は、視覚差分の座標と DOM の文脈を Coding Agent へ返し、基準画像の変更には人のレビューを残すことを重視する。製品に関する主張は産業界の見解であり、独立したベンチマークの結論ではない。
  sources:
  - https://applitools.com/blog/probabilistic-validation-gap-agentic-sdlc/
- id: reading:z-ai-autoclaw-team-glm-5-3-flash-more-intelligence-with-less-compute
  title: 'Z.ai / AutoClaw Team — GLM-5.3-Flash: More Intelligence with Less Compute'
  url: https://autoclaw.z.ai/blog/model/glm-5.3-flash/
  date: '2026.08'
  section: '1.7'
  sub: tools
  type: reading
  scope: reading
  tldr:
    en: “Vision therefore becomes part of execution and verification rather than a separate input capability.” *Topic link:*
      The model is explicitly framed around inspecting rendered work, determining what should happen next, and continuing
      refinement across documents, interfaces, and other visual artifacts.
    zh: “Vision therefore becomes part of execution and verification rather than a separate input capability.” *与本主题的关联：*
      模型被明确描述为能够检查渲染结果、判断下一步行动，并在文档、界面等视觉产物上继续改进。
    ja: 視覚を独立した入力能力にとどめず、実行と検証の一部として位置付ける。モデルは描画結果を確認して次の行動を判断し、文書や UI などの視覚的な成果物を継続的に改善できると説明されている。
  sources:
  - https://autoclaw.z.ai/blog/model/glm-5.3-flash/
  - https://huggingface.co/zai-org/GLM-5.3-Flash
- id: reading:andrej-karpathy-long-horizon-three-js-experiment-and-commentary
  title: Andrej Karpathy — Long-horizon Three.js experiment and commentary
  url: https://x.com/karpathy/status/2083749667410727319?s=20
  date: '2026.08'
  section: '1.5'
  sub: tools
  type: reading
  scope: reading
  tldr:
    en: '*Topic signal:* Large visual programs are becoming inexpensive to generate, while efficiently watching, playing,
      auditing, and repairing them remains a central bottleneck.'
    zh: '*方向信号：* 大型视觉程序的生成成本正在快速下降，但如何高效地观看、游玩、审计和修复这些程序，仍是核心瓶颈。'
    ja: 大規模な視覚プログラムの生成コストは急速に低下している一方、それらを効率よく観察し、遊び、監査し、修正する方法が引き続き重要な課題となっている。
  sources:
  - https://x.com/karpathy/status/2083749667410727319?s=20
- id: res:miku
  title: MIKU
  url: https://arxiv.org/abs/2611.07354
  date: null
  section: '2.3'
  sub: models
  type: resource
  scope: resource
  tldr:
    en: Reference image + mesh geometry cues → multi-view albedo, metallic and roughness maps. Normalizes material conventions
      and separates albedo from deterministic metallic/roughness prediction; targets consistent renderable assets, not physically
      measured materials. Paper-described capability; code and weights are not linked.
    zh: 参考图＋mesh几何条件 → 多视角 albedo、金属度与粗糙度图。统一材质约定，分阶段生成albedo并确定性预测金属度／粗糙度；目标为可渲染资产一致性，不是实测材质。论文描述了能力，尚无代码或权重链接。
    ja: 参照画像とメッシュの幾何から、多視点のアルベド・金属度・粗さのマップを生成する。材質の規約を正規化し、アルベドと決定的な金属度・粗さの予測を分離する。整合した描画用アセットが対象で、実測した物理材質ではない。論文に記載された機能で、コードと重みへのリンクはない。
  sources:
  - https://arxiv.org/abs/2611.07354
- id: res:blender-agent-skills
  title: blender-agent-skills
  url: https://github.com/oh-ashen-one/blender-agent-skills
  date: null
  section: '1.5'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Community expert skills · MIT · references/scenes → staged builds, render checks and rig/export checks. Five documented
      skills organize isolated MCP sessions, staged construction, concept-to-render visual gates, voxel scenes and rig verification;
      reusable expert procedures, not a measured autonomous-learning system.
    zh: 社区专家Skills · MIT · 参考素材／场景 → 分阶段构建、渲染检查及绑定／导出检查。五项文档化Skill组织独立MCP会话、分阶段构建、概念—渲染视觉检查、体素场景和绑定验证；属于可复用专家流程，不是已测量的自主学习系统。
    ja: 五つの文書化されたスキルが、独立した MCP セッション、段階的な構築、構想と描画の視覚照合、ボクセルシーン、リグと書き出しの確認を構成する。MIT ライセンスの再利用可能な専門手順であり、測定済みの自律学習システムではない。
  sources:
  - https://github.com/oh-ashen-one/blender-agent-skills
- id: res:unreal-engine-5-9-megajam-preview
  title: Unreal Engine 5.9 MegaJam Preview
  url: https://forums.unrealengine.com/t/unreal-engine-5-9-megajam-preview/2852840
  date: null
  section: '1.6'
  sub: tools
  type: resource
  scope: resource
  tldr:
    en: Prompts, references and scenes → editor operations, images, 3D/video assets and runtime inspection. Experimental preview
      adds Unreal MCP for editor/render/debug operations and Canvas for composing generative model tools; the official announcement
      describes integration capabilities, not an autonomous development benchmark.
    zh: 提示词、参考素材与场景 → 编辑器操作、图像／3D／视频资产及运行检查。实验性预览提供用于编辑、渲染及调试的Unreal MCP，并通过Canvas组合生成模型工具；官方公告介绍接入能力，不是自主开发性能评测。
    ja: 実験的なプレビューとして、編集・描画・デバッグのための Unreal MCP と、生成モデルのツールを組み合わせる Canvas を追加する。指示、参照、シーンから編集操作、画像、3D・動画アセット、実行状態の確認を扱う。公式発表は統合機能の説明であり、自律開発のベンチマークではない。
  sources:
  - https://forums.unrealengine.com/t/unreal-engine-5-9-megajam-preview/2852840
- id: '2611.16748'
  title: 'PhysLoop: Harnessing LLMs’ Physics Awareness for Self-Improving Video Generation Models'
  url: https://arxiv.org/abs/2611.16748
  date: '2026.11'
  section: '2.2'
  type: paper
  scope: core
  tldr:
    en: A coding agent builds simulator scenes and uses visual and state feedback to revise them or adjust a video refiner,
      supporting controlled video generation and local repair.
    zh: 编码 Agent 构建可执行仿真场景，并依据画面和状态反馈修订场景或调整视频模型输入，支持可控视频生成与局部修复。
    ja: コーディングエージェントが実行可能なシミュレーションシーンを構築し、画像と状態のフィードバックに基づいてシーンや動画モデルの入力を修正し、制御可能な動画生成と局所修復を行う。
  sources:
  - https://arxiv.org/abs/2611.16748
  - https://arxiv.org/html/2611.16748v1
  - https://chenyx24.github.io/PhysLoop-site/
  - https://github.com/DAGroup-PKU/PhysLoop
  verification:
    en: Camera previews and simulation/video checks guide revisions in the same run. Evaluation covers 100 generation
      and 50 repair tasks; recursive model training remains future work.
    zh: 预览画面与仿真／成片检查驱动同次运行内的修订。评测覆盖 100 个生成任务和 50 个修复任务，递归模型训练留待后续验证。
- id: '2611.16217'
  title: 'WorldDraft: If Code Builds the World, Can Video Models Just Render It?'
  url: https://arxiv.org/abs/2611.16217
  date: '2026.11'
  section: '2.2'
  type: paper
  scope: adjacent
  tldr:
    en: Benchmarks video models as renderers of executable 4D drafts, testing whether they preserve motion and camera
      paths while applying requested appearances.
    zh: 用固定运动和镜头轨迹的可执行 4D 草稿，评测视频模型能否保留世界结构并实现目标外观。
    ja: 運動とカメラ軌道を固定した実行可能な4Dドラフトを用い、動画モデルが世界の構造を保持しつつ指定された外観を実現できるかを評価する。
  sources:
  - https://arxiv.org/abs/2611.16217
  - https://arxiv.org/html/2611.16217v1
  - https://haroldchen19.github.io/WorldDraft-site/
  - https://github.com/KevinHuge/WorldDraft
  - https://huggingface.co/datasets/KevinHuge/WorldDraft
  verification:
    en: 432 paired cases from 48 executable world families and 12 renderers; separate metrics for structural preservation,
      rendering fidelity and appearance persistence.
    zh: 48 类可执行场景构成 432 个配对样例，比较 12 个视频模型，分别量化结构保留、外观实现和跨帧一致性。
- id: '2611.16009'
  title: 'JustRUA: A Controlled Study of GPT-6 Robot-Use Agents'
  url: https://arxiv.org/abs/2611.16009
  date: '2026.11'
  section: '3.1'
  type: paper
  scope: adjacent
  tldr:
    en: Studies how episode history, short motions, geometry and coordinate-solving code shape a general-purpose agent’s
      RoboDojo manipulation performance.
    zh: 在 RoboDojo 仿真中比较完整回合历史、短动作、深度与坐标求解代码对通用 Agent 操控的影响。
    ja: RoboDojoのシミュレーションで、エピソードの全履歴、短い動作、深度情報、座標を求めるコードが汎用エージェントの操作性能に与える影響を比較する。
  sources:
  - https://arxiv.org/abs/2611.16009
  - https://arxiv.org/html/2611.16009v1
  - https://zefanw.github.io/JustRUA/
  - https://github.com/ZefanW/JustRUA
  - https://huggingface.co/spaces/ZefanW/robodojo-replay-explorer
  verification:
    en: 111 simulated episodes across 42 tasks; the final configuration adds coordinate-solving code and lifts the decision
      cap together.
    zh: 42 项任务的 111 个仿真回合。最终配置同时加入坐标求解代码并取消决策次数上限。
  sub: capability-eval
