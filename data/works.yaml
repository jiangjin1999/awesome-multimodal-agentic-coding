  date: '2026.10'
  section: '1.5'
  sub: method
  type: paper
  scope: core
  tldr:
    en: Turns 3D Gaussian Splatting papers and ideas into trainable plugins, repairing code through rendered-image critique,
      cross-view Gaussian diagnostics, and training-curve feedback.
