  url: "https://arxiv.org/abs/2508.01031"
  date: "2025.08"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Generates conceptual CAD programs from text or sketches and improves them through iterative visual feedback and accumulated design knowledge.
    zh: 根据文本或草图生成概念 CAD 程序，并通过迭代视觉反馈和累积设计知识继续改进。
    ja: ''
- id: "2508.08228"
