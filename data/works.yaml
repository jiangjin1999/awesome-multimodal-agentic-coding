  url: "https://arxiv.org/abs/2603.00805"
  date: "2026.02"
  section: "1.5"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Builds trainable Nerfstudio implementations from papers and uses render diagnostics and VLM-guided patches to refine their code.
    zh: 根据论文构建可训练的 Nerfstudio 实现，通过渲染诊断与 VLM 引导的补丁持续改进代码。
    ja: ''
- id: "2601.11109"
  title: Vision-as-Inverse-Graphics Agent via Interleaved Multimodal Reasoning
  url: "https://arxiv.org/abs/2601.11109"
  date: "2026.01"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Interleaves code generation, rendering, and multimodal reasoning to refine executable inverse-graphics hypotheses.
    zh: 交错进行代码生成、渲染和多模态推理，以细化可执行逆图形假设。
    ja: ''
- id: "2508.01031"
