      · training and test-time critic ablations; published evaluation data is distinct from the training collections.
    zh: 碰撞／边界检查 · 可达性与功能组织 · 场景排序准确率 · 修正效率 · 训练及测试时 Critic 消融；已公开评价集与训练资料分别标注。
  tags:
