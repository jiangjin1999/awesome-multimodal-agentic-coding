  date: "2026.10"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Coordinates Phaser code and model-generated assets through a multimodal design document, routing build-linked playtesting and visual-critic findings back to artifact owners for repair.
    zh: 以多模态设计文档组织 Phaser 代码与模型生成素材，将绑定当前构建版本的试玩和视觉 Critic 发现路由给产物负责人继续修复。
    ja: ''
- id: "2610.06910"
  title: "GAMEGO: Training Game-Dev Agents with Synthetic Trajectories Anchored in Real-World Assets"
  url: "https://arxiv.org/abs/2610.06910"
  demo: "https://haoyue-yang.github.io/GameGo/games/"
  date: "2026.10"
  section: "1.6"
  sub: method
  type: paper
  scope: adjacent
  tldr:
    en: Turns game seeds into compact, asset-grounded requirements and executable React development trajectories for training, with separate multimodal play-and-quality evaluation of completed games.
    zh: 将游戏种子转换为精简且有资产依据的需求及可执行 React 开发轨迹，用于模型训练，再对完成的游戏独立开展多模态试玩与质量评估。
    ja: ''
- id: "2610.08621"
  title: "Recursive Game Creator: An Agentic Product-Level Experience-Oriented Game Harness"
  url: "https://arxiv.org/abs/2610.08621"
  date: "2026.10"
  section: "1.6"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Separates policy-driven gameplay collection from visual experience review, using version-linked trajectories, screenshots, and user preferences to guide repeated game-code revisions and checkpoint retention.
    zh: 将策略驱动的试玩采集与视觉体验审查分离，利用绑定版本的轨迹、截图和用户偏好指导反复修改游戏代码及保留检查点。
    ja: ''
- id: "system:3agamefactory"
