  url: "https://arxiv.org/abs/2508.08228"
  date: "2025.08"
  section: "1.5"
  sub: method
  type: paper
  scope: core
  tldr:
    en: Writes modular Blender Python, then uses a rendered-asset critic and a verification agent to drive targeted automatic code refinements before optional user edits.
    zh: 编写模块化 Blender Python，再通过渲染产物 Critic 与验证 Agent 驱动自动局部修改，之后可继续接收用户编辑指令。
