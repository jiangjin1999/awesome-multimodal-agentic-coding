      validity, multiview semantic alignment, and human-validated design preference.
    zh: 在规模与库存约束下评测程序化积木装配，分别检查碰撞／稳定性有效性、多视角语义一致性及人类验证的设计偏好。
    ja: 規模と在庫の制約下でプログラムによるブロック組立を評価し、衝突・安定性、複数視点の意味的一致、人間が確認した設計の好みを別々に検査する。
  sources:
