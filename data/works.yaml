  date: "2026.10"
  section: "1.7"
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Decomposes visual requirements into graded checks for training image generators, using ground-truth reference images to reduce target-state reasoning errors in rule-governed visual tasks.
    zh: 将视觉要求拆为分项检查并汇总为训练图像生成器的分级奖励，在规则约束视觉任务中借助真实目标参考图减少目标状态推理错误。
