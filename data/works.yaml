  section: '1.1'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Evaluates edits to existing applications against hidden requirements using source, rendered interfaces, and interaction
      evidence, with an independent refutation stage that challenges positive judgments.
    zh: 用源代码、渲染界面和交互证据检查已有应用的修改是否满足隐藏需求，并通过独立反驳阶段复核正向判定。
