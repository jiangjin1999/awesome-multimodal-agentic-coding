  date: '2026.09'
  section: '1.5'
  sub: eval
  type: paper
  scope: adjacent
  tldr:
    en: Studies agents that inspect rendered views and revise fixed-part poses through MCP tools rather than authoring construction
      programs, exposing the gap between approximate assembly and geometric precision.
    zh: 研究 Agent 查看渲染视图、通过 MCP 工具修订既有零件位姿而非编写构建程序的装配任务，揭示近似装配与几何精度之间的差距。
