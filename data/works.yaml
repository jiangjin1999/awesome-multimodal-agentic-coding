    zh: 结合参考素材生成、对话／画布编辑、设备预览和 HTML／项目导出，由用户检查交互并提出修正。
    ja: 参考素材の生成、対話・キャンバス編集、端末プレビュー、HTML・プロジェクト出力を組み合わせ、利用者が操作を確認して修正を求める。
