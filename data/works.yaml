    en: Documents staged prototype refinement, screen-readability checks, deterministic replay and repair validation for browser
      and Godot workflows; reusable procedures, not a benchmarked autonomous system.
    zh: 为浏览器与Godot工作流提供分阶段原型迭代、画面可读性检查、确定性回放及修复验证流程；属于可复用规程，不是已评测的自主系统。
    ja: ブラウザと Godot 向けに段階的な試作、画面の読みやすさの検査、決定論的再生、修復検証の手順を提供する。再利用可能な手順であり、評価済みの自律システムではない。
  sources:
